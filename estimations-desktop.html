<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<title>Varmak — Estimations</title><style>
  :root{--navy-950:#04101f;--navy-900:#071a33;--navy-800:#0a2447;--navy-brand:#013179;
    --steel-400:#8ea3c0;--steel-300:#b9c6da;--spark:#4a90ff;--ice:#e8f0fb;
    --line:rgba(142,163,192,0.16);--field:rgba(255,255,255,0.045);--field-line:rgba(185,198,218,0.24);
    --ok:#4ad48a;--warn:#ffb057;--danger:#ff6b6b;;--c-accent:#4a90ff;--c-accent-rgb:74,144,255;--c-accent2:#2c6bd6;--c-accent2-rgb:44,107,214;--c-avatar:#16385b;--c-avatar-line:#3e6288;--c-brand:#013179;--c-brand-rgb:1,49,121;--c-card-rgb:9,23,45;--c-danger-rgb:255,107,107;--c-fieldline-rgb:185,198,218;--c-line-rgb:142,163,192;--c-navhover-rgb:31,91,164;--c-navicon:#78a7d9;--c-ok-rgb:74,212,138;--c-panel-rgb:7,26,51;--c-panel2:#0a2447;--c-panel2-rgb:10,36,71;--c-scrim-rgb:2,8,15;--c-side1-rgb:6,26,49;--c-side2-rgb:4,19,38;--c-side3-rgb:7,26,48;--c-tint:#cfe0ff;--c-warn-rgb:255,176,87;--font-heading:'Sora',sans-serif;--font-body:'Inter',system-ui,sans-serif;color-scheme:dark;--select-bg:#0a2447;--select-fg:#e8f0fb;}
:root[data-theme="carbon"]{--navy-950:#020305;--navy-900:#06080c;--navy-800:#0a0d13;--navy-brand:#16326a;--steel-400:#a3adbd;--steel-300:#c6cedb;--spark:#4f8cff;--ice:#f2f5fa;--line:rgba(135,146,163,0.16);--field-line:rgba(170,180,196,0.24);--ok:#35c98a;--warn:#f0a544;--danger:#f4635f;--c-accent:#4f8cff;--c-accent-rgb:79,140,255;--c-accent2:#2f6ccc;--c-accent2-rgb:47,108,204;--c-avatar:#14202e;--c-avatar-line:#2a3444;--c-brand:#16326a;--c-brand-rgb:22,50,106;--c-card-rgb:9,11,16;--c-danger-rgb:244,99,95;--c-fieldline-rgb:170,180,196;--c-line-rgb:135,146,163;--c-navhover-rgb:26,52,102;--c-navicon:#8ba0b8;--c-ok-rgb:53,201,138;--c-panel-rgb:6,8,12;--c-panel2:#0a0d13;--c-panel2-rgb:10,13,19;--c-scrim-rgb:1,2,4;--c-side1-rgb:6,8,12;--c-side2-rgb:3,4,7;--c-side3-rgb:6,8,12;--c-tint:#dbe8ff;--c-warn-rgb:240,165,68;--font-heading:'Space Grotesk',sans-serif;--font-body:'IBM Plex Sans',system-ui,sans-serif;--select-bg:#0f131b;--select-fg:#f2f5fa;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);color:var(--ice);min-height:100vh;}
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--navy-950);}
  .bg::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 82% 0%,rgba(var(--c-brand-rgb),0.5),transparent 55%),radial-gradient(80% 60% at 10% 100%,rgba(var(--c-panel2-rgb),0.6),transparent 60%),linear-gradient(160deg,var(--navy-950),var(--navy-900) 60%,var(--navy-950));}
  .grid{position:absolute;inset:0;opacity:0.28;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);}
  .glow{position:absolute;left:50%;top:20%;width:560px;height:560px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(var(--c-accent-rgb),0.16),transparent 62%);filter:blur(8px);animation:pulse 6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
  .ember{position:absolute;bottom:-10px;border-radius:50%;background:var(--spark);box-shadow:0 0 6px 1px rgba(var(--c-accent-rgb),.8);animation:rise linear infinite;opacity:0;}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-105vh) translateX(var(--drift));opacity:0}}
  @media (prefers-reduced-motion:reduce){.glow,.ember{animation:none}}

  .topfull{position:relative;z-index:2;width:100%;padding:22px 36px 0;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;}
  .brand .logo{font-family:var(--font-heading);font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .brand .logo .dot{width:6px;height:6px;background:var(--spark);box-shadow:0 0 9px 1px rgba(var(--c-accent-rgb),.9);}
  .brand .meta{font-size:11px;color:var(--steel-400);margin-top:2px;line-height:1.5;}
  .topright{display:flex;flex-direction:column;align-items:flex-end;gap:9px;}
  .clock{text-align:right;font-variant-numeric:tabular-nums;} .clock .time{font-family:var(--font-heading);font-weight:600;font-size:16px;} .clock .date{font-size:11px;color:var(--steel-400);}
  .who{display:flex;align-items:center;gap:8px;}
  .who .badge{display:flex;align-items:center;gap:7px;padding:5px 10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;}
  .who .badge .av{width:20px;height:20px;background:linear-gradient(135deg,var(--c-accent2),var(--c-panel2));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:var(--font-heading);}
  .who .role{color:var(--spark);font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
  .who .out{background:transparent;border:1px solid var(--field-line);color:var(--steel-300);padding:6px 10px;font-size:12px;cursor:pointer;font-family:var(--font-body);transition:.15s;}
  .who .out:hover{border-color:var(--spark);color:var(--ice);}

  .wrap{position:relative;z-index:2;max-width:1620px;margin:0 auto;padding:26px 32px 40px;}
  .modhead{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .back{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--field-line);color:var(--steel-300);font-family:var(--font-body);font-size:12.5px;padding:9px 13px;cursor:pointer;transition:.15s;}
  .back:hover{border-color:var(--spark);color:var(--ice);}
  .modhead .ttl{display:flex;align-items:center;gap:11px;}
  /* summary stats sit in the header so the estimation list gets the full width */
  .headsum{margin-left:auto;display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;justify-content:flex-end;}
  .headsum .hs{display:flex;flex-direction:column;gap:1px;}
  .headsum .hsl{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);white-space:nowrap;}
  .headsum .hsv{font-family:var(--font-heading);font-weight:600;font-size:15px;white-space:nowrap;}
  .headsum .hsv.draft{color:var(--steel-300);} .headsum .hsv.sent{color:var(--spark);}
  .headsum .hsv.accepted{color:var(--ok);} .headsum .hsv.declined{color:var(--danger);}
  .headsum .hssub{font-size:10px;color:var(--steel-400);white-space:nowrap;}
  .headsum .hsdiv{width:1px;align-self:stretch;background:var(--line);}
  @media(max-width:1100px){.modhead{flex-wrap:wrap;} .headsum{margin-left:0;width:100%;justify-content:flex-start;gap:16px;} .headsum .hsdiv{display:none;}}
  .modhead .ic{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(var(--c-accent-rgb),.14);box-shadow:inset 0 0 0 1px rgba(var(--c-accent-rgb),.35);}
  .modhead h1{font-family:var(--font-heading);font-weight:600;font-size:22px;letter-spacing:-.01em;} .modhead p{font-size:12px;color:var(--steel-400);}

  .tbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--field-line);background:transparent;color:var(--steel-300);font-family:var(--font-heading);font-weight:600;font-size:12.5px;padding:9px 13px;cursor:pointer;transition:.16s;white-space:nowrap;}
  .tbtn:hover{border-color:var(--spark);color:var(--ice);}
  .tbtn.primary{background:linear-gradient(180deg,var(--c-accent2),var(--c-brand));border:none;color:#fff;}
  .tbtn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(var(--c-accent2-rgb),.5);}
  .tbtn.small{padding:6px 10px;font-size:11.5px;}
  .tbtn.danger{border-color:rgba(var(--c-danger-rgb),.4);color:#ffb3b3;}
  .tbtn.danger:hover{border-color:var(--danger);color:#fff;background:rgba(var(--c-danger-rgb),.1);}
  .tbtn svg{flex:none;width:13px;height:13px;}

  .crmgrid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start;}
  /* the list and summary columns are compact panels: flow them across the full
     width instead of leaving them as sparse full-width bars */
  .crmgrid>.col:first-child,.crmgrid>.col:last-child{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:stretch;}
  /* Cards laid out side by side end on the same line instead of each stopping at its own content. */
  .crmgrid>.col:last-child>.panel{display:flex;flex-direction:column;}
  .crmgrid>.col:last-child>.panel>.spacer{flex:1 1 auto;min-height:0;}
  /* min-width:0 lets a grid track shrink below its content's intrinsic width (the wide items table)
     so .itable-wrap's own overflow-x:auto can scroll internally instead of forcing the whole page wider. */
  .col{display:flex;flex-direction:column;gap:16px;min-width:0;}
  body{overflow-x:hidden;}
  .panel{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:17px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .panel .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:10px;}
  .panel .phead h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--spark);font-weight:700;}

  .search{position:relative;flex:1;}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--steel-400);}
  .search input{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:var(--font-body);font-size:13px;padding:9px 10px 9px 32px;outline:none;}
  .search input:focus{border-color:var(--spark);}
  /* Producing the offer is what the module is for, so it sits at the top of the list, beside the
     button that creates the project it is produced from. */
  .listbar{display:flex;align-items:stretch;gap:10px;margin-bottom:11px;flex-wrap:wrap;}
  .listbar .newproj{flex:1 1 250px;justify-content:center;}
  .offerbar{flex:2 1 430px;display:flex;align-items:center;gap:8px;padding:5px 7px 5px 13px;
    border:1px solid rgba(var(--c-accent-rgb),.32);background:rgba(var(--c-accent-rgb),.07);}
  .offerbar.off{border-color:var(--line);background:rgba(255,255,255,.02);}
  .offerlbl{display:flex;align-items:baseline;gap:9px;margin-right:auto;min-width:0;}
  .offerlbl b{font-family:var(--font-heading);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-tint);}
  .offerbar.off .offerlbl b{color:var(--steel-400);}
  .offerref{font-size:13px;font-weight:600;color:var(--ice);font-variant-numeric:tabular-nums;}
  .offersub{font-size:10.5px;color:var(--steel-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .offerbar .tbtn{font-size:11.5px;padding:7px 11px;}
  .offerbar .tbtn[disabled]{opacity:.45;cursor:not-allowed;}
  .offerbar .tbtn[disabled]:hover{border-color:var(--field-line);background:transparent;color:var(--steel-300);}
  @media(max-width:900px){.listbar{flex-direction:column;}.listbar .newproj{flex:none;}.offerbar{flex:none;flex-wrap:wrap;}}
  .listtoolbar{display:flex;gap:8px;margin-bottom:11px;}
  .iconbtn{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);cursor:pointer;}
  .iconbtn:hover{border-color:var(--spark);color:var(--ice);}

  .segtabs{display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap;}
  .segtabs button{flex:1;background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);font-family:var(--font-body);font-size:10.5px;padding:7px 4px;cursor:pointer;transition:.15s;white-space:nowrap;}
  .segtabs button.on{background:rgba(var(--c-accent-rgb),.16);border-color:rgba(var(--c-accent-rgb),.5);color:var(--c-tint);}

  .estlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;max-height:330px;overflow-y:auto;margin:-4px;padding:4px;}
  .estrow{display:block;width:100%;padding:10px 11px;border:1px solid var(--line);cursor:pointer;transition:.14s;text-align:left;color:inherit;background:transparent;font:inherit;}
  .estrow:hover{background:rgba(255,255,255,.03);}
  .estrow.sel{background:rgba(var(--c-accent-rgb),.12);border-color:rgba(var(--c-accent-rgb),.45);}
  .estrow .er1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px;}
  .estrow .eno{font-family:var(--font-heading);font-weight:700;font-size:14px;}
  .estrow .ename{font-size:12.5px;font-weight:500;color:var(--ice);margin-bottom:2px;}
  .estrow .ecust{font-size:11px;color:var(--steel-400);margin-bottom:5px;}
  .estrow .er2{display:flex;justify-content:space-between;align-items:center;}
  .estrow .eval{font-family:var(--font-heading);font-weight:700;font-size:13.5px;color:var(--ice);font-variant-numeric:tabular-nums;}

  .pager{display:flex;align-items:center;justify-content:space-between;margin-top:11px;font-size:11px;color:var(--steel-400);}
  .pager .pnav{display:flex;gap:5px;}
  .pager button{background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);width:24px;height:24px;cursor:pointer;font-size:11px;}
  .pager button.cur{background:rgba(var(--c-accent-rgb),.18);border-color:rgba(var(--c-accent-rgb),.5);color:var(--c-tint);}
  .pager button:disabled{opacity:.35;cursor:not-allowed;}

  .sumgrid2{display:flex;flex-direction:column;gap:0;}
  .sumtotal{display:flex;justify-content:space-between;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line);}
  .sumtotal .sl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);margin-bottom:5px;}
  .sumtotal .sv{font-family:var(--font-heading);font-size:19px;font-weight:600;}
  .sumbystatus{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .sumbystatus .ss{}
  .sumbystatus .sl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);margin-bottom:4px;}
  .sumbystatus .sv{font-family:var(--font-heading);font-size:16px;font-weight:600;} .sumbystatus .sv.draft{color:var(--steel-300);} .sumbystatus .sv.sent{color:var(--spark);} .sumbystatus .sv.accepted{color:var(--ok);} .sumbystatus .sv.declined{color:var(--danger);}
  .sumbystatus .ssub{font-size:10.5px;color:var(--steel-400);}

  .dhead3{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .dhead3 .idn{display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
  .dhead3 h2{font-family:var(--font-heading);font-weight:700;font-size:19px;letter-spacing:-.01em;}
  .dhead3 .esttitle{flex-basis:100%;font-family:var(--font-heading);font-size:13px;font-weight:600;color:var(--steel-300);}
  .dhead3 .dbtns{display:flex;gap:8px;flex-wrap:wrap;}

  .stpill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;font-weight:700;white-space:nowrap;border:1px solid;}
  .stpill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .stpill.draft{color:var(--c-tint);border-color:rgba(var(--c-accent-rgb),.5);background:rgba(var(--c-accent-rgb),.18);}
  .stpill.review{color:var(--steel-300);border-color:var(--field-line);background:rgba(var(--c-line-rgb),.1);}
  .stpill.sent{color:var(--spark);border-color:rgba(var(--c-accent-rgb),.4);background:rgba(var(--c-accent-rgb),.1);}
  .stpill.accepted{color:var(--ok);border-color:rgba(var(--c-ok-rgb),.4);background:rgba(var(--c-ok-rgb),.1);}
  .stpill.declined{color:var(--danger);border-color:rgba(var(--c-danger-rgb),.4);background:rgba(var(--c-danger-rgb),.1);}
  .stpill.expired{color:var(--steel-400);border-color:var(--line);background:rgba(var(--c-line-rgb),.08);}

  .metarow{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:18px;}
  .meta{display:flex;align-items:flex-start;gap:8px;}
  .meta svg{flex:none;width:14px;height:14px;color:var(--steel-400);margin-top:2px;}
  .meta .mk{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);margin-bottom:2px;}
  .meta .mv{font-size:13px;font-weight:600;}

  .stepper{display:flex;align-items:center;margin-bottom:22px;overflow-x:auto;padding-bottom:2px;}
  .step{display:flex;align-items:center;gap:8px;flex:none;cursor:pointer;padding:6px 4px;border:none;background:none;}
  .step .sdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--field-line);display:flex;align-items:center;justify-content:center;color:var(--steel-400);flex:none;transition:.15s;}
  .step .slabel{font-size:11.5px;font-weight:600;color:var(--steel-400);white-space:nowrap;}
  .step.done .sdot{border-color:var(--ok);background:rgba(var(--c-ok-rgb),.15);color:var(--ok);}
  .step.done .slabel{color:var(--steel-300);}
  .step.current .sdot{border-color:var(--spark);background:var(--spark);color:#fff;box-shadow:0 0 0 4px rgba(var(--c-accent-rgb),.18);}
  .step.current .slabel{color:var(--ice);}
  .step.declined.current .sdot{border-color:var(--danger);background:var(--danger);box-shadow:0 0 0 4px rgba(var(--c-danger-rgb),.18);}
  .step.declined.current .slabel{color:#ffb3b3;}
  .stepline{width:34px;height:1px;background:var(--field-line);flex:none;}

  .infocard3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px;}
  @media(max-width:1000px){.infocard3{grid-template-columns:1fr;}}
  .icard{background:rgba(255,255,255,.025);border:1px solid var(--line);padding:15px;}
  .icard .ich{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
  .icard h4{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--spark);}
  .icard .irow2{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);}
  .icard .irow2:last-child{border-bottom:none;}
  .icard .irow2 .ik{color:var(--steel-400);} .icard .irow2 .iv{font-weight:600;text-align:right;}
  .icard .ilead{font-size:14px;font-weight:700;margin-bottom:8px;}
  .icard .istatus{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ok);margin-bottom:10px;}
  .icard .istatus::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .icard .iline{font-size:12.5px;color:var(--steel-300);display:flex;align-items:flex-start;gap:7px;margin-bottom:7px;}
  .icard .iline svg{flex:none;width:13px;height:13px;color:var(--steel-400);margin-top:1px;}

  .itemshead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
  .itemshead h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--spark);font-weight:700;}
  .itemsactions{display:flex;gap:8px;align-items:center;}
  .costtoggle{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--steel-300);cursor:pointer;user-select:none;}
  .costtoggle input{accent-color:var(--spark);}

  .opttabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .opttab{display:flex;align-items:center;gap:10px;background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);font-family:var(--font-body);font-size:12px;padding:8px 12px;transition:.15s;}
  .opttab.on{border-color:rgba(var(--c-accent-rgb),.5);background:rgba(var(--c-accent-rgb),.12);color:var(--c-tint);}
  .opttab.included{border-color:rgba(var(--c-ok-rgb),.5);}
  .opttab.combined{background:rgba(var(--c-ok-rgb),.1);border-color:rgba(var(--c-ok-rgb),.4);color:var(--ok);font-weight:600;}
  .opttab input{accent-color:var(--spark);}

  /* Project-first estimating: an item carries the project's own reference, and the row says which

    padding:1px 6px;margin-right:7px;vertical-align:middle;}

    if(e.revisionSnapshots===undefined)e.revisionSnapshots=[];

// Reads every field this module itself persists back from WorkshopData, so notes, documents, work items,
// options, terms, exclusions and status all survive a page refresh — for BOTH the hardcoded seed estimates
// (which re-run their literal JS object on every load) and estimates created purely in this session.
// Named (not an IIFE) so it can be re-run on workshop:data (see the listener near the bottom of
// this file) - an estimation created/updated elsewhere (e.g. Customers' "New Quote", Pass 3.10, or
// another tab entirely - workshop-data.js reloads on the browser's native 'storage' event and
// re-dispatches workshop:data, see that file's own comment) now reaches this page without a full
// reload. Already safe to re-run as-is: for an estimation this module has already seen it adopts
// the shared record's fields verbatim (see the comment a few lines below - syncEstimation() always
// writes the complete field set, so there is never local-only unsaved state to lose), and for a
// genuinely new one it hydrates fresh.
function hydrateSharedEstimations(){
  if(!window.WorkshopData)return;
  const shared=WorkshopData.get();
  shared.estimations.forEach(se=>{
    const existing=ESTIMATIONS.find(e=>e.no===se.no);
    if(existing){
      // A record with this number already exists locally (seed data or this session) — this shared
      // record is what WE last saved for it (syncEstimation always writes the full field set below),
      // so adopt it verbatim rather than rebuilding anything from an invented value.
      existing.sharedId=se.id;existing.customerId=localCustomerIdForShared(se.customerId,se.customer);existing.status=se.status;existing.revision=se.revision||0;
      existing.created=se.created;existing.validUntil=se.validUntil;existing.currency=se.currency||existing.currency;
      if(Array.isArray(se.workItems))existing.workItems=se.workItems;
      if(Array.isArray(se.options))existing.options=se.options;
      if(se.terms!==undefined)existing.terms=se.terms;
      if(Array.isArray(se.exclusions))existing.exclusions=se.exclusions;
      if(Array.isArray(se.notes))existing.notes=se.notes;
      if(Array.isArray(se.documents))existing.documents=se.documents;
      if(se.overheadPct!==undefined)existing.overheadPct=se.overheadPct;
      if(se.contingencyPct!==undefined)existing.contingencyPct=se.contingencyPct;
      if(se.discount!==undefined)existing.discount=se.discount;
      if(se.reference!==undefined)existing.reference=se.reference;
      if(se.customerRfq!==undefined)existing.customerRfq=se.customerRfq;
      if(se.opportunityRef!==undefined)existing.opportunityRef=se.opportunityRef;
      if(se.requestedDelivery!==undefined)existing.requestedDelivery=se.requestedDelivery;
      if(se.estimator!==undefined)existing.estimator=se.estimator;
      if(se.title!==undefined)existing.projectTitle=se.title;
      if(se.deliveryTime!==undefined)existing.deliveryTime=se.deliveryTime;
      if(se.paymentTerms!==undefined)existing.paymentTerms=se.paymentTerms;
      if(se.priceList!==undefined)existing.priceList=se.priceList;
      if(se.incoterms!==undefined)existing.incoterms=se.incoterms;
      if(se.createdBy!==undefined)existing.createdBy=se.createdBy;
      if(se.projectNo!==undefined)existing.projectNo=se.projectNo;
      if(Array.isArray(se.history)&&se.history.length)existing.history=se.history;
      if(Array.isArray(se.revisionSnapshots))existing.revisionSnapshots=se.revisionSnapshots;
      if(se.archived!==undefined)existing.archived=se.archived;
      return;
    }
    // Genuinely new shared estimation this module has never seen locally (e.g. created from another
    // module such as Planning). Hydrate directly from its own real fields — never from an invented value.
    const project=shared.projects.find(p=>p.id===se.projectId),localCustomerId=localCustomerIdForShared(se.customerId,se.customer);
    const hasDetail=Array.isArray(se.bom)&&se.bom.length>0;
    const workItems=hasDetail?[{no:'',desc:'Bill of Materials',lines:se.bom.map(b=>({desc:b.description||b.code,category:'material',qty:Number(b.qty)||1,unit:b.unit||'EA',weight:0,waste:0,cost:0,sell:0,disc:0,tax:25}))}]:[{no:'',desc:'Work items',lines:[]}];
    ESTIMATIONS.push({id:se.id,sharedId:se.id,no:se.no,customerId:localCustomerId,projectNo:project?project.no:(se.projectNo||null),projectTitle:se.title,status:se.status,created:se.created,validUntil:se.validUntil,currency:se.currency||'SEK',deliveryTime:se.deliveryTime||'4–5 weeks',paymentTerms:se.paymentTerms||'30 days',priceList:se.priceList||'Standard Price List 2026',incoterms:se.incoterms||'EXW Marieholm',reference:se.reference||'—',customerRfq:se.customerRfq||'',opportunityRef:se.opportunityRef||'',requestedDelivery:se.requestedDelivery||se.deliveryTarget||'',createdBy:se.createdBy||'Aleksandar C.',estimator:se.estimator||'Aleksandar C.',overheadPct:se.overheadPct===undefined?8:se.overheadPct,contingencyPct:se.contingencyPct===undefined?5:se.contingencyPct,discount:se.discount||0,workItems:Array.isArray(se.workItems)?se.workItems:workItems,options:Array.isArray(se.options)?se.options:[],exclusions:Array.isArray(se.exclusions)?se.exclusions:[],terms:se.terms||'Prices valid for 30 days.',documents:Array.isArray(se.documents)?se.documents:[],history:Array.isArray(se.history)&&se.history.length?se.history:(se.revisions||[]).map(r=>({date:r.date,action:`Revision ${r.rev}: ${r.reason}`,by:r.author})),notes:Array.isArray(se.notes)?se.notes:[],revision:se.revision||0,revisionSnapshots:Array.isArray(se.revisionSnapshots)?se.revisionSnapshots:[],sharedBom:se.bom||[],plannedHours:se.plannedHours||0,machines:se.machines||[],deliveryTarget:se.deliveryTarget});
    nextEstId=Math.max(nextEstId,se.id+1);
  });
  ESTIMATIONS.forEach(e=>{if(e.revision==null)e.revision=Math.max(0,(e.history||[]).filter(h=>/Rev|Revision/.test(h.action)).length-1)});
}
hydrateSharedEstimations();

// Hand every estimate's legacy work items to its project once, at load, rather than waiting for
// each one to be opened - otherwise the project list would report items the projects do not yet
// have. Each call is a no-op for a project that already owns its items.
function adoptAllLegacyWorkItems(){
  ESTIMATIONS.filter(e=>!e.archived&&e.projectNo).forEach(e=>{adoptLegacyWorkItems(e);syncWorkItemsToProject(e);});
}

let LANG="en",selectedId=2,filterStatus="all",query="",showCost=false,activeOptTab="base";

function getEst(id){return ESTIMATIONS.find(e=>e.id===id);}
// One estimate per project: the project is what is being quoted, so the module is browsed by
// project and an estimate is simply the pricing attached to one.
function estForProject(no){return ESTIMATIONS.find(e=>!e.archived&&e.projectNo===no)||null;}
// The estimate's visible reference is read off the project, not a separate document number, and an
// item's reference is that project number plus its position: P-26-0008-02 is P-26-0008's second item.
function estRef(e){return e&&e.projectNo?e.projectNo:(e?e.no:'—');}
function itemRef(e,seq){return e&&e.projectNo?EstimationRules.itemEstRef(e.projectNo,seq):String(seq);}
// Rebuilds the priced work items from the project's items on every read. Pricing for an item that
// has left the project is kept aside rather than dropped, and returns intact if the item comes back.
// One-time upgrade. Before this pass an estimate kept its own free-text work items, unconnected to
// the project it was quoting. Those items describe real work, so they are handed to the project
// rather than retired wholesale: the project takes them on as its own items, and the estimate's
// pricing is rebound to the item numbers the project hands back. It runs only for a project that
// has no items of its own, so it can never duplicate work the project already tracks.
function adoptLegacyWorkItems(e){
  if(!e||!e.projectNo||!window.WorkshopData||!WorkshopData.upsertJobcard)return 0;
  if(projectItems(e.projectNo).length)return 0;
  const p=WorkshopData.getProjects().find(x=>x.no===e.projectNo);
  if(!p)return 0;
  // No number check here: the early return above already guarantees the project has no items of its
  // own, so anything the estimate is holding is legacy by definition. The seeded work items carry
  // JC-style numbers that never matched a real jobcard, which is exactly what this repairs.
  const legacy=(e.workItems||[]).filter(w=>w&&w.desc);
  if(!legacy.length)return 0;
  let adopted=0;
  legacy.forEach(w=>{
    const lines=w.lines||[];
    const hours=lines.filter(l=>l.category==='labour').reduce((a,l)=>a+(Number(l.qty)||0),0);
    const material=lines.filter(l=>l.category==='material').reduce((a,l)=>a+EstimationRules.lineCostTotal(l),0);
    const saved=WorkshopData.upsertJobcard({projectId:p.id,projectNo:p.no,customerId:p.customerId,customer:p.customer,
      title:w.desc,item:w.desc,quantity:1,revision:0,workType:'other',location:'workshop',priority:'medium',
      responsible:'Aleksandar C.',workers:[],status:'draft',plannedHours:hours,estimatedMaterialCost:material,
      progress:0,actualHours:0,archived:false,created:todayISO(),createdBy:'Aleksandar C.'});
    if(saved&&saved.no){w.no=saved.no;adopted++;}
  });
  if(adopted)syncEstimation(e);
  return adopted;
}
function syncWorkItemsToProject(e){
  if(!e||!e.projectNo)return e;
  adoptLegacyWorkItems(e);
  const stored=(e.workItems||[]).concat(e.retiredWorkItems||[]);
  const {workItems,retired}=EstimationRules.reconcileWorkItems(projectItems(e.projectNo),stored);
  e.workItems=workItems;e.retiredWorkItems=retired;
  return e;
}
// An estimate's totals are the project's quoted price - writing them back is what keeps the two
// from disagreeing. Only a live estimate does this; a declined or expired one must not requote.
function pushTotalsToProject(e){
  if(!e||!e.projectNo||!window.WorkshopData||!WorkshopData.upsertProject)return;
  if(['declined','expired'].includes(e.status))return;
  const p=WorkshopData.getProjects().find(x=>x.no===e.projectNo);
  if(!p)return;
  const tot=computeTotals(e);
  // An estimate with nothing priced yet must not wipe a price the project already carries.
  if(!(tot.netSellingPrice>0))return;
  if(Number(p.quotedValue)===tot.netSellingPrice)return;
  // The whole project record goes back, not just the price: upsertProject() requires a name, and
  // re-resolves the customer from the payload - sending a partial record would blank both.
  WorkshopData.upsertProject(Object.assign({},p,{quotedValue:tot.netSellingPrice}));
  hydrateProjects();
}
// Pushes the full current state of an estimate into WorkshopData (the one shared browser-data layer).
// IMPORTANT: this function never changes the revision number itself — see createRevision() for the single,
// dedicated place a revision is ever incremented, so calling this repeatedly (on every routine save) can
// never double-count a revision the way the old code did via WorkshopData.updateEstimation(...,reason).
function syncEstimation(e){
  if(!window.WorkshopData||!e)return null;
  const c=CUSTOMERS[e.customerId],shared=WorkshopData.get(),sc=shared.customers.find(x=>x.name===c.name),tot=computeTotals(e);

// ─────────────────────────────────────────────────────────────────────────
// CALCULATION ENGINE — frontend prototype only.
// The rules below (waste handling, discount sequencing, VAT base) are the
// functional specification a future backend calculation engine must
// reproduce exactly; keep this block as the single source of truth for how
// a line, a work item and a whole estimate are priced.
// ─────────────────────────────────────────────────────────────────────────

// Tax (VAT) on a single line is computed on that line's already-discounted sell total.
// The estimate-level discount is applied later, proportionally, in computeTotals() — see note there.
function lineTax(it){const tax=Math.min(100,Math.max(0,Number(it.tax)||0));return money(lineTotal(it)*tax/100);}
function lineSellCostDelta(it){return money(lineTotal(it)-lineCostTotal(it));}

// Display-only merge used to PREVIEW an option in the items table without ever touching the saved totals.
// activeOptTab selects which option (if any) is temporarily shown; computeTotals() never reads this state.
function mergedWorkItems(e){
  const replaced=new Set();
  (e.options||[]).filter(o=>o.included&&Array.isArray(o.replacesDesc)).forEach(o=>o.replacesDesc.forEach(d=>replaced.add(o.intoWorkItem+'|'+d)));
  // Carry seq and lock onto the display copy: without them the table would renumber items by
  // position and show every item as unlocked however the stored item actually stands.
  const wis=e.workItems.map(wi=>({no:wi.no,seq:wi.seq,lock:wi.lock,days:wi.days,people:wi.people,desc:wi.desc,lines:wi.lines.filter(l=>!replaced.has(wi.no+'|'+l.desc))}));
  (e.options||[]).filter(o=>o.included).forEach(opt=>{
    const optLines=opt.lines.map(l=>Object.assign({},l,{fromOption:opt.name,optionId:opt.id}));
    wis.push({no:"",desc:opt.name,lines:optLines,isOption:true});
  });
  if(activeOptTab!=="base"){
    const opt=(e.options||[]).find(o=>o.id===activeOptTab);
    if(opt&&!opt.included){
      const optLines=opt.lines.map(l=>Object.assign({},l,{fromOption:opt.name,optionId:opt.id,previewOnly:true}));
      wis.push({no:"",desc:opt.name,lines:optLines,isOption:true,previewOnly:true});
    }
  }
  return wis;
}
function flatLines(e){return baseAndIncludedLines(e);}

function computeTotals(e){
  const items=baseAndIncludedLines(e);
  const bySection={};
  items.forEach(it=>{const s=it.category;bySection[s]=(bySection[s]||0)+lineTotal(it);});
  const sellSubtotal=money(items.reduce((a,b)=>a+lineTotal(b),0));

  // Estimate-level discount can never exceed the sell subtotal (no negative net price).
  const discount=Math.max(0,Math.min(Number(e.discount)||0,sellSubtotal));

  // VAT must be calculated AFTER line discounts (already applied in lineTotal) and AFTER the
  // estimate-level discount. The estimate-level discount is spread across lines proportionally
  // to each line's share of the subtotal, so VAT is charged on the true net base — not on the
  // pre-discount subtotal. This mirrors how the future backend must compute VAT.
  const discountRatio=sellSubtotal>0?discount/sellSubtotal:0;
  const taxTotal=money(items.reduce((a,b)=>{
    const lineNet=lineTotal(b)*(1-discountRatio);
    const tax=Math.min(100,Math.max(0,Number(b.tax)||0));
    return a+lineNet*tax/100;
  },0));

  const netSubtotal=money(sellSubtotal-discount);
  const grandTotal=money(netSubtotal+taxTotal);

  const costOf=cat=>money(items.filter(it=>it.category===cat).reduce((a,b)=>a+lineCostTotal(b),0));
  const sellOf=cat=>money(items.filter(it=>it.category===cat).reduce((a,b)=>a+lineTotal(b),0));
  const materialCost=costOf('material'),labourCost=costOf('labour'),machineCost=costOf('machine'),subCost=costOf('subcontractor'),
    consumableCost=costOf('consumable'),logisticsCost=costOf('logistics'),otherCost=costOf('other');
  const totalDirectCost=money(materialCost+labourCost+machineCost+subCost+consumableCost+logisticsCost+otherCost);
  const overheadPct=Math.max(0,Number(e.overheadPct)||0),contingencyPct=Math.max(0,Number(e.contingencyPct)||0);
  const overhead=money(totalDirectCost*overheadPct/100);
  const contingency=money(totalDirectCost*contingencyPct/100);
  const totalInternalCost=money(totalDirectCost+overhead+contingency);
  const sellingPrice=sellSubtotal;
  const netSellingPrice=netSubtotal;
  const grossProfit=money(netSellingPrice-totalInternalCost);
  // Margin must never be Infinity/NaN: guard the zero-price case explicitly.
  const margin=netSellingPrice>0?money(grossProfit/netSellingPrice*100):0;

  const matSell=sellOf('material'),labSell=sellOf('labour'),subSell=sellOf('subcontractor');
  const matMarkup=materialCost>0?money((matSell-materialCost)/materialCost*100):0;
  const labMargin=labourCost>0?money((labSell-labourCost)/labourCost*100):0;
  const subMarkup=subCost>0?money((subSell-subCost)/subCost*100):0;

  return{items,bySection,sellSubtotal,taxTotal,discount,netSubtotal,grandTotal,
    materialCost,labourCost,machineCost,subCost,consumableCost,logisticsCost,otherCost,
    totalDirectCost,overhead,contingency,totalInternalCost,sellingPrice,netSellingPrice,grossProfit,margin,
    matMarkup,labMargin,subMarkup};
}

function optionDelta(e,opt){return money(opt.lines.reduce((a,it)=>a+lineTotal(it),0));}
function toggleOptionIncluded(estId,optId,included){
  const e=getEst(estId);if(!guardEdit(e))return;

  opt.included=included;
  e.history.push({date:todayISO(),action:(included?'Option included in offer: ':'Option removed from offer: ')+opt.name,by:'Aleksandar C.'});

}

function pushHistory(e,action,by,at){

function exportItemExcel(id,idx){

// ── Locking an item's calculation ──
// The current user and clock, in the one place the lock flows read them.
function lockStamp(){return todayISO()+' '+nowTime();}
function currentUser(){return 'Aleksandar C.';}
function getWorkItem(e,idx){return e&&e.workItems?e.workItems[idx]:null;}
// Every route that changes an item's lines goes through this, so a locked item cannot be edited by
// reaching a form directly. A blocked action does not just fail: it asks whether to unlock, and the
// action it interrupted is resumed once the unlock goes through.
let pendingUnlockAction=null;
function guardItemEdit(e,idx,resume){
  const wi=getWorkItem(e,idx);
  if(!wi)return false;
  if(!isItemLocked(wi))return true;
  if(resume)openLockedPrompt(e.id,idx,resume);
  else toast(T[LANG].item_locked_msg.replace('{ref}',itemRef(e,wi.seq||idx+1)),'error');
  return false;
}
function openLockedPrompt(id,idx,resume){
  const e=getEst(id),wi=getWorkItem(e,idx);if(!e||!wi)return;
  const t=T[LANG],ref=itemRef(e,wi.seq||idx+1),l=wi.lock||{};
  pendingUnlockAction=resume||null;
  showModal(`<h2>${esc(t.locked_prompt_title.replace('{ref}',ref))}</h2>
    <p class="fsub">${esc(t.locked_prompt_body.replace('{by}',l.by||'—').replace('{at}',l.at||'—'))}</p>
    <div class="fbtns"><button class="tbtn" onclick="cancelUnlockPrompt()">${esc(t.locked_prompt_no)}</button><button class="tbtn danger" onclick="openUnlockItem(${id},${idx},true)">${esc(t.locked_prompt_yes)}</button></div>`);
}
function cancelUnlockPrompt(){pendingUnlockAction=null;closeModal();}
// Locking is an approval, so it asks first and says plainly what it commits to.
function openLockItem(id,idx){
  const e=getEst(id),wi=getWorkItem(e,idx);if(!e||!wi||!guardEdit(e))return;
  const t=T[LANG],ref=itemRef(e,wi.seq||idx+1);
  showModal(`<h2>${esc(t.lock_title)}</h2>
    <p class="fsub">${esc(t.lock_body.replace('{ref}',ref).replace('{n}',(wi.lines||[]).length))}</p>
    <div class="frow"><label>${esc(t.lock_total)}</label><div class="lockfig">${fmt((wi.lines||[]).reduce((a,l)=>a+lineTotal(l),0))}</div></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn primary" onclick="doLockItem(${id},${idx})">${esc(t.lock_confirm)}</button></div>`);
}
function doLockItem(id,idx){
  const e=getEst(id),wi=getWorkItem(e,idx);if(!e||!wi)return;
  const at=lockStamp(),by=currentUser(),ref=itemRef(e,wi.seq||idx+1);
  wi.lock=lockItem(wi.lock,by,at);
  pushHistory(e,T[LANG].hist_item_locked.replace('{ref}',ref),by,at);
  syncEstimation(e);closeModal();renderAll();
  toast(T[LANG].lock_done.replace('{ref}',ref),'ok');
}
// Unlocking an agreed figure always carries a reason; who and when are recorded automatically.
function openUnlockItem(id,idx,keepPending){
  if(!keepPending)pendingUnlockAction=null;
  const e=getEst(id),wi=getWorkItem(e,idx);if(!e||!wi||!guardEdit(e))return;
  const t=T[LANG],ref=itemRef(e,wi.seq||idx+1),l=wi.lock||{};
  showModal(`<h2>${esc(t.unlock_title)}</h2>
    <p class="fsub">${esc(t.unlock_body.replace('{ref}',ref).replace('{by}',l.by||'—').replace('{at}',l.at||'—'))}</p>
    <div class="frow"><label for="ulReason">${esc(t.unlock_reason)}</label><textarea id="ulReason" rows="3"></textarea><div id="ulErr" class="errmsg" style="display:none;"></div></div>
    <div class="frow"><label>${esc(t.unlock_recorded)}</label><div class="lockfig small">${esc(currentUser())} · ${esc(lockStamp())}</div></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn danger" onclick="doUnlockItem(${id},${idx})">${esc(t.unlock_confirm)}</button></div>`);
}
function doUnlockItem(id,idx){
  const t=T[LANG],e=getEst(id),wi=getWorkItem(e,idx);if(!e||!wi)return;
  const reason=$("ulReason").value.trim();
  if(!reason){showFieldError('ulReason','ulErr',t.unlock_err_reason);return;}
  const at=lockStamp(),by=currentUser(),ref=itemRef(e,wi.seq||idx+1);
  wi.lock=unlockItem(wi.lock,by,at,reason);
  pushHistory(e,T[LANG].hist_item_unlocked.replace('{ref}',ref)+' — '+reason,by,at);
  syncEstimation(e);closeModal();renderAll();
  // Resume the edit the lock interrupted, so unlocking does not cost the user their place.
  const resume=pendingUnlockAction;pendingUnlockAction=null;
  if(resume)resume();
}

function openItemHistory(id,idx){

      <button class="ibtn" onclick="exportItemExcel(${e.id},${idx})" title="${esc(t.item_excel)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M9 13l6 6M15 13l-6 6"/></svg>${esc(t.item_excel)}</button>
      ${locked?'':itemLocked
        ?`<button class="ibtn warn" onclick="openUnlockItem(${e.id},${idx})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="1"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/></svg>${esc(t.item_unlock)}</button>`

    </span>`;

    </td></tr>`;
    let sIdx=1;let sectionSell=0;

          ${it.weight?`<span class="isub">${esc(it.weight)} kg${it.waste?` · ${esc(it.waste)}% ${esc(t.waste_word)}`:''}</span>`:''}

// ── work-item and line management: move/edit/duplicate/delete. All guarded against editing a locked estimate. ──
function duplicateLine(id,wiIdx,lIdx){
  const e=getEst(id);if(!guardEdit(e)||!guardItemEdit(e,wiIdx,()=>duplicateLine(id,wiIdx,lIdx)))return;
  const wi=e.workItems[wiIdx];const line=wi.lines[lIdx];if(!line)return;
  wi.lines.splice(lIdx+1,0,JSON.parse(JSON.stringify(line)));
  e.history.push({date:todayISO(),action:'Line duplicated: '+line.desc,by:'Aleksandar C.'});
  syncEstimation(e);renderAll();

function deleteLine(id,wiIdx,lIdx){

function moveLine(id,wiIdx,lIdx,dir){
  const e=getEst(id);if(!guardEdit(e)||!guardItemEdit(e,wiIdx,()=>moveLine(id,wiIdx,lIdx,dir)))return;
  const wi=e.workItems[wiIdx];if(!wi)return renderAll();

  // shrank from a concurrent edit elsewhere such that lIdx is now out of range but lIdx+dir

// History and notes are both a record of what happened to this estimate over time, so they read as

// ─────────────────────────────────────────────────────────────────────────
// STATUS WORKFLOW — frontend enforcement only. The future backend must
// enforce these exact same transition and precondition rules server-side.
//   Draft → Internal Review → Sent → Accepted
//   From Sent, also: Declined · Expired · (Revision requested, via createRevision)
// A Draft can never jump straight to Accepted, and Sent requires ≥1 valid cost line.
// ─────────────────────────────────────────────────────────────────────────
const ALLOWED_TRANSITIONS={draft:['review','sent'],review:['draft','sent'],sent:['accepted','declined','expired','review'],accepted:[],declined:[],expired:[]};
function hasValidCostLine(e){return e.workItems.some(wi=>wi.lines.some(l=>!isBlank(l.desc)&&isPositiveNumber(l.qty)&&isNonNegNumber(l.sell)));}
function requestStageChange(id,stage){
  const t=T[LANG];const e=getEst(id);if(!e||e.status===stage)return;
  if(isLocked(e)){toast(t.locked_msg.replace('{no}',e.no),'error');return;}
  const allowed=ALLOWED_TRANSITIONS[e.status]||[];
  if(!allowed.includes(stage)){toast(t.transition_blocked.replace('{a}',t['st_'+e.status]).replace('{b}',t['st_'+stage]),'error');return;}
  if(stage==='sent'&&!hasValidCostLine(e)){toast(t.err_needs_line,'error');return;}
  if(!confirm(t.confirm_stage.replace('{s}',t["st_"+stage])))return;
  e.status=stage;
  e.history.push({date:todayISO(),action:`Status changed to ${t["st_"+stage]}`,by:"Aleksandar C."});
  syncEstimation(e);
  renderAll();
}

function saveLineForm(id,wiIdx,lIdx){
  const t=T[LANG];clearAllFieldErrors();
  const e=getEst(id);if(!guardEdit(e)||!guardItemEdit(e,wiIdx))return;
  const wi=e.workItems[wiIdx];if(!wi)return;

  if(!desc){showFieldError('aiDesc','aiDescErr',t.err_required);return;}
  const qty=parseFloat($("aiQty").value),sell=parseFloat($("aiSell").value),cost=parseFloat($("aiCost").value),
    disc=parseFloat($("aiDisc").value),tax=parseFloat($("aiTax").value),waste=parseFloat($("aiWaste").value)||0;
  if(!isPositiveNumber(qty)){showFieldError('aiQty','aiNumErr',t.err_qty);return;}
  if(!isNonNegNumber(sell)){showFieldError('aiSell','aiNumErr',t.err_sell);return;}
  if(!isNonNegNumber(cost)){showFieldError('aiCost','aiNumErr',t.err_cost);return;}
  if(!isPercent(disc)){showFieldError('aiDisc','aiNumErr',t.err_disc);return;}
  if(!isPercent(tax)){showFieldError('aiTax','aiNumErr',t.err_tax);return;}
  const category=$("aiCat").value;
  const payload={desc,category,qty,unit:$("aiUnit").value.trim()||"pcs",cost,sell,disc,tax,waste:category==='material'?Math.max(0,Math.min(100,waste)):0};
  // Pass 3.27 bug hunt: workItems can now be replaced wholesale by hydrateSharedEstimations()
  // reacting to workshop:data WHILE this modal is open (Pass 3.22 made it re-callable, correctly,
  // for the cross-tab sync it exists to support) - if the line this modal was opened for was
  // removed/reordered by a concurrent edit elsewhere in the meantime, wi.lines[lIdx] is now stale
  // and Object.assign(undefined,payload) throws. Same "record no longer exists" class of guard as
  // guardEdit()/getEst() above, just for the array position specifically.
  if(editing){
    if(!wi.lines[lIdx]){toast(t.err_line_changed,'error');closeModal();renderAll();return;}
    Object.assign(wi.lines[lIdx],payload);e.history.push({date:todayISO(),action:`Line updated in ${wi.desc}: ${desc}`,by:"Aleksandar C."});
  }
  else{wi.lines.push(payload);e.history.push({date:todayISO(),action:`Item added to ${wi.desc}: ${desc}`,by:"Aleksandar C."});}
  syncEstimation(e);
  closeModal();renderAll();
}

// An estimate linked to a project cannot be safely deleted (the project still references it) — offer
// Archive instead and explain why. Unlinked estimates can be deleted after confirmation.
function deleteEst(id){
  const t=T[LANG];const e=getEst(id);if(!e)return;
  if(e.projectNo){
    if(!confirm(t.confirm_archive.replace('{no}',e.no).replace('{p}',e.projectNo)))return;
    e.archived=true;
    e.history.push({date:todayISO(),action:'Archived (linked to project '+e.projectNo+')',by:'Aleksandar C.'});
    syncEstimation(e);
    if(selectedId===id){const visible=ESTIMATIONS.filter(x=>x.id!==id&&!x.archived);selectedId=visible.length?visible[0].id:null;}
    renderAll();
    return;
  }
  if(!confirm(t.confirm_delete))return;
  // Unlinked estimates are removed from BOTH this page's local list and the shared data layer, so the
  // record cannot reappear on refresh (hydrateSharedEstimations() re-adds anything still present there).
  if(window.WorkshopData&&e.sharedId){
    const res=WorkshopData.deleteEstimation(e.sharedId);
    if(res&&res.error){toast(res.error,'error');return;}
  }
  ESTIMATIONS=ESTIMATIONS.filter(x=>x.id!==id);
  if(selectedId===id)selectedId=ESTIMATIONS.length?ESTIMATIONS[0].id:null;
  renderAll();
}

  p.activity.push({date:todayISO(),time:nowTime(),user:'Aleksandar C.',action});
  const res=WorkshopData.upsertProject(p);
  if(res&&res.code==='QUALITY_HOLD_ACTIVE'){alert(T[LANG].qh_blocked);return false;}
  hydrateProjects();closeModal();renderAll();return true;
}
function wfGate(p){return (p&&WorkshopData.getProjectQualityGate)?WorkshopData.getProjectQualityGate(p.no):{blocked:false,holds:[],reasons:[]};}
// What still stands in the way of finishing: an active hold, unfinished items, undelivered orders.
function wfIssues(p){
  const t=T[LANG],iss=[],gate=wfGate(p);
  if(gate.blocked)(gate.reasons||[t.qh_blocked]).forEach(r=>iss.push(r));
  const items=projectItemRows(p.no).filter(j=>j.status!=='completed'&&j.status!=='cancelled');
  if(items.length)iss.push(t.iss_open_jc.replace('{n}',items.length));
  const pos=wfPurchaseRows(p.no).filter(x=>x.status!=='delivered'&&x.status!=='cancelled');
  if(pos.length)iss.push(t.iss_po_undelivered.replace('{n}',pos.length));
  return iss;
}
function projectItemRows(no){
  if(!window.WorkshopData||!WorkshopData.listJobcards)return[];
  return WorkshopData.listJobcards().filter(j=>j.projectNo===no&&!j.archived);
}
function wfPurchaseRows(no){
  if(!window.WorkshopData||!WorkshopData.listPurchaseOrders)return[];
  return WorkshopData.listPurchaseOrders().filter(x=>x.projectNo===no&&!x.archived);
}

// ── The step strip: where the project stands, and what it may do next ──
function wfPipeAction(p,step){
  if(step==='approved'&&canApprove(p))return'approve';
  if(step==='planned'&&canPlan(p))return'plan';
  if(step==='active'&&canStart(p))return'start';
  if((step==='active'||step==='planned')&&canResume(p))return'resume';
  if(step==='active'&&canReopen(p))return'reopen';
  return null;
}
function renderProjectWorkflow(){
  const p=wfProject();if(!p)return '';
  const t=T[LANG],cur=uiStatus(p.status),at=PIPELINE.indexOf(cur);
  const steps=PIPELINE.map((st,i)=>{
    const isNow=st===cur,act=isNow?null:wfPipeAction(p,st),done=at>=0&&i<at;
    const cls=['pstep',isNow?'now':'',done?'done':'',act?'can':''].filter(Boolean).join(' ');
    const title=isNow?t.pipe_current:act?t.pipe_next:done?t.pipe_done:'';
    return act?`<button class="${cls}" data-status="${st}" title="${esc(title)}" onclick="wfAction('${act}')">${esc(t["f_"+st]||st)}</button>`
              :`<span class="${cls}" data-status="${st}" title="${esc(title)}">${esc(t["f_"+st]||st)}</span>`;
  }).join("");
  const off=at<0?`<div class="pipeoff">${esc(t.pipe_off.replace("{s}",t["f_"+cur]||p.status))}</div>`:"";
  const more=[['hold',t.a_hold,canHold(p)],['resume',t.a_resume,canResume(p)],['complete',t.a_complete,canComplete(p)],
              ['close',t.a_close,canClose(p)],['cancel',t.a_cancel,canCancel(p)],['reopen',t.a_reopen,canReopen(p)]]
    .filter(x=>x[2]).map(x=>`<button onclick="wfAction('${x[0]}')">${esc(x[1])}</button>`).join("");
  return `<div class="pipe">
    <div class="pipehead"><span class="pipelbl">${esc(t.pipe_label)}</span>
      ${more?`<div class="more"><button class="tbtn small" id="wfMoreBtn">${esc(t.a_more)} ▾</button><div class="moremenu" id="wfMoreMenu">${more}</div></div>`:''}</div>
    <div class="psteps">${steps}</div>${off}</div>`;
}
function wireProjectWorkflow(){
  const b=$("wfMoreBtn");if(!b)return;
  b.addEventListener('click',ev=>{ev.stopPropagation();$("wfMoreMenu").classList.toggle('open');});
}
document.addEventListener('click',()=>{const m=$("wfMoreMenu");if(m)m.classList.remove('open');});

function wfAction(kind){
  const m=$("wfMoreMenu");if(m)m.classList.remove('open');
  const p=wfProject();if(!p)return;
  if(kind==='approve')return wfApprove(p);
  if(kind==='plan')return wfPlan(p);
  if(kind==='start')return wfStart(p);
  if(kind==='hold')return wfHold(p);
  if(kind==='resume')return wfResume(p);
  if(kind==='complete')return wfComplete(p);
  if(kind==='close')return wfClose(p);
  if(kind==='cancel')return wfCancel(p);
  if(kind==='reopen')return wfReopen(p);
}

function wfApprove(p){const t=T[LANG];
  showModal(`<h2>${esc(t.approve_title)}</h2><p class="fsub">${esc(t.approve_body)}</p>
    <div class="frow"><label for="wfDate">${esc(t.approve_date)}</label><input type="date" id="wfDate" value="${todayISO()}"></div>
    <div class="frow"><label for="wfPo">${esc(t.approve_po)}</label><input type="text" id="wfPo" value="${esc(p.poNumber||'')}"></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn primary" onclick="wfDoApprove()">${esc(t.approve_save)}</button></div>`);}
function wfDoApprove(){const p=wfProject();if(!p||!canApprove(p))return closeModal();
  const po=$("wfPo").value.trim();p.status='approved';p.approvedDate=$("wfDate").value||todayISO();if(po)p.poNumber=po;
  wfSave(p,'Status changed: QUOTATION → APPROVED'+(po?' — customer PO '+po:''));}

function wfPlan(p){const t=T[LANG];
  showModal(`<h2>${esc(t.plan_title)}</h2><p class="fsub">${esc(t.plan_body)}</p>
    <div class="frow"><label for="wfStart">${esc(t.plan_start)}</label><input type="date" id="wfStart" value="${esc(p.plannedStart||'')}"></div>
    <div class="frow"><label for="wfDl">${esc(t.plan_deadline)}</label><input type="date" id="wfDl" value="${esc(p.deadline||'')}"></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn primary" onclick="wfDoPlan()">${esc(t.plan_save)}</button></div>`);}
function wfDoPlan(){const t=T[LANG],p=wfProject();if(!p||!canPlan(p))return closeModal();
  const a=$("wfStart").value,b=$("wfDl").value;
  if(!a||!b){alert(t.plan_err_dates);return;}
  if(b<a){alert(t.plan_err_order);return;}
  p.status='planned';p.plannedStart=a;p.deadline=b;
  wfSave(p,'Status changed: APPROVED → PLANNED — '+wfDate(a)+' → '+wfDate(b));}

function wfStart(p){const t=T[LANG];
  showModal(`<h2>${esc(t.start_title)}</h2><p class="fsub">${esc(t.start_body)}</p>
    <div class="frow"><label for="wfAct">${esc(t.start_date)}</label><input type="date" id="wfAct" value="${esc(p.actualStart||todayISO())}"></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn primary" onclick="wfDoStart()">${esc(t.start_save)}</button></div>`);}
function wfDoStart(){const p=wfProject();if(!p||!canStart(p))return closeModal();
  p.status='active';p.actualStart=$("wfAct").value||todayISO();
  wfSave(p,'Status changed: PLANNED → ACTIVE — started '+wfDate(p.actualStart));}

function wfHold(p){const t=T[LANG];
  showModal(`<h2>${esc(t.hold_title)}</h2>
    <div class="frow"><label for="wfReason">${esc(t.hold_reason)}</label><select id="wfReason">${HOLD_REASONS.map(r=>`<option value="${r}">${esc(t["hr_"+r]||r)}</option>`).join("")}</select></div>
    <div class="frow"><label for="wfComment">${esc(t.hold_comment)}</label><textarea id="wfComment" rows="3"></textarea></div>
    <div class="frow"><label for="wfExp">${esc(t.hold_expected)}</label><input type="date" id="wfExp"></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn primary" onclick="wfDoHold()">${esc(t.hold_save)}</button></div>`);}
function wfDoHold(){const t=T[LANG],p=wfProject();if(!p||!canHold(p))return closeModal();
  const r=$("wfReason").value;p.status='hold';p.holdReason=r;p.holdComment=$("wfComment").value;p.expectedResume=$("wfExp").value;
  wfSave(p,'Status changed → ON HOLD ('+(t["hr_"+r]||r)+')');}

function wfResume(p){const t=T[LANG];
  showModal(`<h2>${esc(t.resume_title)}</h2>
    <div class="frow"><label for="wfTo">${esc(t.resume_tostatus)}</label><select id="wfTo"><option value="active">${esc(t.f_active)}</option><option value="planned">${esc(t.f_planned)}</option></select></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn primary" onclick="wfDoResume()">${esc(t.resume_save)}</button></div>`);}
function wfDoResume(){const p=wfProject();if(!p||!canResume(p))return closeModal();
  const to=$("wfTo").value;p.status=to;p.holdReason='';p.holdComment='';p.expectedResume='';
  wfSave(p,'Status changed: ON HOLD → '+to.toUpperCase());}

// Finishing is gated: an active Quality Hold can never be overridden, and the remaining checks are
// listed before anyone commits to them.
function wfComplete(p){const t=T[LANG],iss=wfIssues(p),held=wfGate(p).blocked;
  if(!iss.length)return showModal(`<h2>${esc(t.complete_title)}</h2><p class="fsub">${esc(t.complete_ok)}</p>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn primary" onclick="wfDoComplete()">${esc(t.complete_confirm)}</button></div>`);
  showModal(`<h2>${esc(t.complete_issues_title)}</h2><ul class="issuelist">${iss.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.complete_goback)}</button>
    ${held?'':`<button class="tbtn primary" onclick="wfDoComplete()">${esc(t.complete_override)}</button>`}</div>`);}
function wfDoComplete(){const p=wfProject();if(!p||!canComplete(p))return closeModal();
  p.status='completed';p.actualCompletion=todayISO();wfSave(p,'Status changed → COMPLETED');}

function wfClose(p){const t=T[LANG],iss=wfIssues(p);
  if(iss.length)return showModal(`<h2>${esc(t.close_issues_title)}</h2><ul class="issuelist">${iss.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.complete_goback)}</button></div>`);
  showModal(`<h2>${esc(t.close_title)}</h2><p class="fsub">${esc(t.close_ok)}</p>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn primary" onclick="wfDoClose()">${esc(t.close_confirm)}</button></div>`);}
function wfDoClose(){const p=wfProject();if(!p||!canClose(p))return closeModal();
  p.status='closed';p.closedDate=todayISO();wfSave(p,'Status changed → CLOSED');}

function wfCancel(p){const t=T[LANG];
  showModal(`<h2>${esc(t.cancel_title)}</h2>
    <div class="frow"><label for="wfCx">${esc(t.cancel_reason)}</label><textarea id="wfCx" rows="3"></textarea><div id="wfCxErr" class="errmsg" style="display:none;"></div></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn danger" onclick="wfDoCancel()">${esc(t.cancel_save)}</button></div>`);}
function wfDoCancel(){const t=T[LANG],p=wfProject();if(!p||!canCancel(p))return closeModal();
  const r=$("wfCx").value.trim();
  if(!r){showFieldError('wfCx','wfCxErr',t.err_required);return;}
  p.status='cancelled';p.cancelReason=r;wfSave(p,'Status changed → CANCELLED: '+r);}

function wfReopen(p){const t=T[LANG],held=wfGate(p).blocked;
  showModal(`<h2>${esc(t.reopen_title)}</h2>
    <div class="frow"><label for="wfRo">${esc(t.reopen_reason)}</label><textarea id="wfRo" rows="3"></textarea><div id="wfRoErr" class="errmsg" style="display:none;"></div></div>
    <div class="frow"><label for="wfRoTo">${esc(t.reopen_tostatus)}</label><select id="wfRoTo"><option value="active">${esc(t.f_active)}</option>${held?'':`<option value="completed">${esc(t.f_completed)}</option>`}</select></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn primary" onclick="wfDoReopen()">${esc(t.reopen_save)}</button></div>`);}
function wfDoReopen(){const t=T[LANG],p=wfProject();if(!p||!canReopen(p))return closeModal();
  const r=$("wfRo").value.trim();
  if(!r){showFieldError('wfRo','wfRoErr',t.err_required);return;}
  p.status=$("wfRoTo").value;p.closedDate='';wfSave(p,'Reopened → '+p.status.toUpperCase()+' — reason: '+r);}


// ── Creating a project ──
// Kept from the Projects module because an estimate cannot exist without a project: with the module
// gone this is the only way a new job enters the system. Deliberately short - a project starts as
// the quotation, so it needs a customer, a name and a price, and the rest is filled in as it moves.
function openNewProject(){
  const t=T[LANG];
  const opts=Object.keys(CUSTOMERS).map(id=>`<option value="${id}">${esc(CUSTOMERS[id].name)}</option>`).join("");
  newProjItems=[];
  showModal(`<h2>${esc(t.np_title)}</h2><p class="fsub">${esc(t.np_body)}</p>
    <div class="frow2"><div><label for="npCust">${esc(t.np_customer)} *</label><select id="npCust">${opts}</select></div>
      <div><label for="npName">${esc(t.np_name)} *</label><input id="npName"></div></div>
    <div id="npErr" class="errmsg" style="display:none;"></div>
    <div class="frow2"><div><label for="npKind">${esc(t.np_kind)} *</label><select id="npKind">
        <option value="offer">${esc(t.kind_offer)}</option>
        <option value="internal">${esc(t.kind_internal)}</option>
        <option value="service">${esc(t.kind_service)}</option></select></div>
      <div><label for="npDeadline">${esc(t.np_deadline)}</label><input id="npDeadline" type="date"></div></div>
    <div class="frow"><label>${esc(t.np_items)}</label>
      <div class="npitems" id="npItems"></div>
      <div class="npadd"><input id="npItemDesc" placeholder="${esc(t.np_item_ph)}"><button class="tbtn small" type="button" onclick="addNewProjItem()">+ ${esc(t.np_item_add)}</button></div>
      <div class="fsub">${esc(t.np_items_hint)}</div></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn primary" onclick="saveNewProject()">${esc(t.np_save)}</button></div>`);
  renderNewProjItems();
  const box=$("npItemDesc");
  if(box)box.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();addNewProjItem();}});
}
// The items are collected before the project exists, then created with it.
let newProjItems=[];
function addNewProjItem(){
  const box=$("npItemDesc");if(!box)return;
  const v=box.value.trim();if(!v)return;
  newProjItems.push(v);box.value='';renderNewProjItems();box.focus();
}
function removeNewProjItem(i){newProjItems.splice(i,1);renderNewProjItems();}
function renderNewProjItems(){
  const el=$("npItems");if(!el)return;
  const t=T[LANG];
  el.innerHTML=newProjItems.length
    ? newProjItems.map((d,i)=>`<div class="npitem"><span class="npn">${i+1}</span><span class="npd">${esc(d)}</span><button type="button" class="npx" onclick="removeNewProjItem(${i})" title="${esc(t.np_item_remove)}">×</button></div>`).join("")
    : `<div class="empty3">${esc(t.np_items_empty)}</div>`;
}
function saveNewProject(){
  const t=T[LANG];clearAllFieldErrors();
  const name=$("npName").value.trim();
  if(!name){showFieldError('npName','npErr',t.err_required);return;}
  const localId=parseInt($("npCust").value),c=CUSTOMERS[localId];
  const shared=WorkshopData.get().customers.find(x=>x.name===c.name);
  const kind=$("npKind").value;
  // No price is typed here: a project is priced by estimating its items, and the estimate writes
  // the quoted value back. Creating it with a number would just be a figure nobody had worked out.
  const saved=WorkshopData.upsertProject({name,customerId:shared?shared.id:null,customer:shared?shared.name:c.name,
    status:'quotation',quoteKind:kind,quotedValue:0,deadline:$("npDeadline").value||'',plannedStart:'',
    types:[kind==='service'?'Service':'Fabrication'],pm:'Aleksandar',createdDate:todayISO(),
    activity:[{date:todayISO(),time:nowTime(),user:'Aleksandar C.',action:'Project created ('+kind+')'}]});
  if(!saved||saved.error){alert(saved&&saved.error?saved.error:t.err_required);return;}
  // Each line becomes a real project item, so the estimate has something to price straight away.
  newProjItems.forEach(desc=>WorkshopData.upsertJobcard({projectId:saved.id,projectNo:saved.no,
    customerId:saved.customerId,customer:saved.customer,title:desc,item:desc,quantity:1,revision:0,
    workType:kind==='service'?'maintenance':'other',location:'workshop',priority:'medium',
    responsible:'Aleksandar C.',workers:[],status:'draft',plannedHours:0,estimatedMaterialCost:0,
    progress:0,actualHours:0,archived:false,created:todayISO(),createdBy:'Aleksandar C.'}));
  hydrateProjects();
  const e=ensureEstimateForProject(saved.no);
  if(e)selectedId=e.id;
  const n=newProjItems.length;newProjItems=[];
  closeModal();renderAll();
  toast(t.np_created.replace('{no}',saved.no).replace('{n}',n),'ok');
}
// A brand-new project has no estimate yet; it gets one so it can be priced straight away.
function ensureEstimateForProject(no){
  let e=estForProject(no);if(e)return e;
  const p=PROJECTS[no];if(!p)return null;
  const created=todayISO();
  e={id:nextEstId++,no:'EST-'+no.replace(/^P-/,''),projectNo:no,projectTitle:p.name,
     customerId:localCustomerIdForShared(p.customerId,p.customer),status:'draft',created,
     validUntil:addDaysISO(created,30),currency:'SEK',deliveryTime:'—',paymentTerms:'30 days',
     priceList:'Standard Price List 2026',incoterms:'EXW Marieholm',reference:'—',customerRfq:'',
     opportunityRef:'',requestedDelivery:'',createdBy:'Aleksandar C.',estimator:'Aleksandar C.',
     overheadPct:8,contingencyPct:5,discount:0,workItems:[],retiredWorkItems:[],options:[],exclusions:[],
     terms:'Prices valid for 30 days.',documents:[],revision:0,revisionSnapshots:[],
     history:[{date:created,time:nowTime(),action:'Estimation created (Rev 0)',by:'Aleksandar C.'}],notes:[]};
  ESTIMATIONS.push(e);syncEstimation(e);
  return e;
}


// ── How long an item takes, and how many people it occupies ──
// Estimated per item because that is the only level anyone can judge it at; the project's duration
// and crew are then derived from these rather than typed a second time.
function openItemEffort(id,idx){
  const e=getEst(id),wi=getWorkItem(e,idx);if(!e||!wi)return;
  if(!guardEdit(e)||!guardItemEdit(e,idx,()=>openItemEffort(id,idx)))return;
  const t=T[LANG],ref=itemRef(e,wi.seq||idx+1);
  showModal(`<h2>${esc(t.effort_title)}</h2><p class="fsub">${esc(ref)} — ${esc(wi.desc)}</p>
    <div class="frow2">
      <div><label for="efDays">${esc(t.effort_days)}</label><input id="efDays" type="number" min="0" step="0.5" value="${itemDays(wi)||''}"></div>
      <div><label for="efPeople">${esc(t.effort_people)}</label><input id="efPeople" type="number" min="0" step="1" value="${itemPeople(wi)||''}"></div>
    </div>
    <div id="efErr" class="errmsg" style="display:none;"></div>
    <p class="fsub">${esc(t.effort_hint)}</p>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn primary" onclick="saveItemEffort(${id},${idx})">${esc(t.nc_save)}</button></div>`);
}
function saveItemEffort(id,idx){
  const t=T[LANG],e=getEst(id),wi=getWorkItem(e,idx);if(!e||!wi)return;
  const d=parseFloat($("efDays").value)||0,p=parseInt($("efPeople").value,10)||0;
  if(d<0||p<0){showFieldError('efDays','efErr',t.effort_err);return;}
  // One without the other says nothing useful, so both are asked for together.
  if((d>0)!==(p>0)){showFieldError(d>0?'efPeople':'efDays','efErr',t.effort_err_pair);return;}
  wi.days=d;wi.people=p;
  syncEstimation(e);closeModal();renderAll();
}
// What the priced items add up to in time and crew, for the whole project.
function renderEffortSummary(e){
  const t=T[LANG],tot=effortTotals(e.workItems);
  if(!tot.items)return '';
  const val=v=>v?String(v):'—';
  return `<div class="panel effortpanel">
    <div class="phead"><h3>${esc(t.effort_panel)}</h3>${tot.estimated<tot.items?`<span class="stpill draft">${esc(t.effort_partial.replace('{a}',tot.estimated).replace('{b}',tot.items))}</span>`:''}</div>
    <div class="effgrid">
      <div class="eff"><div class="effk">${esc(t.effort_duration)}</div><div class="effv">${val(tot.totalDays)}<span class="effu">${esc(t.effort_days_unit)}</span></div></div>
      <div class="eff"><div class="effk">${esc(t.effort_avg)}</div><div class="effv">${val(tot.avgPeople)}<span class="effu">${esc(t.effort_people_unit)}</span></div></div>
      <div class="eff"><div class="effk">${esc(t.effort_peak)}</div><div class="effv">${val(tot.peakPeople)}<span class="effu">${esc(t.effort_people_unit)}</span></div></div>
      <div class="eff"><div class="effk">${esc(t.effort_persondays)}</div><div class="effv">${val(tot.personDays)}<span class="effu">${esc(t.effort_pd_unit)}</span></div></div>
    </div></div>`;
}
