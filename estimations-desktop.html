<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>Varmak — Estimations</title><style>
  :root{--navy-950:#04101f;--navy-900:#071a33;--navy-800:#0a2447;--navy-brand:#013179;
    --steel-400:#8ea3c0;--steel-300:#b9c6da;--spark:#4a90ff;--ice:#e8f0fb;
    --line:rgba(142,163,192,0.16);--field:rgba(255,255,255,0.045);--field-line:rgba(185,198,218,0.24);
    --ok:#4ad48a;--warn:#ffb057;--danger:#ff6b6b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ice);min-height:100vh;}
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--navy-950);}
  .bg::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 82% 0%,rgba(1,49,121,0.5),transparent 55%),radial-gradient(80% 60% at 10% 100%,rgba(10,36,71,0.6),transparent 60%),linear-gradient(160deg,var(--navy-950),var(--navy-900) 60%,var(--navy-950));}
  .grid{position:absolute;inset:0;opacity:0.28;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);}
  .glow{position:absolute;left:50%;top:20%;width:560px;height:560px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(74,144,255,0.16),transparent 62%);filter:blur(8px);animation:pulse 6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
  .ember{position:absolute;bottom:-10px;border-radius:50%;background:var(--spark);box-shadow:0 0 6px 1px rgba(74,144,255,.8);animation:rise linear infinite;opacity:0;}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-105vh) translateX(var(--drift));opacity:0}}
  @media (prefers-reduced-motion:reduce){.glow,.ember{animation:none}}

  .topfull{position:relative;z-index:2;width:100%;padding:22px 36px 0;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;}
  .brand .logo{font-family:'Sora';font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .brand .logo .dot{width:6px;height:6px;background:var(--spark);box-shadow:0 0 9px 1px rgba(74,144,255,.9);}
  .brand .meta{font-size:11px;color:var(--steel-400);margin-top:2px;line-height:1.5;}
  .topright{display:flex;flex-direction:column;align-items:flex-end;gap:9px;}
  .clock{text-align:right;font-variant-numeric:tabular-nums;} .clock .time{font-family:'Sora';font-weight:600;font-size:16px;} .clock .date{font-size:11px;color:var(--steel-400);}
  .who{display:flex;align-items:center;gap:8px;}
  .who .badge{display:flex;align-items:center;gap:7px;padding:5px 10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;}
  .who .badge .av{width:20px;height:20px;background:linear-gradient(135deg,#2c6bd6,#0a2447);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:'Sora';}
  .who .role{color:var(--spark);font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
  .who .out{background:transparent;border:1px solid var(--field-line);color:var(--steel-300);padding:6px 10px;font-size:12px;cursor:pointer;font-family:'Inter';transition:.15s;}
  .who .out:hover{border-color:var(--spark);color:var(--ice);}

  .wrap{position:relative;z-index:2;max-width:1620px;margin:0 auto;padding:26px 32px 40px;}
  .modhead{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .back{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--field-line);color:var(--steel-300);font-family:'Inter';font-size:12.5px;padding:9px 13px;cursor:pointer;transition:.15s;}
  .back:hover{border-color:var(--spark);color:var(--ice);}
  .modhead .ttl{display:flex;align-items:center;gap:11px;}
  .modhead .ic{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(74,144,255,.14);box-shadow:inset 0 0 0 1px rgba(74,144,255,.35);}
  .modhead h1{font-family:'Sora';font-weight:600;font-size:22px;letter-spacing:-.01em;} .modhead p{font-size:12px;color:var(--steel-400);}

  .tbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--field-line);background:transparent;color:var(--steel-300);font-family:'Sora';font-weight:600;font-size:12.5px;padding:9px 13px;cursor:pointer;transition:.16s;white-space:nowrap;}
  .tbtn:hover{border-color:var(--spark);color:var(--ice);}
  .tbtn.primary{background:linear-gradient(180deg,#2c6bd6,#013179);border:none;color:#fff;}
  .tbtn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(44,107,214,.5);}
  .tbtn.small{padding:6px 10px;font-size:11.5px;}
  .tbtn.danger{border-color:rgba(255,107,107,.4);color:#ffb3b3;}
  .tbtn.danger:hover{border-color:var(--danger);color:#fff;background:rgba(255,107,107,.1);}
  .tbtn svg{flex:none;width:13px;height:13px;}

  .crmgrid{display:grid;grid-template-columns:300px 1fr 320px;gap:16px;align-items:start;}
  @media(max-width:1400px){.crmgrid{grid-template-columns:1fr;}}
  .col{display:flex;flex-direction:column;gap:16px;}
  .panel{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:17px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .panel .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:10px;}
  .panel .phead h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--spark);font-weight:700;}

  .search{position:relative;flex:1;}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--steel-400);}
  .search input{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:'Inter';font-size:13px;padding:9px 10px 9px 32px;outline:none;}
  .search input:focus{border-color:var(--spark);}
  .listtoolbar{display:flex;gap:8px;margin-bottom:11px;}
  .iconbtn{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);cursor:pointer;}
  .iconbtn:hover{border-color:var(--spark);color:var(--ice);}

  .segtabs{display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap;}
  .segtabs button{flex:1;background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);font-family:'Inter';font-size:10.5px;padding:7px 4px;cursor:pointer;transition:.15s;white-space:nowrap;}
  .segtabs button.on{background:rgba(74,144,255,.16);border-color:rgba(74,144,255,.5);color:#cfe0ff;}

  .estlist{display:flex;flex-direction:column;gap:6px;max-height:440px;overflow-y:auto;margin:-4px;padding:4px;}
  .estrow{display:block;width:100%;padding:10px 11px;border:1px solid var(--line);cursor:pointer;transition:.14s;text-align:left;color:inherit;background:transparent;font:inherit;}
  .estrow:hover{background:rgba(255,255,255,.03);}
  .estrow.sel{background:rgba(74,144,255,.12);border-color:rgba(74,144,255,.45);}
  .estrow .er1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px;}
  .estrow .eno{font-family:'Sora';font-weight:600;font-size:12.5px;}
  .estrow .ecust{font-size:11px;color:var(--steel-400);margin-bottom:5px;}
  .estrow .er2{display:flex;justify-content:space-between;align-items:center;}
  .estrow .eval{font-family:'Sora';font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;}

  .pager{display:flex;align-items:center;justify-content:space-between;margin-top:11px;font-size:11px;color:var(--steel-400);}
  .pager .pnav{display:flex;gap:5px;}
  .pager button{background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);width:24px;height:24px;cursor:pointer;font-size:11px;}
  .pager button.cur{background:rgba(74,144,255,.18);border-color:rgba(74,144,255,.5);color:#cfe0ff;}
  .pager button:disabled{opacity:.35;cursor:not-allowed;}

  .sumgrid2{display:flex;flex-direction:column;gap:0;}
  .sumtotal{display:flex;justify-content:space-between;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line);}
  .sumtotal .sl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);margin-bottom:5px;}
  .sumtotal .sv{font-family:'Sora';font-size:19px;font-weight:600;}
  .sumbystatus{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .sumbystatus .ss{}
  .sumbystatus .sl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);margin-bottom:4px;}
  .sumbystatus .sv{font-family:'Sora';font-size:16px;font-weight:600;} .sumbystatus .sv.draft{color:var(--steel-300);} .sumbystatus .sv.sent{color:var(--spark);} .sumbystatus .sv.accepted{color:var(--ok);} .sumbystatus .sv.declined{color:var(--danger);}
  .sumbystatus .ssub{font-size:10.5px;color:var(--steel-400);}

  .dhead3{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .dhead3 .idn{display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
  .dhead3 h2{font-family:'Sora';font-weight:700;font-size:19px;letter-spacing:-.01em;}
  .dhead3 .dbtns{display:flex;gap:8px;flex-wrap:wrap;}

  .stpill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;font-weight:700;white-space:nowrap;border:1px solid;}
  .stpill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .stpill.draft{color:#cfe0ff;border-color:rgba(74,144,255,.5);background:rgba(74,144,255,.18);}
  .stpill.review{color:var(--steel-300);border-color:var(--field-line);background:rgba(142,163,192,.1);}
  .stpill.sent{color:var(--spark);border-color:rgba(74,144,255,.4);background:rgba(74,144,255,.1);}
  .stpill.accepted{color:var(--ok);border-color:rgba(74,212,138,.4);background:rgba(74,212,138,.1);}
  .stpill.declined{color:var(--danger);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.1);}
  .stpill.expired{color:var(--steel-400);border-color:var(--line);background:rgba(142,163,192,.08);}

  .metarow{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:18px;}
  .meta{display:flex;align-items:flex-start;gap:8px;}
  .meta svg{flex:none;width:14px;height:14px;color:var(--steel-400);margin-top:2px;}
  .meta .mk{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);margin-bottom:2px;}
  .meta .mv{font-size:13px;font-weight:600;}

  .stepper{display:flex;align-items:center;margin-bottom:22px;overflow-x:auto;padding-bottom:2px;}
  .step{display:flex;align-items:center;gap:8px;flex:none;cursor:pointer;padding:6px 4px;border:none;background:none;}
  .step .sdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--field-line);display:flex;align-items:center;justify-content:center;color:var(--steel-400);flex:none;transition:.15s;}
  .step .slabel{font-size:11.5px;font-weight:600;color:var(--steel-400);white-space:nowrap;}
  .step.done .sdot{border-color:var(--ok);background:rgba(74,212,138,.15);color:var(--ok);}
  .step.done .slabel{color:var(--steel-300);}
  .step.current .sdot{border-color:var(--spark);background:var(--spark);color:#fff;box-shadow:0 0 0 4px rgba(74,144,255,.18);}
  .step.current .slabel{color:var(--ice);}
  .step.declined.current .sdot{border-color:var(--danger);background:var(--danger);box-shadow:0 0 0 4px rgba(255,107,107,.18);}
  .step.declined.current .slabel{color:#ffb3b3;}
  .stepline{width:34px;height:1px;background:var(--field-line);flex:none;}

  .infocard3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px;}
  @media(max-width:1000px){.infocard3{grid-template-columns:1fr;}}
  .icard{background:rgba(255,255,255,.025);border:1px solid var(--line);padding:15px;}
  .icard .ich{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
  .icard h4{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--spark);}
  .icard .irow2{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);}
  .icard .irow2:last-child{border-bottom:none;}
  .icard .irow2 .ik{color:var(--steel-400);} .icard .irow2 .iv{font-weight:600;text-align:right;}
  .icard .ilead{font-size:14px;font-weight:700;margin-bottom:8px;}
  .icard .istatus{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ok);margin-bottom:10px;}
  .icard .istatus::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .icard .iline{font-size:12.5px;color:var(--steel-300);display:flex;align-items:flex-start;gap:7px;margin-bottom:7px;}
  .icard .iline svg{flex:none;width:13px;height:13px;color:var(--steel-400);margin-top:1px;}

  .itemshead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
  .itemshead h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--spark);font-weight:700;}
  .itemsactions{display:flex;gap:8px;align-items:center;}
  .costtoggle{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--steel-300);cursor:pointer;user-select:none;}
  .costtoggle input{accent-color:var(--spark);}

  .opttabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .opttab{display:flex;align-items:center;gap:7px;background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);font-family:'Inter';font-size:12px;padding:8px 12px;cursor:pointer;transition:.15s;}
  .opttab.on{border-color:rgba(74,144,255,.5);background:rgba(74,144,255,.12);color:#cfe0ff;}
  .opttab input{accent-color:var(--spark);pointer-events:none;}
  .opttab .odelta{font-variant-numeric:tabular-nums;font-weight:600;color:var(--steel-400);}
  .opttab.on .odelta{color:var(--ok);}

  .itable-wrap{overflow-x:auto;border:1px solid var(--line);background:rgba(255,255,255,.02);margin-bottom:18px;}
  .itable{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px;}
  .itable th{text-align:left;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);border-bottom:1px solid var(--line);padding:9px 10px;white-space:nowrap;}
  .itable th.n,.itable td.n{text-align:right;}
  .itable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  .itable tr.sectionrow td{background:rgba(74,144,255,.06);font-family:'Sora';font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#cfe0ff;padding:8px 10px;}
  .itable tr.subtotalrow td{background:rgba(255,255,255,.02);font-weight:600;color:var(--steel-300);border-bottom:1px solid var(--line);}
  .itable tr.optrow td{background:rgba(74,212,138,.05);}
  .itable .grip{color:var(--steel-400);opacity:.5;margin-right:6px;}
  .itable .idesc{font-weight:500;}
  .itable .isub{color:var(--steel-400);font-size:11px;}
  .itable .costsub{color:var(--steel-400);font-size:10.5px;display:block;margin-top:1px;}
  .subtag{display:inline-block;font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);border:1px solid rgba(255,176,87,.4);background:rgba(255,176,87,.1);padding:1px 6px;margin-left:6px;}
  .cattag{display:inline-block;font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;margin-left:6px;border:1px solid var(--field-line);color:var(--steel-300);background:rgba(255,255,255,.04);}
  .cattag.cat-material{color:#cfe0ff;border-color:rgba(74,144,255,.35);background:rgba(74,144,255,.08);}
  .cattag.cat-subcontractor{color:var(--warn);border-color:rgba(255,176,87,.4);background:rgba(255,176,87,.1);}
  .addline-btn{background:none;border:none;color:var(--spark);font-size:11px;cursor:pointer;margin-left:10px;font-family:'Inter';}
  .addline-btn:hover{text-decoration:underline;}
  .rnum{font-variant-numeric:tabular-nums;white-space:nowrap;}

  .tccard{background:rgba(255,255,255,.025);border:1px solid var(--line);padding:15px;margin-bottom:14px;}
  .tccard .ich{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
  .tccard h4{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--spark);}
  .tccard p{font-size:12.5px;color:var(--steel-300);line-height:1.6;}
  .tccard ul{padding-left:18px;font-size:12.5px;color:var(--steel-300);line-height:1.8;}

  .pricerow{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;}
  .pricerow .pk{color:var(--steel-400);} .pricerow .pv{font-weight:600;font-variant-numeric:tabular-nums;}
  .pricerow.divider{border-top:1px solid var(--line);margin-top:4px;padding-top:12px;}
  .pricerow.grand{padding-top:12px;border-top:1px solid var(--line);margin-top:4px;}
  .pricerow.grand .pk{font-family:'Sora';font-size:13px;color:var(--steel-300);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .pricerow.grand .pv{font-family:'Sora';font-size:22px;color:var(--spark);font-weight:700;}
  .pricerow input.pctinput{width:48px;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-size:11.5px;padding:3px 5px;text-align:right;margin-left:6px;}

  .costrow{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;color:var(--steel-300);}
  .costrow .ck{color:var(--steel-400);}
  .costrow.sub{padding-top:9px;border-top:1px solid var(--line);margin-top:3px;font-weight:600;color:var(--ice);}
  .costrow.final{padding-top:10px;border-top:1px solid var(--line);margin-top:6px;font-weight:700;color:var(--ice);}
  .costrow.profit{color:var(--ok);font-weight:700;font-size:14px;padding-top:10px;border-top:1px solid rgba(74,212,138,.25);margin-top:6px;}
  .costrow.margin{color:var(--ok);font-weight:600;}
  .markupby{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .markupby .mb{flex:1;text-align:center;}
  .markupby .ml{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--steel-400);margin-bottom:3px;}
  .markupby .mv{font-family:'Sora';font-weight:700;font-size:14px;color:var(--ok);}

  .stbl{width:100%;border-collapse:collapse;font-size:12.5px;}
  .empty3{text-align:center;color:var(--steel-400);padding:20px;font-size:12px;}

  .docrow2{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;}
  .docrow2:last-child{border-bottom:none;}
  .dicon{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:8px;color:#fff;}
  .dicon.pdf{background:#c0392b;} .dicon.doc{background:#2c6bd6;} .dicon.xls{background:#1f9d55;} .dicon.zip{background:#8e6bd6;}
  .docrow2 .dn{flex:1;font-weight:500;} .docrow2 .dd{color:var(--steel-400);font-size:10.5px;white-space:nowrap;}
  .docrow2 a{color:var(--steel-400);display:flex;} .docrow2 a:hover{color:var(--ice);}

  .histrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;}
  .histrow:last-child{border-bottom:none;}
  .histrow .hdate{color:var(--steel-400);font-size:10.5px;white-space:nowrap;flex:none;width:76px;}
  .histrow .haction{font-weight:500;} .histrow .hby{color:var(--steel-400);font-size:10.5px;margin-top:1px;}

  .notecard{font-size:12.5px;color:var(--steel-300);line-height:1.55;padding:10px 0;border-bottom:1px solid var(--line);}

function getEst(id){return ESTIMATIONS.find(e=>e.id===id);}
function syncEstimation(e,reason){if(!window.WorkshopData||!e)return null;const c=CUSTOMERS[e.customerId],shared=WorkshopData.get(),sc=shared.customers.find(x=>x.name===c.name),tot=computeTotals(e);const payload={id:e.sharedId,no:e.no,customerId:sc?sc.id:null,customer:c.name,title:e.projectTitle||(PROJECTS[e.projectNo]||{}).name||e.no,status:e.status,revision:e.revision||0,created:e.created,validUntil:e.validUntil,currency:e.currency,estimatedMaterial:tot.materialCost,estimatedLabour:tot.labourCost,estimatedMachine:tot.machineCost,estimatedOther:tot.subCost+tot.consumableCost+tot.logisticsCost+tot.otherCost,totalCost:tot.totalInternalCost,sellingPrice:tot.sellingPrice,plannedHours:e.plannedHours||flatLines(e).filter(x=>x.category==='labour').reduce((a,x)=>a+x.qty,0),machines:e.machines||flatLines(e).filter(x=>x.category==='machine').map(x=>x.desc),deliveryTarget:e.deliveryTarget||e.validUntil,bom:e.sharedBom||[]};const saved=WorkshopData.upsertEstimation(payload);e.sharedId=saved.id;if(reason){WorkshopData.updateEstimation(saved.id,{},reason);e.revision=(e.revision||0)+1;e.history.push({date:new Date().toISOString().slice(0,10),action:`Revision ${e.revision}: ${reason}`,by:'Aleksandar C.'})}return saved}
function stageIndex(status){if(status==='declined'||status==='expired')return 3;return STAGES.indexOf(status);}

function lineTotal(it){return it.qty*it.sell*(1-(it.disc||0)/100);}
function lineTax(it){return lineTotal(it)*(it.tax||0)/100;}
function lineCostTotal(it){return it.qty*it.cost;}

function mergedWorkItems(e){
  const wis=e.workItems.map(wi=>({no:wi.no,desc:wi.desc,lines:wi.lines.slice()}));
  if(activeOptTab!=="base"){
    const opt=e.options.find(o=>o.id===activeOptTab);
    if(opt){
      const optLines=opt.lines.map(l=>Object.assign({},l,{fromOption:opt.name}));
      const target=wis.find(wi=>wi.no&&wi.no===opt.intoWorkItem);
      if(target)target.lines=target.lines.concat(optLines);
      else wis.push({no:"",desc:opt.name,lines:optLines});
    }
  }
  return wis;
}
function flatLines(e){return mergedWorkItems(e).flatMap(wi=>wi.lines);}

function computeTotals(e){
  const items=flatLines(e);
  const bySection={};
  items.forEach(it=>{const s=it.category;bySection[s]=(bySection[s]||0)+lineTotal(it);});
  const sellSubtotal=items.reduce((a,b)=>a+lineTotal(b),0);
  const taxTotal=items.reduce((a,b)=>a+lineTax(b),0);
  const discount=e.discount||0;
  const netSubtotal=sellSubtotal-discount;
  const grandTotal=netSubtotal+taxTotal;

  const costOf=cat=>items.filter(it=>it.category===cat).reduce((a,b)=>a+lineCostTotal(b),0);
  const sellOf=cat=>items.filter(it=>it.category===cat).reduce((a,b)=>a+lineTotal(b),0);
  const materialCost=costOf('material'),labourCost=costOf('labour'),machineCost=costOf('machine'),subCost=costOf('subcontractor'),
    consumableCost=costOf('consumable'),logisticsCost=costOf('logistics'),otherCost=costOf('other');
  const totalDirectCost=materialCost+labourCost+machineCost+subCost+consumableCost+logisticsCost+otherCost;
  const overhead=totalDirectCost*(e.overheadPct||0)/100;
  const contingency=totalDirectCost*(e.contingencyPct||0)/100;
  const totalInternalCost=totalDirectCost+overhead+contingency;
  const sellingPrice=sellSubtotal;
  const grossProfit=(sellingPrice-discount)-totalInternalCost;
  const margin=sellingPrice?grossProfit/(sellingPrice-discount)*100:0;

  const matSell=sellOf('material'),labSell=sellOf('labour'),subSell=sellOf('subcontractor');
  const matMarkup=materialCost?((matSell-materialCost)/materialCost*100):0;
  const labMargin=labourCost?((labSell-labourCost)/labourCost*100):0;
  const subMarkup=subCost?((subSell-subCost)/subCost*100):0;

  return{items,bySection,sellSubtotal,taxTotal,discount,netSubtotal,grandTotal,
    materialCost,labourCost,machineCost,subCost,consumableCost,logisticsCost,otherCost,
    totalDirectCost,overhead,contingency,totalInternalCost,sellingPrice,grossProfit,margin,
    matMarkup,labMargin,subMarkup};
}

function renderItemsTable(e){

        ${showCost?`<td class="rnum">${((it.sell-it.cost)*it.qty).toLocaleString('sv-SE',{maximumFractionDigits:0})}</td><td class="rnum">${it.cost?(((it.sell-it.cost)/it.cost*100).toFixed(0)):'—'}%</td>`:''}
        <td class="rnum">${tot.toLocaleString('sv-SE',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>

}

    <button onclick="duplicateEst(${e.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="1"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>${t.act_duplicate}</button>
    <button onclick="exportExcel(${e.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M9.5 13l5 6M14.5 13l-5 6"/></svg>${t.act_export}</button>
    <button class="danger" onclick="deleteEst(${e.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>${t.act_delete}</button>
  </div>`;
}

function renderAll(){
  const t=T[LANG];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i');if(t[k]!==undefined)el.textContent=t[k];});
  let e=getEst(selectedId);if(!e){e=ESTIMATIONS[0];selectedId=e.id;}
  $("app").innerHTML=`<div class="crmgrid">
    <div class="col">${renderLeft()}</div>
    <div class="col">${renderMiddle(e)}</div>
    <div class="col">${renderRight(e)}</div>
  </div>${renderActionBar(e)}`;
  document.querySelectorAll('.estrow').forEach(row=>row.addEventListener('click',()=>selectEst(Number(row.dataset.estId))));
  const s=$("search");if(s)s.addEventListener('input',ev=>{query=ev.target.value;renderAll();});
  syncModuleSidebar();
}

function syncModuleSidebar(){document.querySelectorAll('#moduleSideNav button[data-ms]').forEach(b=>b.classList.toggle('on',b.dataset.ms===filterStatus));}
function sidebarEstimate(filter){filterStatus=filter;renderAll();window.scrollTo({top:0,behavior:'smooth'});}

function setOptTab(id){activeOptTab=id;renderAll();}

function setStage(id,stage){
  const e=getEst(id);if(e.status===stage)return;
  const t=T[LANG];
  if(!confirm(t.confirm_stage.replace('{s}',t["st_"+stage])))return;
  e.status=stage;
  e.history.push({date:new Date().toISOString().slice(0,10),action:`Status changed to ${t["st_"+stage]}`,by:"Aleksandar C."});
  syncEstimation(e);
  renderAll();
}

function closeModal(){$("fov").classList.remove("show");}
$("fov").addEventListener('click',ev=>{if(ev.target===$("fov"))closeModal();});

function openNewEst(){
  const t=T[LANG];
  const custOpts=Object.keys(CUSTOMERS).map(id=>`<option value="${id}">${CUSTOMERS[id].name}</option>`).join("");
  const projOpts=Object.keys(PROJECTS).map(no=>`<option value="${no}">${no} — ${PROJECTS[no].name}</option>`).join("");
  $("fcard").innerHTML=`<h2>${t.nc_title}</h2><p class="fsub">${t.esub}</p>
    <div class="frow"><label>${t.nc_customer}</label><select id="neCustomer">${custOpts}</select></div>
    <div class="frow"><label>${t.nc_project}</label><select id="neProject">${projOpts}</select></div>
    <div class="frow"><label>${t.nc_valid}</label><input id="neValid" type="date"></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${t.nc_cancel}</button><button class="tbtn primary" onclick="saveNewEst()">${t.nc_save}</button></div>`;
  $("fov").classList.add("show");
}
function saveNewEst(){
  const customerId=parseInt($("neCustomer").value);const projectNo=$("neProject").value;
  const no="EST-26-0"+String(nextEstId).padStart(2,'0');
  ESTIMATIONS.push({id:nextEstId++,no,customerId,projectNo,status:"draft",created:new Date().toISOString().slice(0,10),
    validUntil:$("neValid").value||new Date().toISOString().slice(0,10),currency:"SEK",deliveryTime:"—",paymentTerms:"30 days",
    priceList:"Standard Price List 2026",incoterms:"EXW Marieholm",reference:"—",createdBy:"Aleksandar C.",
    overheadPct:8,contingencyPct:5,discount:0,workItems:autoItems(20000),options:[],exclusions:[],terms:"Prices valid for 30 days.",
    documents:[],history:[{date:new Date().toISOString().slice(0,10),action:"Estimation created (Rev 0)",by:"Aleksandar C."}],notes:[]});
  const created=getEst(nextEstId-1);syncEstimation(created);closeModal();selectedId=nextEstId-1;renderAll();
}

function openEditEst(id){
  const t=T[LANG];const e=getEst(id);
  $("fcard").innerHTML=`<h2>${t.edit} — ${e.no}</h2>
    <div class="frow2"><div><label>${t.ei_ref}</label><input id="eeRef" value="${e.reference}"></div><div><label>${t.ei_valid}</label><input id="eeValid" type="date" value="${e.validUntil}"></div></div>
    <div class="frow2"><div><label>${t.ei_delivery}</label><input id="eeDelivery" value="${e.deliveryTime}"></div><div><label>${t.ei_terms}</label><input id="eeTerms" value="${e.paymentTerms}"></div></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${t.nc_cancel}</button><button class="tbtn primary" onclick="saveEditEst(${id})">${t.nc_save}</button></div>`;
  $("fov").classList.add("show");
}
function openConvertEst(id){const e=getEst(id),tot=computeTotals(e);$("fcard").innerHTML=`<h2>Convert to Project</h2><p class="fsub">${e.no} · ${CUSTOMERS[e.customerId].name}</p><div class="fnote">This will reuse the customer, BOM, estimated hours, machines, selling price and delivery target in Projects, Planning and Store.</div><div class="frow"><label>Project title</label><input id="cpTitle" value="${e.projectTitle||(PROJECTS[e.projectNo]||{}).name||'Project from '+e.no}"></div><div class="frow2"><div><label>Planned hours</label><input id="cpHours" type="number" value="${e.plannedHours||flatLines(e).filter(x=>x.category==='labour').reduce((a,x)=>a+x.qty,0)}"></div><div><label>Delivery target</label><input id="cpDate" type="date" value="${e.deliveryTarget||e.validUntil}"></div></div><div class="frow"><label>Estimated project value</label><input value="${Math.round(tot.sellingPrice)} SEK" disabled></div><div class="fbtns"><button class="tbtn" onclick="closeModal()">Cancel</button><button class="tbtn primary" onclick="confirmConvertEst(${id})">Create connected project</button></div>`;$("fov").classList.add("show")}
function confirmConvertEst(id){const e=getEst(id);e.status='accepted';e.plannedHours=+$('cpHours').value||0;e.deliveryTarget=$('cpDate').value||e.validUntil;const saved=syncEstimation(e,'Accepted and converted to project');WorkshopData.updateEstimation(saved.id,{title:$('cpTitle').value||saved.title,plannedHours:e.plannedHours,deliveryTarget:e.deliveryTarget});const result=WorkshopData.createProjectFromEstimation(saved.id);if(result.error)return;e.projectNo=result.project.no;PROJECTS[e.projectNo]={name:result.project.name,type:'Generated from estimation',status:'planned'};e.history.push({date:new Date().toISOString().slice(0,10),action:`Converted to ${e.projectNo}`,by:'Aleksandar C.'});closeModal();renderAll()}
function saveEditEst(id){
  const e=getEst(id);e.reference=$("eeRef").value;e.validUntil=$("eeValid").value||e.validUntil;e.deliveryTime=$("eeDelivery").value;e.paymentTerms=$("eeTerms").value;
  syncEstimation(e,'Commercial information updated');
  closeModal();renderAll();
}

function openPricingSettings(id){
  const t=T[LANG];const e=getEst(id);
  $("fcard").innerHTML=`<h2>${t.pricing_title}</h2><p class="fsub">${e.no}</p>
    <p class="fnote">${t.pricing_note}</p>
    <div class="frow2"><div><label>${t.cb_overhead} %</label><input id="psOverhead" type="number" value="${e.overheadPct}"></div><div><label>${t.cb_contingency} %</label><input id="psContingency" type="number" value="${e.contingencyPct}"></div></div>
    <div class="frow"><label>${t.ps_discount} (SEK)</label><input id="psDiscount" type="number" value="${e.discount}"></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${t.nc_cancel}</button><button class="tbtn primary" onclick="savePricingSettings(${id})">${t.nc_save}</button></div>`;
  $("fov").classList.add("show");
}
function savePricingSettings(id){
  const e=getEst(id);e.overheadPct=parseFloat($("psOverhead").value)||0;e.contingencyPct=parseFloat($("psContingency").value)||0;e.discount=parseFloat($("psDiscount").value)||0;
  syncEstimation(e,'Pricing settings updated');
  closeModal();renderAll();
}

function openAddWorkItem(id){
  const t=T[LANG];
  $("fcard").innerHTML=`<h2>${t.addworkitem}</h2><p class="fsub">${getEst(id).no}</p>
    <div class="frow"><label>${t.wi_no}</label><input id="awNo" placeholder="JC-26-00XX"></div>
    <div class="frow"><label>${t.wi_desc}</label><input id="awDesc"></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${t.nc_cancel}</button><button class="tbtn primary" onclick="saveAddWorkItem(${id})">${t.addworkitem}</button></div>`;
  $("fov").classList.add("show");
}
function saveAddWorkItem(id){
  const desc=$("awDesc").value.trim();if(!desc)return;
  const e=getEst(id);
  e.workItems.push({no:$("awNo").value.trim(),desc,lines:[]});
  e.history.push({date:new Date().toISOString().slice(0,10),action:`Work item added: ${desc}`,by:"Aleksandar C."});
  syncEstimation(e,'Work item added');
  closeModal();renderAll();
}

function openAddLine(id,idx){
  const t=T[LANG];const wi=getEst(id).workItems[idx];
  $("fcard").innerHTML=`<h2>${t.addline}</h2><p class="fsub">${wi.desc}</p>
    <div class="frow"><label>${t.th_item}</label><input id="aiDesc"></div>
    <div class="frow"><label>${t.th_category}</label><select id="aiCat">
      <option value="material">${catLabel('material')}</option><option value="labour">${catLabel('labour')}</option><option value="machine">${catLabel('machine')}</option>
      <option value="subcontractor">${catLabel('subcontractor')}</option><option value="consumable">${catLabel('consumable')}</option><option value="logistics">${catLabel('logistics')}</option><option value="other">${catLabel('other')}</option>
    </select></div>
    <div class="frow3"><div><label>${t.th_qty}</label><input id="aiQty" type="number" value="1"></div><div><label>${t.th_unit}</label><input id="aiUnit" value="pcs"></div><div><label>${t.th_price}</label><input id="aiSell" type="number" value="0"></div></div>
    <div class="frow"><label>Internal cost</label><input id="aiCost" type="number" value="0"></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${t.nc_cancel}</button><button class="tbtn primary" onclick="saveAddLine(${id},${idx})">${t.addline}</button></div>`;
  $("fov").classList.add("show");
}
function saveAddLine(id,idx){
  const desc=$("aiDesc").value.trim();if(!desc)return;
  const e=getEst(id);const wi=e.workItems[idx];if(!wi)return;
  wi.lines.push({desc,category:$("aiCat").value,qty:parseFloat($("aiQty").value)||1,unit:$("aiUnit").value||"pcs",
    cost:parseFloat($("aiCost").value)||0,sell:parseFloat($("aiSell").value)||0,disc:0,tax:25});
  e.history.push({date:new Date().toISOString().slice(0,10),action:`Item added to ${wi.desc}: ${desc}`,by:"Aleksandar C."});
  syncEstimation(e,'Cost item added');
  closeModal();renderAll();
}

function openEditText(id,field){
  const t=T[LANG];const e=getEst(id);
  const isExcl=field==='exclusions';
  $("fcard").innerHTML=`<h2>${isExcl?t.excl_title:t.terms_title}</h2>
    <div class="frow"><textarea id="etText" style="min-height:120px;">${isExcl?e.exclusions.join("\\n"):e.terms}</textarea></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${t.nc_cancel}</button><button class="tbtn primary" onclick="saveEditText(${id},'${field}')">${t.nc_save}</button></div>`;
  $("fov").classList.add("show");
}
function saveEditText(id,field){
  const e=getEst(id);const val=$("etText").value;
  if(field==='exclusions')e.exclusions=val.split("\n").map(s=>s.trim()).filter(Boolean);else e.terms=val;
  syncEstimation(e,'Terms or exclusions updated');
  closeModal();renderAll();
}

function openAddNote(id){
  const t=T[LANG];
  $("fcard").innerHTML=`<h2>${t.an_title}</h2><p class="fsub">${getEst(id).no}</p>
    <div class="frow"><label>${t.an_text}</label><textarea id="anText"></textarea></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${t.nc_cancel}</button><button class="tbtn primary" onclick="saveAddNote(${id})">${t.an_save}</button></div>`;
  $("fov").classList.add("show");
}
function saveAddNote(id){
  const text=$("anText").value.trim();if(!text)return;
  getEst(id).notes.push({date:new Date().toISOString().slice(0,10),author:"Aleksandar",text});
  closeModal();renderAll();
}

function openUpload(id){
  const t=T[LANG];
  $("fcard").innerHTML=`<h2>${t.ud_title}</h2><p class="fsub">${getEst(id).no}</p>
    <div class="frow"><label>${t.ud_name}</label><input id="udName" placeholder="Document.pdf"></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${t.nc_cancel}</button><button class="tbtn primary" onclick="saveUpload(${id})">${t.ud_save}</button></div>`;
  $("fov").classList.add("show");
}
function saveUpload(id){
  const name=$("udName").value.trim();if(!name)return;
  const ext=name.split('.').pop().toLowerCase();const type=ext==='pdf'?'pdf':(ext==='xlsx'||ext==='xls')?'xls':(ext==='zip')?'zip':'doc';
  const e=getEst(id);e.documents.push({name,type,date:new Date().toISOString().slice(0,10)});
  e.history.push({date:new Date().toISOString().slice(0,10),action:`Document uploaded: ${name}`,by:"Aleksandar C."});
  closeModal();renderAll();
}

function duplicateEst(id){
  const src=getEst(id);
  const copy=JSON.parse(JSON.stringify(src));
  copy.id=nextEstId++;copy.no="EST-26-0"+String(nextEstId-1).padStart(2,'0');copy.status="draft";
  copy.created=new Date().toISOString().slice(0,10);
  copy.history=[{date:copy.created,action:`Duplicated from ${src.no}`,by:"Aleksandar C."}];
  ESTIMATIONS.push(copy);selectedId=copy.id;renderAll();
}
function deleteEst(id){
  const t=T[LANG];if(!confirm(t.confirm_delete))return;
  ESTIMATIONS=ESTIMATIONS.filter(e=>e.id!==id);
  if(selectedId===id)selectedId=ESTIMATIONS.length?ESTIMATIONS[0].id:null;
  renderAll();
}
function sendEmail(id){
  const e=getEst(id);const c=CUSTOMERS[e.customerId];
  location.href=`mailto:${c.email}?subject=${encodeURIComponent('Estimation '+e.no+' — Varmak AB')}`;
}
function exportExcel(id){alert("Export to Excel (demo) — "+getEst(id).no+".xlsx");}
function printEst(id){selectedId=id;renderPrintSheet(getEst(id));window.print();}

function renderPrintSheet(e){
  const t=T[LANG];const c=CUSTOMERS[e.customerId];const tot=computeTotals(e);
  const items=flatLines(e);
  const rows=items.map((it,i)=>`<tr><td>${i+1}</td><td>${it.desc}</td><td style="text-align:right;">${it.qty}</td><td>${it.unit}</td><td style="text-align:right;">${it.sell.toFixed(2)}</td><td style="text-align:right;">${lineTotal(it).toFixed(2)}</td></tr>`).join("");
  $("printSheet").innerHTML=`<h1 style="font-family:sans-serif;">Varmak AB — Estimation ${e.no}</h1>
    <p>${c.name}, ${c.address}</p><p>Date: ${e.created} · Valid until: ${e.validUntil}</p>
    <table style="width:100%;border-collapse:collapse;margin-top:16px;" border="1" cellpadding="6"><thead><tr><th>#</th><th>Description</th><th>Qty</th><th>Unit</th><th>Price</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table>
    <p style="margin-top:16px;">Subtotal: ${tot.sellSubtotal.toFixed(2)} SEK<br>Tax: ${tot.taxTotal.toFixed(2)} SEK<br><b>Total: ${tot.grandTotal.toFixed(2)} SEK</b></p>
    <p style="margin-top:16px;">${e.terms}</p>`;
}

function setLang(code){LANG=code;
  document.documentElement.lang=code==="mk"?"mk-Latn":code;
  document.querySelectorAll('.langmenu button').forEach(b=>b.classList.toggle('active',b.getAttribute('data-lang')===code));
  const _c=$("langcur");if(_c)_c.textContent=code.toUpperCase();
  renderAll();tick();
}
document.querySelectorAll('.langmenu button').forEach(b=>b.addEventListener('click',()=>{setLang(b.getAttribute('data-lang'));$("langc").classList.remove('open');}));
function tick(){const n=new Date();$("time").textContent=n.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
  try{$("date").textContent=n.toLocaleDateString(T[LANG].locale,{weekday:'short',day:'numeric',month:'short'});}catch(e){$("date").textContent=n.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}}
setLang("en");setInterval(tick,10000);

const box=$("embers");const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!reduce){for(let i=0;i<16;i++){const e=document.createElement('div');e.className='ember';e.style.left=Math.random()*100+'%';e.style.setProperty('--drift',(Math.random()*80-40)+'px');const dur=7+Math.random()*9;e.style.animationDuration=dur+'s';e.style.animationDelay=(-Math.random()*dur)+'s';const s=1+Math.random()*2;e.style.width=s+'px';e.style.height=s+'px';box.appendChild(e);}}
(function(){var lc=$("langc"),lt=$("langtoggle");if(lt){lt.addEventListener('click',function(e){e.stopPropagation();lc.classList.toggle('open');});document.addEventListener('click',function(e){if(!lc.contains(e.target))lc.classList.remove('open');});}})();
</script>
