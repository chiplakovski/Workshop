<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>Varmak — Estimations</title><style>
  :root{--navy-950:#04101f;--navy-900:#071a33;--navy-800:#0a2447;--navy-brand:#013179;
    --steel-400:#8ea3c0;--steel-300:#b9c6da;--spark:#4a90ff;--ice:#e8f0fb;
    --line:rgba(142,163,192,0.16);--field:rgba(255,255,255,0.045);--field-line:rgba(185,198,218,0.24);
    --ok:#4ad48a;--warn:#ffb057;--danger:#ff6b6b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ice);min-height:100vh;}
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--navy-950);}
  .bg::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 82% 0%,rgba(1,49,121,0.5),transparent 55%),radial-gradient(80% 60% at 10% 100%,rgba(10,36,71,0.6),transparent 60%),linear-gradient(160deg,var(--navy-950),var(--navy-900) 60%,var(--navy-950));}
  .grid{position:absolute;inset:0;opacity:0.28;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);}
  .glow{position:absolute;left:50%;top:20%;width:560px;height:560px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(74,144,255,0.16),transparent 62%);filter:blur(8px);animation:pulse 6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
  .ember{position:absolute;bottom:-10px;border-radius:50%;background:var(--spark);box-shadow:0 0 6px 1px rgba(74,144,255,.8);animation:rise linear infinite;opacity:0;}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-105vh) translateX(var(--drift));opacity:0}}
  @media (prefers-reduced-motion:reduce){.glow,.ember{animation:none}}

  .topfull{position:relative;z-index:2;width:100%;padding:22px 36px 0;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;}
  .brand .logo{font-family:'Sora';font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .brand .logo .dot{width:6px;height:6px;background:var(--spark);box-shadow:0 0 9px 1px rgba(74,144,255,.9);}
  .brand .meta{font-size:11px;color:var(--steel-400);margin-top:2px;line-height:1.5;}
  .topright{display:flex;flex-direction:column;align-items:flex-end;gap:9px;}
  .clock{text-align:right;font-variant-numeric:tabular-nums;} .clock .time{font-family:'Sora';font-weight:600;font-size:16px;} .clock .date{font-size:11px;color:var(--steel-400);}
  .who{display:flex;align-items:center;gap:8px;}
  .who .badge{display:flex;align-items:center;gap:7px;padding:5px 10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;}
  .who .badge .av{width:20px;height:20px;background:linear-gradient(135deg,#2c6bd6,#0a2447);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:'Sora';}
  .who .role{color:var(--spark);font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
  .who .out{background:transparent;border:1px solid var(--field-line);color:var(--steel-300);padding:6px 10px;font-size:12px;cursor:pointer;font-family:'Inter';transition:.15s;}
  .who .out:hover{border-color:var(--spark);color:var(--ice);}

  .wrap{position:relative;z-index:2;max-width:1620px;margin:0 auto;padding:26px 32px 40px;}
  .modhead{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .back{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--field-line);color:var(--steel-300);font-family:'Inter';font-size:12.5px;padding:9px 13px;cursor:pointer;transition:.15s;}
  .back:hover{border-color:var(--spark);color:var(--ice);}
  .modhead .ttl{display:flex;align-items:center;gap:11px;}
  .modhead .ic{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(74,144,255,.14);box-shadow:inset 0 0 0 1px rgba(74,144,255,.35);}
  .modhead h1{font-family:'Sora';font-weight:600;font-size:22px;letter-spacing:-.01em;} .modhead p{font-size:12px;color:var(--steel-400);}

  .tbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--field-line);background:transparent;color:var(--steel-300);font-family:'Sora';font-weight:600;font-size:12.5px;padding:9px 13px;cursor:pointer;transition:.16s;white-space:nowrap;}
  .tbtn:hover{border-color:var(--spark);color:var(--ice);}
  .tbtn.primary{background:linear-gradient(180deg,#2c6bd6,#013179);border:none;color:#fff;}
  .tbtn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(44,107,214,.5);}
  .tbtn.small{padding:6px 10px;font-size:11.5px;}
  .tbtn.danger{border-color:rgba(255,107,107,.4);color:#ffb3b3;}
  .tbtn.danger:hover{border-color:var(--danger);color:#fff;background:rgba(255,107,107,.1);}
  .tbtn svg{flex:none;width:13px;height:13px;}

  .crmgrid{display:grid;grid-template-columns:300px 1fr 320px;gap:16px;align-items:start;}
  @media(max-width:1400px){.crmgrid{grid-template-columns:1fr;}}
  /* min-width:0 lets a grid track shrink below its content's intrinsic width (the wide items table)
     so .itable-wrap's own overflow-x:auto can scroll internally instead of forcing the whole page wider. */
  .col{display:flex;flex-direction:column;gap:16px;min-width:0;}
  body{overflow-x:hidden;}
  .panel{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:17px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .panel .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:10px;}
  .panel .phead h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--spark);font-weight:700;}

  .search{position:relative;flex:1;}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--steel-400);}
  .search input{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:'Inter';font-size:13px;padding:9px 10px 9px 32px;outline:none;}
  .search input:focus{border-color:var(--spark);}
  .listtoolbar{display:flex;gap:8px;margin-bottom:11px;}
  .iconbtn{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);cursor:pointer;}
  .iconbtn:hover{border-color:var(--spark);color:var(--ice);}

  .segtabs{display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap;}
  .segtabs button{flex:1;background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);font-family:'Inter';font-size:10.5px;padding:7px 4px;cursor:pointer;transition:.15s;white-space:nowrap;}
  .segtabs button.on{background:rgba(74,144,255,.16);border-color:rgba(74,144,255,.5);color:#cfe0ff;}

  .estlist{display:flex;flex-direction:column;gap:6px;max-height:440px;overflow-y:auto;margin:-4px;padding:4px;}
  .estrow{display:block;width:100%;padding:10px 11px;border:1px solid var(--line);cursor:pointer;transition:.14s;text-align:left;color:inherit;background:transparent;font:inherit;}
  .estrow:hover{background:rgba(255,255,255,.03);}
  .estrow.sel{background:rgba(74,144,255,.12);border-color:rgba(74,144,255,.45);}
  .estrow .er1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px;}
  .estrow .eno{font-family:'Sora';font-weight:600;font-size:12.5px;}
  .estrow .ecust{font-size:11px;color:var(--steel-400);margin-bottom:5px;}
  .estrow .er2{display:flex;justify-content:space-between;align-items:center;}
  .estrow .eval{font-family:'Sora';font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;}

  .pager{display:flex;align-items:center;justify-content:space-between;margin-top:11px;font-size:11px;color:var(--steel-400);}
  .pager .pnav{display:flex;gap:5px;}
  .pager button{background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);width:24px;height:24px;cursor:pointer;font-size:11px;}
  .pager button.cur{background:rgba(74,144,255,.18);border-color:rgba(74,144,255,.5);color:#cfe0ff;}
  .pager button:disabled{opacity:.35;cursor:not-allowed;}

  .sumgrid2{display:flex;flex-direction:column;gap:0;}
  .sumtotal{display:flex;justify-content:space-between;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line);}
  .sumtotal .sl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);margin-bottom:5px;}
  .sumtotal .sv{font-family:'Sora';font-size:19px;font-weight:600;}
  .sumbystatus{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .sumbystatus .ss{}
  .sumbystatus .sl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);margin-bottom:4px;}
  .sumbystatus .sv{font-family:'Sora';font-size:16px;font-weight:600;} .sumbystatus .sv.draft{color:var(--steel-300);} .sumbystatus .sv.sent{color:var(--spark);} .sumbystatus .sv.accepted{color:var(--ok);} .sumbystatus .sv.declined{color:var(--danger);}
  .sumbystatus .ssub{font-size:10.5px;color:var(--steel-400);}

  .dhead3{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .dhead3 .idn{display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
  .dhead3 h2{font-family:'Sora';font-weight:700;font-size:19px;letter-spacing:-.01em;}
  .dhead3 .esttitle{flex-basis:100%;font-family:'Sora';font-size:13px;font-weight:600;color:var(--steel-300);}
  .dhead3 .dbtns{display:flex;gap:8px;flex-wrap:wrap;}

  .stpill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;font-weight:700;white-space:nowrap;border:1px solid;}
  .stpill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .stpill.draft{color:#cfe0ff;border-color:rgba(74,144,255,.5);background:rgba(74,144,255,.18);}
  .stpill.review{color:var(--steel-300);border-color:var(--field-line);background:rgba(142,163,192,.1);}
  .stpill.sent{color:var(--spark);border-color:rgba(74,144,255,.4);background:rgba(74,144,255,.1);}
  .stpill.accepted{color:var(--ok);border-color:rgba(74,212,138,.4);background:rgba(74,212,138,.1);}
  .stpill.declined{color:var(--danger);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.1);}
  .stpill.expired{color:var(--steel-400);border-color:var(--line);background:rgba(142,163,192,.08);}

  .metarow{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:18px;}
  .meta{display:flex;align-items:flex-start;gap:8px;}
  .meta svg{flex:none;width:14px;height:14px;color:var(--steel-400);margin-top:2px;}
  .meta .mk{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);margin-bottom:2px;}
  .meta .mv{font-size:13px;font-weight:600;}

  .stepper{display:flex;align-items:center;margin-bottom:22px;overflow-x:auto;padding-bottom:2px;}
  .step{display:flex;align-items:center;gap:8px;flex:none;cursor:pointer;padding:6px 4px;border:none;background:none;}
  .step .sdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--field-line);display:flex;align-items:center;justify-content:center;color:var(--steel-400);flex:none;transition:.15s;}
  .step .slabel{font-size:11.5px;font-weight:600;color:var(--steel-400);white-space:nowrap;}
  .step.done .sdot{border-color:var(--ok);background:rgba(74,212,138,.15);color:var(--ok);}
  .step.done .slabel{color:var(--steel-300);}
  .step.current .sdot{border-color:var(--spark);background:var(--spark);color:#fff;box-shadow:0 0 0 4px rgba(74,144,255,.18);}
  .step.current .slabel{color:var(--ice);}
  .step.declined.current .sdot{border-color:var(--danger);background:var(--danger);box-shadow:0 0 0 4px rgba(255,107,107,.18);}
  .step.declined.current .slabel{color:#ffb3b3;}
  .stepline{width:34px;height:1px;background:var(--field-line);flex:none;}

  .infocard3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px;}
  @media(max-width:1000px){.infocard3{grid-template-columns:1fr;}}
  .icard{background:rgba(255,255,255,.025);border:1px solid var(--line);padding:15px;}
  .icard .ich{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
  .icard h4{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--spark);}
  .icard .irow2{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);}
  .icard .irow2:last-child{border-bottom:none;}
  .icard .irow2 .ik{color:var(--steel-400);} .icard .irow2 .iv{font-weight:600;text-align:right;}
  .icard .ilead{font-size:14px;font-weight:700;margin-bottom:8px;}
  .icard .istatus{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ok);margin-bottom:10px;}
  .icard .istatus::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .icard .iline{font-size:12.5px;color:var(--steel-300);display:flex;align-items:flex-start;gap:7px;margin-bottom:7px;}
  .icard .iline svg{flex:none;width:13px;height:13px;color:var(--steel-400);margin-top:1px;}

  .itemshead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
  .itemshead h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--spark);font-weight:700;}
  .itemsactions{display:flex;gap:8px;align-items:center;}
  .costtoggle{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--steel-300);cursor:pointer;user-select:none;}
  .costtoggle input{accent-color:var(--spark);}

  .opttabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .opttab{display:flex;align-items:center;gap:10px;background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);font-family:'Inter';font-size:12px;padding:8px 12px;transition:.15s;}
  .opttab.on{border-color:rgba(74,144,255,.5);background:rgba(74,144,255,.12);color:#cfe0ff;}
  .opttab.included{border-color:rgba(74,212,138,.5);}
  .opttab.combined{background:rgba(74,212,138,.1);border-color:rgba(74,212,138,.4);color:var(--ok);font-weight:600;}
  .opttab input{accent-color:var(--spark);}
  .opttab .odelta{font-variant-numeric:tabular-nums;font-weight:600;color:var(--steel-400);}
  .opttab.on .odelta,.opttab.included .odelta{color:var(--ok);}
  .opttab .optinc{display:flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--steel-400);cursor:pointer;border-left:1px solid var(--field-line);padding-left:9px;}
  .opttab.included .optinc{color:var(--ok);}
  .lockbanner{display:flex;align-items:center;gap:10px;background:rgba(255,176,87,.1);border:1px solid rgba(255,176,87,.4);color:var(--warn);font-size:12px;padding:10px 13px;margin-bottom:16px;}
  .lockbanner svg{flex:none;}
  .lockbanner button{margin-left:auto;}
  .revbadge{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);background:rgba(255,255,255,.05);border:1px solid var(--field-line);padding:3px 8px;}
  .fielderr{border-color:var(--danger)!important;}
  .errmsg{font-size:11px;color:var(--danger);margin-top:-10px;margin-bottom:12px;}
  .rowactions2{display:flex;gap:4px;margin-left:8px;}
  .rowactions2 button{background:none;border:none;color:var(--steel-400);cursor:pointer;padding:2px;display:inline-flex;}
  .rowactions2 button:hover{color:var(--ice);}
  .rowactions2 svg{width:12px;height:12px;}
  .wiactions{display:inline-flex;gap:4px;margin-left:8px;}
  .wiactions button{background:none;border:none;color:var(--steel-400);cursor:pointer;padding:2px;display:inline-flex;vertical-align:middle;}
  .wiactions button:hover{color:var(--ice);}
  .wiactions svg{width:12px;height:12px;}
  .previewrow td{opacity:.72;font-style:italic;}
  .disclaimer2{font-size:10.5px;color:var(--steel-400);font-style:italic;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);}

  .itable-wrap{overflow-x:auto;border:1px solid var(--line);background:rgba(255,255,255,.02);margin-bottom:18px;}
  .itable{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px;}
  .itable th{text-align:left;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);border-bottom:1px solid var(--line);padding:9px 10px;white-space:nowrap;}
  .itable th.n,.itable td.n{text-align:right;}
  .itable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  .itable tr.sectionrow td{background:rgba(74,144,255,.06);font-family:'Sora';font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#cfe0ff;padding:8px 10px;}
  .itable tr.subtotalrow td{background:rgba(255,255,255,.02);font-weight:600;color:var(--steel-300);border-bottom:1px solid var(--line);}
  .itable tr.optrow td{background:rgba(74,212,138,.05);}
  .itable .grip{color:var(--steel-400);opacity:.5;margin-right:6px;}
  .itable .idesc{font-weight:500;}
  .itable .isub{color:var(--steel-400);font-size:11px;}
  .itable .costsub{color:var(--steel-400);font-size:10.5px;display:block;margin-top:1px;}
  .subtag{display:inline-block;font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);border:1px solid rgba(255,176,87,.4);background:rgba(255,176,87,.1);padding:1px 6px;margin-left:6px;}
  .cattag{display:inline-block;font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;margin-left:6px;border:1px solid var(--field-line);color:var(--steel-300);background:rgba(255,255,255,.04);}
  .cattag.cat-material{color:#cfe0ff;border-color:rgba(74,144,255,.35);background:rgba(74,144,255,.08);}
  .cattag.cat-subcontractor{color:var(--warn);border-color:rgba(255,176,87,.4);background:rgba(255,176,87,.1);}
  .addline-btn{background:none;border:none;color:var(--spark);font-size:11px;cursor:pointer;margin-left:10px;font-family:'Inter';}
  .addline-btn:hover{text-decoration:underline;}
  .rnum{font-variant-numeric:tabular-nums;white-space:nowrap;}

  .tccard{background:rgba(255,255,255,.025);border:1px solid var(--line);padding:15px;margin-bottom:14px;}
  .tccard .ich{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
  .tccard h4{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--spark);}
  .tccard p{font-size:12.5px;color:var(--steel-300);line-height:1.6;}
  .tccard ul{padding-left:18px;font-size:12.5px;color:var(--steel-300);line-height:1.8;}

  .pricerow{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;}
  .pricerow .pk{color:var(--steel-400);} .pricerow .pv{font-weight:600;font-variant-numeric:tabular-nums;}
  .pricerow.divider{border-top:1px solid var(--line);margin-top:4px;padding-top:12px;}
  .pricerow.grand{padding-top:12px;border-top:1px solid var(--line);margin-top:4px;}
  .pricerow.grand .pk{font-family:'Sora';font-size:13px;color:var(--steel-300);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .pricerow.grand .pv{font-family:'Sora';font-size:22px;color:var(--spark);font-weight:700;}
  .pricerow input.pctinput{width:48px;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-size:11.5px;padding:3px 5px;text-align:right;margin-left:6px;}

  .costrow{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;color:var(--steel-300);}
  .costrow .ck{color:var(--steel-400);}
  .costrow.sub{padding-top:9px;border-top:1px solid var(--line);margin-top:3px;font-weight:600;color:var(--ice);}
  .costrow.final{padding-top:10px;border-top:1px solid var(--line);margin-top:6px;font-weight:700;color:var(--ice);}

// Reads every field this module itself persists back from WorkshopData, so notes, documents, work items,
// options, terms, exclusions and status all survive a page refresh — for BOTH the hardcoded seed estimates
// (which re-run their literal JS object on every load) and estimates created purely in this session.
// Named (not an IIFE) so it can be re-run on workshop:data (see the listener near the bottom of
// this file) - an estimation created/updated elsewhere (e.g. Customers' "New Quote", Pass 3.10, or
// another tab entirely - workshop-data.js reloads on the browser's native 'storage' event and
// re-dispatches workshop:data, see that file's own comment) now reaches this page without a full
// reload. Already safe to re-run as-is: for an estimation this module has already seen it adopts
// the shared record's fields verbatim (see the comment a few lines below - syncEstimation() always
// writes the complete field set, so there is never local-only unsaved state to lose), and for a
// genuinely new one it hydrates fresh.
function hydrateSharedEstimations(){
  if(!window.WorkshopData)return;
  const shared=WorkshopData.get();
  shared.estimations.forEach(se=>{
    const existing=ESTIMATIONS.find(e=>e.no===se.no);
    if(existing){
      // A record with this number already exists locally (seed data or this session) — this shared
      // record is what WE last saved for it (syncEstimation always writes the full field set below),
      // so adopt it verbatim rather than rebuilding anything from an invented value.
      existing.sharedId=se.id;existing.customerId=localCustomerIdForShared(se.customerId,se.customer);existing.status=se.status;existing.revision=se.revision||0;
      existing.created=se.created;existing.validUntil=se.validUntil;existing.currency=se.currency||existing.currency;
      if(Array.isArray(se.workItems))existing.workItems=se.workItems;
      if(Array.isArray(se.options))existing.options=se.options;
      if(se.terms!==undefined)existing.terms=se.terms;
      if(Array.isArray(se.exclusions))existing.exclusions=se.exclusions;
      if(Array.isArray(se.notes))existing.notes=se.notes;
      if(Array.isArray(se.documents))existing.documents=se.documents;
      if(se.overheadPct!==undefined)existing.overheadPct=se.overheadPct;
      if(se.contingencyPct!==undefined)existing.contingencyPct=se.contingencyPct;
      if(se.discount!==undefined)existing.discount=se.discount;
      if(se.reference!==undefined)existing.reference=se.reference;
      if(se.customerRfq!==undefined)existing.customerRfq=se.customerRfq;
      if(se.opportunityRef!==undefined)existing.opportunityRef=se.opportunityRef;
      if(se.requestedDelivery!==undefined)existing.requestedDelivery=se.requestedDelivery;
      if(se.estimator!==undefined)existing.estimator=se.estimator;
      if(se.title!==undefined)existing.projectTitle=se.title;
      if(se.deliveryTime!==undefined)existing.deliveryTime=se.deliveryTime;
      if(se.paymentTerms!==undefined)existing.paymentTerms=se.paymentTerms;
      if(se.priceList!==undefined)existing.priceList=se.priceList;
      if(se.incoterms!==undefined)existing.incoterms=se.incoterms;
      if(se.createdBy!==undefined)existing.createdBy=se.createdBy;
      if(se.projectNo!==undefined)existing.projectNo=se.projectNo;
      if(Array.isArray(se.history)&&se.history.length)existing.history=se.history;
      if(Array.isArray(se.revisionSnapshots))existing.revisionSnapshots=se.revisionSnapshots;
      if(se.archived!==undefined)existing.archived=se.archived;
      return;
    }
    // Genuinely new shared estimation this module has never seen locally (e.g. created from another
    // module such as Planning). Hydrate directly from its own real fields — never from an invented value.
    const project=shared.projects.find(p=>p.id===se.projectId),localCustomerId=localCustomerIdForShared(se.customerId,se.customer);
    const hasDetail=Array.isArray(se.bom)&&se.bom.length>0;
    const workItems=hasDetail?[{no:'',desc:'Bill of Materials',lines:se.bom.map(b=>({desc:b.description||b.code,category:'material',qty:Number(b.qty)||1,unit:b.unit||'EA',weight:0,waste:0,cost:0,sell:0,disc:0,tax:25}))}]:[{no:'',desc:'Work items',lines:[]}];
    ESTIMATIONS.push({id:se.id,sharedId:se.id,no:se.no,customerId:localCustomerId,projectNo:project?project.no:(se.projectNo||null),projectTitle:se.title,status:se.status,created:se.created,validUntil:se.validUntil,currency:se.currency||'SEK',deliveryTime:se.deliveryTime||'4–5 weeks',paymentTerms:se.paymentTerms||'30 days',priceList:se.priceList||'Standard Price List 2026',incoterms:se.incoterms||'EXW Marieholm',reference:se.reference||'—',customerRfq:se.customerRfq||'',opportunityRef:se.opportunityRef||'',requestedDelivery:se.requestedDelivery||se.deliveryTarget||'',createdBy:se.createdBy||'Aleksandar C.',estimator:se.estimator||'Aleksandar C.',overheadPct:se.overheadPct===undefined?8:se.overheadPct,contingencyPct:se.contingencyPct===undefined?5:se.contingencyPct,discount:se.discount||0,workItems:Array.isArray(se.workItems)?se.workItems:workItems,options:Array.isArray(se.options)?se.options:[],exclusions:Array.isArray(se.exclusions)?se.exclusions:[],terms:se.terms||'Prices valid for 30 days.',documents:Array.isArray(se.documents)?se.documents:[],history:Array.isArray(se.history)&&se.history.length?se.history:(se.revisions||[]).map(r=>({date:r.date,action:`Revision ${r.rev}: ${r.reason}`,by:r.author})),notes:Array.isArray(se.notes)?se.notes:[],revision:se.revision||0,revisionSnapshots:Array.isArray(se.revisionSnapshots)?se.revisionSnapshots:[],sharedBom:se.bom||[],plannedHours:se.plannedHours||0,machines:se.machines||[],deliveryTarget:se.deliveryTarget});
    nextEstId=Math.max(nextEstId,se.id+1);
  });
  ESTIMATIONS.forEach(e=>{if(e.revision==null)e.revision=Math.max(0,(e.history||[]).filter(h=>/Rev|Revision/.test(h.action)).length-1)});
}

let LANG="en",selectedId=2,filterStatus="all",query="",showCost=false,activeOptTab="base";

function getEst(id){return ESTIMATIONS.find(e=>e.id===id);}
// Pushes the full current state of an estimate into WorkshopData (the one shared browser-data layer).
// IMPORTANT: this function never changes the revision number itself — see createRevision() for the single,
// dedicated place a revision is ever incremented, so calling this repeatedly (on every routine save) can
// never double-count a revision the way the old code did via WorkshopData.updateEstimation(...,reason).
function syncEstimation(e){
  if(!window.WorkshopData||!e)return null;
  const c=CUSTOMERS[e.customerId],shared=WorkshopData.get(),sc=shared.customers.find(x=>x.name===c.name),tot=computeTotals(e);
  const payload={id:e.sharedId,no:e.no,customerId:sc?sc.id:null,customer:c.name,title:e.projectTitle||(PROJECTS[e.projectNo]||{}).name||e.no,
    status:e.status,revision:e.revision||0,created:e.created,validUntil:e.validUntil,currency:e.currency,
    estimatedMaterial:tot.materialCost,estimatedLabour:tot.labourCost,estimatedMachine:tot.machineCost,
    estimatedOther:tot.subCost+tot.consumableCost+tot.logisticsCost+tot.otherCost,totalCost:tot.totalInternalCost,sellingPrice:tot.sellingPrice,
    plannedHours:e.plannedHours||flatLines(e).filter(x=>x.category==='labour').reduce((a,x)=>a+x.qty,0),
    machines:e.machines||flatLines(e).filter(x=>x.category==='machine').map(x=>x.desc),
    deliveryTarget:e.deliveryTarget||e.validUntil,bom:e.sharedBom||[],
    // additional Phase-1 fields so nothing entered in this module disappears on refresh:
    workItems:e.workItems,options:e.options,terms:e.terms,exclusions:e.exclusions,notes:e.notes,documents:e.documents,
    overheadPct:e.overheadPct,contingencyPct:e.contingencyPct,discount:e.discount,reference:e.reference,
    customerRfq:e.customerRfq,opportunityRef:e.opportunityRef,requestedDelivery:e.requestedDelivery,estimator:e.estimator,
    projectNo:e.projectNo,deliveryTime:e.deliveryTime,paymentTerms:e.paymentTerms,priceList:e.priceList,incoterms:e.incoterms,
    createdBy:e.createdBy,history:e.history,revisionSnapshots:e.revisionSnapshots,archived:!!e.archived};
  const saved=WorkshopData.upsertEstimation(payload);
  e.sharedId=saved.id;
  return saved;
}
// Estimation attachments used to live only inside e.documents. Keep those older records visible,
// but read new shared metadata live so attachments created here also appear in Documents and
// records linked from that module appear back on the estimation without a reload.
function estimationDocumentRows(e){
  const live=(window.WorkshopData?WorkshopData.getDocuments():[]).filter(d=>d.module==='Estimations'&&d.record===e.no);
  const liveNames=new Set(live.map(d=>String(d.name).trim().toLowerCase()));
  const iconType=name=>{const ext=String(name).split('.').pop().toLowerCase();return ext==='pdf'?'pdf':(ext==='xlsx'||ext==='xls')?'xls':ext==='zip'?'zip':'doc'};
  return live.map(d=>({name:d.name,type:iconType(d.name),date:(d.updated||'').slice(0,10)}))
    .concat((e.documents||[]).filter(d=>!liveNames.has(String(d.name).trim().toLowerCase())));
}
function stageIndex(status){if(status==='declined'||status==='expired')return 3;return STAGES.indexOf(status);}

// ─────────────────────────────────────────────────────────────────────────
// CALCULATION ENGINE — frontend prototype only.
// The rules below (waste handling, discount sequencing, VAT base) are the
// functional specification a future backend calculation engine must
// reproduce exactly; keep this block as the single source of truth for how
// a line, a work item and a whole estimate are priced.
// ─────────────────────────────────────────────────────────────────────────

// Tax (VAT) on a single line is computed on that line's already-discounted sell total.
// The estimate-level discount is applied later, proportionally, in computeTotals() — see note there.
function lineTax(it){const tax=Math.min(100,Math.max(0,Number(it.tax)||0));return money(lineTotal(it)*tax/100);}
function lineSellCostDelta(it){return money(lineTotal(it)-lineCostTotal(it));}

// Display-only merge used to PREVIEW an option in the items table without ever touching the saved totals.
// activeOptTab selects which option (if any) is temporarily shown; computeTotals() never reads this state.
function mergedWorkItems(e){
  const replaced=new Set();
  (e.options||[]).filter(o=>o.included&&Array.isArray(o.replacesDesc)).forEach(o=>o.replacesDesc.forEach(d=>replaced.add(o.intoWorkItem+'|'+d)));
  const wis=e.workItems.map(wi=>({no:wi.no,desc:wi.desc,lines:wi.lines.filter(l=>!replaced.has(wi.no+'|'+l.desc))}));
  (e.options||[]).filter(o=>o.included).forEach(opt=>{
    const optLines=opt.lines.map(l=>Object.assign({},l,{fromOption:opt.name,optionId:opt.id}));
    wis.push({no:"",desc:opt.name,lines:optLines,isOption:true});
  });
  if(activeOptTab!=="base"){
    const opt=(e.options||[]).find(o=>o.id===activeOptTab);
    if(opt&&!opt.included){
      const optLines=opt.lines.map(l=>Object.assign({},l,{fromOption:opt.name,optionId:opt.id,previewOnly:true}));
      wis.push({no:"",desc:opt.name,lines:optLines,isOption:true,previewOnly:true});
    }
  }
  return wis;
}
function flatLines(e){return baseAndIncludedLines(e);}

function computeTotals(e){
  const items=baseAndIncludedLines(e);
  const bySection={};
  items.forEach(it=>{const s=it.category;bySection[s]=(bySection[s]||0)+lineTotal(it);});
  const sellSubtotal=money(items.reduce((a,b)=>a+lineTotal(b),0));

  // Estimate-level discount can never exceed the sell subtotal (no negative net price).
  const discount=Math.max(0,Math.min(Number(e.discount)||0,sellSubtotal));

  // VAT must be calculated AFTER line discounts (already applied in lineTotal) and AFTER the
  // estimate-level discount. The estimate-level discount is spread across lines proportionally
  // to each line's share of the subtotal, so VAT is charged on the true net base — not on the
  // pre-discount subtotal. This mirrors how the future backend must compute VAT.
  const discountRatio=sellSubtotal>0?discount/sellSubtotal:0;
  const taxTotal=money(items.reduce((a,b)=>{
    const lineNet=lineTotal(b)*(1-discountRatio);
    const tax=Math.min(100,Math.max(0,Number(b.tax)||0));
    return a+lineNet*tax/100;
  },0));

  const netSubtotal=money(sellSubtotal-discount);
  const grandTotal=money(netSubtotal+taxTotal);

  const costOf=cat=>money(items.filter(it=>it.category===cat).reduce((a,b)=>a+lineCostTotal(b),0));
  const sellOf=cat=>money(items.filter(it=>it.category===cat).reduce((a,b)=>a+lineTotal(b),0));
  const materialCost=costOf('material'),labourCost=costOf('labour'),machineCost=costOf('machine'),subCost=costOf('subcontractor'),
    consumableCost=costOf('consumable'),logisticsCost=costOf('logistics'),otherCost=costOf('other');
  const totalDirectCost=money(materialCost+labourCost+machineCost+subCost+consumableCost+logisticsCost+otherCost);
  const overheadPct=Math.max(0,Number(e.overheadPct)||0),contingencyPct=Math.max(0,Number(e.contingencyPct)||0);
  const overhead=money(totalDirectCost*overheadPct/100);
  const contingency=money(totalDirectCost*contingencyPct/100);
  const totalInternalCost=money(totalDirectCost+overhead+contingency);
  const sellingPrice=sellSubtotal;
  const netSellingPrice=netSubtotal;
  const grossProfit=money(netSellingPrice-totalInternalCost);
  // Margin must never be Infinity/NaN: guard the zero-price case explicitly.
  const margin=netSellingPrice>0?money(grossProfit/netSellingPrice*100):0;

  const matSell=sellOf('material'),labSell=sellOf('labour'),subSell=sellOf('subcontractor');
  const matMarkup=materialCost>0?money((matSell-materialCost)/materialCost*100):0;
  const labMargin=labourCost>0?money((labSell-labourCost)/labourCost*100):0;
  const subMarkup=subCost>0?money((subSell-subCost)/subCost*100):0;

  return{items,bySection,sellSubtotal,taxTotal,discount,netSubtotal,grandTotal,
    materialCost,labourCost,machineCost,subCost,consumableCost,logisticsCost,otherCost,
    totalDirectCost,overhead,contingency,totalInternalCost,sellingPrice,netSellingPrice,grossProfit,margin,
    matMarkup,labMargin,subMarkup};
}

// ── work-item and line management: move/edit/duplicate/delete. All guarded against editing a locked estimate. ──
function moveWorkItem(id,idx,dir){
  const e=getEst(id);if(!guardEdit(e))return;
  const to=idx+dir;
  // Same class of guard as moveLine() (Pass 3.27) - bounds-checking `to` alone does not guarantee
  // idx itself is still valid after a concurrent edit elsewhere reshaped workItems.
  if(idx<0||idx>=e.workItems.length||to<0||to>=e.workItems.length)return renderAll();
  const tmp=e.workItems[idx];e.workItems[idx]=e.workItems[to];e.workItems[to]=tmp;
  syncEstimation(e);renderAll();
}
function deleteWorkItem(id,idx){
  const e=getEst(id);if(!guardEdit(e))return;
  const wi=e.workItems[idx];if(!wi||wi.lines.length)return;
  if(!confirm(T[LANG].confirm_delete_wi.replace('{n}',wi.desc)))return;
  e.workItems.splice(idx,1);
  e.history.push({date:todayISO(),action:'Work item removed: '+wi.desc,by:'Aleksandar C.'});
  syncEstimation(e);renderAll();
}
function openEditWorkItem(id,idx){
  const t=T[LANG];const e=getEst(id);if(!guardEdit(e))return;
  const wi=e.workItems[idx];if(!wi)return;
  $("fcard").innerHTML=`<h2>${esc(t.act_editwi)}</h2>
    <div class="frow"><label>${esc(t.wi_no)}</label><input id="ewNo" value="${esc(wi.no)}"></div>
    <div class="frow"><label>${esc(t.wi_desc)}</label><input id="ewDesc" value="${esc(wi.desc)}"></div>
    <div id="ewErr" class="errmsg" style="display:none;"></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn primary" onclick="saveEditWorkItem(${id},${idx})">${esc(t.nc_save)}</button></div>`;
  $("fov").classList.add("show");
}
function saveEditWorkItem(id,idx){
  const t=T[LANG];clearAllFieldErrors();const e=getEst(id);if(!guardEdit(e))return;
  const desc=$("ewDesc").value.trim();
  if(!desc){showFieldError('ewDesc','ewErr',t.err_required);return;}
  // Same class of guard as saveLineForm() (Pass 3.27 bug hunt) - workItems can be replaced
  // wholesale by hydrateSharedEstimations() reacting to workshop:data while this modal is open.
  const wi=e.workItems[idx];if(!wi){toast(t.err_line_changed,'error');closeModal();renderAll();return;}
  wi.no=$("ewNo").value.trim();wi.desc=desc;
  e.history.push({date:todayISO(),action:'Work item renamed to: '+desc,by:'Aleksandar C.'});
  syncEstimation(e);closeModal();renderAll();
}
function duplicateLine(id,wiIdx,lIdx){
  const e=getEst(id);if(!guardEdit(e))return;
  const wi=e.workItems[wiIdx];const line=wi.lines[lIdx];if(!line)return;
  wi.lines.splice(lIdx+1,0,JSON.parse(JSON.stringify(line)));
  e.history.push({date:todayISO(),action:'Line duplicated: '+line.desc,by:'Aleksandar C.'});
  syncEstimation(e);renderAll();
}
function deleteLine(id,wiIdx,lIdx){
  const e=getEst(id);if(!guardEdit(e))return;
  const wi=e.workItems[wiIdx];const line=wi.lines[lIdx];if(!line)return;
  if(!confirm(T[LANG].confirm_delete_line.replace('{n}',line.desc)))return;
  wi.lines.splice(lIdx,1);
  e.history.push({date:todayISO(),action:'Line removed: '+line.desc,by:'Aleksandar C.'});
  syncEstimation(e);renderAll();
}
function moveLine(id,wiIdx,lIdx,dir){
  const e=getEst(id);if(!guardEdit(e))return;
  const wi=e.workItems[wiIdx];if(!wi)return renderAll();
  const to=lIdx+dir;
  // Bounds-checking `to` alone does not guarantee lIdx itself is still valid (e.g. the array
  // shrank from a concurrent edit elsewhere such that lIdx is now out of range but lIdx+dir
  // coincidentally isn't) - without this, an out-of-bounds read would silently overwrite a real
  // line with undefined. Same class of guard as saveLineForm()/saveEditWorkItem() (Pass 3.27).
  if(lIdx<0||lIdx>=wi.lines.length||to<0||to>=wi.lines.length)return renderAll();
  const tmp=wi.lines[lIdx];wi.lines[lIdx]=wi.lines[to];wi.lines[to]=tmp;
  syncEstimation(e);renderAll();
}

function actualComparisonHtml(e,tot){if(!window.WorkshopData)return'';const t=T[LANG];const shared=WorkshopData.get(),se=shared.estimations.find(x=>x.id===e.sharedId||x.no===e.no),p=se&&shared.projects.find(x=>x.id===se.projectId);if(!p)return'';const actualMat=p.actualMaterialCost||money(tot.materialCost*.92),actualHours=p.usedHours||0,planned=e.plannedHours||p.plannedHours||0;return `<div class="panel"><div class="phead"><h3>${esc(t.actual_vs_est)}</h3><span class="stpill ${p.status==='completed'?'accepted':'sent'}">${esc(p.no)}</span></div><div class="costrow"><span class="ck">${esc(t.cb_material)}</span><span>${fmt0(tot.materialCost)} → <b>${fmt0(actualMat)}</b></span></div><div class="costrow"><span class="ck">${esc(t.actual_hours)}</span><span>${esc(planned)} h → <b>${esc(actualHours)} h</b></span></div><div class="costrow final"><span>${esc(t.actual_variance)}</span><span style="color:${actualMat>tot.materialCost?'var(--danger)':'var(--ok)'}">${actualMat>tot.materialCost?'+':''}${fmt0(actualMat-tot.materialCost)}</span></div></div>`}

// Creates exactly one new revision: an immutable deep-copy snapshot of the previous revision is preserved,
// the revision number is incremented once, and the estimate returns to Draft so it can be edited again.
// This is the ONLY place e.revision is ever incremented — routine saves (syncEstimation) never touch it.
function openRevision(id){
  const t=T[LANG];const e=getEst(id);
  $("fcard").innerHTML=`<h2>${esc(t.rev_create_title)} ${Number(e.revision||0)+1}</h2><p class="fsub">${esc(e.no)}</p>
    <div class="frow"><label>${esc(t.rev_reason)}</label><textarea id="revReason" placeholder="${esc(t.rev_reason_ph)}"></textarea></div>
    <div id="revErr" class="errmsg" style="display:none;"></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn primary" onclick="saveRevision(${id})">${esc(t.rev_create_btn)}</button></div>`;
  $("fov").classList.add("show");
}
function saveRevision(id){
  const t=T[LANG];clearAllFieldErrors();const reason=$("revReason").value.trim();
  if(!reason){showFieldError('revReason','revErr',t.err_required);return;}
  const e=getEst(id);
  if(!confirm(t.confirm_revision.replace('{no}',e.no)))return;
  createRevision(e,reason);
  closeModal();renderAll();
}
function createRevision(e,reason){
  const snapshot=JSON.parse(JSON.stringify({workItems:e.workItems,options:e.options,terms:e.terms,exclusions:e.exclusions,
    overheadPct:e.overheadPct,contingencyPct:e.contingencyPct,discount:e.discount,status:e.status,revision:e.revision||0,
    savedAt:todayISO()}));
  e.revisionSnapshots=e.revisionSnapshots||[];
  e.revisionSnapshots.push(snapshot);
  e.revision=(e.revision||0)+1;
  e.status=(e.status==='sent'||e.status==='accepted'||e.status==='declined'||e.status==='expired')?'draft':e.status;
  e.history.push({date:todayISO(),time:nowTime(),action:`Revision ${e.revision} created: ${reason}`,by:'Aleksandar C.'});
  syncEstimation(e);
  return e;
}

// ─────────────────────────────────────────────────────────────────────────
// STATUS WORKFLOW — frontend enforcement only. The future backend must
// enforce these exact same transition and precondition rules server-side.
//   Draft → Internal Review → Sent → Accepted
//   From Sent, also: Declined · Expired · (Revision requested, via createRevision)
// A Draft can never jump straight to Accepted, and Sent requires ≥1 valid cost line.
// ─────────────────────────────────────────────────────────────────────────
const ALLOWED_TRANSITIONS={draft:['review','sent'],review:['draft','sent'],sent:['accepted','declined','expired','review'],accepted:[],declined:[],expired:[]};
function hasValidCostLine(e){return e.workItems.some(wi=>wi.lines.some(l=>!isBlank(l.desc)&&isPositiveNumber(l.qty)&&isNonNegNumber(l.sell)));}
function requestStageChange(id,stage){
  const t=T[LANG];const e=getEst(id);if(!e||e.status===stage)return;
  if(isLocked(e)){toast(t.locked_msg.replace('{no}',e.no),'error');return;}
  const allowed=ALLOWED_TRANSITIONS[e.status]||[];
  if(!allowed.includes(stage)){toast(t.transition_blocked.replace('{a}',t['st_'+e.status]).replace('{b}',t['st_'+stage]),'error');return;}
  if(stage==='sent'&&!hasValidCostLine(e)){toast(t.err_needs_line,'error');return;}
  if(!confirm(t.confirm_stage.replace('{s}',t["st_"+stage])))return;
  e.status=stage;
  e.history.push({date:todayISO(),action:`Status changed to ${t["st_"+stage]}`,by:"Aleksandar C."});
  syncEstimation(e);
  renderAll();
}

  if(!isNonNegNumber(cost)){showFieldError('aiCost','aiNumErr',t.err_cost);return;}
  if(!isPercent(disc)){showFieldError('aiDisc','aiNumErr',t.err_disc);return;}
  if(!isPercent(tax)){showFieldError('aiTax','aiNumErr',t.err_tax);return;}
  const category=$("aiCat").value;

  // guardEdit()/getEst() above, just for the array position specifically.
  if(editing){

function openUpload(id){

  $("fcard").innerHTML=`<h2>${esc(t.ud_title)}</h2><p class="fsub">${esc(getEst(id).no)} · ${esc(t.demo_upload)}</p>

async function saveUpload(id){
  const t=T[LANG];clearAllFieldErrors();const name=$("udName").value.trim();
  if(!name){showFieldError('udName','udErr',t.err_required);return;}
  const e=getEst(id),file=$("udFile").files[0];
  if(file&&file.size>WorkshopData.maxDocumentFileBytes){showFieldError('udName','udErr',`File is too large (maximum ${Math.round(WorkshopData.maxDocumentFileBytes/1024)} KB)`);return;}
  let fileData='';if(file)fileData=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)}).catch(()=>null);
  if(file&&fileData===null){showFieldError('udName','udErr','The selected file could not be read.');return;}
  const saved=WorkshopData.upsertDocument({name,type:'Document',module:'Estimations',record:e.no,category:'Estimation Attachments',status:'Valid',expiry:'',revision:'1',author:'Aleksandar C.',fileName:file?file.name:'',mimeType:file?file.type:'',fileSize:file?file.size:0,fileData:fileData||''});
  if(saved.error){showFieldError('udName','udErr',saved.error);return;}
  e.history.push({date:todayISO(),action:`Document uploaded: ${name}`,by:"Aleksandar C."});
  syncEstimation(e);
  closeModal();renderAll();
  toast(t.demo_upload,'ok');
}

// Duplicating creates a genuinely independent estimate: deep-cloned commercial/cost content, a brand-new
// local id and estimation number, no shared/project linkage, reset status/revision/dates/history. The
// original estimate is never touched.
function duplicateEst(id){
  const src=getEst(id);
  const copy=JSON.parse(JSON.stringify(src));
  const created=todayISO();
  copy.id=nextEstId++;
  copy.no=nextEstNumber(created);
  delete copy.sharedId;                 // never overwrite the original shared estimation
  copy.projectNo=null;copy.projectTitle=null;copy.deliveryTarget=null;
  copy.status="draft";
  copy.revision=0;copy.revisionSnapshots=[];
  copy.created=created;
  copy.validUntil=addDaysISO(created,30);
  copy.documents=[];                    // do not copy uploaded customer-specific documents by default
  copy.notes=[];
  copy.history=[{date:created,action:`Duplicated from ${src.no}`,by:"Aleksandar C."}];
  ESTIMATIONS.push(copy);
  selectedId=copy.id;
  syncEstimation(copy);                 // saved as a new, separate shared estimation — the original is untouched
  renderAll();
  toast(T[LANG].duplicate_toast.replace('{a}',src.no).replace('{b}',copy.no),'ok');
}
function addDaysISO(iso,days){const d2=new Date(iso+"T00:00:00");d2.setDate(d2.getDate()+days);return d2.toISOString().slice(0,10);}

// An estimate linked to a project cannot be safely deleted (the project still references it) — offer
// Archive instead and explain why. Unlinked estimates can be deleted after confirmation.
function deleteEst(id){
  const t=T[LANG];const e=getEst(id);if(!e)return;
  if(e.projectNo){
    if(!confirm(t.confirm_archive.replace('{no}',e.no).replace('{p}',e.projectNo)))return;
    e.archived=true;
    e.history.push({date:todayISO(),action:'Archived (linked to project '+e.projectNo+')',by:'Aleksandar C.'});
    syncEstimation(e);
    if(selectedId===id){const visible=ESTIMATIONS.filter(x=>x.id!==id&&!x.archived);selectedId=visible.length?visible[0].id:null;}
    renderAll();
    return;
  }
  if(!confirm(t.confirm_delete))return;
  // Unlinked estimates are removed from BOTH this page's local list and the shared data layer, so the
  // record cannot reappear on refresh (hydrateSharedEstimations() re-adds anything still present there).
  if(window.WorkshopData&&e.sharedId){
    const res=WorkshopData.deleteEstimation(e.sharedId);
    if(res&&res.error){toast(res.error,'error');return;}
  }
  ESTIMATIONS=ESTIMATIONS.filter(x=>x.id!==id);
  if(selectedId===id)selectedId=ESTIMATIONS.length?ESTIMATIONS[0].id:null;
  renderAll();
}

// A dependency-free Excel export using Microsoft's SpreadsheetML 2003 format. This is a genuine
// workbook file (not a toast-only simulation) and opens directly in Excel/LibreOffice while
// keeping the static prototype free of a large XLSX/ZIP dependency.
function exportExcel(id){
  const e=getEst(id),c=CUSTOMERS[e.customerId],tot=computeTotals(e),rows=flatLines(e);
  const x=v=>esc(v==null?'':v),cell=(v,type='String')=>`<Cell><Data ss:Type="${type}">${x(v)}</Data></Cell>`;
  const body=[
    ['Estimation',e.no],['Customer',c.name],['Title',e.projectTitle||e.no],['Status',e.status],['Revision',e.revision||0],['Created',e.created],['Valid Until',e.validUntil],[],
    ['Category','Description','Quantity','Unit','Unit Cost','Unit Sell','Discount %','VAT %','Line Total'],
    ...rows.map(l=>[l.category,l.desc,l.qty,l.unit,l.cost,l.sell,l.discount||0,l.tax||0,lineTotal(l)]),
    [],['Sell Subtotal',tot.sellSubtotal],['Estimate Discount',tot.discount],['VAT',tot.taxTotal],['Grand Total',tot.grandTotal]
  ];
  const xml=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Estimation"><Table>${body.map(r=>`<Row>${r.map(v=>cell(v,typeof v==='number'&&Number.isFinite(v)?'Number':'String')).join('')}</Row>`).join('')}</Table></Worksheet></Workbook>`;
  const blob=new Blob([xml],{type:'application/vnd.ms-excel;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=e.no+'-estimation.xml';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`Excel workbook downloaded — ${a.download}`,'ok');
}

}

        ${esc(t.ei_rfq)}: ${esc(e.customerRfq)||'—'}<br>${esc(t.ei_delivery)}: ${esc(e.deliveryTime)}<br>
        ${esc(t.ei_terms)}: ${esc(e.paymentTerms)}<br>${esc(t.ei_incoterms)}: ${esc(e.incoterms)}

      <div style="display:flex;justify-content:space-between;"><span>${esc(t.ps_discount)}</span><span>${tot.discount.toFixed(2)} ${esc(e.currency)}</span></div>
