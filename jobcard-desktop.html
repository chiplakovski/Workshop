<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="workshop-radio.css">
<title>Varmak — Jobcards</title><style>
  :root{--navy-950:#04101f;--navy-900:#071a33;--navy-800:#0a2447;--navy-brand:#013179;
    --steel-400:#8ea3c0;--steel-300:#b9c6da;--spark:#4a90ff;--ice:#e8f0fb;
    --line:rgba(142,163,192,0.16);--field:rgba(255,255,255,0.045);--field-line:rgba(185,198,218,0.24);
    --ok:#4ad48a;--warn:#ffb057;--danger:#ff6b6b;--idea:#c084fc;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ice);min-height:100vh;overflow-x:hidden;}
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--navy-950);}
  .bg::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 82% 0%,rgba(1,49,121,0.5),transparent 55%),radial-gradient(80% 60% at 10% 100%,rgba(10,36,71,0.6),transparent 60%),linear-gradient(160deg,var(--navy-950),var(--navy-900) 60%,var(--navy-950));}
  .grid{position:absolute;inset:0;opacity:0.28;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);}
  .glow{position:absolute;left:50%;top:18%;width:560px;height:560px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(74,144,255,0.16),transparent 62%);filter:blur(8px);animation:pulse 6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
  .ember{position:absolute;bottom:-10px;border-radius:50%;background:var(--spark);box-shadow:0 0 6px 1px rgba(74,144,255,.8);animation:rise linear infinite;opacity:0;}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-105vh) translateX(var(--drift));opacity:0}}
  @media (prefers-reduced-motion:reduce){.glow,.ember{animation:none}}

  .topfull{position:relative;z-index:2;width:100%;padding:22px 40px 0;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;}
  .brand .logo{font-family:'Sora';font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .brand .logo .dot{width:6px;height:6px;background:var(--spark);box-shadow:0 0 9px 1px rgba(74,144,255,.9);}
  .brand .meta{font-size:11px;color:var(--steel-400);margin-top:2px;line-height:1.5;}
  .topright{display:flex;flex-direction:column;align-items:flex-end;gap:9px;}
  .clock{text-align:right;font-variant-numeric:tabular-nums;} .clock .time{font-family:'Sora';font-weight:600;font-size:16px;} .clock .date{font-size:11px;color:var(--steel-400);}
  .who{display:flex;align-items:center;gap:8px;}
  .who .badge{display:flex;align-items:center;gap:7px;padding:5px 10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;}
  .who .badge .av{width:20px;height:20px;background:linear-gradient(135deg,#2c6bd6,#0a2447);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:'Sora';}
  .who .role{color:var(--spark);font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
  .who .out{background:transparent;border:1px solid var(--field-line);color:var(--steel-300);padding:6px 10px;font-size:12px;cursor:pointer;font-family:'Inter';transition:.15s;}
  .who .out:hover{border-color:var(--spark);color:var(--ice);}

  .wrap{position:relative;z-index:2;max-width:1680px;margin:0 auto;padding:22px 30px 46px;}
  .back{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--field-line);color:var(--steel-300);font-family:'Inter';font-size:12px;padding:7px 12px;cursor:pointer;transition:.15s;margin-bottom:10px;}
  .back:hover{border-color:var(--spark);color:var(--ice);}
  .modhead{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;justify-content:space-between;}
  .modhead .ttl{display:flex;align-items:center;gap:12px;}
  .modhead .ic{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(74,144,255,.14);box-shadow:inset 0 0 0 1px rgba(74,144,255,.35);}
  .modhead h1{font-family:'Sora';font-weight:700;font-size:22px;letter-spacing:-.01em;} .modhead p{font-size:12px;color:var(--steel-400);}

  .tbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--field-line);background:transparent;color:var(--steel-300);font-family:'Sora';font-weight:600;font-size:12.5px;padding:9px 13px;cursor:pointer;transition:.16s;white-space:nowrap;}
  .tbtn:hover{border-color:var(--spark);color:var(--ice);}
  .tbtn.primary{background:linear-gradient(180deg,#2c6bd6,#013179);border:none;color:#fff;}
  .tbtn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(44,107,214,.5);}
  .tbtn.small{padding:6px 10px;font-size:11.5px;}
  .tbtn.danger{border-color:rgba(255,107,107,.4);color:#ffb3b3;}
  .tbtn.danger:hover{border-color:var(--danger);color:#fff;background:rgba(255,107,107,.1);}
  .tbtn:disabled{opacity:.35;cursor:not-allowed;}
  .tbtn svg{flex:none;width:13px;height:13px;}
  .toggrp{display:flex;gap:2px;background:rgba(255,255,255,.03);border:1px solid var(--line);padding:3px;}
  .toggrp button{background:transparent;border:none;color:var(--steel-400);font-family:'Sora';font-weight:600;font-size:11px;letter-spacing:.03em;text-transform:uppercase;padding:8px 12px;cursor:pointer;white-space:nowrap;transition:.15s;}
  .toggrp button.on{background:rgba(74,144,255,.16);color:#cfe0ff;}
  .toggrp button:hover{color:var(--ice);}

  .panel{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:18px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);margin-bottom:16px;}
  .panel .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .panel .phead h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--spark);font-weight:700;}
  .panel .phead .phsub{font-size:11px;color:var(--steel-400);}

  .kpigrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  @media(max-width:1300px){.kpigrid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.kpigrid{grid-template-columns:1fr;}}
  .kpi-card{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:15px;cursor:pointer;transition:.15s;}
  .kpi-card:hover{border-color:rgba(74,144,255,.5);}
  .kpi-label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:8px;}
  .kpi-value{font-family:'Sora';font-weight:700;font-size:26px;}
  .kpi-value.warn{color:var(--warn);} .kpi-value.danger{color:var(--danger);} .kpi-value.ok{color:var(--ok);}

  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .filterbar select,.filterbar input[type=text],.filterbar input[type=date]{background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:'Inter';font-size:12px;padding:8px 10px;outline:none;}
  .filterbar select:focus,.filterbar input:focus{border-color:var(--spark);}
  .search{position:relative;flex:1;min-width:180px;}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--steel-400);}
  .search input{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:'Inter';font-size:13px;padding:9px 10px 9px 32px;outline:none;}
  .search input:focus{border-color:var(--spark);}
  .morewrap{margin-bottom:14px;}
  .morepanel{display:none;grid-template-columns:repeat(4,1fr);gap:10px;background:rgba(255,255,255,.03);border:1px solid var(--line);padding:14px;margin-top:8px;}
  .morewrap.open .morepanel{display:grid;}
  @media(max-width:900px){.morepanel{grid-template-columns:1fr 1fr;}}
  .morepanel label{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:5px;}
  .morepanel select,.morepanel input{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:'Inter';font-size:12.5px;padding:8px 9px;outline:none;}

  .stbl{width:100%;border-collapse:collapse;font-size:12.5px;}
  .stbl th{text-align:left;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap;cursor:default;}
  .stbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;}
  .stbl tr:last-child td{border-bottom:none;}
  .stbl tr.click{cursor:pointer;} .stbl tr.click:hover{background:rgba(74,144,255,.06);}
  .tblwrap{overflow-x:auto;}
  .empty3{text-align:center;color:var(--steel-400);padding:26px;font-size:12.5px;}
  .jcnum{font-family:'Sora';font-weight:600;color:var(--steel-300);font-size:12px;white-space:nowrap;}
  .miniprog{width:70px;height:5px;background:rgba(255,255,255,.08);overflow:hidden;} .miniprog i{display:block;height:100%;background:var(--spark);}

  .tagpill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;font-weight:600;white-space:nowrap;border:1px solid;}
  .tagpill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;}
  .tagpill.g{color:var(--ok);border-color:rgba(74,212,138,.4);background:rgba(74,212,138,.1);}
  .tagpill.b{color:#cfe0ff;border-color:rgba(74,144,255,.4);background:rgba(74,144,255,.12);}
  .tagpill.w{color:var(--warn);border-color:rgba(255,176,87,.4);background:rgba(255,176,87,.1);}
  .tagpill.r{color:var(--danger);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.1);}
  .tagpill.n{color:var(--steel-400);border-color:var(--line);background:rgba(142,163,192,.08);}
  .tagpill.p{color:var(--idea);border-color:rgba(192,132,252,.4);background:rgba(192,132,252,.12);}
  .prio{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle;}
  .prio.high{background:var(--danger);} .prio.medium{background:var(--warn);} .prio.low{background:var(--steel-400);}

  /* detail header */
  .dethead{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:22px 24px;margin-bottom:18px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}
  .dethead .dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
  .dethead .jno{font-family:'Sora';font-size:12px;color:var(--steel-300);letter-spacing:.04em;} .dethead h2{font-family:'Sora';font-weight:600;font-size:21px;margin-top:3px;}
  .dethead .dcust{font-size:12.5px;color:var(--steel-400);margin-top:3px;}
  .dfacts{display:flex;gap:26px;flex-wrap:wrap;}
  .dfacts .df .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:3px;} .dfacts .df .v{font-size:13.5px;font-weight:600;}
  .roactions{display:flex;gap:8px;flex-wrap:wrap;}
  .roactions .more{position:relative;}
  .moremenu{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:rgba(7,26,51,.98);border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.5);z-index:50;}
  .moremenu.open{display:block;}
  .moremenu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--steel-300);font-family:'Inter';font-size:12.5px;padding:11px 14px;cursor:pointer;}
  .moremenu button:hover{background:rgba(74,144,255,.12);color:var(--ice);}
  .moremenu button.danger2:hover{background:rgba(255,107,107,.12);color:#ffb3b3;}
  .lockbanner{display:flex;align-items:center;gap:10px;background:rgba(255,176,87,.1);border:1px solid rgba(255,176,87,.4);color:var(--warn);font-size:12px;padding:10px 13px;margin-bottom:16px;}
  .lockbanner svg{flex:none;} .lockbanner button{margin-left:auto;}

  .stepper{display:flex;align-items:center;margin:16px 0 4px;overflow-x:auto;padding-bottom:2px;}
  .step{display:flex;align-items:center;gap:8px;flex:none;cursor:pointer;padding:6px 4px;border:none;background:none;}
  .step .sdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--field-line);display:flex;align-items:center;justify-content:center;color:var(--steel-400);flex:none;transition:.15s;font-size:11px;}
  .step .slabel{font-size:11.5px;font-weight:600;color:var(--steel-400);white-space:nowrap;}
  .step.done .sdot{border-color:var(--ok);background:rgba(74,212,138,.15);color:var(--ok);}
  .step.done .slabel{color:var(--steel-300);}
  .step.current .sdot{border-color:var(--spark);background:var(--spark);color:#fff;box-shadow:0 0 0 4px rgba(74,144,255,.18);}
  .step.current .slabel{color:var(--ice);}
  .step.sidebranch .sdot{border-color:var(--warn);background:var(--warn);color:#1c1200;box-shadow:0 0 0 4px rgba(255,176,87,.18);}
  .step.sidebranch .slabel{color:#ffd0b0;}
  .stepline{width:30px;height:1px;background:var(--field-line);flex:none;}

  .ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;}
  .ptabs button{background:transparent;border:none;color:var(--steel-400);font-family:'Sora';font-weight:600;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;padding:11px 14px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:.15s;}
  .ptabs button:hover{color:var(--ice);}
  .ptabs button.on{color:#cfe0ff;border-bottom-color:var(--spark);}
  .tabpanel{min-height:200px;}

  .ovgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  @media(max-width:1100px){.ovgrid{grid-template-columns:repeat(2,1fr);}}
  .ovcard{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:15px;}
  .ovcard h4{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:10px;}
  .ovline{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px;} .ovline .lk{color:var(--steel-400);}
  .ovbar{height:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:4px 0 8px;} .ovbar i{display:block;height:100%;background:var(--spark);}
  .ovbig{font-family:'Sora';font-size:22px;font-weight:600;}

  .opcard{border:1px solid var(--line);padding:13px 15px;margin-bottom:10px;background:rgba(255,255,255,.02);}
  .opcard.active{border-color:rgba(74,144,255,.5);background:rgba(74,144,255,.06);}
  .opcard .oph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
  .opcard .opn{font-family:'Sora';font-weight:700;font-size:12.5px;} .opcard .opdesc{font-size:13px;font-weight:600;margin-top:2px;}
  .opcard .opinstr{font-size:12px;color:var(--steel-300);margin:6px 0;line-height:1.5;}
  .opcard .opmeta{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--steel-400);margin-top:6px;}
  .opcard .opmeta b{color:var(--steel-300);font-weight:600;}
  .opactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .opactions button{background:transparent;border:1px solid var(--field-line);color:var(--steel-300);font-size:11px;padding:5px 9px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:5px;}
  .opactions button:hover{border-color:var(--spark);color:var(--ice);}
  .opactions button svg{width:11px;height:11px;}
  .opdep{font-size:10.5px;color:var(--steel-400);}

  .mchips{display:flex;flex-wrap:wrap;gap:7px;}
  .mchip{display:inline-flex;align-items:center;padding:7px 11px;border:1px solid var(--field-line);color:var(--steel-300);font-size:11.5px;cursor:pointer;transition:.14s;-webkit-user-select:none;user-select:none;}
  .mchip.on{background:rgba(74,144,255,.16);border-color:rgba(74,144,255,.5);color:#cfe0ff;}

  .notecard{border:1px solid var(--line);padding:12px 14px;margin-bottom:10px;background:rgba(255,255,255,.02);}
  .notecard .nh{display:flex;justify-content:space-between;font-size:11px;color:var(--steel-400);margin-bottom:6px;}
  .notecard .ntag{font-size:9px;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);margin-left:7px;}
  .notecard p{font-size:12.5px;color:var(--steel-300);line-height:1.5;}

  .actrow{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:12.5px;}
  .actrow:first-child{border-top:none;}
  .actrow .adot{width:7px;height:7px;border-radius:50%;background:var(--spark);margin-top:5px;flex:none;}
  .actrow .atime{color:var(--steel-400);font-size:11px;white-space:nowrap;width:126px;flex:none;}
  .actrow .auser{font-weight:600;margin-right:4px;}

  .rowactions2{display:flex;gap:6px;flex-wrap:wrap;}
  .iconbtn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--field-line);background:transparent;color:var(--steel-300);cursor:pointer;transition:.15s;}
  .iconbtn:hover{border-color:var(--spark);color:var(--ice);}
  .iconbtn svg{width:14px;height:14px;}

  .scanbox{height:70px;border:1px dashed rgba(74,144,255,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--steel-400);margin-bottom:12px;background:rgba(74,144,255,.04);font-size:11px;}
  .scanbox b{display:block;color:var(--ice);margin-top:4px;font-size:12px;}

  .fielderr{border-color:var(--danger)!important;}
  .errmsg{font-size:11px;color:var(--danger);margin-top:-10px;margin-bottom:12px;}

  .actionbar{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:20px;}
  .actionbar button{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--field-line);color:var(--steel-300);font-family:'Sora';font-weight:600;font-size:11.5px;padding:16px 8px;cursor:pointer;transition:.16s;}
  .actionbar button:hover{border-color:var(--spark);color:var(--ice);background:rgba(74,144,255,.07);transform:translateY(-2px);}
  .actionbar button svg{width:19px;height:19px;color:var(--spark);}
  @media(max-width:1400px){.actionbar{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:640px){.actionbar{grid-template-columns:repeat(2,1fr);}}

  .fov{position:fixed;inset:0;z-index:90;background:rgba(2,8,15,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;}
  .fov.show{display:flex;}
  .fcard{background:rgba(9,23,45,.98);border:1px solid var(--line);width:600px;max-width:100%;padding:30px 34px;box-shadow:0 30px 80px rgba(0,0,0,.55);}
  .fcard.wide{width:800px;}
  .fcard h2{font-family:'Sora';font-weight:600;font-size:18px;margin-bottom:6px;}
  .fcard .fsub{font-size:12px;color:var(--steel-400);margin-bottom:20px;}
  .fcard .frow{margin-bottom:14px;} .fcard .frow2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .fcard .frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px;}
  @media(max-width:560px){.fcard .frow2,.fcard .frow3{grid-template-columns:1fr;}}
  .fcard label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:6px;}
  .fcard input,.fcard select,.fcard textarea{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:'Inter';font-size:13.5px;padding:9px 11px;outline:none;}
  .fcard input:focus,.fcard select:focus,.fcard textarea:focus{border-color:var(--spark);}
  .fcard textarea{min-height:64px;resize:vertical;}
  .fcard .checkrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--steel-300);}
  .fcard .checkrow input{width:auto;}
  .fcard .fbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap;}
  .fcard .fnote{font-size:11.5px;color:var(--steel-400);margin-top:-6px;margin-bottom:14px;}

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function money(n){n=Number(n);if(!Number.isFinite(n))return 0;return Math.round(n*100)/100;}
function fmt0(n){return Math.round(money(n)).toLocaleString('sv-SE');}
function todayISO(){return new Date().toISOString().slice(0,10);}
function nowTime(){return new Date().toTimeString().slice(0,5);}
// isBlank, isPositiveNumber, canCompleteOp, VALID_RESUME_TARGETS and resumeTargetFor live in
// jobcard-rules.js (loaded above) so the page and the automated tests share one implementation.
const {isBlank,isPositiveNumber,canCompleteOp,VALID_RESUME_TARGETS,resumeTargetFor}=JobcardRules;
// resolveMachineLink, isDuplicateEquipmentLink, isAssignedElsewhere, canAddEquipmentToJobcard,
// canStartOperationEquipment, canReturnEquipmentFromJobcard, equipmentUsageForJobcard and
// resolveLogTimeEquipment live in jobcard-equipment-rules.js — the actual safety DECISION always
// still comes from WorkshopData's central Equipment Safety Gate (equipment-gates.js); these are
// read-only reference/UI helpers.
const {resolveMachineLink,isDuplicateEquipmentLink,isAssignedElsewhere,canAddEquipmentToJobcard,
  canStartOperationEquipment,canReturnEquipmentFromJobcard,equipmentUsageForJobcard,
  resolveLogTimeEquipment}=JobcardEquipmentRules;
function isNonNegNumber(v){const n=Number(v);return Number.isFinite(n)&&n>=0;}
function clearAllFieldErrors(){document.querySelectorAll('#fcard .fielderr').forEach(el=>el.classList.remove('fielderr'));document.querySelectorAll('#fcard .errmsg').forEach(el=>{el.style.display='none';el.textContent='';});}
function showFieldError(fieldId,errId,msg){const f=$(fieldId),err=$(errId);if(f){f.classList.add('fielderr');f.focus();}if(err){err.textContent=msg;err.style.display='block';}}
function toast(msg,kind){
  let box=$('toastBox');
  if(!box){box=document.createElement('div');box.id='toastBox';box.style.cssText='position:fixed;right:18px;top:18px;z-index:120;display:flex;flex-direction:column;gap:8px;';document.body.appendChild(box);}
  const el=document.createElement('div');
  el.style.cssText=`font-family:'Inter';font-size:12.5px;padding:11px 16px;max-width:320px;box-shadow:0 14px 34px rgba(0,0,0,.45);border:1px solid ${kind==='error'?'rgba(255,107,107,.5)':'rgba(74,144,255,.4)'};background:rgba(9,23,45,.98);color:${kind==='error'?'#ffb3b3':'#e8f0fb'};`;
  el.textContent=msg;box.appendChild(el);

function getJC(idOrNo){return JOBCARDS.find(j=>j.id===idOrNo||j.no===idOrNo);}
// The authoritative decision always comes from WorkshopData's central Quality Hold gate (see
// quality-gates.js) — this is a thin read-only wrapper used only to drive the banner/disabled
// controls; it is never trusted as the actual safety enforcement (that happens server-side).
function jcQualityGate(j){return (j&&window.WorkshopData?.getJobcardQualityGate)?WorkshopData.getJobcardQualityGate(j.no):{blocked:false,holds:[],reasons:[]};}
// Shows a translated error toast when a WorkshopData mutation was rejected by the central Quality
// Hold safety gate, instead of silently recording a misleading "status changed" activity entry for
// a change that was actually blocked and never happened. Returns true if the result was blocked.
function handleQualityBlocked(result){
  if(!result||result.code!=='QUALITY_HOLD_ACTIVE')return false;
  const tt=t();
  toast(tpl(tt.qh_blocked_toast,{holds:(result.holdNumbers||[]).join(', ')||'—'}),'error');
  return true;
}
function qualityHoldBanner(j){
  const tt=t();const gate=jcQualityGate(j);
  if(!gate.blocked)return'';
  return `<div class="lockbanner" style="background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.4);color:#ffd9d9;flex-direction:column;align-items:stretch;gap:8px;">

    ${gate.holds.map(h=>`<div style="font-size:12px;line-height:1.6;">
      <div><b>${esc(tt.qh_hold_label)} ${esc(h.no)}</b>${h.severity?` · ${esc(tt.qh_severity_label)}: ${esc(h.severity)}`:''}</div>
      ${h.reason?`<div>${esc(tt.qh_reason_label)}: ${esc(h.reason)}</div>`:''}
      ${h.requiredAction?`<div>${esc(tt.qh_requiredaction_label)}: ${esc(h.requiredAction)}</div>`:''}
    </div>`).join('')}
  </div>`;
}

// ── status workflow metadata ──
// Draft → Released → Ready → In Progress → Inspection → Completed → Closed, with Paused/Blocked/Cancelled
// as side-statuses and Archived as a terminal action from Completed/Closed/Cancelled.
// Frontend enforcement only — the future backend must repeat every one of these checks server-side.
const MAIN_STAGES=['draft','released','ready','in-progress','inspection','completed','closed'];
const SIDE_STATUSES=['paused','blocked','cancelled','archived'];
// Presentational mirror of workshop-data.js's JOBCARD_UNSAFE_STATUSES/OPERATION_UNSAFE_STATUSES —
// used only to decide which controls to disable/hide while a Quality Hold is active. The actual
// safety decision always comes from WorkshopData's central gate (quality-gates.js); these lists
// only avoid showing a control the server would reject anyway.
const JOBCARD_UNSAFE_STATUSES=['in-progress','completed','closed'];
const OPERATION_UNSAFE_STATUSES=['in-progress','completed','skipped'];
const ALLOWED_TRANSITIONS={
  draft:['released','cancelled'],
  released:['ready','draft','paused','blocked','cancelled'],
  ready:['in-progress','released','paused','blocked','cancelled'],
  'in-progress':['inspection','paused','blocked'],
  inspection:['completed','in-progress','paused','blocked'],
  completed:['closed'],
  closed:[],
  paused:[],// resumed explicitly back to the status recorded in resumeStatus
  blocked:[],
  cancelled:[],
  archived:[]
};
function isLocked(j){return['completed','closed','archived','cancelled'].includes(j.status);}
function isPaused(j){return j.status==='paused'||j.status==='blocked';}

function hasAtLeastOneOperation(j){return(j.operations||[]).length>0;}
function requiredOperationsComplete(j){return(j.operations||[]).filter(o=>o.status!=='skipped').every(o=>o.status==='completed');}
function mandatoryInspectionsPassed(j){return(j.inspections||[]).filter(i=>i.requirement==='required').every(i=>i.status==='passed'||i.status==='passed-comment');}
function failedInspections(j){return(j.inspections||[]).filter(i=>i.requirement==='required'&&(i.status==='rework'||i.status==='rejected'));}
function pendingInspections(j){return(j.inspections||[]).filter(i=>i.requirement==='required'&&i.status==='pending');}
function materialsShort(j){return(j.materials||[]).some(m=>m.status==='shortage'||m.status==='substitute');}
function jcHoursLogged(j){return(j.operations||[]).reduce((a,o)=>a+(Number(o.loggedHours)||0),0);}
function jcProgress(j){const total=(j.operations||[]).length;if(!total)return j.progress||0;const done=(j.operations||[]).filter(o=>o.status==='completed').length;return Math.round(done/total*100);}
function daysUntil(iso){if(!iso)return null;return Math.round((new Date(iso+'T00:00:00')-currentDate())/86400000);}
function currentDate(){return new Date();}

let LANG='en';
function t(){return T[LANG];}
function tpl(str,vals){return str.replace(/\{(\w+)\}/g,(m,k)=>(vals[k]!==undefined?vals[k]:m));}

// ── shared form field builders (match the fov/fcard modal pattern used across the app) ──
function field(id,label,value,type){type=type||'text';return `<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value??'')}"></div>`;}
function fieldSelect(id,label,options,selected,disabled){return `<div><label for="${id}">${label}</label><select id="${id}" ${disabled?'disabled':''}>${options.map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(selected??'')?'selected':''}>${esc(o.l)}</option>`).join('')}</select></div>`;}
function fieldTextarea(id,label,value){return `<div><label for="${id}">${label}</label><textarea id="${id}">${esc(value??'')}</textarea></div>`;}
function optList(keys,prefix){const tt=t();return keys.map(k=>({v:k,l:tt[prefix+k]??k}));}
function ownerOptions(){return OWNER_OPTIONS.map(n=>({v:n,l:n}));}
function projectOptions(includeNone){const opts=SHARED.projects.map(p=>({v:p.no,l:`${p.no} — ${p.name}`}));return includeNone?[{v:'',l:t().ji_none}].concat(opts):opts;}

let currentModal=null;

function openModal(html,wide){$('fcard').className='fcard'+(wide?' wide':'');$('fcard').innerHTML=html;$('fov').classList.add('show');currentModal=true;
  const first=$('fcard').querySelector('input,select,textarea,button');if(first)first.focus();}
function closeModal(){$('fov').classList.remove('show');$('fcard').innerHTML='';currentModal=null;}
$('fov').addEventListener('click',e=>{if(e.target.id==='fov')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(currentModal)closeModal();document.querySelectorAll('.moremenu.open').forEach(m=>m.classList.remove('open'));}});

function fmtDate(iso){if(!iso)return '—';try{const d=new Date(iso+'T00:00:00');return d.toLocaleDateString(t().locale||'en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return iso;}}
function followupClass(iso){if(!iso)return '';const n=daysUntil(iso);if(n===null)return '';if(n<0)return 'r';if(n<=3)return 'w';return '';}

// ── chrome: clock, language switcher, embers ──
function tick(){const n=new Date();$('time').textContent=n.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
  try{$('date').textContent=n.toLocaleDateString((t().locale||'en-GB'),{weekday:'short',day:'numeric',month:'short'});}catch(e){$('date').textContent=n.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}}
function setLang(code){LANG=code;
  document.querySelectorAll('[data-i]').forEach(el=>{const key=el.getAttribute('data-i');if(T[code][key]!==undefined)el.textContent=T[code][key];});
  document.documentElement.lang=code==='mk'?'mk-Latn':code;
  document.querySelectorAll('.langmenu button').forEach(b=>b.classList.toggle('active',b.getAttribute('data-lang')===code));
  const cur=$('langcur');if(cur)cur.textContent=code.toUpperCase();
  tick();renderApp();}
document.querySelectorAll('.langmenu button').forEach(b=>b.addEventListener('click',()=>{setLang(b.getAttribute('data-lang'));const l=$('langc');if(l)l.classList.remove('open');}));

function setView(v){VIEW=v;document.querySelectorAll('.module-side-nav button[data-ms]').forEach(b=>b.classList.toggle('on',b.getAttribute('data-ms')===v));renderApp();window.scrollTo({top:0,behavior:'auto'});}

// ═══════════════ OVERVIEW ═══════════════
function activeJobcards(){return JOBCARDS.filter(j=>!j.archived&&!['completed','closed','cancelled'].includes(j.status));}
function overdueJobcards(){return activeJobcards().filter(j=>{const n=daysUntil(j.plannedCompletion);return n!==null&&n<0;});}
function completedThisWeek(){return JOBCARDS.filter(j=>{if(!['completed','closed'].includes(j.status)||!j.actualCompletion)return false;const n=daysUntil(j.actualCompletion);return n!==null&&n>=-7&&n<=0;});}
function waitingForMaterial(){return activeJobcards().filter(j=>materialsShort(j)||j.materialReadiness==='shortage'||j.materialReadiness==='partial');}
function waitingForInspection(){return JOBCARDS.filter(j=>!j.archived&&(j.status==='inspection'||(!['completed','closed','cancelled'].includes(j.status)&&pendingInspections(j).length>0)));}

function kpiData(){
  const open=activeJobcards();
  return{
    open:open.length,
    ready:JOBCARDS.filter(j=>!j.archived&&j.status==='ready').length,
    inprogress:JOBCARDS.filter(j=>!j.archived&&j.status==='in-progress').length,
    blocked:JOBCARDS.filter(j=>!j.archived&&isPaused(j)).length,
    waitmat:waitingForMaterial().length,
    waitinsp:waitingForInspection().length,
    completedweek:completedThisWeek().length,
    overdue:overdueJobcards().length
  };
}
function renderKPIGrid(){
  const k=kpiData();const tt=t();
  const cards=[
    ['kpi_open',k.open,'',()=>setView('all')],
    ['kpi_ready',k.ready,'ok',()=>setView('ready')],
    ['kpi_inprogress',k.inprogress,'',()=>setView('inprogress')],
    ['kpi_blocked',k.blocked,k.blocked>0?'warn':'',()=>setView('blocked')],
    ['kpi_waitmat',k.waitmat,k.waitmat>0?'warn':'',()=>setView('all')],
    ['kpi_waitinsp',k.waitinsp,k.waitinsp>0?'warn':'',()=>setView('inspection')],
    ['kpi_completedweek',k.completedweek,'ok',()=>setView('completed')],
    ['kpi_overdue',k.overdue,k.overdue>0?'danger':'',()=>setView('all')]
  ];
  window._kpiActions=cards.map(c=>c[3]);
  return `<div class="kpigrid">${cards.map((c,i)=>`<div class="kpi-card" onclick="_kpiActions[${i}]()"><div class="kpi-label">${esc(tt[c[0]])}</div><div class="kpi-value ${c[2]}">${c[1]}</div></div>`).join('')}</div>`;
}

function priorityScore(j){const order={high:0,medium:1,low:2};const overdueBonus=daysUntil(j.plannedCompletion)!==null&&daysUntil(j.plannedCompletion)<0?-10:0;return (order[j.priority]??1)+overdueBonus;}
function renderPriorityWork(){
  const tt=t();const rows=activeJobcards().sort((a,b)=>priorityScore(a)-priorityScore(b)).slice(0,6);
  if(!rows.length)return `<div class="empty3">${esc(tt.empty_jclist)}</div>`;
  return `<div class="tblwrap"><table class="stbl"><thead><tr><th>${esc(tt.th_jcno)}</th><th>${esc(tt.th_title)}</th><th>${esc(tt.th_customer)}</th><th>${esc(tt.th_priority)}</th><th>${esc(tt.th_status)}</th><th>${esc(tt.th_deadline)}</th></tr></thead><tbody>
    ${rows.map(j=>`<tr class="click" tabindex="0" onclick="openJcDetail(${j.id})"><td><b>${esc(j.no)}</b></td><td>${esc(j.title)}</td><td>${esc(custName(j.customerId))}</td><td><span class="prio ${esc(j.priority)}"></span>${esc(tt['pr_'+j.priority])}</td><td>${statusPill(j.status)}</td><td class="${followupClass(j.plannedCompletion)==='r'?'tagpill r':''}">${fmtDate(j.plannedCompletion)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function renderRecentlyUpdated(){
  const tt=t();
  const rows=JOBCARDS.filter(j=>!j.archived).map(j=>({j,last:(j.activity&&j.activity[0])||null})).filter(x=>x.last).sort((a,b)=>(b.last.date+((b.last.time)||'')).localeCompare(a.last.date+((a.last.time)||''))).slice(0,6);
  if(!rows.length)return `<div class="empty3">${esc(tt.chart_none)}</div>`;
  return rows.map(({j,last})=>`<div class="actrow"><div class="adot"></div><div><div><b>${esc(j.no)}</b> — ${esc(j.title)}</div><div style="color:var(--steel-400);font-size:11px;margin-top:2px;">${esc(last.action)} · ${esc(last.by||'')} · ${fmtDate(last.date)}</div></div></div>`).join('');
}
function renderMaterialShortages(){
  const tt=t();const rows=waitingForMaterial().slice(0,6);
  if(!rows.length)return `<div class="empty3">${esc(tt.chart_none)}</div>`;
  return rows.map(j=>{const shorts=(j.materials||[]).filter(m=>m.status==='shortage'||m.status==='substitute');
    return `<div class="actrow"><div class="adot" style="background:var(--warn);"></div><div><div><b>${esc(j.no)}</b> — ${esc(j.title)}</div><div style="color:var(--steel-400);font-size:11px;margin-top:2px;">${shorts.map(m=>esc(m.description)).join(', ')||esc(tt.ms_shortage)}</div></div></div>`;}).join('');
}
function renderWaitingInspection(){
  const tt=t();const rows=waitingForInspection().slice(0,6);
  if(!rows.length)return `<div class="empty3">${esc(tt.chart_none)}</div>`;
  return rows.map(j=>{const n=pendingInspections(j).length;
    return `<div class="actrow"><div class="adot" style="background:var(--idea);"></div><div><div><b>${esc(j.no)}</b> — ${esc(j.title)}</div><div style="color:var(--steel-400);font-size:11px;margin-top:2px;">${n} ${esc(tt.q_type).toLowerCase()} · ${statusPill(j.status)}</div></div></div>`;}).join('');
}
function renderWorkload(){
  const tt=t();
  const byWorker={};activeJobcards().forEach(j=>(j.operations||[]).forEach(o=>{if(!o.worker)return;byWorker[o.worker]=byWorker[o.worker]||{planned:0,logged:0};byWorker[o.worker].planned+=Number(o.plannedHours)||0;byWorker[o.worker].logged+=Number(o.loggedHours)||0;}));
  const byMachine={};activeJobcards().forEach(j=>(j.operations||[]).forEach(o=>{if(!o.machine)return;byMachine[o.machine]=byMachine[o.machine]||0;byMachine[o.machine]+=Number(o.plannedHours)||0;}));
  const workerRows=Object.entries(byWorker).map(([w,v])=>`<div class="barrow2"><span>${esc(w)}</span><span>${v.logged}h / ${v.planned}h</span></div>`).join('')||`<div class="empty3">${esc(tt.chart_none)}</div>`;
  const machineRows=Object.entries(byMachine).map(([m,h])=>`<div class="barrow2"><span>${esc(m)}</span><span>${h}h</span></div>`).join('')||`<div class="empty3">${esc(tt.chart_none)}</div>`;
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;"><div><h4 style="font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:8px;">${esc(tt.wh_assigned)}</h4>${workerRows}</div><div><h4 style="font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:8px;">${esc(tt.mc_required)}</h4>${machineRows}</div></div>`;
}
function renderUpcomingDeadlines(){
  const tt=t();const rows=activeJobcards().filter(j=>j.plannedCompletion).sort((a,b)=>a.plannedCompletion.localeCompare(b.plannedCompletion)).slice(0,6);
  if(!rows.length)return `<div class="empty3">${esc(tt.chart_none)}</div>`;
  return `<div class="tblwrap"><table class="stbl"><thead><tr><th>${esc(tt.th_jcno)}</th><th>${esc(tt.th_title)}</th><th>${esc(tt.th_deadline)}</th><th>${esc(tt.th_status)}</th></tr></thead><tbody>
    ${rows.map(j=>`<tr class="click" tabindex="0" onclick="openJcDetail(${j.id})"><td><b>${esc(j.no)}</b></td><td>${esc(j.title)}</td><td class="${followupClass(j.plannedCompletion)==='r'?'tagpill r':(followupClass(j.plannedCompletion)==='w'?'tagpill w':'')}">${fmtDate(j.plannedCompletion)}</td><td>${statusPill(j.status)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function renderOverview(){
  const tt=t();
  return `${renderKPIGrid()}
  <div class="panel"><div class="phead"><h3>${esc(tt.ov_priority_t)}</h3></div>${renderPriorityWork()}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;" class="ovsplit">
    <div class="panel" style="margin-bottom:0;"><div class="phead"><h3>${esc(tt.ov_recent_t)}</h3></div>${renderRecentlyUpdated()}</div>
    <div class="panel" style="margin-bottom:0;"><div class="phead"><h3>${esc(tt.ov_matshortage_t)}</h3></div>${renderMaterialShortages()}</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;" class="ovsplit">
    <div class="panel" style="margin-bottom:0;"><div class="phead"><h3>${esc(tt.ov_waitinsp_t)}</h3></div>${renderWaitingInspection()}</div>
    <div class="panel" style="margin-bottom:0;"><div class="phead"><h3>${esc(tt.ov_deadlines_t)}</h3></div>${renderUpcomingDeadlines()}</div>
  </div>
  <div class="panel" style="margin-top:16px;"><div class="phead"><h3>${esc(tt.ov_workload_t)}</h3></div>${renderWorkload()}</div>`;
}
function statusPill(s){const tt=t();const cls=STATUS_CLASS[s]||'n';return `<span class="tagpill ${cls}">${esc(tt['st_'+s]||s)}</span>`;}
const STATUS_CLASS={draft:'n',released:'b',ready:'b','in-progress':'b',inspection:'p',completed:'g',closed:'g',paused:'w',blocked:'r',cancelled:'r',archived:'n'};

// ═══════════════ JOBCARD LIST (All / Ready / In Progress / Blocked / Inspection / Completed / Archived) ═══════════════
const VIEW_TITLES={all:'nav_all',ready:'nav_ready',inprogress:'nav_inprogress',blocked:'nav_blocked',inspection:'nav_inspection',completed:'nav_completed',archived:'nav_archived'};
const VIEW_BASE_FILTER={
  all:j=>!j.archived,
  ready:j=>!j.archived&&j.status==='ready',
  inprogress:j=>!j.archived&&j.status==='in-progress',
  blocked:j=>!j.archived&&isPaused(j),
  inspection:j=>!j.archived&&(j.status==='inspection'||(!['completed','closed','cancelled'].includes(j.status)&&pendingInspections(j).length>0)),
  completed:j=>!j.archived&&['completed','closed'].includes(j.status),
  archived:j=>!!j.archived
};
function currentOperation(j){const ops=j.operations||[];return ops.find(o=>o.status==='in-progress')||ops.find(o=>o.status==='pending')||ops[ops.length-1]||null;}
function jcMaterialStatus(j){if(!j.materials||!j.materials.length)return j.materialReadiness||'not-checked';if(j.materials.some(m=>m.status==='shortage'))return'shortage';if(j.materials.some(m=>m.status==='substitute'))return'substitute';if(j.materials.every(m=>m.status==='issued'))return'issued';if(j.materials.some(m=>m.status==='partial'))return'partial';if(j.materials.every(m=>m.status==='available'||m.status==='reserved'))return'available';return'not-checked';}

function filteredJobcards(){
  const base=VIEW_BASE_FILTER[VIEW]||(()=>true);
  const q=jcQuery.trim().toLowerCase();
  return JOBCARDS.filter(base)
    .filter(j=>jcFilterStatus==='all'||j.status===jcFilterStatus)
    .filter(j=>jcFilterProject==='all'||j.projectNo===jcFilterProject)
    .filter(j=>jcFilterCustomer==='all'||String(j.customerId)===jcFilterCustomer)
    .filter(j=>jcFilterResp==='all'||j.responsible===jcFilterResp)
    .filter(j=>jcFilterWorker==='all'||(j.workers||[]).includes(jcFilterWorker))
    .filter(j=>jcFilterMachine==='all'||(j.machines||[]).some(m=>m.name===jcFilterMachine))
    .filter(j=>jcFilterPriority==='all'||j.priority===jcFilterPriority)
    .filter(j=>jcFilterMaterial==='all'||jcMaterialStatus(j)===jcFilterMaterial)
    .filter(j=>jcFilterInspection==='all'||(jcFilterInspection==='pending'?pendingInspections(j).length>0:jcFilterInspection==='failed'?failedInspections(j).length>0:jcFilterInspection==='clear'?mandatoryInspectionsPassed(j):true))
    .filter(j=>!q||j.no.toLowerCase().includes(q)||j.title.toLowerCase().includes(q)||(j.projectNo||'').toLowerCase().includes(q)||custName(j.customerId).toLowerCase().includes(q))
    .sort((a,b)=>(b.plannedStart||'').localeCompare(a.plannedStart||''));
}
function allWorkersList(){const s=new Set();JOBCARDS.forEach(j=>(j.workers||[]).forEach(w=>s.add(w)));return[...s];}
function allMachinesList(){const s=new Set();JOBCARDS.forEach(j=>(j.machines||[]).forEach(m=>s.add(m.name)));return[...s];}

    <div class="filterbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="jcSearch" type="text" placeholder="${esc(tt.searchph)}" aria-label="${esc(tt.searchph)}" value="${esc(jcQuery)}"></div>
      <select aria-label="${esc(tt.f_status)}" onchange="jcFilterStatus=this.value;renderApp();"><option value="all" ${jcFilterStatus==='all'?'selected':''}>${esc(tt.filt_allstatus)}</option>${MAIN_STAGES.concat(SIDE_STATUSES).map(s=>`<option value="${s}" ${jcFilterStatus===s?'selected':''}>${esc(tt['st_'+s])}</option>`).join('')}</select>
      <select aria-label="${esc(tt.f_priority)}" onchange="jcFilterPriority=this.value;renderApp();"><option value="all" ${jcFilterPriority==='all'?'selected':''}>${esc(tt.filt_allpriorities)}</option>${['high','medium','low'].map(p=>`<option value="${p}" ${jcFilterPriority===p?'selected':''}>${esc(tt['pr_'+p])}</option>`).join('')}</select>
      <button class="tbtn small" onclick="moreFiltersOpen=!moreFiltersOpen;renderApp();">${esc(tt.morefilters)}</button>
      <button class="tbtn small" onclick="clearJcFilters();">${esc(tt.clearfilters)}</button>

    <div class="morewrap ${moreFiltersOpen?'open':''}"><div class="morepanel">
      <div><label for="jcFilterProjectSel">${esc(tt.f_project)}</label><select id="jcFilterProjectSel" onchange="jcFilterProject=this.value;renderApp();"><option value="all" ${jcFilterProject==='all'?'selected':''}>${esc(tt.filt_allprojects)}</option>${SHARED.projects.map(p=>`<option value="${esc(p.no)}" ${jcFilterProject===p.no?'selected':''}>${esc(p.no)}</option>`).join('')}</select></div>
      <div><label for="jcFilterCustomerSel">${esc(tt.f_customer)}</label><select id="jcFilterCustomerSel" onchange="jcFilterCustomer=this.value;renderApp();"><option value="all" ${jcFilterCustomer==='all'?'selected':''}>${esc(tt.filt_allcustomers)}</option>${SHARED.customers.map(c=>`<option value="${c.id}" ${jcFilterCustomer===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div><label for="jcFilterRespSel">${esc(tt.f_responsible)}</label><select id="jcFilterRespSel" onchange="jcFilterResp=this.value;renderApp();"><option value="all" ${jcFilterResp==='all'?'selected':''}>${esc(tt.filt_allresp)}</option>${OWNER_OPTIONS.map(o=>`<option value="${esc(o)}" ${jcFilterResp===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>
      <div><label for="jcFilterWorkerSel">${esc(tt.f_worker)}</label><select id="jcFilterWorkerSel" onchange="jcFilterWorker=this.value;renderApp();"><option value="all" ${jcFilterWorker==='all'?'selected':''}>${esc(tt.filt_allworkers)}</option>${allWorkersList().map(w=>`<option value="${esc(w)}" ${jcFilterWorker===w?'selected':''}>${esc(w)}</option>`).join('')}</select></div>
      <div><label for="jcFilterMachineSel">${esc(tt.f_machine)}</label><select id="jcFilterMachineSel" onchange="jcFilterMachine=this.value;renderApp();"><option value="all" ${jcFilterMachine==='all'?'selected':''}>${esc(tt.filt_allmachines)}</option>${allMachinesList().map(m=>`<option value="${esc(m)}" ${jcFilterMachine===m?'selected':''}>${esc(m)}</option>`).join('')}</select></div>
      <div><label for="jcFilterMaterialSel">${esc(tt.f_material)}</label><select id="jcFilterMaterialSel" onchange="jcFilterMaterial=this.value;renderApp();"><option value="all" ${jcFilterMaterial==='all'?'selected':''}>${esc(tt.filt_allmaterial)}</option>${['not-checked','available','partial','reserved','issued','shortage','substitute'].map(m=>`<option value="${m}" ${jcFilterMaterial===m?'selected':''}>${esc(tt['ms_'+m.replace('-','')])}</option>`).join('')}</select></div>
      <div><label for="jcFilterInspectionSel">${esc(tt.f_inspection)}</label><select id="jcFilterInspectionSel" onchange="jcFilterInspection=this.value;renderApp();"><option value="all" ${jcFilterInspection==='all'?'selected':''}>${esc(tt.filt_allinspection)}</option><option value="pending" ${jcFilterInspection==='pending'?'selected':''}>${esc(tt.is_pending)}</option><option value="failed" ${jcFilterInspection==='failed'?'selected':''}>${esc(tt.is_rejected)}</option><option value="clear" ${jcFilterInspection==='clear'?'selected':''}>${esc(tt.is_passed)}</option></select></div>
    </div></div>
    ${renderJcTable(rows)}
  </div>`;
}
function clearJcFilters(){jcQuery='';jcFilterStatus='all';jcFilterProject='all';jcFilterCustomer='all';jcFilterResp='all';jcFilterWorker='all';jcFilterMachine='all';jcFilterPriority='all';jcFilterMaterial='all';jcFilterInspection='all';renderApp();}
function attachList(){const s=$('jcSearch');if(s)s.addEventListener('input',e=>{jcQuery=e.target.value;renderApp();});}

// ═══════════════ JOBCARD DETAIL ═══════════════
function openJcDetail(id){selectedJcId=id;detailTab='info';VIEW='detail';renderApp();window.scrollTo({top:0,behavior:'auto'});}
function setDetailTab(tabName){detailTab=tabName;renderApp();}

function renderDetail(){
  const tt=t();const j=getJC(selectedJcId);
  if(!j)return `<div class="empty3">${esc(tt.empty_select)}</div>`;
  const locked=isLocked(j);
  const heldGate=jcQualityGate(j);const held=heldGate.blocked;
  const stagesShown=MAIN_STAGES.map(s=>({k:s,lbl:tt['st_'+s]}));
  const curMainIdx=MAIN_STAGES.indexOf(j.status);
  const onSideBranch=SIDE_STATUSES.includes(j.status);
  const stepsHtml=stagesShown.map((s,i)=>{
    let cls='';
    if(!onSideBranch&&s.k===j.status)cls='current';
    else if(curMainIdx>=0&&i<curMainIdx)cls='done';
    else if(onSideBranch&&i<=MAIN_STAGES.indexOf(j._resumeStatus||'draft'))cls='done';
    const stepBlocked=held&&JOBCARD_UNSAFE_STATUSES.includes(s.k);
    return `<button class="step ${cls}" ${stepBlocked?'disabled title="'+esc(tt.qh_title)+'"':''} onclick="requestStatusChange(${j.id},'${s.k}')"><span class="sdot">${cls==='done'?'✓':i+1}</span><span class="slabel">${esc(s.lbl)}</span></button>${i<stagesShown.length-1?'<span class="stepline"></span>':''}`;

function saveOpForm(jcId,opId){
  const tt=t();clearAllFieldErrors();const j=getJC(jcId);
  const desc=$('opDesc').value.trim();
  if(!desc){showFieldError('opDesc','opDescErr',tt.err_required);return;}
  const plannedHours=Number($('opPlannedHours').value)||0,loggedHours=Number($('opLoggedHours').value)||0;
  if(!isNonNegNumber(plannedHours)||!isNonNegNumber(loggedHours)){toast(tt.err_negative,'error');return;}
  const opMachineVal=$('opMachine').value;
  let equipmentId=null,machine='';
  if(opMachineVal.indexOf('legacy:')===0){machine=opMachineVal.slice('legacy:'.length);}
  else if(opMachineVal){const linked=(j.machines||[]).find(m=>m.equipmentId===opMachineVal);equipmentId=opMachineVal;machine=linked?linked.name:'';}
  const payload={desc,instructions:$('opInstr').value.trim(),worker:$('opWorker').value,machine,equipmentId,
    status:$('opStatus').value,plannedHours,loggedHours,plannedStart:$('opPlannedStart').value||null,
    dependency:$('opDependency').value?Number($('opDependency').value):null,inspectionCheckpoint:$('opInspection').checked,notes:$('opNotes').value.trim()};
  if(opId){
    const res=WorkshopData.updateJobcardOperation(jcId,opId,payload);
    if(handleQualityBlocked(res)){refreshShared();return;}
    // Starting (payload.status:'in-progress' on a pending/paused operation) is always refused here —
    // see setOpStatus()/the Start/Resume buttons for the one authoritative route. Any other rejection
    // (should not normally be reachable from this form) also stops here instead of silently
    // recording a misleading "updated" activity entry.
    if(res&&res.error){toast(translateEquipmentBlockCode(res),'error');refreshShared();return;}
    WorkshopData.recordJobcardActivity(jcId,{action:`Operation updated: ${desc}`});
  }
  else{
    const added=WorkshopData.addJobcardOperation(jcId,Object.assign({no:(j.operations||[]).length+1,actualStart:null,actualCompletion:null,attachments:''},payload));
    if(added&&added.error){toast(added.error,'error');refreshShared();return;}
    WorkshopData.recordJobcardActivity(jcId,{action:`Operation added: ${desc}`});
  }
  refreshShared();closeModal();renderApp();
}
function duplicateOp(jcId,opId){
  const j=getJC(jcId);if(isLocked(j))return;const op=j.operations.find(o=>o.id===opId);if(!op)return;
  const copy=Object.assign({},op,{status:'pending',loggedHours:0,actualStart:null,actualCompletion:null});delete copy.id;
  const added=WorkshopData.addJobcardOperation(jcId,copy);
  if(added&&added.error){toast(translateEquipmentBlockCode(added),'error');refreshShared();return;}
  refreshShared();const jj=getJC(jcId);const idx=jj.operations.findIndex(o=>o.id===op.id);const newIdx=jj.operations.findIndex(o=>o.id===added.id);
  if(newIdx>-1&&idx>-1){
    const arr=jj.operations;const [item]=arr.splice(newIdx,1);arr.splice(idx+1,0,item);
    const res=WorkshopData.updateJobcard(jcId,{operations:arr});
    if(res&&res.error){toast(translateEquipmentBlockCode(res),'error');refreshShared();return;}
  }
  WorkshopData.recordJobcardActivity(jcId,{action:`Operation duplicated: ${op.desc}`});
  refreshShared();renderApp();
}
function deleteOp(jcId,opId){
  const tt=t();const j=getJC(jcId);const op=j.operations.find(o=>o.id===opId);if(!op)return;
  // An in-progress operation must be paused before it can be deleted — the button is disabled for
  // this case, but WorkshopData enforces it centrally regardless (never rely on the UI control alone).
  if(op.status==='in-progress'){toast(tt.op_delete_pausefirst,'error');return;}
  if(!confirm(tpl(tt.confirm_delete_op,{n:op.desc})))return;
  const arr=j.operations.filter(o=>o.id!==opId);
  const res=WorkshopData.updateJobcard(jcId,{operations:arr});
  if(res&&res.error){toast(translateEquipmentBlockCode(res),'error');refreshShared();return;}
  WorkshopData.recordJobcardActivity(jcId,{action:`Operation removed: ${op.desc}`});
  refreshShared();renderApp();
}
function moveOp(jcId,opId,dir){
  const j=getJC(jcId);const arr=j.operations.slice();const idx=arr.findIndex(o=>o.id===opId);
  // Pass 3.27 bug hunt: idx===-1 (the operation this button was rendered for no longer exists -
  // removed by a concurrent edit elsewhere) must fail closed, not silently overwrite a real entry
  // at arr[to] with arr[-1]===undefined.
  if(idx===-1)return;
  const to=idx+dir;
  if(to<0||to>=arr.length)return;const tmp=arr[idx];arr[idx]=arr[to];arr[to]=tmp;
  const res=WorkshopData.updateJobcard(jcId,{operations:arr});
  if(res&&res.error){toast(translateEquipmentBlockCode(res),'error');refreshShared();return;}
  refreshShared();renderApp();
}

// an equipment-assignment-conflict result) into a user-facing message. This is display-only — the
// actual decision always comes from WorkshopData, called fresh, right before the mutation; this
// function never decides anything itself.
function translateEquipmentBlockCode(res,context){
  const tt=t();
  switch(res&&res.code){
    case 'EQUIPMENT_NOT_LINKED':
    case 'EQUIPMENT_MISSING':
      return tt.mc_unlinked_start_blocked;
    case 'EQUIPMENT_UNASSIGNED':
      return tt.mc_notassignedhere;
    case 'EQUIPMENT_ASSIGNED_ELSEWHERE':
    case 'EQUIPMENT_ASSIGNMENT_CONFLICT':
      return tpl(tt.mc_assignedelsewhere,{jc:res.assignedJobcard||'—'})+' '+tt.mc_returnorreassign;
    case 'EQUIPMENT_SAFETY_BLOCKED':
      return tpl(tt.mc_blocked_toast,{reasons:(res.reasons||[]).join('; ')});
    case 'OPERATION_EQUIPMENT_CHANGE_REQUIRES_PAUSE':
      return tt.mc_pausetoedit;
    case 'OPERATION_ACTIVE_DELETE_REQUIRES_PAUSE':
      return tt.op_delete_pausefirst;
    case 'ACTIVE_OPERATION_EQUIPMENT_UNLINK_REQUIRES_PAUSE':
      return tt.mc_pausetoremove;
    default:
      return (res&&res.error)||(context==='usage'?tt.mc_usageblocked:tt.mc_startblocked);
  }
}
// Starting or resuming an operation ('in-progress') has exactly ONE authoritative route:
// WorkshopData.startJobcardOperation() — it re-checks the Quality Hold gate and, when the operation
// references equipment, that the equipment is explicitly linked to THIS Jobcard by equipmentId AND
// currently assigned to exactly this Jobcard, then the central canUseEquipment() safety gate. All of
// that always reads WorkshopData's live state, never this page's cached SHARED snapshot, so it is
// correct even if the equipment's assignment changed a moment ago elsewhere in the app. Every other
// transition (pause, complete, skip) is unaffected and keeps going through updateJobcardOperation().
function setOpStatus(jcId,opId,status){
  const j=getJC(jcId);const op=j.operations.find(o=>o.id===opId);if(!op)return;
  if(status==='in-progress'){
    const res=WorkshopData.startJobcardOperation(jcId,opId,{date:todayISO()});
    if(!res)return;
    if(res.error){
      if(!handleQualityBlocked(res))toast(translateEquipmentBlockCode(res),'error');
      refreshShared();renderApp();
      return;
    }
    WorkshopData.recordJobcardActivity(jcId,{action:`Operation started: ${op.desc}`});
    refreshShared();renderApp();
    return;
  }
  const res=WorkshopData.updateJobcardOperation(jcId,opId,{status});
  if(handleQualityBlocked(res)){refreshShared();renderApp();return;}
  WorkshopData.recordJobcardActivity(jcId,{action:`Operation ${status}: ${op.desc}`});
  refreshShared();renderApp();
}
function opMissingFields(op,tt){
  const missing=[];
  if(isBlank(op.worker))missing.push(tt.op_worker);
  if(!isPositiveNumber(Number(op.loggedHours)))missing.push(tt.op_loggedhours);
  return missing;
}
function attemptCompleteOp(jcId,opId){
  const tt=t();const j=getJC(jcId);const op=j.operations.find(o=>o.id===opId);if(!op)return;
  if(!canCompleteOp(op)){
    const missing=opMissingFields(op,tt);
    toast(tt.err_required+': '+missing.join(', '),'error');
    return;
  }
  const res=WorkshopData.updateJobcardOperation(jcId,opId,{status:'completed',actualCompletion:todayISO()});
  if(handleQualityBlocked(res)){refreshShared();renderApp();return;}
  WorkshopData.recordJobcardActivity(jcId,{action:`Operation completed: ${op.desc}`});
  refreshShared();renderApp();
}

function commitMatOp(jcId,idx,kind){
  const tt=t();clearAllFieldErrors();const j=getJC(jcId);const m=j.materials[idx];if(!m)return;
  const qty=Number($('matOpQty').value);
  if(!isPositiveNumber(qty)){showFieldError('matOpQty','matOpErr',tt.err_qty);return;}
  if(!m.code){toast(tt.err_required,'error');return;}
  let result;
  if(kind==='reserve')result=WorkshopData.reserveItem({code:m.code,projectNo:j.projectNo,qty,jobcard:j.no,user:j.responsible||'Aleksandar C.'});
  else if(kind==='issue')result=WorkshopData.issue({code:m.code,projectNo:j.projectNo,qty,jobcard:j.no,user:j.responsible||'Aleksandar C.'});
  else if(kind==='return')result=WorkshopData.move({action:'RETURN',code:m.code,qty,projectNo:j.projectNo,jobcard:j.no,user:j.responsible||'Aleksandar C.'});
  else if(kind==='scrap')result=WorkshopData.move({action:'SCRAP',code:m.code,qty,projectNo:j.projectNo,jobcard:j.no,user:j.responsible||'Aleksandar C.'});
  if(result&&result.error){toast(result.error,'error');return;}
  if(kind==='reserve')m.reserved=(Number(m.reserved)||0)+(result.reserved||qty);
  if(kind==='issue'){m.issued=(Number(m.issued)||0)+qty;m.reserved=Math.max(0,(Number(m.reserved)||0)-qty);}
  if(kind==='return')m.issued=Math.max(0,(Number(m.issued)||0)-qty);
  const remaining=Math.max(0,(Number(m.required)||0)-(Number(m.issued)||0));
  m.status=m.issued>=m.required&&m.required>0?'issued':(m.reserved>0||m.issued>0?'partial':m.status);
  WorkshopData.updateJobcard(jcId,{materials:j.materials});
  WorkshopData.recordJobcardActivity(jcId,{action:`Material ${kind}: ${qty} ${m.unit||''} ${m.description}`});
  refreshShared();closeModal();renderApp();
  toast(`${tt['m_'+(kind==='reserve'?'reservemat':kind==='issue'?'issuemat':kind==='return'?'returnmat':'scrapmat')]}: ${qty} ${m.unit||''}`,'ok');
}

// When real equipment is selected: JobcardEquipmentRules.resolveLogTimeEquipment() re-reads the
// equipment record fresh from WorkshopData (never the page's cached SHARED snapshot) and requires it
// to be CURRENTLY assigned to exactly this Jobcard before even attempting anything — a stale local
// machine link must never let this Jobcard log usage against equipment another Jobcard now holds
// (the Hours module's saveHours() reuses the same helper for the same reason). Only then preflight
// with canUseEquipment(), then
// record equipment usage through WorkshopData.logEquipmentUsage() BEFORE labour hours — if the
// equipment safety gate (or the same fresh assignment check, defensively re-applied server-side)
// rejects it, labour hours are never logged either. No equipment selected simply logs labour hours.
function saveLogTime(jcId){
  const tt=t();clearAllFieldErrors();const hours=Number($('logHours').value);
  if(!isPositiveNumber(hours)){showFieldError('logHours','logErr',tt.err_hours);return;}
  const date=$('logDate').value;if(isBlank(date)){showFieldError('logDate','logErr',tt.err_date);return;}
  const j=getJC(jcId);const opId=Number($('logOp').value);const op=(j.operations||[]).find(o=>o.id===opId);
  const worker=$('logWorker').value,equipmentId=$('logMachine').value,notes=$('logNotes').value.trim();
  let linkedMachine=null;
  if(equipmentId){
    const resolved=resolveLogTimeEquipment(j.machines,equipmentId,WorkshopData.getEquipment(),j.no);
    if(!resolved.ok){
      toast(translateEquipmentBlockCode(resolved,'usage'),'error');
      return;
    }
    linkedMachine=resolved.machine;
    const use=WorkshopData.canUseEquipment(equipmentId,{date,projectNo:j.projectNo,jobcardNo:j.no});
    if(!use.allowed){toast(tpl(tt.mc_blocked_toast,{reasons:((use.gate&&use.gate.reasons)||[]).join('; ')}),'error');return;}
    const usageRes=WorkshopData.logEquipmentUsage(equipmentId,{hours,date,worker,project:j.projectNo,jobcard:j.no,notes});
    if(usageRes&&usageRes.error){toast(translateEquipmentBlockCode(usageRes,'usage'),'error');return;}
  }
  const result=WorkshopData.logHours({project:j.projectNo,jobcard:j.no,item:op?op.desc:j.title,operation:op?op.desc:'',worker,hours,date,notes,equipment:linkedMachine?[{equipmentId,name:linkedMachine.name,hours}]:[]});
  if(result&&result.error){toast(result.error,'error');return;}
  if(op){WorkshopData.updateJobcardOperation(jcId,opId,{loggedHours:(Number(op.loggedHours)||0)+hours});}
  WorkshopData.recordJobcardActivity(jcId,{action:`${hours}h logged by ${worker}${op?' on '+op.desc:''}${equipmentId?' using '+equipmentId:''}`});
  refreshShared();closeModal();renderApp();
}

function addMachineToJobcard(jcId,equipmentId){
  const tt=t();clearAllFieldErrors();const j=getJC(jcId);const eq=SHARED.equipment.find(e=>e.equipmentId===equipmentId);
  if(!eq){toast(tt.err_required,'error');return;}

  const decision=canAddEquipmentToJobcard(eq,j.machines||[],j.no,gate);
  if(!decision.allowed){

// Remove / return equipment. returnEquipment() is only called when this Jobcard is the equipment's
// CURRENT assignment — never clearing an assignment that belongs to a different Jobcard. Blocked
// equipment can always be physically returned (a safe-direction action); it never becomes Available
// through this path (see workshop-data.js's returnEquipment()).
function removeMachine(jcId,idx){
  const tt=t();const j=getJC(jcId);const m=(j.machines||[])[idx];if(!m)return;
  // Equipment powering an in-progress operation must be paused first — the button is disabled for
  // this case, but WorkshopData enforces it centrally regardless (never rely on the UI control alone).
  const usedByActiveOp=!!(m.equipmentId&&(j.operations||[]).some(op=>op&&op.status==='in-progress'&&op.equipmentId===m.equipmentId));
  if(usedByActiveOp){toast(tt.mc_pausetoremove,'error');return;}
  if(!confirm(tpl(tt.confirm_removemachine,{n:m.name||m.equipmentId||''})))return;
  if(m.equipmentId){
    const eq=SHARED.equipment.find(e=>e.equipmentId===m.equipmentId);
    if(canReturnEquipmentFromJobcard(eq,j.no)){
      const res=WorkshopData.returnEquipment(m.equipmentId,{user:j.responsible||'Aleksandar C.',note:`Returned from ${j.no}`});
      if(res&&res.error){toast(res.error,'error');return;}
    }
  }
  const machines=(j.machines||[]).filter((x,i)=>i!==idx);
  const res=WorkshopData.updateJobcard(jcId,{machines});
  if(res&&res.error){toast(translateEquipmentBlockCode(res),'error');refreshShared();return;}
  WorkshopData.recordJobcardActivity(jcId,{action:`Equipment removed: ${m.name||m.equipmentId||''}`});
  refreshShared();renderApp();
}

// ═══════════════ STATUS WORKFLOW ═══════════════
// Frontend enforcement only — the future backend must repeat every one of these checks server-side.
function requestStatusChange(id,stage){
  // Note: no blanket isLocked() guard here. isLocked() gates ordinary editing (job info, operations,
  // materials, etc.) but the status engine's own ALLOWED_TRANSITIONS map is what must decide whether a
  // transition is possible — that's what still lets a Completed jobcard move on to Closed.
  const tt=t();const j=getJC(id);if(!j||j.status===stage)return;
  const allowed=ALLOWED_TRANSITIONS[j.status]||[];
  if(!allowed.includes(stage)){toast(tpl(tt.transition_blocked,{a:tt['st_'+j.status],b:tt['st_'+stage]}),'error');return;}
  if(stage==='released'&&!hasAtLeastOneOperation(j)){toast(tt.issue_no_operations,'error');return;}
  if(stage==='ready'){
    if(isBlank(j.responsible)){toast(tt.issue_no_responsible,'error');return;}
    if(materialsShort(j))toast(tt.issue_material_short,'error');
  }
  if(stage==='completed'){openCompleteCheck(id);return;}
  if(!confirm(tpl(tt.confirm_status,{s:tt['st_'+stage]})))return;
  applyStatusChange(id,stage);
}
function applyStatusChange(id,stage,extra){
  const tt=t();const j=getJC(id);const patch=Object.assign({status:stage},extra||{});
  if(stage==='in-progress'&&!j.actualStart)patch.actualStart=todayISO();
  const res=WorkshopData.updateJobcard(id,patch);
  if(handleQualityBlocked(res)){refreshShared();renderApp();return;}
  WorkshopData.recordJobcardActivity(id,{action:`Status changed to ${tt['st_'+stage]}`});
  refreshShared();renderApp();
}
function openCompleteCheck(id){
  const tt=t();const j=getJC(id);
  const issues=[];
  const gate=jcQualityGate(j);
  if(gate.blocked)gate.holds.forEach(h=>issues.push(tpl(tt.qh_blocked_toast,{holds:h.no})));
  if(!requiredOperationsComplete(j)){const n=(j.operations||[]).filter(o=>o.status!=='completed'&&o.status!=='skipped').length;issues.push(tpl(tt.issue_operations_open,{n}));}
  const pend=pendingInspections(j).length;if(pend)issues.push(tpl(tt.issue_inspections_pending,{n:pend}));
  const failed=failedInspections(j).length;if(failed)issues.push(tpl(tt.issue_inspections_failed,{n:failed}));
  if(!issues.length){if(!confirm(tpl(tt.confirm_status,{s:tt.st_completed})))return;applyStatusChange(id,'completed',{actualCompletion:todayISO()});return;}
  $('fcard').className='fcard';
  $('fcard').innerHTML=`<h2>${esc(tt.complete_issues_title)}</h2><p class="fsub">${esc(j.no)}</p>
    <ul class="issuelist">${issues.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
    <div class="fbtns"><button class="tbtn primary" onclick="closeModal()">${esc(tt.complete_goback)}</button></div>`;
  $('fov').classList.add('show');
}

    priority:$('fbPriority').value,responsible:proj.responsible||'Aleksandar C.',workers:[],plannedStart:$('fbStart').value||todayISO(),
    plannedCompletion:proj.expectedCompletion||proj.deadline||null,actualStart:null,actualCompletion:null,plannedHours:0,progress:0,status:'draft',
    materialReadiness:(line.issued>=line.required&&line.required>0)?'issued':'not-checked',inspectionRequired:true,
    deliveryTarget:proj.expectedCompletion||proj.deadline||null,created:todayISO(),createdBy:'Aleksandar C.',archived:false,
    materials:[{code:line.code,description:line.description,spec:inv?inv.grade:'',grade:inv?inv.grade:'',dimension:inv?inv.dimensions:'',required:line.required,reserved:line.reserved||0,issued:line.issued||0,unit:line.unit,location:inv?inv.location:'',heat:inv?inv.heat:'',certificate:inv?inv.certificate:null,status:'not-checked'}],
    machines:[],operations:[],inspections:[],notes:[],documents:[]});
  WorkshopData.recordJobcardActivity(created.id,{action:`Jobcard created from BOM item ${line.code} on ${proj.no}`});
  refreshShared();closeModal();openJcDetail(created.id);
}

// Duplicate: deep-cloned commercial/operational content, a brand-new id and number (assigned by
// WorkshopData.upsertJobcard), reset status/dates/progress/hours/history. The original is never touched.
function duplicateJc(id){
  const tt=t();const src=getJC(id);if(!src)return;
  const copy=JSON.parse(JSON.stringify(src));
  delete copy.id;delete copy.no;delete copy._resumeStatus;
  copy.status='draft';copy.progress=0;copy.actualStart=null;copy.actualCompletion=null;copy.archived=false;
  copy.created=todayISO();copy.createdBy='Aleksandar C.';
  copy.operations=(copy.operations||[]).map(o=>Object.assign({},o,{status:'pending',loggedHours:0,actualStart:null,actualCompletion:null,equipmentId:null}));
  copy.materials=(copy.materials||[]).map(m=>Object.assign({},m,{reserved:0,issued:0,status:'not-checked'}));
  // Real equipment assignment is a live, single-Jobcard relationship (WorkshopData.assignEquipment)
  // — it is never silently duplicated onto a new draft Jobcard. Equipment must be explicitly
  // re-added through the Machines & Equipment tab, going through the real safety gate again.
  copy.machines=[];
  copy.inspections=(copy.inspections||[]).map(i=>Object.assign({},i,{status:'pending',result:'pending',date:null,comments:''}));
  copy.notes=[];copy.documents=(src.documents||[]).slice();
  copy.activity=[];
  const created=WorkshopData.upsertJobcard(copy);
  WorkshopData.recordJobcardActivity(created.id,{action:`Duplicated from ${src.no}`});
  refreshShared();document.querySelectorAll('.moremenu.open').forEach(m=>m.classList.remove('open'));
  toast(tpl('{a} → {b}',{a:src.no,b:created.no}),'ok');
  openJcDetail(created.id);
}
