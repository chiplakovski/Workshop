    ov_projects:"Proekti",ov_quoted:"Vkupno ponudeno",ov_open:"Otvoreni",ov_realized:"Realizirano (završeno + zatvoreno)",
    d_contact:"Kontakt lice",d_email:"E-pošta",d_org:"EMBS",
    proj_th_no:"Proekt br.",proj_th_name:"Ime na proekt",proj_th_status:"Status",proj_th_quoted:"Ponudena vrednost",proj_th_deadline:"Rok",proj_empty:"Sè uште nema proekti za ovoj klient.",
    nc_title:"Nov klient",nc_name:"Ime na klient",nc_org:"EMBS",nc_contact:"Kontakt lice",nc_email:"E-pošta",nc_save:"Dodaj klient",nc_cancel:"Otkaži",
    st_draft:"Nacrt",st_quotation:"Ponuda",st_approved:"Odobreno",st_planned:"Planirano",st_active:"Aktivno",st_hold:"Pauzirano",st_completed:"Završeno",st_closed:"Zatvoreno",st_cancelled:"Otkažano",st_none:"—",
    locale:"mk"}
};

let LANG="en",VIEW="list",currentId=null,activeTab="overview",query="";

function custProjects(id){return PROJECTS.filter(p=>p.customerId===id);}
function custStats(id){const ps=custProjects(id);
  const quoted=ps.reduce((a,b)=>a+b.quotedValue,0);
  const open=ps.filter(p=>OPEN_STATUSES.includes(p.status)).length;
  const realized=ps.filter(p=>p.status==='completed'||p.status==='closed').reduce((a,b)=>a+b.quotedValue,0);
  const latest=ps[ps.length-1];
  return{count:ps.length,quoted,open,realized,latestStatus:latest?latest.status:null};}
function statusBadge(s){const t=T[LANG];if(!s)return `<span class="sbadge draft">${t.st_none}</span>`;return `<span class="sbadge ${s}">${t["st_"+s]}</span>`;}

function renderList(){
  const t=T[LANG];
  const kQuoted=CUSTOMERS.reduce((a,c)=>a+custStats(c.id).quoted,0);
  const kOpen=PROJECTS.filter(p=>OPEN_STATUSES.includes(p.status)).length;
  const kHold=CUSTOMERS.filter(c=>custProjects(c.id).some(p=>p.status==='hold')).length;

  const q=query.trim().toLowerCase();
  const rows=CUSTOMERS.filter(c=>!q||c.name.toLowerCase().includes(q)||c.org.toLowerCase().includes(q)||c.contact.toLowerCase().includes(q))
    .sort((a,b)=>custStats(b.id).quoted-custStats(a.id).quoted);

  const trs=rows.map(c=>{const s=custStats(c.id);
    return `<tr class="prow2" onclick="openCustomer(${c.id})">
      <td><div class="pname">${c.name}</div></td>
      <td class="pnum">${c.org}</td>
      <td><div>${c.contact}</div><div class="pcust2">${c.email}</div></td>
      <td class="rnum">${s.count}</td>
      <td class="rnum">${fmt(s.quoted)}</td>
      <td>${statusBadge(s.latestStatus)}</td>
    </tr>`;}).join("");

  $("listView").innerHTML=`
    <div class="kpistrip">
      <div class="kpi"><div class="kl">${t.kpi_customers}</div><div class="kv">${CUSTOMERS.length}</div></div>
      <div class="kpi"><div class="kl">${t.kpi_quoted}</div><div class="kv">${fmt(kQuoted)}</div></div>
      <div class="kpi"><div class="kl">${t.kpi_open}</div><div class="kv">${kOpen}</div></div>
      <div class="kpi"><div class="kl">${t.kpi_hold}</div><div class="kv ${kHold?'warn':''}">${kHold}</div></div>
    </div>
    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="search" type="text" placeholder="${t.searchph}" value="${query.replace(/"/g,'&quot;')}"></div>
      <button class="tbtn primary" onclick="openNewCustomer()">${t.newcust}</button>
    </div>
    <div class="ptable-wrap"><table class="ptable"><thead><tr>
      <th>${t.th_name}</th><th>${t.th_org}</th><th>${t.th_contact}</th><th>${t.th_projects}</th><th>${t.th_quoted}</th><th>${t.th_status}</th>
    </tr></thead><tbody>${trs||`<tr><td colspan="6" class="empty2">${t.empty}</td></tr>`}</tbody></table></div>`;
  $("search").addEventListener('input',e=>{query=e.target.value;renderList();});
}

function openCustomer(id){currentId=id;VIEW="detail";activeTab="overview";render();}

function renderDetail(){
  const t=T[LANG];const c=CUSTOMERS.find(x=>x.id===currentId);if(!c)return;
  const s=custStats(c.id);
  $("detailView").innerHTML=`
    <div class="dhead">
      <div><h2>${c.name}</h2><span class="pnum">${t.d_org}: ${c.org}</span></div>
    </div>
    <div class="ovgrid">
      <div class="ovcard"><h4><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H3z"/><path d="M3 7V5a2 2 0 0 1 2-2h4l2 2"/></svg>${t.ov_projects}</h4><div class="ovbig">${s.count}</div></div>
      <div class="ovcard"><h4><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>${t.ov_quoted}</h4><div class="ovbig">${fmt(s.quoted)}</div></div>
      <div class="ovcard"><h4><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${t.ov_open}</h4><div class="ovbig ${s.open?'warn':''}">${s.open}</div></div>
      <div class="ovcard"><h4><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>${t.ov_realized}</h4><div class="ovbig">${fmt(s.realized)}</div></div>
    </div>
    <div class="ptabs">
      <button data-tab="overview" class="${activeTab==='overview'?'on':''}">${t.tab_overview}</button>
      <button data-tab="projects" class="${activeTab==='projects'?'on':''}">${t.tab_projects}</button>
    </div>
    <div class="tabpanel" id="tabpanel"></div>`;
  document.querySelectorAll('.ptabs button').forEach(b=>b.addEventListener('click',()=>{activeTab=b.getAttribute('data-tab');renderDetail();}));
  renderTab(c);
}

function renderTab(c){
  const t=T[LANG];
  if(activeTab==='projects'){
    const ps=custProjects(c.id);
    const rows=ps.map(p=>`<tr class="prow2" onclick="location.href='projects-desktop.html'">
      <td class="pnum">${p.no}</td><td class="pname">${p.name}</td><td>${statusBadge(p.status)}</td>
      <td class="rnum">${fmt(p.quotedValue)}</td><td class="rnum">${fmtD(p.deadline)}</td></tr>`).join("");
    $("tabpanel").innerHTML=`<div class="card2"><div class="tabhead"><h3>${t.tab_projects}</h3></div>
      <div class="ptable-wrap"><table class="ptable"><thead><tr><th>${t.proj_th_no}</th><th>${t.proj_th_name}</th><th>${t.proj_th_status}</th><th>${t.proj_th_quoted}</th><th>${t.proj_th_deadline}</th></tr></thead>
      <tbody>${rows||`<tr><td colspan="5" class="empty2">${t.proj_empty}</td></tr>`}</tbody></table></div></div>`;
  }else{
    $("tabpanel").innerHTML=`<div class="card2"><div class="tabhead"><h3>${t.tab_overview}</h3></div>
      <div class="dfacts" style="margin-bottom:0;">
        <div class="df"><div class="k">${t.d_org}</div><div class="v">${c.org}</div></div>
        <div class="df"><div class="k">${t.d_contact}</div><div class="v">${c.contact}</div></div>
        <div class="df"><div class="k">${t.d_email}</div><div class="v">${c.email}</div></div>
      </div></div>`;
  }
}

function openNewCustomer(){
  const t=T[LANG];
  $("fcard").innerHTML=`<h2>${t.nc_title}</h2><p class="fsub">${t.csub}</p>
    <div class="frow"><label>${t.nc_name}</label><input id="ncName"></div>
    <div class="frow"><label>${t.nc_org}</label><input id="ncOrg" placeholder="XXXXXX-XXXX"></div>
    <div class="frow"><label>${t.nc_contact}</label><input id="ncContact"></div>
    <div class="frow"><label>${t.nc_email}</label><input id="ncEmail" type="email"></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${t.nc_cancel}</button><button class="tbtn primary" onclick="saveNewCustomer()">${t.nc_save}</button></div>`;
  $("fov").classList.add("show");
}
function closeModal(){$("fov").classList.remove("show");}
function saveNewCustomer(){
  const name=$("ncName").value.trim();if(!name)return;
  CUSTOMERS.push({id:nextCustId++,name,org:$("ncOrg").value.trim()||"—",contact:$("ncContact").value.trim()||"—",email:$("ncEmail").value.trim()||"—"});
  closeModal();renderList();
}
$("fov").addEventListener('click',e=>{if(e.target===$("fov"))closeModal();});

function render(){
  const t=T[LANG];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i');if(t[k]!==undefined)el.textContent=t[k];});
  if(VIEW==="list"){
    $("listView").style.display="";$("detailView").style.display="none";
    $("backLbl").textContent=t.back_hub;$("backBtn").onclick=()=>{location.href="hub-desktop.html";};
    renderList();
  }else{
    $("listView").style.display="none";$("detailView").style.display="";
    $("backLbl").textContent=t.back_list;$("backBtn").onclick=()=>{VIEW="list";render();};
    renderDetail();
  }
}

function setLang(code){LANG=code;
  document.documentElement.lang=code==="mk"?"mk-Latn":code;
  document.querySelectorAll('.langmenu button').forEach(b=>b.classList.toggle('active',b.getAttribute('data-lang')===code));
  const _c=$("langcur");if(_c)_c.textContent=code.toUpperCase();
  render();tick();
}
document.querySelectorAll('.langmenu button').forEach(b=>b.addEventListener('click',()=>{setLang(b.getAttribute('data-lang'));$("langc").classList.remove('open');}));
function tick(){const n=new Date();$("time").textContent=n.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
  try{$("date").textContent=n.toLocaleDateString(T[LANG].locale,{weekday:'short',day:'numeric',month:'short'});}catch(e){$("date").textContent=n.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}}
setLang("en");setInterval(tick,10000);

const box=$("embers");const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!reduce){for(let i=0;i<16;i++){const e=document.createElement('div');e.className='ember';e.style.left=Math.random()*100+'%';e.style.setProperty('--drift',(Math.random()*80-40)+'px');const dur=7+Math.random()*9;e.style.animationDuration=dur+'s';e.style.animationDelay=(-Math.random()*dur)+'s';const s=1+Math.random()*2;e.style.width=s+'px';e.style.height=s+'px';box.appendChild(e);}}
(function(){var lc=$("langc"),lt=$("langtoggle");if(lt){lt.addEventListener('click',function(e){e.stopPropagation();lc.classList.toggle('open');});document.addEventListener('click',function(e){if(!lc.contains(e.target))lc.classList.remove('open');});}})();
</script>
</body></html>
