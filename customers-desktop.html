<!DOCTYPE html><html lang="en" class="ws-shell-root"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="workshop-radio.css">
<link rel="stylesheet" href="workshop-desktop-shell.css">
<title>Varmak — Customers</title><style>
  :root{--navy-950:#04101f;--navy-900:#071a33;--navy-800:#0a2447;--navy-brand:#013179;
    --steel-400:#8ea3c0;--steel-300:#b9c6da;--spark:#4a90ff;--ice:#e8f0fb;
    --line:rgba(142,163,192,0.16);--field:rgba(255,255,255,0.045);--field-line:rgba(185,198,218,0.24);
    --ok:#4ad48a;--warn:#ffb057;--danger:#ff6b6b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ice);min-height:100vh;}
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--navy-950);}
  .bg::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 82% 0%,rgba(1,49,121,0.5),transparent 55%),radial-gradient(80% 60% at 10% 100%,rgba(10,36,71,0.6),transparent 60%),linear-gradient(160deg,var(--navy-950),var(--navy-900) 60%,var(--navy-950));}
  .grid{position:absolute;inset:0;opacity:0.28;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);}
  .glow{position:absolute;left:50%;top:22%;width:560px;height:560px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(74,144,255,0.16),transparent 62%);filter:blur(8px);animation:pulse 6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
  .ember{position:absolute;bottom:-10px;border-radius:50%;background:var(--spark);box-shadow:0 0 6px 1px rgba(74,144,255,.8);animation:rise linear infinite;opacity:0;}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-105vh) translateX(var(--drift));opacity:0}}
  @media (prefers-reduced-motion:reduce){.glow,.ember{animation:none}}

  .topfull{position:relative;z-index:2;width:100%;padding:22px 40px 0;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;}
  .brand .logo{font-family:'Sora';font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .brand .logo .dot{width:6px;height:6px;background:var(--spark);box-shadow:0 0 9px 1px rgba(74,144,255,.9);}
  .brand .meta{font-size:11px;color:var(--steel-400);margin-top:2px;line-height:1.5;}
  .topright{display:flex;flex-direction:column;align-items:flex-end;gap:9px;}
  .clock{text-align:right;font-variant-numeric:tabular-nums;} .clock .time{font-family:'Sora';font-weight:600;font-size:16px;} .clock .date{font-size:11px;color:var(--steel-400);}
  .who{display:flex;align-items:center;gap:8px;}
  .who .badge{display:flex;align-items:center;gap:7px;padding:5px 10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;}
  .who .badge .av{width:20px;height:20px;background:linear-gradient(135deg,#2c6bd6,#0a2447);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:'Sora';}
  .who .role{color:var(--spark);font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
  .who .out{background:transparent;border:1px solid var(--field-line);color:var(--steel-300);padding:6px 10px;font-size:12px;cursor:pointer;font-family:'Inter';transition:.15s;}
  .who .out:hover{border-color:var(--spark);color:var(--ice);}

  .wrap{position:relative;z-index:2;max-width:1560px;margin:0 auto;padding:26px 36px 40px;}
  .modhead{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .back{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--field-line);color:var(--steel-300);font-family:'Inter';font-size:12.5px;padding:9px 13px;cursor:pointer;transition:.15s;}
  .back:hover{border-color:var(--spark);color:var(--ice);}
  .modhead .ttl{display:flex;align-items:center;gap:11px;}
  .modhead .ic{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(74,144,255,.14);box-shadow:inset 0 0 0 1px rgba(74,144,255,.35);}
  .modhead h1{font-family:'Sora';font-weight:600;font-size:22px;letter-spacing:-.01em;} .modhead p{font-size:12px;color:var(--steel-400);}

  .tbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--field-line);background:transparent;color:var(--steel-300);font-family:'Sora';font-weight:600;font-size:12.5px;padding:9px 13px;cursor:pointer;transition:.16s;white-space:nowrap;}
  .tbtn:hover{border-color:var(--spark);color:var(--ice);}
  .tbtn.primary{background:linear-gradient(180deg,#2c6bd6,#013179);border:none;color:#fff;}
  .tbtn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(44,107,214,.5);}
  .tbtn.small{padding:6px 10px;font-size:11.5px;}
  .tbtn.linklike{border:none;background:none;color:var(--spark);padding:0;font-size:11.5px;}
  .tbtn.linklike:hover{color:var(--ice);}

  .crmgrid{display:grid;grid-template-columns:328px 1fr 340px;gap:18px;align-items:start;}
  @media(max-width:1300px){.crmgrid{grid-template-columns:1fr;}}
  .col{display:flex;flex-direction:column;gap:18px;}
  .panel{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:18px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .panel .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}
  .panel .phead h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--spark);font-weight:700;}

  .search{position:relative;flex:1;}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--steel-400);}
  .search input{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:'Inter';font-size:13px;padding:9px 10px 9px 32px;outline:none;}
  .search input:focus{border-color:var(--spark);}
  .listtoolbar{display:flex;gap:8px;margin-bottom:12px;}

  .segtabs{display:flex;gap:6px;margin-bottom:12px;}
  .segtabs button{flex:1;background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);font-family:'Inter';font-size:11px;padding:7px 6px;cursor:pointer;transition:.15s;}
  .segtabs button.on{background:rgba(74,144,255,.16);border-color:rgba(74,144,255,.5);color:#cfe0ff;}

  .custlist{display:flex;flex-direction:column;gap:4px;max-height:420px;overflow-y:auto;margin:-4px;padding:4px;}
  .custrow{display:flex;align-items:center;gap:10px;padding:9px;border:1px solid transparent;cursor:pointer;transition:.14s;}
  .custrow:hover{background:rgba(255,255,255,.03);}
  .custrow.sel{background:rgba(74,144,255,.12);border-color:rgba(74,144,255,.45);}
  .avc{flex:none;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2c6bd6,#0a2447);display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:600;font-size:11.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
  .avc.big{width:64px;height:64px;border-radius:10px;font-size:19px;}
  .crname{font-size:13px;font-weight:600;} .crcity{font-size:11px;color:var(--steel-400);}
  .statusdot{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;white-space:nowrap;flex:none;margin-left:auto;}
  .statusdot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .statusdot.active{color:var(--ok);} .statusdot.inactive{color:var(--warn);}

  .pager{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:11px;color:var(--steel-400);}
  .pager .pnav{display:flex;gap:5px;}
  .pager button{background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);width:24px;height:24px;cursor:pointer;font-size:11px;}
  .pager button.cur{background:rgba(74,144,255,.18);border-color:rgba(74,144,255,.5);color:#cfe0ff;}
  .pager button:disabled{opacity:.35;cursor:not-allowed;}

  .sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;}
  .sumgrid .sl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);margin-bottom:5px;}
  .sumgrid .sv{font-family:'Sora';font-size:19px;font-weight:600;} .sumgrid .sv.ok{color:var(--ok);}

  .dhead2{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px;}
  .dhead2 .idn{display:flex;gap:14px;align-items:flex-start;}
  .dhead2 h2{font-family:'Sora';font-weight:600;font-size:21px;margin-bottom:5px;}
  .cstatus{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;}
  .cstatus::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
  .cstatus.active{color:var(--ok);} .cstatus.inactive{color:var(--warn);}

  .factcols{display:flex;gap:40px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .ifacts{display:flex;flex-direction:column;gap:9px;}
  .ifact{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--steel-300);}
  .ifact svg{flex:none;width:14px;height:14px;color:var(--steel-400);}
  .ifact a{color:var(--spark);text-decoration:none;} .ifact a:hover{text-decoration:underline;}
  .kvcols{display:flex;gap:30px;flex-wrap:wrap;}
  .kv .k{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);margin-bottom:3px;}
  .kv .v{font-size:13.5px;font-weight:600;} .kv{margin-bottom:12px;}

  .ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;}
  .ptabs button{background:transparent;border:none;color:var(--steel-400);font-family:'Sora';font-weight:600;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;padding:11px 14px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:.15s;}
  .ptabs button:hover{color:var(--ice);}
  .ptabs button.on{color:#cfe0ff;border-bottom-color:var(--spark);}
  .tabpanel{min-height:160px;}

  .addrgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
  .addrcard{background:rgba(255,255,255,.025);border:1px solid var(--line);padding:15px;}
  .addrcard h4{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--spark);margin-bottom:9px;}
  .addrcard div.al{font-size:13px;color:var(--steel-300);line-height:1.6;}
  @media(max-width:700px){.addrgrid{grid-template-columns:1fr;}}

  .infolist{background:rgba(255,255,255,.025);border:1px solid var(--line);padding:4px 15px;}
  .irow{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .irow:last-child{border-bottom:none;}
  .irow .ik{color:var(--steel-400);flex:none;} .irow .iv{text-align:right;font-weight:500;}

  .stbl{width:100%;border-collapse:collapse;font-size:12.5px;}
  .stbl th{text-align:left;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap;}
  .stbl td{padding:10px;border-bottom:1px solid var(--line);}
  .stbl tr:last-child td{border-bottom:none;}
  .stbl tr.click{cursor:pointer;} .stbl tr.click:hover{background:rgba(74,144,255,.06);}
  .rnum{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .pnum2{font-family:'Sora';font-weight:600;color:var(--steel-300);font-size:12px;}
  .empty3{text-align:center;color:var(--steel-400);padding:26px;font-size:12.5px;}

  .tagpill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;font-weight:600;white-space:nowrap;border:1px solid;}
  .tagpill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;}
  .tagpill.g{color:var(--ok);border-color:rgba(74,212,138,.4);background:rgba(74,212,138,.1);}
  .tagpill.b{color:#cfe0ff;border-color:rgba(74,144,255,.4);background:rgba(74,144,255,.12);}
  .tagpill.w{color:var(--warn);border-color:rgba(255,176,87,.4);background:rgba(255,176,87,.1);}
  .tagpill.r{color:var(--danger);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.1);}
  .tagpill.n{color:var(--steel-400);border-color:var(--line);background:rgba(142,163,192,.08);}
  .statusword{font-size:11.5px;font-weight:600;white-space:nowrap;}
  .statusword.g{color:var(--ok);} .statusword.b{color:var(--spark);} .statusword.w{color:var(--warn);}

  .ccard{border:1px solid var(--line);padding:12px;margin-bottom:10px;position:relative;}
  .ccard:last-child{margin-bottom:0;}
  .crow1{display:flex;align-items:flex-start;gap:10px;}
  .ccard .primary-badge{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--spark);border:1px solid rgba(74,144,255,.4);background:rgba(74,144,255,.12);padding:2px 7px;margin-left:7px;}
  .ccard .crole{font-size:11.5px;color:var(--steel-400);margin:3px 0 6px;}
  .ccard .cmeta{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--steel-300);}
  .ccard .cmeta a{color:inherit;text-decoration:none;} .ccard .cmeta a:hover{color:var(--ice);}
  .ciconbtns{display:flex;gap:6px;margin-left:auto;flex:none;}
  .ciconbtns a{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid var(--field-line);color:var(--steel-300);text-decoration:none;transition:.15s;}
  .ciconbtns a:hover{border-color:var(--spark);color:var(--ice);}

  .projrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .projrow:last-child{border-bottom:none;}
  .projrow .pn{display:flex;flex-direction:column;} .projrow .pn b{font-weight:600;}

  .notecard{font-size:12.5px;color:var(--steel-300);line-height:1.55;}
  .notecard .nd{color:var(--steel-400);font-size:11px;margin-bottom:4px;}
  .notecard .na{color:var(--steel-400);font-size:11px;margin-top:6px;}

  .docrow2{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .docrow2:last-child{border-bottom:none;}
  .dicon{flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:8.5px;color:#fff;}
  .dicon.pdf{background:#c0392b;} .dicon.doc{background:#2c6bd6;} .dicon.xls{background:#1f9d55;}
  .docrow2 .dn{flex:1;font-weight:500;} .docrow2 .dd{color:var(--steel-400);font-size:11px;white-space:nowrap;}
  .docrow2 a{color:var(--steel-400);display:flex;} .docrow2 a:hover{color:var(--ice);}

  .actionbar{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-top:22px;}
  .actionbar button{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--field-line);color:var(--steel-300);font-family:'Sora';font-weight:600;font-size:11.5px;padding:16px 8px;cursor:pointer;transition:.16s;}
  .actionbar button:hover{border-color:var(--spark);color:var(--ice);background:rgba(74,144,255,.07);transform:translateY(-2px);}
  .actionbar button svg{width:19px;height:19px;color:var(--spark);}
  @media(max-width:1300px){.actionbar{grid-template-columns:repeat(4,1fr);}}
  @media(max-width:640px){.actionbar{grid-template-columns:repeat(2,1fr);}}

  .fov{position:fixed;inset:0;z-index:90;background:rgba(2,8,15,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;}
  .fov.show{display:flex;}
  .fcard{background:rgba(9,23,45,.98);border:1px solid var(--line);width:480px;max-width:100%;padding:30px 34px;box-shadow:0 30px 80px rgba(0,0,0,.55);}
  .fcard h2{font-family:'Sora';font-weight:600;font-size:18px;margin-bottom:6px;}
  .fcard .fsub{font-size:12px;color:var(--steel-400);margin-bottom:20px;}
  .fcard .frow{margin-bottom:14px;} .fcard .frow2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .fcard label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:6px;}
  .fcard input,.fcard select,.fcard textarea{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:'Inter';font-size:13.5px;padding:9px 11px;outline:none;}
  .fcard input:focus,.fcard select:focus{border-color:var(--spark);}
  .fcard textarea{min-height:60px;resize:vertical;}
  .fcard .fbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

  .langc{position:fixed;z-index:30;left:18px;bottom:16px;font-family:'Inter';}
  .langtoggle{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(7,26,51,.8);border:1px solid rgba(142,163,192,0.16);color:var(--steel-300);font-size:12px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:.15s;}
  .langtoggle:hover{color:var(--ice);border-color:rgba(185,198,218,0.35);} .langtoggle .globe{width:14px;height:14px;color:var(--steel-400);} .langtoggle .cur{font-weight:600;letter-spacing:.08em;} .langtoggle .chev{width:12px;height:12px;color:var(--steel-400);transition:transform .18s;}
  .langc.open .langtoggle .chev{transform:rotate(180deg);}
  .langmenu{position:absolute;left:0;bottom:calc(100% + 6px);min-width:158px;background:rgba(7,26,51,.96);border:1px solid rgba(142,163,192,0.18);box-shadow:0 14px 34px rgba(0,0,0,.45);opacity:0;visibility:hidden;transform:translateY(6px);transition:.16s;}
  .langc.open .langmenu{opacity:1;visibility:visible;transform:translateY(0);}

let LANG="en",selectedId=2,activeTab="overview",query="",filterStatus="all";
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

function getCust(id){return CUSTOMERS.find(c=>c.id===id);}
// "New Quote" pushed into c.quotes (a page-local array) and syncCustomer()'s explicit field
// whitelist never included quotes, so a new quote was invisible outside this session - purely lost
// on reload. hydrateSharedCustomers() above already proves the right shape (it derives a hydrated
// customer's initial c.quotes from live WorkshopData.listEstimations(), mapped to
// {no,date,value,status}) - this re-derives the SAME thing live on every render, same pattern as
// Suppliers' supplierOrderRows()/supplierDocRows() (Pass 3.7/3.8). Draft estimations are excluded:
// this tab is the customer-facing "quotes sent to them" view, and a draft has not been sent yet
// (it also has no qs_draft translation, since it was never meant to reach a customer's eyes here).
// Matched by NAME, not c.sharedId: sharedId is only set in-memory for the current session (either
// by hydrateSharedCustomers() at load, or by syncCustomer() the first time this customer is
// written to) and is never itself persisted - a customer whose name already exists in this page's
// own hardcoded demo list never gets hydrated with one at all. Matching by e.customer===c.name
// (exactly how upsertEstimation() and this page's own syncCustomer()/upsertCustomer() already
// resolve identity) is what actually survives a reload.
function customerQuoteRows(c){
  const live=(window.WorkshopData?WorkshopData.listEstimations():[]).filter(e=>e.customer===c.name&&e.status!=='draft');
  const liveNos=new Set(live.map(e=>e.no));
  return live.map(e=>({no:e.no,date:e.created,value:e.sellingPrice,status:e.status}))
    .concat((c.quotes||[]).filter(q=>!liveNos.has(q.no)));
}
// The customer Documents panel had the same split-brain problem already fixed for Suppliers:
// it rendered only c.documents and saveUpload() wrote only that nested customer field, so the
// dedicated Documents module never saw uploads made here (and documents linked to a customer in
// that module never appeared here). Read the shared collection live, while retaining the older
// nested records as a deduplicated legacy fallback so existing demonstration data is not lost.
function customerDocumentRows(c){
  const live=(window.WorkshopData?WorkshopData.getDocuments():[]).filter(d=>d.module==='Customers'&&d.record===c.name);
  const liveNames=new Set(live.map(d=>String(d.name).trim().toLowerCase()));
  const iconType=name=>{const ext=String(name).split('.').pop().toLowerCase();return ext==='pdf'?'pdf':(ext==='xlsx'||ext==='xls')?'xls':'doc'};
  return live.map(d=>({name:d.name,type:iconType(d.name),date:(d.updated||'').slice(0,10)}))
    .concat((c.documents||[]).filter(d=>!liveNames.has(String(d.name).trim().toLowerCase())));
}
// Invoices now have their own shared collection. Preserve the page's original demonstration rows
// as a fallback, but all new invoices are real customer-linked records visible to Reports.
function customerInvoiceRows(c){
  const live=(window.WorkshopData?WorkshopData.listInvoices():[]).filter(i=>!i.archived&&(i.customerId===c.sharedId||i.customer===c.name));
  const liveNos=new Set(live.map(i=>i.no));
  return live.concat((c.invoices||[]).filter(i=>!liveNos.has(i.no))).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
}
function syncCustomer(c){if(!window.WorkshopData||!c)return;const rec=WorkshopData.upsertCustomer({id:c.sharedId,name:c.name,status:c.status,city:c.city,country:c.country,org:c.org,vat:c.vat,email:c.email,phone:c.phone,website:c.website,since:c.since,terms:c.terms,credit:c.credit,currency:c.currency,industry:c.industry,type:c.ctype,preferred:c.preferred,priceList:c.pricelist,deliveryTerms:c.deliveryTerms||"—",discountAgreement:c.discountAgreement||"—",billing:c.billing,shipping:c.shipping||c.billing,contacts:c.contacts,notes:c.notes,documents:c.documents});if(rec){c.sharedId=rec.id;c.sharedNo=rec.no;}}
function custProjects(id){return PROJECTS.filter(p=>p.customerId===id);}
function custStats(id){const ps=custProjects(id);
  const open=ps.filter(p=>OPEN_STATUSES.includes(p.status)).length;
  const realized=ps.filter(p=>p.status==='completed'||p.status==='closed').reduce((a,b)=>a+b.quotedValue,0);
  return{count:ps.length,open,realized};}
function statusBadge(s){const t=T[LANG];return `<span class="tagpill ${STATUS_CLASS[s]||'n'}">${t["st_"+s]||s}</span>`;}
function fmtD(d){return d||"—";}

        <div><div class="sl">${t.sum_progress}</div><div class="sv">${kProgress}</div></div>
        <div><div class="sl">${t.sum_revenue}</div><div class="sv">${fmt(kRevenue)}</div></div>

async function saveUpload(id){
  const name=$("udName").value.trim();if(!name)return;
  const c=getCust(id),file=$("udFile").files[0];
  if(file&&file.size>WorkshopData.maxDocumentFileBytes){$("udError").textContent=`File is too large (maximum ${Math.round(WorkshopData.maxDocumentFileBytes/1024)} KB)`;return;}
  let fileData='';if(file)fileData=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)}).catch(()=>null);
  if(file&&fileData===null){$("udError").textContent='The selected file could not be read.';return;}
  const saved=WorkshopData.upsertDocument({name,type:'Document',module:'Customers',record:c.name,category:'Customer Documents',status:'Valid',expiry:'',revision:'1',author:'Aleksandar C.',fileName:file?file.name:'',mimeType:file?file.type:'',fileSize:file?file.size:0,fileData:fileData||''});
  if(saved.error){$("udError").textContent=saved.error;return;}
  closeModal();renderAll();
}

// Was pushing into c.quotes (a page-local array never read back by WorkshopData.upsertCustomer's
// explicit field whitelist in syncCustomer()) - a new quote looked saved but vanished on reload.
// WorkshopData.upsertEstimation() is the real backing function (same one estimations-desktop.html
// itself uses); customerQuoteRows() above now derives the display live from it, so this only needs
// to create the real record. 'sent' is a genuine Estimation status (matches the status this form
// already claimed, unchanged) - this quote was just created and handed to the customer, not saved
// as an internal draft.
function saveNewQuote(id){
  const value=parseFloat($("nqValue").value)||0;
  const desc=$("nqDesc").value.trim();
  const c=getCust(id);
  if(!c.sharedId)syncCustomer(c);
  WorkshopData.upsertEstimation({customerId:c.sharedId,customer:c.name,title:desc||`Quote for ${c.name}`,status:'sent',sellingPrice:value,totalCost:value,currency:'SEK',created:new Date().toISOString().slice(0,10)});
  closeModal();activeTab='quotes';renderAll();
}
