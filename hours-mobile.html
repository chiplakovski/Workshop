<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><title>Varmak — Hours (Mobile)</title><style>
  :root{--navy-950:#04101f;--navy-900:#071a33;--navy-800:#0a2447;--navy-brand:#013179;
    --steel-400:#8ea3c0;--steel-300:#b9c6da;--spark:#4a90ff;--ice:#e8f0fb;
    --line:rgba(142,163,192,0.16);--field:rgba(255,255,255,0.045);--field-line:rgba(185,198,218,0.24);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ice);}
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--navy-950);}
  .bg::before{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 70% at 82% 0%,rgba(1,49,121,0.5),transparent 55%),

  .grid{position:absolute;inset:0;opacity:0.28;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:60px 60px;-webkit-mask-image:radial-gradient(circle at 60% 8%,#000 20%,transparent 80%);mask-image:radial-gradient(circle at 60% 8%,#000 20%,transparent 80%);}
  .glow{position:absolute;left:50%;top:38%;width:460px;height:460px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(74,144,255,0.2),transparent 62%);filter:blur(8px);animation:pulse 6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
  .ember{position:absolute;bottom:-10px;border-radius:50%;background:var(--spark);box-shadow:0 0 6px 1px rgba(74,144,255,.8);animation:rise linear infinite;opacity:0;}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-105vh) translateX(var(--drift));opacity:0}}
  @media (prefers-reduced-motion:reduce){.glow,.ember{animation:none}}

  .brand .logo{font-family:'Sora';font-weight:700;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .brand .logo .dot{width:6px;height:6px;background:var(--spark);box-shadow:0 0 9px 1px rgba(74,144,255,.9);}
  .brand .meta{font-size:11px;color:var(--steel-400);margin-top:2px;}
  .clock{text-align:right;font-variant-numeric:tabular-nums;}
  .clock .time{font-family:'Sora';font-weight:600;}
  .clock .date{font-size:11px;color:var(--steel-400);}

  .modhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);}
  .modleft{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

  .back:hover{border-color:var(--spark);color:var(--ice);}
  .modhead .title{display:flex;align-items:center;gap:10px;}
  .modhead .title .ic{background:rgba(74,144,255,.14);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(74,144,255,.35);}
  .modhead .title h1{font-family:'Sora';font-weight:600;letter-spacing:-.01em;}
  .modhead .title p{font-size:11px;color:var(--steel-400);}
  .who{display:flex;align-items:center;gap:8px;}

  .who .badge .av{width:20px;height:20px;background:linear-gradient(135deg,#2c6bd6,#0a2447);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:'Sora';}
  .who .out{background:transparent;border:1px solid var(--field-line);color:var(--steel-300);padding:6px 10px;font-size:12px;cursor:pointer;font-family:'Inter';transition:.15s;}
  .who .out:hover{border-color:var(--spark);color:var(--ice);}

  .card{background:rgba(255,255,255,.035);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 16px 50px rgba(0,0,0,.35);}
  label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:6px;font-weight:500;}
  .fld{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:'Inter';font-size:14px;padding:10px 12px;outline:none;transition:.15s;}
  .fld:focus{border-color:var(--spark);box-shadow:0 0 0 3px rgba(74,144,255,.16);}
  select.fld{appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="%238ea3c0" stroke-width="2"><path d="M5 8l5 5 5-5"/></svg>');background-repeat:no-repeat;background-position:right 10px center;padding-right:36px;}
  textarea.fld{resize:vertical;line-height:1.45;}
  .itemhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .itemhead label{margin-bottom:0;}
  .est{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;background:rgba(74,144,255,.12);border:1px solid rgba(74,144,255,.35);font-size:11px;color:#cfe0ff;}
  .est b{font-family:'Sora';font-weight:600;}
  .est.warn{background:rgba(255,138,74,.12);border-color:rgba(255,138,74,.4);color:#ffd0b0;}
  .eqrow{display:grid;grid-template-columns:1fr 96px 38px;gap:8px;margin-bottom:8px;}

  .eqrow .eqdel:hover{border-color:#ff6b6b;color:#ff9d9d;}
  .addeq{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px dashed var(--field-line);color:var(--steel-300);font-family:'Inter';font-size:12.5px;padding:9px 12px;cursor:pointer;transition:.15s;}
  .addeq:hover{border-color:var(--spark);color:var(--ice);}
  .actions{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);font-size:12.5px;cursor:pointer;font-family:'Inter';transition:.15s;user-select:none;}
  .chip:hover{color:var(--ice);border-color:rgba(185,198,218,.4);}
  .chip.on{background:rgba(74,144,255,.16);border-color:rgba(74,144,255,.5);color:#cfe0ff;}
  .save{display:flex;gap:10px;}
  .save button{font-family:'Sora';font-weight:600;font-size:14px;padding:13px;cursor:pointer;transition:.18s;border:none;}
  .btn-primary{flex:1;background:linear-gradient(180deg,#2c6bd6,#013179);color:#fff;box-shadow:0 8px 24px rgba(1,49,121,.5);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(44,107,214,.5);}
  .btn-ghost{background:transparent;border:1px solid var(--field-line)!important;color:var(--steel-300);padding:13px 16px;}
  .btn-ghost:hover{border-color:var(--spark)!important;color:var(--ice);}
  body{min-height:100vh;background:#02080f;display:flex;align-items:flex-start;justify-content:center;padding:24px 0 90px;}
  .bg{background:#02080f;}
  .phone{position:relative;z-index:2;width:390px;max-width:100vw;min-height:800px;background:transparent;
    border:10px solid #0c1626;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;}
  .phone .inbg{position:absolute;inset:0;z-index:0;overflow:hidden;}
  .phone .inbg::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 80% 0%,rgba(1,49,121,.5),transparent 55%),linear-gradient(160deg,var(--navy-950),var(--navy-900) 60%,var(--navy-950));}
  .phone .grid{position:absolute;inset:0;opacity:.24;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(circle at 60% 6%,#000 15%,transparent 78%);mask-image:radial-gradient(circle at 60% 6%,#000 15%,transparent 78%);}
  .phone .glow{position:absolute;left:50%;top:30%;width:320px;height:320px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(74,144,255,.2),transparent 62%);filter:blur(8px);animation:pulse 6s ease-in-out infinite;}
  .scr{position:relative;z-index:2;padding:16px 15px 72px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
  .brand .logo{font-size:14px;} .clock{text-align:right;} .clock .time{font-size:14px;} .clock .date{font-size:10px;}
  .brand .meta{font-size:10px;}
  .modhead{margin-bottom:14px;padding-bottom:11px;flex-wrap:wrap;gap:10px;}
  .modhead .title .ic{width:30px;height:30px;} .modhead .title h1{font-size:17px;} .modhead .title p{font-size:10px;}
  .who .badge{padding:4px 8px;font-size:11px;} .who .out{padding:5px 9px;font-size:11px;}
  .card{padding:15px;margin-top:80px;}
  .row{margin-bottom:11px;}
  .grid-hd{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  textarea.fld{min-height:84px;}
  .actions{gap:7px;} .chip{flex:1;justify-content:center;padding:10px 8px;font-size:12px;}
  .save{margin-top:100px;}
  
  /* compact collapsible language switcher */
  .langc{position:absolute;z-index:60;left:18px;bottom:16px;font-family:'Inter';}
  .langtoggle{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(7,26,51,.8);border:1px solid rgba(142,163,192,0.16);color:var(--steel-300);font-size:12px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:.15s;}
  .langtoggle:hover{color:var(--ice);border-color:rgba(185,198,218,0.35);}
  .langtoggle .globe{width:14px;height:14px;color:var(--steel-400);}
  .langtoggle .cur{font-weight:600;letter-spacing:.08em;}
  .langtoggle .chev{width:12px;height:12px;color:var(--steel-400);transition:transform .18s;}
  .langc.open .langtoggle .chev{transform:rotate(180deg);}
  .langmenu{position:absolute;left:0;bottom:calc(100% + 6px);min-width:158px;background:rgba(7,26,51,.96);border:1px solid rgba(142,163,192,0.18);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 14px 34px rgba(0,0,0,.45);opacity:0;visibility:hidden;transform:translateY(6px);transition:.16s;}
  .langc.open .langmenu{opacity:1;visibility:visible;transform:translateY(0);}
  .langmenu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--steel-300);font-family:'Inter';font-size:13px;padding:11px 14px;cursor:pointer;transition:.13s;}
  .langmenu button:hover{background:rgba(74,144,255,.12);color:var(--ice);}
  .langmenu button.active{color:#cfe0ff;box-shadow:inset 2px 0 0 var(--spark);}

</style></head><body>
<div class="bg"></div>
<div class="phone">
  <div class="inbg"><div class="grid"></div><div class="glow"></div><div id="embers"></div></div>

    </div>
  </div>
  


<div class="langc" id="langc">

  // Project/Item/Equipment are real, live WorkshopData records — never a page-local fake list — and

  const T={
    sv:{back_hub:"Nav",modtitle:"Timmar",modsub:"Registrera tid & material",logout:"Logga ut",project:"Välj projekt",item:"Välj artikel",est:"Est.",hours:"Ange timmar",date:"Datum",notes:"Anteckningar",notesph:"Vad gjordes…",intcost:"Utrustning",hrs:"Tim",addeq:"Lägg till utrustning",eqph:"— välj —",matlabel:"Material",addmat:"Lägg till material",matph:"Materialnamn…",qty:"Antal",addpics:"Lägg till bilder",explain:"Mer info",teamtalk:"Dela i team-flödet",savebtn:"Spara post",savenew:"Spara & ny",locale:"sv-SE",

    en:{back_hub:"Hub",modtitle:"Hours",modsub:"Log time & materials",logout:"Log out",project:"Select Project",item:"Select Item",est:"Est.",hours:"Enter Hours",date:"Date",notes:"Notes",notesph:"What was done…",intcost:"Equipment used",hrs:"Hrs",addeq:"Add equipment",eqph:"— select —",matlabel:"Material used",addmat:"Add material",matph:"Material name…",qty:"Qty",addpics:"Add pics",explain:"More detail",teamtalk:"Share to team feed",savebtn:"Save entry",savenew:"Save & new",locale:"en-GB",
      wholejobcard:"(whole jobcard)",noitems:"No jobcards found for this project",noeqlinked:"No equipment linked to this jobcard yet",
      err_select:"Select a project and item, then enter hours greater than zero.",err_jobcard_missing:"This jobcard no longer exists — refresh and try again.",

  let current="en";
  function setLang(code){current=code;const t=T[code];
    document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t[el.getAttribute('data-i')]);
    document.querySelectorAll('[data-i-ph]').forEach(el=>el.placeholder=t[el.getAttribute('data-i-ph')]);
    document.documentElement.lang=code==="mk"?"mk-Latn":code;var _c=document.getElementById('langcur');if(_c)_c.textContent=code.toUpperCase();
    document.querySelectorAll('.langmenu button').forEach(b=>b.classList.toggle('active',b.getAttribute('data-lang')===code));
    refreshEqLang();tick();}
  document.querySelectorAll('.langmenu button').forEach(b=>b.addEventListener('click',()=>{setLang(b.getAttribute('data-lang'));var l=document.getElementById('langc');if(l)l.classList.remove('open');}));
  const proj=document.getElementById('project'),item=document.getElementById('item');
  (WorkshopData.listProjects()||[]).forEach(p=>{const o=document.createElement('option');o.value=p.no;o.textContent=`${p.no} — ${p.name}`;proj.appendChild(o);});
  // Item = a real Jobcard operation (falls back to "(whole jobcard)" when the jobcard has none),
  // grouped by jobcard — mirrors jobcard-desktop.html's own opOpts/machineOpts construction. Never
  // the old page-local fake {n,est} list.
  function loadItems(){
    const t=T[current];item.innerHTML='';
    const jobcards=(WorkshopData.listJobcards()||[]).filter(j=>j.projectNo===proj.value&&!j.archived&&!['completed','closed','cancelled'].includes(j.status));
    if(!proj.value||!jobcards.length){
      const ph=document.createElement('option');ph.value='';ph.textContent=proj.value?t.noitems:'—';item.appendChild(ph);
      updateEst();refreshEquipRows();return;
    }
    jobcards.forEach(j=>{
      const grp=document.createElement('optgroup');grp.label=`${j.no} — ${j.title||''}`;
      const ops=(j.operations&&j.operations.length)?j.operations:[null];
      ops.forEach(op=>{
        const o=document.createElement('option');
        o.dataset.jobcard=j.no;o.dataset.op=op?String(op.id):'';o.dataset.est=op?op.plannedHours:'';o.dataset.desc=op?op.desc:(j.title||j.no);
        o.textContent=op?op.desc:`${j.no} — ${t.wholejobcard}`;
        grp.appendChild(o);
      });
      item.appendChild(grp);
    });
    updateEst();refreshEquipRows();
  }
  proj.addEventListener('change',loadItems);
  item.addEventListener('change',()=>{updateEst();refreshEquipRows();});document.getElementById('hours').addEventListener('input',updateEst);
  function updateEst(){const chip=document.getElementById('estChip'),val=document.getElementById('estVal');const sel=item.options[item.selectedIndex];
    if(sel&&sel.dataset.est){chip.style.display='inline-flex';val.textContent=sel.dataset.est+' h';const h=parseFloat(document.getElementById('hours').value||0);chip.classList.toggle('warn',h>parseFloat(sel.dataset.est));}else chip.style.display='none';}
  // Equipment rows may only offer equipment already linked to the SELECTED item's Jobcard (never
  // free text, never the whole shared catalog) — exactly jobcard-desktop.html's machineOpts rule.
  function selectedJobcard(){
    const sel=item.options[item.selectedIndex];const jcNo=sel&&sel.dataset?sel.dataset.jobcard:'';
    if(!jcNo)return null;
    return (WorkshopData.listJobcards()||[]).find(j=>j.no===jcNo)||null;
  }
  function populateEqSelect(sel){
    const t=T[current];const prev=sel.value;sel.innerHTML='';
    const jc=selectedJobcard();const linked=jc?(jc.machines||[]).filter(m=>m.equipmentId):[];
    const ph=document.createElement('option');ph.value='';ph.textContent=linked.length?t.eqph:t.noeqlinked;sel.appendChild(ph);
    linked.forEach(m=>{const o=document.createElement('option');o.value=m.equipmentId;o.textContent=`${m.equipmentId} — ${m.name}`;sel.appendChild(o);});
    if(linked.some(m=>m.equipmentId===prev))sel.value=prev;
  }
  function refreshEquipRows(){document.querySelectorAll('#equipList .eqsel').forEach(populateEqSelect);}
  const equipList=document.getElementById('equipList');
  function addEqRow(){const t=T[current];const row=document.createElement('div');row.className='eqrow';
    const sel=document.createElement('select');sel.className='fld eqsel';
    const hrs=document.createElement('input');hrs.className='fld eqhrs';hrs.type='number';hrs.step='0.25';hrs.min='0';hrs.placeholder=t.hrs;
    const del=document.createElement('button');del.type='button';del.className='eqdel';del.setAttribute('aria-label','Remove equipment');del.textContent='×';del.onclick=()=>row.remove();
    row.append(sel,hrs,del);equipList.appendChild(row);populateEqSelect(sel);}
  document.getElementById('addEq').addEventListener('click',addEqRow);
  const matList=document.getElementById('matList');
  function addMatRow(){const t=T[current];const row=document.createElement('div');row.className='eqrow';
    const name=document.createElement('input');name.className='fld matname';name.type='text';name.placeholder=t.matph;
    const qty=document.createElement('input');qty.className='fld matqty';qty.type='number';qty.step='0.1';qty.min='0';qty.placeholder=t.qty;
    const del=document.createElement('button');del.type='button';del.className='eqdel';del.setAttribute('aria-label','Remove material');del.textContent='×';del.onclick=()=>row.remove();
    row.append(name,qty,del);matList.appendChild(row);}
  document.getElementById('addMat').addEventListener('click',addMatRow);
  function refreshEqLang(){const t=T[current];refreshEquipRows();document.querySelectorAll('.eqhrs').forEach(h=>h.placeholder=t.hrs);
    document.querySelectorAll('.matname').forEach(n=>n.placeholder=t.matph);document.querySelectorAll('.matqty').forEach(q=>q.placeholder=t.qty);}
  function tick(){const n=new Date();document.getElementById('time').textContent=n.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
    try{document.getElementById('date').textContent=n.toLocaleDateString(T[current].locale,{weekday:'short',day:'numeric',month:'short'});}catch(e){document.getElementById('date').textContent=n.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}}
  document.getElementById('date2').valueAsDate=new Date();
  setLang("en");setInterval(tick,10000);addEqRow();addMatRow();
  function collectHours(){
    const sel=item.options[item.selectedIndex];
    return {
      project:proj.value,jobcard:sel&&sel.dataset?sel.dataset.jobcard||'':'',
      operationId:sel&&sel.dataset&&sel.dataset.op?Number(sel.dataset.op):null,
      item:sel&&sel.dataset?sel.dataset.desc||'':'',
      hours:document.getElementById('hours').value,date:document.getElementById('date2').value,notes:document.getElementById('notes').value,
      worker:document.getElementById('whoName').textContent,
      equipment:[...document.querySelectorAll('#equipList .eqrow')].map(row=>({equipmentId:row.querySelector('.eqsel')?.value,hours:row.querySelector('.eqhrs')?.value})).filter(x=>x.equipmentId||x.hours),
      materials:[...document.querySelectorAll('#matList .eqrow')].map(row=>({name:row.querySelector('.matname')?.value,qty:row.querySelector('.matqty')?.value})).filter(x=>x.name||x.qty)
    };
  }
  function tpl(str,vals){return String(str||'').replace(/\{(\w+)\}/g,(m,k)=>vals&&vals[k]!=null?vals[k]:'');}
  // Translates a blocked equipment result (from resolveLogTimeEquipment(), canUseEquipment()'s gate,
  // or logEquipmentUsage()'s returned error) into a user-facing message — display-only, mirrors
  // jobcard-desktop.html's translateEquipmentBlockCode(). Never decides anything itself.
  function equipBlockMessage(res){
    const t=T[current];
    switch(res&&res.code){
      case 'EQUIPMENT_NOT_LINKED':
      case 'EQUIPMENT_MISSING':
        return t.eq_missing;
      case 'EQUIPMENT_UNASSIGNED':
        return t.eq_unassigned;
      case 'EQUIPMENT_ASSIGNED_ELSEWHERE':
      case 'EQUIPMENT_ASSIGNMENT_CONFLICT':
        return tpl(t.eq_assignedelsewhere,{jc:res.assignedJobcard||'—'});
      case 'EQUIPMENT_SAFETY_BLOCKED':
        return tpl(t.eq_blocked,{reasons:(res.reasons||[]).join('; ')});
      default:
        return (res&&res.error)||t.eq_blocked;
    }
  }
  // Mirrors jobcard-desktop.html's saveLogTime(): validate every equipment row against the live,
  // authoritative Equipment Safety Gate BEFORE committing anything, then log equipment usage via
  // WorkshopData.logEquipmentUsage() BEFORE labour hours via logHours() — if any row is blocked,
  // neither equipment usage nor labour hours are recorded. No equipment rows simply logs labour hours.
  function saveHours(reset){
    const entry=collectHours();const hours=Number(entry.hours);
    if(!entry.project||!entry.jobcard||!Number.isFinite(hours)||hours<=0){alert(T[current].err_select);return false;}
    const jc=(WorkshopData.listJobcards()||[]).find(j=>j.no===entry.jobcard);
    if(!jc){alert(T[current].err_jobcard_missing);return false;}

    const toLog=[];
    for(const row of entry.equipment){
      if(!row.equipmentId)continue;
      const resolved=resolveLogTimeEquipment(jc.machines,row.equipmentId,WorkshopData.getEquipment(),jc.no);
      if(!resolved.ok){alert(equipBlockMessage(resolved));return false;}
      const use=WorkshopData.canUseEquipment(row.equipmentId,{date:entry.date,projectNo:jc.projectNo,jobcardNo:jc.no});
      if(!use.allowed){alert(equipBlockMessage({code:'EQUIPMENT_SAFETY_BLOCKED',reasons:(use.gate&&use.gate.reasons)||[]}));return false;}
      toLog.push({equipmentId:row.equipmentId,name:resolved.machine.name,hours:Number(row.hours)||hours});
    }

    for(const eqEntry of toLog){
      const usageRes=WorkshopData.logEquipmentUsage(eqEntry.equipmentId,{hours:eqEntry.hours,date:entry.date,worker:entry.worker,project:jc.projectNo,jobcard:jc.no,notes:entry.notes});
      if(usageRes&&usageRes.error){alert(equipBlockMessage(usageRes));return false;}
    }

    // Sets both `worker` (jobcard-desktop.html's own hours panel filters by this — SHARED.hours
    // matching h.jobcard/h.worker) and `user` (reports-desktop.html's Hours-by-user/by-worker tables
    // group by this) — logHours() itself only defaults `user`, never derives one from `worker`.
    const result=WorkshopData.logHours({project:jc.projectNo,jobcard:jc.no,item:entry.item,operation:entry.item,worker:entry.worker,user:entry.worker,hours,date:entry.date,notes:entry.notes,equipment:toLog,materials:entry.materials});
    if(result&&result.error){alert(result.error);return false;}

    if(entry.operationId!=null){
      const op=(jc.operations||[]).find(o=>o.id===entry.operationId);
      WorkshopData.updateJobcardOperation(jc.no,entry.operationId,{loggedHours:(Number(op&&op.loggedHours)||0)+hours});
    }
    WorkshopData.recordJobcardActivity(jc.no,{action:`${hours}h logged by ${entry.worker}${entry.item?' on '+entry.item:''}`});

    alert(T[current].savedok);
    if(reset){document.getElementById('hours').value='';document.getElementById('notes').value='';}
    return true;
  }
  document.getElementById('saveEntry').addEventListener('click',()=>saveHours(false));document.getElementById('saveNewEntry').addEventListener('click',()=>saveHours(true));
  document.getElementById('logoutBtn').addEventListener('click',()=>{location.href='login.html';});
  const picsChip=document.getElementById('picsChip'),picsInput=document.getElementById('picsInput');
  picsChip.addEventListener('click',()=>picsInput.click());
  picsInput.addEventListener('change',()=>{picsChip.classList.toggle('on',picsInput.files.length>0);});
  const box=document.getElementById('embers');const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!reduce){for(let i=0;i<18;i++){const e=document.createElement('div');e.className='ember';e.style.left=Math.random()*100+'%';e.style.setProperty('--drift',(Math.random()*80-40)+'px');const dur=7+Math.random()*9;e.style.animationDuration=dur+'s';e.style.animationDelay=(-Math.random()*dur)+'s';const s=1+Math.random()*2;e.style.width=s+'px';e.style.height=s+'px';box.appendChild(e);}}

  (function(){var lc=document.getElementById('langc'),lt=document.getElementById('langtoggle');
    if(lt){lt.addEventListener('click',function(e){e.stopPropagation();lc.classList.toggle('open');});
    document.addEventListener('click',function(e){if(!lc.contains(e.target))lc.classList.remove('open');});}})();
</script></body></html>
