  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);color:var(--ice);}
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--navy-950);}
  .bg::before{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 70% at 82% 0%,var(--bg-glow1),transparent 55%),
      radial-gradient(80% 60% at 10% 100%,var(--bg-glow2),transparent 60%),
      linear-gradient(160deg,var(--navy-950),var(--navy-900) 60%,var(--navy-950));}
  .grid{position:absolute;inset:0;opacity:0.28;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:60px 60px;-webkit-mask-image:radial-gradient(circle at 60% 8%,#000 20%,transparent 80%);mask-image:radial-gradient(circle at 60% 8%,#000 20%,transparent 80%);}
  .glow{position:absolute;left:50%;top:38%;width:460px;height:460px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(var(--c-accent-rgb),0.2),transparent 62%);filter:blur(8px);animation:pulse 6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
  .ember{position:absolute;bottom:-10px;border-radius:50%;background:var(--spark);box-shadow:0 0 6px 1px rgba(var(--c-accent-rgb),.8);animation:rise linear infinite;opacity:0;}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-105vh) translateX(var(--drift));opacity:0}}
  @media (prefers-reduced-motion:reduce){.glow,.ember{animation:none}}

  .brand .logo{font-family:var(--font-heading);font-weight:700;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .brand .logo .dot{width:6px;height:6px;background:var(--spark);box-shadow:0 0 9px 1px rgba(var(--c-accent-rgb),.9);}
  .brand .meta{font-size:11px;color:var(--steel-400);margin-top:2px;}
  .clock{text-align:right;font-variant-numeric:tabular-nums;}
  .clock .time{font-family:var(--font-heading);font-weight:600;}
  .clock .date{font-size:11px;color:var(--steel-400);}

  .modhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);}
  .modleft{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .back{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--field-line);color:var(--steel-300);font-family:var(--font-body);font-size:11px;padding:6px 10px;cursor:pointer;transition:.15s;}
  .back:hover{border-color:var(--spark);color:var(--ice);}
  .modhead .title{display:flex;align-items:center;gap:10px;}
  .modhead .title .ic{background:rgba(var(--c-accent-rgb),.14);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(var(--c-accent-rgb),.35);}
  .modhead .title h1{font-family:var(--font-heading);font-weight:600;letter-spacing:-.01em;}
  .modhead .title p{font-size:11px;color:var(--steel-400);}
  .who{display:flex;align-items:center;gap:8px;}
  .who .badge{display:flex;align-items:center;gap:7px;padding:5px 10px;background:var(--lift-05);border:1px solid var(--line);font-size:12px;}
  .who .badge .av{width:20px;height:20px;background:linear-gradient(135deg,var(--c-accent2),var(--c-panel2));display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;font-family:var(--font-heading);}
  .who .out{background:transparent;border:1px solid var(--field-line);color:var(--steel-300);padding:6px 10px;font-size:12px;cursor:pointer;font-family:var(--font-body);transition:.15s;}
  .who .out:hover{border-color:var(--spark);color:var(--ice);}

  .card{background:var(--lift-035);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 16px 50px var(--shade-35);}
  label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:6px;font-weight:500;}
  .fld{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:var(--font-body);font-size:13px;padding:10px 12px;outline:none;transition:.15s;}
  .fld:focus{border-color:var(--spark);box-shadow:0 0 0 3px rgba(var(--c-accent-rgb),.16);}

  /* Everything a hand presses is at least 48px. This screen is used standing up, in a workshop,
     often with a glove half off; a 34px target is a target you miss. */
  .fld,.chip,.addeq,.btn-primary,.btn-ghost{min-height:48px;}
  .fld{font-size:15px;}

  /* Jobs running now: the fast path. */
  .jobpicks{display:grid;gap:8px;}
  .jobpick{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;min-height:56px;
    padding:10px 13px;background:var(--field);border:1px solid var(--field-line);color:var(--ice);
    font-family:var(--font-body);text-align:left;cursor:pointer;transition:.15s;}
  .jobpick:hover{border-color:var(--spark);}
  .jobpick.on{border-color:var(--spark);background:rgba(var(--c-accent-rgb),.16);}
  .jobpick b{font-size:14px;font-weight:600;}
  .jobpick span{font-size:11.5px;color:var(--steel-400);}
  .jobpick.on span{color:var(--steel-300);}
  .jobnone{font-size:12.5px;color:var(--steel-400);padding:2px 1px;}

  /* Hours: the common answers as buttons, the field for everything else. */
  .quickhrs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:9px;}
  .qh{min-height:48px;background:var(--field);border:1px solid var(--field-line);color:var(--ice);
    font-family:var(--font-heading);font-weight:600;font-size:16px;cursor:pointer;transition:.15s;}
  .qh:hover{border-color:var(--spark);}
  .qh.on{background:rgba(var(--c-accent-rgb),.2);border-color:var(--spark);color:#fff;}
  .hrsline,.dateline{display:flex;gap:7px;align-items:stretch;}
  .hrsfld{text-align:center;font-family:var(--font-heading);font-size:19px;font-weight:600;}
  .step{min-width:56px;min-height:48px;background:var(--field);border:1px solid var(--field-line);
    color:var(--ice);font-size:22px;line-height:1;cursor:pointer;transition:.15s;}
  .step.wide{min-width:0;flex:0 0 auto;padding:0 14px;font-size:13px;font-family:var(--font-body);}
  .step:hover{border-color:var(--spark);}
  .dateline .fld{flex:1;}

  /* Logged today. Nothing here is styled as a figure the app computed - it is the worker's own
     entries read back, which is the only thing that makes a time sheet trustworthy. */
  .today{border-top:1px solid var(--field-line);padding-top:14px;margin-top:4px;}
  .todayrow{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;
    border-bottom:1px solid rgba(var(--c-line-rgb),.14);font-size:13px;}
  .todayrow:last-child{border-bottom:0;}
  .todayrow b{font-family:var(--font-heading);font-weight:600;white-space:nowrap;}
  .todayrow small{display:block;color:var(--steel-400);font-size:11px;margin-top:2px;}
  .todaysum{display:flex;justify-content:space-between;padding:11px 2px 0;font-size:13px;
    font-family:var(--font-heading);font-weight:700;color:var(--ice);}
  .todaynone{font-size:12.5px;color:var(--steel-400);padding:4px 2px;}
  select.fld{appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="%238ea3c0" stroke-width="2"><path d="M5 8l5 5 5-5"/></svg>');background-repeat:no-repeat;background-position:right 10px center;padding-right:36px;}
  textarea.fld{resize:vertical;line-height:1.45;}
  .itemhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .itemhead label{margin-bottom:0;}
  .est{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;background:rgba(var(--c-accent-rgb),.12);border:1px solid rgba(var(--c-accent-rgb),.35);font-size:11px;color:var(--c-tint);}
  .est b{font-family:var(--font-heading);font-weight:600;}
  .est.warn{background:rgba(var(--c-est-rgb),.12);border-color:rgba(var(--c-est-rgb),.4);color:var(--tint-est);}
  .eqrow{display:grid;grid-template-columns:1fr 96px 38px;gap:8px;margin-bottom:8px;}
  /* A material row carries a unit as well as a quantity, so it needs the extra column. */
  .eqrow.matrow{grid-template-columns:1fr 84px 70px 38px;}
  @media(max-width:560px){.eqrow.matrow{grid-template-columns:1fr 64px 56px 34px;gap:6px;}}
  .eqrow .eqdel{background:transparent;border:1px solid var(--field-line);color:var(--steel-400);cursor:pointer;font-size:15px;line-height:1;transition:.15s;}
  .eqrow .eqdel:hover{border-color:var(--c-danger);color:var(--tint-danger);}
  .addeq{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px dashed var(--field-line);color:var(--steel-300);font-family:var(--font-body);font-size:12px;padding:9px 12px;cursor:pointer;transition:.15s;}
  .addeq:hover{border-color:var(--spark);color:var(--ice);}
  .actions{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);font-size:12px;cursor:pointer;font-family:var(--font-body);transition:.15s;user-select:none;}
  .chip:hover{color:var(--ice);border-color:rgba(var(--c-fieldline-rgb),.4);}
  .chip.on{background:rgba(var(--c-accent-rgb),.16);border-color:rgba(var(--c-accent-rgb),.5);color:var(--c-tint);}
  .save{display:flex;gap:10px;}
  .save button{font-family:var(--font-heading);font-weight:600;font-size:13px;padding:13px;cursor:pointer;transition:.18s;border:none;}
  .btn-primary{flex:1;background:linear-gradient(180deg,var(--c-accent2),var(--c-brand));color:#fff;box-shadow:0 8px 24px var(--bg-glow1);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(var(--c-accent2-rgb),.5);}
  .btn-ghost{background:transparent;border:1px solid var(--field-line)!important;color:var(--steel-300);padding:13px 16px;}
  .btn-ghost:hover{border-color:var(--spark)!important;color:var(--ice);}
  body{min-height:100vh;background:var(--c-deep);display:flex;align-items:flex-start;justify-content:center;padding:24px 0 90px;}
  .bg{background:var(--c-deep);}
  .phone{position:relative;z-index:2;width:390px;max-width:100vw;min-height:800px;background:transparent;
    border:10px solid var(--c-slate);box-shadow:0 30px 80px var(--shade-60);overflow:hidden;}
  .phone .inbg{position:absolute;inset:0;z-index:0;overflow:hidden;}
  .phone .inbg::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 80% 0%,var(--bg-glow1),transparent 55%),linear-gradient(160deg,var(--navy-950),var(--navy-900) 60%,var(--navy-950));}
  .phone .grid{position:absolute;inset:0;opacity:.24;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(circle at 60% 6%,#000 15%,transparent 78%);mask-image:radial-gradient(circle at 60% 6%,#000 15%,transparent 78%);}
  .phone .glow{position:absolute;left:50%;top:30%;width:320px;height:320px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(var(--c-accent-rgb),.2),transparent 62%);filter:blur(8px);animation:pulse 6s ease-in-out infinite;}
  .scr{position:relative;z-index:2;padding:16px 15px 72px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
  .brand .logo{font-size:13px;} .clock{text-align:right;} .clock .time{font-size:13px;} .clock .date{font-size:9.5px;}
  .brand .meta{font-size:9.5px;}
  .modhead{margin-bottom:14px;padding-bottom:11px;flex-wrap:wrap;gap:10px;}
  .modhead .title .ic{width:30px;height:30px;} .modhead .title h1{font-size:17px;} .modhead .title p{font-size:9.5px;}
  .who .badge{padding:4px 8px;font-size:11px;} .who .out{padding:5px 9px;font-size:11px;}
  .card{padding:15px;margin-top:80px;}
  .row{margin-bottom:11px;}
  .grid-hd{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  textarea.fld{min-height:84px;}
  .actions{gap:7px;} .chip{flex:1;justify-content:center;padding:10px 8px;font-size:12px;}
  /* The gap used to push Save below three chips' worth of controls that are now folded away. */
  .save{margin-top:22px;}
  
  /* compact collapsible language switcher */
  .langc{position:absolute;z-index:60;left:18px;bottom:16px;font-family:var(--font-body);}

  let current="en";

    document.querySelectorAll('[data-i-ph]').forEach(el=>el.placeholder=t[el.getAttribute('data-i-ph')]);

  const proj=document.getElementById('project'),item=document.getElementById('item');
  // Named (not inline at load only) so it can be re-run on workshop:data - a project created
  // elsewhere now appears in this dropdown without a full reload. Resets to the placeholder option
  // first (rather than appending again) so a repeat call never duplicates the list; preserves the
  // current selection across the refresh so a user mid-entry isn't silently reset.
  // Hours are logged against a jobcard, so a project with no open jobcard is not a choice - it was
  // one of eleven rows that led to "no items" on ten of them.
  function openJobcards(){
    return (WorkshopData.listJobcards()||[])
      .filter(j=>!j.archived&&!['completed','closed','cancelled'].includes(j.status));
  }
  function populateProjects(){
    const t=T[current],prevValue=proj.value;
    const open=new Set(openJobcards().map(j=>j.projectNo));
    const list=(WorkshopData.listProjects()||[]).filter(p=>open.has(p.no));
    proj.innerHTML='';
    const ph=document.createElement('option');ph.value='';ph.textContent=list.length?'—':t.noopenjobs;proj.appendChild(ph);
    list.forEach(p=>{const o=document.createElement('option');o.value=p.no;o.textContent=`${p.name} · ${p.no}`;proj.appendChild(o);});
    if([...proj.options].some(o=>o.value===prevValue))proj.value=prevValue;
  }
  populateProjects();
  // Item = a real Jobcard operation (falls back to "(whole jobcard)" when the jobcard has none),
  // grouped by jobcard — mirrors jobcard-desktop.html's own opOpts/machineOpts construction. Never
  // the old page-local fake {n,est} list.
  function loadItems(){
    const t=T[current];item.innerHTML='';
    const jobcards=(WorkshopData.listJobcards()||[]).filter(j=>j.projectNo===proj.value&&!j.archived&&!['completed','closed','cancelled'].includes(j.status));
    if(!proj.value||!jobcards.length){
      const ph=document.createElement('option');ph.value='';ph.textContent=proj.value?t.noitems:'—';item.appendChild(ph);
      updateEst();refreshEquipRows();return;
    }
    jobcards.forEach(j=>{
      const grp=document.createElement('optgroup');grp.label=`${j.title||j.no} · ${j.no}`;
      const ops=(j.operations&&j.operations.length)?j.operations:[null];
      ops.forEach(op=>{
        const o=document.createElement('option');
        o.dataset.jobcard=j.no;o.dataset.op=op?String(op.id):'';o.dataset.est=op?op.plannedHours:'';o.dataset.desc=op?op.desc:(j.title||j.no);
        o.textContent=op?op.desc:t.wholejobcard;
        grp.appendChild(o);
      });
      item.appendChild(grp);
    });
    updateEst();refreshEquipRows();
  }
  proj.addEventListener('change',()=>{loadItems();markPicked();});
  item.addEventListener('change',()=>{updateEst();refreshEquipRows();refreshMatOptions();markPicked();});
  document.getElementById('hours').addEventListener('input',()=>{updateEst();setHours(Number(document.getElementById('hours').value)||0);});
  function updateEst(){const chip=document.getElementById('estChip'),val=document.getElementById('estVal');const sel=item.options[item.selectedIndex];
    if(sel&&sel.dataset.est){chip.style.display='inline-flex';val.textContent=sel.dataset.est+' h';const h=parseFloat(document.getElementById('hours').value||0);chip.classList.toggle('warn',h>parseFloat(sel.dataset.est));}else chip.style.display='none';}
  // Equipment rows may only offer equipment already linked to the SELECTED item's Jobcard (never
  // free text, never the whole shared catalog) — exactly jobcard-desktop.html's machineOpts rule.
  function selectedJobcard(){
    const sel=item.options[item.selectedIndex];const jcNo=sel&&sel.dataset?sel.dataset.jobcard:'';
    if(!jcNo)return null;
    return (WorkshopData.listJobcards()||[]).find(j=>j.no===jcNo)||null;
  }
  // A machine already on the jobcard can simply be logged. One that is not is still offered - the
  // plasma cutter you actually used is not absent from the workshop just because nobody linked it
  // first - and saving attaches it through exactly the call the Jobcard module makes. Equipment the
  // safety gate refuses is shown with its reason and cannot be picked, rather than being hidden.
  function populateEqSelect(sel){
    const t=T[current];const prev=sel.value;sel.innerHTML='';
    const jc=selectedJobcard();
    const linked=jc?(jc.machines||[]).filter(m=>m.equipmentId):[];
    const ph=document.createElement('option');ph.value='';ph.textContent=jc?t.eqph:t.noeqlinked;sel.appendChild(ph);
    if(linked.length){
      const g=document.createElement('optgroup');g.label=t.eq_onjob;
      linked.forEach(m=>{const o=document.createElement('option');o.value=m.equipmentId;o.textContent=`${m.name} · ${m.equipmentId}`;g.appendChild(o);});
      sel.appendChild(g);
    }
    if(jc){
      const onJob=new Set(linked.map(m=>m.equipmentId));
      const rest=(WorkshopData.getEquipment()||[]).filter(e=>!onJob.has(e.equipmentId));
      if(rest.length){
        const g=document.createElement('optgroup');g.label=t.eq_attach;
        rest.forEach(e=>{
          const gate=WorkshopData.getEquipmentSafetyGate(e.equipmentId,{requirePreUseCheck:true,jobcardNo:jc.no,projectNo:jc.projectNo});
          const d=JobcardEquipmentRules.canAddEquipmentToJobcard(e,jc.machines||[],jc.no,gate);
          const o=document.createElement('option');o.value=e.equipmentId;
          o.textContent=`${e.name} · ${e.equipmentId}`+(d.allowed?'':` — ${eqReasonShort(d,gate,e)}`);
          o.disabled=!d.allowed;
          g.appendChild(o);
        });
        sel.appendChild(g);
      }
    }
    if([...sel.options].some(o=>o.value===prev&&!o.disabled))sel.value=prev;
  }
  // The decision says why; which jobcard holds the equipment is on the equipment record itself.
  function eqReasonShort(decision,gate,eq){
    const t=T[current];
    if(decision.reasonCode==='ASSIGNED_ELSEWHERE')return tpl(t.eq_assignedelsewhere,{jc:(eq&&eq.assignedJobcard)||'—'});
    if(decision.reasonCode==='BLOCKED')return (gate&&gate.reasons||[]).join('; ')||t.eq_blocked;
    return t.eq_blocked;
  }
  function refreshEquipRows(){document.querySelectorAll('#equipList .eqsel').forEach(populateEqSelect);}
  const equipList=document.getElementById('equipList');
  function addEqRow(){const t=T[current];const row=document.createElement('div');row.className='eqrow';

    const del=document.createElement('button');del.type='button';del.className='eqdel';del.setAttribute('aria-label','Remove equipment');del.textContent='×';del.onclick=()=>row.remove();
    row.append(sel,hrs,del);equipList.appendChild(row);populateEqSelect(sel);}

  }

    const del=document.createElement('button');del.type='button';del.className='eqdel';del.setAttribute('aria-label','Remove material');del.textContent='×';del.onclick=()=>row.remove();
    row.append(name,qty,unit,del);matList.appendChild(row);refreshMatOptions();}
  document.getElementById('addMat').addEventListener('click',addMatRow);
  function refreshEqLang(){const t=T[current];refreshEquipRows();document.querySelectorAll('.eqhrs').forEach(h=>h.placeholder=t.hrs);
    document.querySelectorAll('.matname').forEach(n=>n.placeholder=t.matph);document.querySelectorAll('.matqty').forEach(q=>q.placeholder=t.qty);}
  function tick(){const n=new Date();document.getElementById('time').textContent=n.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
    try{document.getElementById('date').textContent=n.toLocaleDateString(T[current].locale,{weekday:'short',day:'numeric',month:'short'});}catch(e){document.getElementById('date').textContent=n.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}}
  document.getElementById('date2').valueAsDate=new Date();
  document.getElementById('date2').addEventListener('change',renderToday);
  // Yesterday is the correction a worker actually needs; every other date is the picker's job.
  document.getElementById('dayBack').addEventListener('click',()=>{
    const f=document.getElementById('date2');
    const d=f.valueAsDate||new Date();d.setDate(d.getDate()-1);
    f.valueAsDate=d;renderToday();
  });
  document.querySelectorAll('.qh').forEach(b=>b.addEventListener('click',()=>setHours(Number(b.dataset.h))));
  document.getElementById('hrsUp').addEventListener('click',()=>nudgeHours(0.5));
  document.getElementById('hrsDown').addEventListener('click',()=>nudgeHours(-0.5));
  // The button that used only to turn blue now does the thing it is named for.
  document.getElementById('moreChip').addEventListener('click',function(){
    const wrap=document.getElementById('moreWrap');
    const open=wrap.hidden;
    wrap.hidden=!open;this.classList.toggle('on',open);this.setAttribute('aria-expanded',String(open));
  });
  renderJobPicks();renderToday();
  setLang("en");setInterval(tick,10000);addEqRow();addMatRow();
  // Job titles and project numbers are typed by people and go into markup here, so they are
  // escaped on the way in like everywhere else in the app.
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  // ── The fast path ────────────────────────────────────────────────────────────────────────
  // The jobcards that are actually running, offered as something to press. A jobcard on Quality
  // Hold is deliberately still offered: work already done on it has to be recorded whatever the
  // hold says, and the hold blocks completing the jobcard, not telling the truth about it.
  function openJobcards(){
    return (WorkshopData.listJobcards()||[])
      .filter(j=>!j.archived&&['ready','in-progress','inspection'].includes(j.status))
      .sort((a,b)=>(a.status===b.status?0:a.status==='in-progress'?-1:1));
  }
  function renderJobPicks(){
    const t=T[current],host=document.getElementById('jobPicks');
    const jobs=openJobcards();
    if(!jobs.length){host.innerHTML=`<p class="jobnone">${esc(t.nojobsnow)}</p>`;return;}
    host.innerHTML=jobs.map(j=>`<button type="button" class="jobpick" data-jc="${esc(j.no)}" data-pr="${esc(j.projectNo||'')}">
      <b>${esc(j.title||j.no)}</b><span>${esc(j.no)}${j.projectNo?' · '+esc(j.projectNo):''}</span></button>`).join('');
    host.querySelectorAll('.jobpick').forEach(btn=>btn.addEventListener('click',()=>pickJob(btn.dataset.pr,btn.dataset.jc)));
    // Lit by the jobcard that is selected, never by its project - two jobcards on one project
    // would otherwise both claim to be the one being booked against.
    markPicked();
  }
  // Pressing a job sets the project and then the jobcard, going through the same two selects the
  // long way round uses - so everything downstream (the estimate chip, equipment rows, the save
  // itself) sees exactly what it would have seen if the worker had picked them by hand.
  function pickJob(projectNo,jobcardNo){
    proj.value=projectNo;loadItems();
    const opt=[...item.options].find(o=>o.dataset&&o.dataset.jobcard===jobcardNo);
    if(opt)item.value=opt.value;
    if(item.selectedIndex<0&&item.options.length)item.selectedIndex=0;
    updateEst();refreshEquipRows();markPicked();
  }
  function markPicked(){
    const sel=item.options[item.selectedIndex];
    const jc=sel&&sel.dataset?sel.dataset.jobcard:'';
    document.querySelectorAll('.jobpick').forEach(b=>b.classList.toggle('on',b.dataset.jc===jc));
  }

  // ── Hours ────────────────────────────────────────────────────────────────────────────────
  const hoursFld=()=>document.getElementById('hours');
  function setHours(value){
    const v=Math.max(0,Math.round(value*4)/4);
    hoursFld().value=v?String(v):'';
    document.querySelectorAll('.qh').forEach(b=>b.classList.toggle('on',Number(b.dataset.h)===v));
  }
  function nudgeHours(by){setHours((Number(hoursFld().value)||0)+by);}

  // ── What this worker has already logged today ────────────────────────────────────────────
  function todayEntries(){
    const who=document.getElementById('whoName').textContent.trim();
    const day=document.getElementById('date2').value;
    return (WorkshopData.get().hours||[])
      .filter(h=>h.date===day&&(h.worker===who||h.user===who));
  }
  function renderToday(){
    const t=T[current],host=document.getElementById('todayList');
    const rows=todayEntries();
    if(!rows.length){host.innerHTML=`<p class="todaynone">${esc(t.nothinglogged)}</p>`;return;}
    const total=rows.reduce((a,h)=>a+(Number(h.hours)||0),0);
    host.innerHTML=rows.map(h=>`<div class="todayrow"><div>${esc(h.item||h.jobcard||h.projectNo||'—')}
      <small>${esc(h.jobcard||'')}${h.projectNo?' · '+esc(h.projectNo):''}</small></div>
      <b>${esc(String(h.hours))} h</b></div>`).join('')
      +`<div class="todaysum"><span>${esc(t.todaytotal)}</span><span>${esc(String(Math.round(total*100)/100))} h</span></div>`;
  }

  function collectHours(){
    const sel=item.options[item.selectedIndex];
    return {
      project:proj.value,jobcard:sel&&sel.dataset?sel.dataset.jobcard||'':'',
      operationId:sel&&sel.dataset&&sel.dataset.op?Number(sel.dataset.op):null,
      item:sel&&sel.dataset?sel.dataset.desc||'':'',
      hours:document.getElementById('hours').value,date:document.getElementById('date2').value,notes:document.getElementById('notes').value,
      worker:document.getElementById('whoName').textContent,
      equipment:[...document.querySelectorAll('#equipList .eqrow')].map(row=>({equipmentId:row.querySelector('.eqsel')?.value,hours:row.querySelector('.eqhrs')?.value})).filter(x=>x.equipmentId||x.hours),
      materials:[...document.querySelectorAll('#matList .eqrow')].map(row=>({name:row.querySelector('.matname')?.value,qty:row.querySelector('.matqty')?.value,unit:row.querySelector('.matunit')?.value})).filter(x=>x.name||x.qty)
    };
  }
  function tpl(str,vals){return String(str||'').replace(/\{(\w+)\}/g,(m,k)=>vals&&vals[k]!=null?vals[k]:'');}
  // Translates a blocked equipment result (from resolveLogTimeEquipment(), canUseEquipment()'s gate,
  // or logEquipmentUsage()'s returned error) into a user-facing message — display-only, mirrors
  // jobcard-desktop.html's translateEquipmentBlockCode(). Never decides anything itself.
  function equipBlockMessage(res){
    const t=T[current];
    switch(res&&res.code){
      case 'EQUIPMENT_NOT_LINKED':
      case 'EQUIPMENT_MISSING':
        return t.eq_missing;
      case 'EQUIPMENT_UNASSIGNED':
        return t.eq_unassigned;
      case 'EQUIPMENT_ASSIGNED_ELSEWHERE':
      case 'EQUIPMENT_ASSIGNMENT_CONFLICT':
        return tpl(t.eq_assignedelsewhere,{jc:res.assignedJobcard||'—'});
      case 'EQUIPMENT_SAFETY_BLOCKED':
        return tpl(t.eq_blocked,{reasons:(res.reasons||[]).join('; ')});
      default:
        return (res&&res.error)||t.eq_blocked;
    }
  }
  // Mirrors jobcard-desktop.html's saveLogTime(): validate every equipment row against the live,
  // authoritative Equipment Safety Gate BEFORE committing anything, then log equipment usage via
  // WorkshopData.logEquipmentUsage() BEFORE labour hours via logHours() — if any row is blocked,
  // neither equipment usage nor labour hours are recorded. No equipment rows simply logs labour hours.
  // Matching is by the jobcard's own code or description, so "SS-SHT-304-2.0 — AISI 304 sheet 2 mm"
  // picked from the list lands on that line rather than beside it.
  function postMaterialsToJobcard(jc,rows){
    const use=(rows||[]).filter(r=>r&&String(r.name||'').trim()&&Number(r.qty)>0);
    if(!use.length)return 0;
    const mats=(jc.materials||[]).map(m=>Object.assign({},m));
    use.forEach(r=>{
      const typed=String(r.name).trim().toLowerCase();
      const hit=mats.find(m=>{
        const code=String(m.code||'').toLowerCase(),desc=String(m.description||'').toLowerCase();
        return (code&&typed.startsWith(code))||(desc&&typed===desc)||(code&&typed===code);
      });
      const qty=Number(r.qty)||0;
      if(hit){
        hit.issued=(Number(hit.issued)||0)+qty;
        const req=Number(hit.required)||0;
        hit.status=req&&hit.issued>=req?'issued':(hit.issued>0?'partial':hit.status);
      }else{
        mats.push({code:'',description:String(r.name).trim(),unit:String(r.unit||'').trim()||'EA',
          required:0,reserved:0,issued:qty,status:'issued',spec:'',grade:'',dimension:'',location:'',heat:'',certificate:''});
      }
    });
    WorkshopData.updateJobcard(jc.no,{materials:mats});
    jc.materials=mats;
    return use.length;
  }
  function saveHours(reset){
    const entry=collectHours();const hours=Number(entry.hours);
    if(!entry.project||!entry.jobcard||!Number.isFinite(hours)||hours<=0){wAlert(T[current].err_select);return false;}
    const jc=(WorkshopData.listJobcards()||[]).find(j=>j.no===entry.jobcard);
    if(!jc){wAlert(T[current].err_jobcard_missing);return false;}

    // A machine used but not yet on the jobcard is attached first, through the same two calls the
    // Jobcard module makes - assignEquipment() decides, and the link is written only if it succeeds.
    // The safety gate is never bypassed: a refused assignment stops the whole save, so neither
    // equipment usage nor labour hours are recorded against a machine that may not be run.
    const attached=[];
    for(const row of entry.equipment){
      if(!row.equipmentId)continue;
      if((jc.machines||[]).some(m=>m.equipmentId===row.equipmentId))continue;
      const eq=(WorkshopData.getEquipment()||[]).find(e=>e.equipmentId===row.equipmentId);
      if(!eq){wAlert(equipBlockMessage({code:'EQUIPMENT_MISSING'}));return false;}
      const gate=WorkshopData.getEquipmentSafetyGate(eq.equipmentId,{requirePreUseCheck:true,jobcardNo:jc.no,projectNo:jc.projectNo});
      const decision=JobcardEquipmentRules.canAddEquipmentToJobcard(eq,jc.machines||[],jc.no,gate);
      if(!decision.allowed){wAlert(eqReasonShort(decision,gate,eq));return false;}
      const res=WorkshopData.assignEquipment(eq.equipmentId,{project:jc.projectNo,jobcard:jc.no,worker:entry.worker,assignedBy:entry.worker});
      if(res&&res.error){wAlert(equipBlockMessage(res));return false;}
      jc.machines=(jc.machines||[]).concat([{equipmentId:eq.equipmentId,name:eq.name,plannedUsage:0}]);
      WorkshopData.updateJobcard(jc.no,{machines:jc.machines});
      WorkshopData.recordJobcardActivity(jc.no,{action:`Equipment linked from Hours: ${eq.equipmentId} — ${eq.name}`});
      attached.push(eq.equipmentId);
    }

    const toLog=[];
    for(const row of entry.equipment){
      if(!row.equipmentId)continue;
      const resolved=resolveLogTimeEquipment(jc.machines,row.equipmentId,WorkshopData.getEquipment(),jc.no);
      if(!resolved.ok){wAlert(equipBlockMessage(resolved));return false;}
      const use=WorkshopData.canUseEquipment(row.equipmentId,{date:entry.date,projectNo:jc.projectNo,jobcardNo:jc.no});
      if(!use.allowed){wAlert(equipBlockMessage({code:'EQUIPMENT_SAFETY_BLOCKED',reasons:(use.gate&&use.gate.reasons)||[]}));return false;}
      toLog.push({equipmentId:row.equipmentId,name:resolved.machine.name,hours:Number(row.hours)||hours});
    }

    for(const eqEntry of toLog){
      const usageRes=WorkshopData.logEquipmentUsage(eqEntry.equipmentId,{hours:eqEntry.hours,date:entry.date,worker:entry.worker,project:jc.projectNo,jobcard:jc.no,notes:entry.notes});
      if(usageRes&&usageRes.error){wAlert(equipBlockMessage(usageRes));return false;}
    }

    // Sets both `worker` (jobcard-desktop.html's own hours panel filters by this — SHARED.hours
    // matching h.jobcard/h.worker) and `user` (reports-desktop.html's Hours-by-user/by-worker tables
    // group by this) — logHours() itself only defaults `user`, never derives one from `worker`.
    const result=WorkshopData.logHours({project:jc.projectNo,jobcard:jc.no,item:entry.item,operation:entry.item,worker:entry.worker,user:entry.worker,hours,date:entry.date,notes:entry.notes,equipment:toLog,materials:entry.materials});
    if(result&&result.error){wAlert(result.error);return false;}

    if(entry.operationId!=null){
      const op=(jc.operations||[]).find(o=>o.id===entry.operationId);
      WorkshopData.updateJobcardOperation(jc.no,entry.operationId,{loggedHours:(Number(op&&op.loggedHours)||0)+hours});
    }
    // Material consumed here is material consumed on the jobcard. A line the jobcard already plans
    // for has its issued quantity raised; anything else is added as a line that was not planned, so
    // the jobcard shows what actually went into the job rather than only what was intended.
    const matCount=postMaterialsToJobcard(jc,entry.materials);
    WorkshopData.recordJobcardActivity(jc.no,{action:`${hours}h logged by ${entry.worker}${entry.item?' on '+entry.item:''}`});

    const t=T[current];
    const extra=[attached.length?tpl(t.eq_attached,{list:attached.join(', ')}):'',
                 matCount?tpl(t.mat_logged,{n:matCount,jc:jc.no}):''].filter(Boolean);
    wAlert(t.savedok+(extra.length?'\n\n'+extra.join('\n'):''));
    if(reset){setHours(0);document.getElementById('notes').value='';}
    renderJobPicks();renderToday();
    return true;
  }
  document.getElementById('saveEntry').addEventListener('click',()=>saveHours(false));document.getElementById('saveNewEntry').addEventListener('click',()=>saveHours(true));
  document.getElementById('logoutBtn').addEventListener('click',()=>{location.href='login.html';});
  const box=document.getElementById('embers');const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!reduce){for(let i=0;i<18;i++){const e=document.createElement('div');e.className='ember';e.style.left=Math.random()*100+'%';e.style.setProperty('--drift',(Math.random()*80-40)+'px');const dur=7+Math.random()*9;e.style.animationDuration=dur+'s';e.style.animationDelay=(-Math.random()*dur)+'s';const s=1+Math.random()*2;e.style.width=s+'px';e.style.height=s+'px';box.appendChild(e);}}

  (function(){var lc=document.getElementById('langc'),lt=document.getElementById('langtoggle');
    if(lt){lt.addEventListener('click',function(e){e.stopPropagation();lc.classList.toggle('open');});
    document.addEventListener('click',function(e){if(!lc.contains(e.target))lc.classList.remove('open');});}})();
  // Picks up a project created elsewhere, and refreshes the Item/equipment dropdowns for whichever
  // project is currently selected (loadItems()/populateEqSelect() already read WorkshopData live on
  // every call - the only gap was nothing triggering that refresh on an external change).
  window.addEventListener('workshop:data',()=>{populateProjects();loadItems();renderJobPicks();renderToday();});
</script></body></html>
