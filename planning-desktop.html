<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>Varmak — Planning</title><style>
  :root{--navy-950:#04101f;--navy-900:#071a33;--navy-800:#0a2447;--navy-brand:#013179;
    --steel-400:#8ea3c0;--steel-300:#b9c6da;--spark:#4a90ff;--ice:#e8f0fb;
    --line:rgba(142,163,192,0.16);--field:rgba(255,255,255,0.045);--field-line:rgba(185,198,218,0.24);
    --ok:#4ad48a;--warn:#ffb057;--danger:#ff6b6b;--idea:#f5a623;--hold:#e2685f;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ice);min-height:100vh;}
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--navy-950);}
  .bg::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 82% 0%,rgba(1,49,121,0.5),transparent 55%),radial-gradient(80% 60% at 10% 100%,rgba(10,36,71,0.6),transparent 60%),linear-gradient(160deg,var(--navy-950),var(--navy-900) 60%,var(--navy-950));}
  .grid{position:absolute;inset:0;opacity:0.28;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);}
  .glow{position:absolute;left:50%;top:16%;width:560px;height:560px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(74,144,255,0.14),transparent 62%);filter:blur(8px);animation:pulse 6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
  .ember{position:absolute;bottom:-10px;border-radius:50%;background:var(--spark);box-shadow:0 0 6px 1px rgba(74,144,255,.8);animation:rise linear infinite;opacity:0;}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-105vh) translateX(var(--drift));opacity:0}}
  @media (prefers-reduced-motion:reduce){.glow,.ember{animation:none}}

  .topfull{position:relative;z-index:2;width:100%;padding:20px 32px 0;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;}
  .brand .logo{font-family:'Sora';font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .brand .logo .dot{width:6px;height:6px;background:var(--spark);box-shadow:0 0 9px 1px rgba(74,144,255,.9);}
  .brand .meta{font-size:11px;color:var(--steel-400);margin-top:2px;line-height:1.5;}
  .topright{display:flex;flex-direction:column;align-items:flex-end;gap:9px;}
  .clock{text-align:right;font-variant-numeric:tabular-nums;} .clock .time{font-family:'Sora';font-weight:600;font-size:16px;} .clock .date{font-size:11px;color:var(--steel-400);}
  .who{display:flex;align-items:center;gap:8px;}
  .who .badge{display:flex;align-items:center;gap:7px;padding:5px 10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;}
  .who .badge .av{width:20px;height:20px;background:linear-gradient(135deg,#2c6bd6,#0a2447);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:'Sora';}
  .who .role{color:var(--spark);font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
  .who .out{background:transparent;border:1px solid var(--field-line);color:var(--steel-300);padding:6px 10px;font-size:12px;cursor:pointer;font-family:'Inter';transition:.15s;}
  .who .out:hover{border-color:var(--spark);color:var(--ice);}

  .wrap{position:relative;z-index:2;max-width:1680px;margin:0 auto;padding:20px 28px 40px;}
  .back{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--field-line);color:var(--steel-300);font-family:'Inter';font-size:12px;padding:7px 12px;cursor:pointer;transition:.15s;margin-bottom:10px;}
  .back:hover{border-color:var(--spark);color:var(--ice);}

  .pheader{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .pheader .ttl{display:flex;align-items:center;gap:12px;}
  .pheader .ic{width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(74,144,255,.14);box-shadow:inset 0 0 0 1px rgba(74,144,255,.35);}
  .pheader h1{font-family:'Sora';font-weight:700;font-size:21px;letter-spacing:-.01em;} .pheader p{font-size:12px;color:var(--steel-400);}
  .toptabs{display:flex;gap:2px;background:rgba(255,255,255,.03);border:1px solid var(--line);padding:3px;}
  .toptabs button{background:transparent;border:none;color:var(--steel-400);font-family:'Sora';font-weight:600;font-size:11px;letter-spacing:.03em;text-transform:uppercase;padding:9px 13px;cursor:pointer;white-space:nowrap;transition:.15s;}
  .toptabs button.on{background:rgba(74,144,255,.16);color:#cfe0ff;}
  .toptabs button:hover{color:var(--ice);}
  .hcontrols{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--field-line);background:transparent;color:var(--steel-300);font-family:'Sora';font-weight:600;font-size:12.5px;padding:9px 13px;cursor:pointer;transition:.16s;white-space:nowrap;}
  .tbtn:hover{border-color:var(--spark);color:var(--ice);}
  .tbtn.primary{background:linear-gradient(180deg,#2c6bd6,#013179);border:none;color:#fff;}
  .tbtn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(44,107,214,.5);}
  .tbtn.small{padding:6px 10px;font-size:11.5px;}
  .tbtn svg{flex:none;width:13px;height:13px;}
  .daterange{display:flex;align-items:center;gap:6px;background:var(--field);border:1px solid var(--field-line);padding:8px 12px;font-size:12px;color:var(--steel-300);}
  .daterange button{background:none;border:none;color:var(--steel-400);cursor:pointer;display:flex;align-items:center;padding:2px;}
  .daterange button:hover{color:var(--ice);}

  .maingrid{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start;}
  @media(max-width:1200px){.maingrid{grid-template-columns:1fr;}}
  .panel{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:16px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .panel .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;}
  .panel .phead h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--spark);font-weight:700;}
  .col{display:flex;flex-direction:column;gap:16px;}

  .subnav{display:flex;flex-direction:column;gap:3px;}
  .subnav button{display:flex;align-items:center;gap:9px;background:transparent;border:1px solid transparent;color:var(--steel-300);font-family:'Inter';font-size:12.5px;padding:9px 10px;cursor:pointer;text-align:left;transition:.14s;}
  .subnav button:hover{background:rgba(255,255,255,.03);}
  .subnav button.on{background:rgba(74,144,255,.12);border-color:rgba(74,144,255,.4);color:#cfe0ff;}
  .subnav button .sic{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;}
  .subnav button .sic svg{width:18px;height:18px;}
  .subnav button .stxt{flex:1;} .subnav button .stxt b{display:block;font-weight:600;font-size:12.5px;}
  .subnav button .scount{font-family:'Sora';font-weight:700;font-size:12px;color:var(--steel-400);}

  .qsrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .qsrow:last-of-type{border-bottom:none;}
  .qsrow .qk{color:var(--steel-400);} .qsrow .qv{font-family:'Sora';font-weight:700;} .qsrow .qv.warn{color:var(--warn);} .qsrow .qv.ok{color:var(--ok);}
  .utilbar{height:7px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px;} .utilbar i{display:block;height:100%;background:var(--spark);}
  .utilbar.over i{background:var(--danger);}
  .utilbar.tier-low i{background:var(--ok);}
  .utilbar.tier-mid i{background:var(--warn);}
  .utilbar.tier-high i{background:var(--danger);}
  .rescav{width:22px;height:22px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:9.5px;color:#fff;background:var(--spark);margin-right:8px;}

  .legend{display:flex;flex-direction:column;gap:7px;}
  .legend .lrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--steel-300);}
  .legend .ldot{width:10px;height:10px;flex:none;border-radius:2px;}

  .ovcards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px;}
  @media(max-width:900px){.ovcards{grid-template-columns:1fr;}}
  .ovcard2{background:rgba(255,255,255,.03);border:1px solid var(--line);padding:16px;display:flex;gap:13px;}
  .ovcard2 .oic{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;}
  .ovcard2 .oic svg{width:26px;height:26px;}
  .ovcard2.ideas .oic svg{color:var(--idea);}
  .ovcard2.existing .oic svg{color:var(--spark);}
  .ovcard2.future .oic svg{color:var(--ok);}
  .ovcard2 .otitle{display:flex;align-items:center;gap:8px;font-family:'Sora';font-weight:700;font-size:14px;margin-bottom:4px;}
  .ovcard2 .ocount{font-family:'Sora';font-size:11px;font-weight:700;color:var(--ice);background:rgba(255,255,255,.08);padding:1px 8px;}
  .ovcard2 .odesc{font-size:11.5px;color:var(--steel-400);margin-bottom:8px;line-height:1.4;}
  .ovcard2 .ostat{font-size:11.5px;margin-bottom:3px;} .ovcard2 .ostat.warn{color:var(--warn);} .ovcard2 .ostat.ok{color:var(--ok);} .ovcard2 .ostat.active{color:var(--spark);}
  .ovcard2 a{font-size:11.5px;color:var(--spark);text-decoration:none;cursor:pointer;} .ovcard2 a:hover{text-decoration:underline;}

  .ganttctrls{display:flex;align-items:center;gap:9px;flex:none;}
  .iconbtn{flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);cursor:pointer;}
  .iconbtn:hover{border-color:var(--spark);color:var(--ice);}
  .gzlbl{font-size:10.5px;color:var(--steel-400);white-space:nowrap;}
  .gzoomslider{width:90px;accent-color:var(--spark);}
  .grandrop{background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);font-family:'Inter';font-size:11.5px;padding:5px 8px;cursor:pointer;}
  .gwrap{overflow-x:auto;}
  .gantthead{display:flex;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px;position:sticky;top:0;}
  .gcolfixed{flex:none;width:320px;padding-right:10px;}
  .gtimeline{flex:1;position:relative;min-width:640px;}
  .gmonths{display:flex;font-size:10px;color:var(--steel-400);text-transform:uppercase;letter-spacing:.04em;position:relative;height:16px;}
  .gticks{display:flex;font-size:10px;color:var(--steel-400);position:relative;height:16px;font-variant-numeric:tabular-nums;}
  .gtick{position:absolute;transform:translateX(-50%);}
  .gmonthlbl{position:absolute;font-weight:700;color:#cfe0ff;}
  .grow{display:flex;align-items:center;min-height:34px;border-bottom:1px solid var(--line);}
  .grow.grouprow{background:rgba(74,144,255,.05);font-family:'Sora';font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#cfe0ff;min-height:28px;cursor:default;}
  .grow.taskrow{background:rgba(255,255,255,.015);}
  .grow:hover:not(.grouprow){background:rgba(255,255,255,.025);}
  .gname{flex:none;width:320px;padding-right:10px;font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer;}
  .gname .chev{width:10px;height:10px;color:var(--steel-400);transition:transform .15s;flex:none;}
  .gname.open .chev{transform:rotate(90deg);}
  .gname b{font-weight:600;} .gname .gsub{color:var(--steel-400);font-size:10.5px;}
  .gname .gpct{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--steel-400);font-size:11px;flex:none;}
  .gname .gr-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
  .gname .gr-date{width:46px;flex:none;color:var(--steel-400);font-size:10.5px;font-variant-numeric:tabular-nums;}
  .gname .gr-prog{width:64px;flex:none;display:flex;align-items:center;gap:5px;justify-content:flex-end;color:var(--steel-400);font-size:11px;font-variant-numeric:tabular-nums;}
  .gname .gr-progbar{width:24px;height:4px;flex:none;background:rgba(255,255,255,.08);}
  .gname .gr-progbar i{display:block;height:100%;background:var(--spark);}
  .gcolhead{flex:none;width:320px;padding-right:10px;display:flex;align-items:center;gap:6px;}
  .gcolhead span{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);font-weight:600;}
  .gcolhead .gch-name{flex:1;} .gcolhead .gch-date{width:46px;flex:none;} .gcolhead .gch-prog{width:34px;flex:none;text-align:right;}
  .gtrack{flex:1;position:relative;height:34px;min-width:640px;}
  .gbar{position:absolute;top:8px;height:18px;border-radius:1px;overflow:hidden;cursor:pointer;}
  .gbar .gfill{position:absolute;inset:0;}
  .gbar .gprog{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.28);}
  .gbar.st-idea .gfill{background:var(--idea);} .gbar.st-planned .gfill{background:var(--steel-400);}
  .gbar.st-active .gfill{background:var(--spark);} .gbar.st-hold .gfill{background:var(--hold);}
  .gbar.st-completed .gfill{background:var(--ok);} .gbar.st-future .gfill{background:rgba(74,212,138,.5);}
  .gmilestone{position:absolute;top:11px;width:11px;height:11px;background:#fff;transform:translateX(-50%) rotate(45deg);border:2px solid var(--navy-950);z-index:2;cursor:pointer;}
  .gmilestone.done{background:var(--ok);} .gmilestone.pending{background:var(--warn);}
  .gtoday{position:absolute;top:0;bottom:0;width:1px;background:var(--danger);z-index:1;}
  .gtoday .gtodaylbl{position:absolute;top:-2px;left:3px;font-size:9px;color:var(--danger);font-weight:700;white-space:nowrap;}
  .gshift{display:inline-flex;gap:2px;margin-left:8px;}
  .gshift button{width:16px;height:16px;background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);font-size:10px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;}
  .gshift button:hover{border-color:var(--spark);color:var(--ice);}
  .glegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:var(--steel-300);}
  .glegend .lg{display:flex;align-items:center;gap:6px;} .glegend .ldot{width:9px;height:9px;}

  .idealist,.projlist,.futlist{display:flex;flex-direction:column;gap:8px;}
  .listcard{border:1px solid var(--line);padding:12px 14px;cursor:pointer;transition:.14s;background:rgba(255,255,255,.015);}
  .listcard:hover{border-color:rgba(74,144,255,.4);background:rgba(74,144,255,.05);}
  .lc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:10px;}
  .lc-top b{font-size:13px;} .lc-sub{font-size:11.5px;color:var(--steel-400);}
  .stagepill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;font-weight:700;white-space:nowrap;border:1px solid;flex:none;}
  .stagepill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .stagepill.new{color:var(--steel-300);border-color:var(--field-line);background:rgba(142,163,192,.1);}
  .stagepill.evaluation,.stagepill.concept{color:var(--idea);border-color:rgba(192,132,252,.4);background:rgba(192,132,252,.12);}
  .stagepill.feasibility{color:var(--warn);border-color:rgba(255,176,87,.4);background:rgba(255,176,87,.1);}
  .stagepill.approved,.stagepill.confirmed{color:var(--ok);border-color:rgba(74,212,138,.4);background:rgba(74,212,138,.12);}
  .stagepill.future,.stagepill.probable{color:var(--spark);border-color:rgba(74,144,255,.4);background:rgba(74,144,255,.12);}
  .stagepill.rejected,.stagepill.onhold{color:var(--danger);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.1);}
  .stagepill.tentative{color:var(--steel-400);border-color:var(--line);background:rgba(142,163,192,.08);}
  .stagetext{font-size:11.5px;font-weight:600;white-space:nowrap;}
  .stagetext.new{color:var(--steel-300);}
  .stagetext.evaluation,.stagetext.concept{color:var(--idea);}
  .stagetext.feasibility{color:var(--warn);}
  .stagetext.approved,.stagetext.confirmed{color:var(--ok);}
  .stagetext.future,.stagetext.probable{color:var(--spark);}
  .stagetext.rejected,.stagetext.onhold{color:var(--danger);}
  .stagetext.tentative{color:var(--steel-400);}

  .pipetable{width:100%;border-collapse:collapse;table-layout:fixed;}
  .pipetable th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel-400);padding:0 6px 8px;font-weight:600;}
  .pipetable th:nth-child(2),.pipetable th:nth-child(3){width:70px;}
  .pipetable td{padding:8px 6px;border-top:1px solid var(--line);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;}
  .pipetable tr{cursor:pointer;}
  .pipetable tr:hover td{background:rgba(74,144,255,.05);}
  .pipetable td.ptname{font-weight:600;}
  .pipetable td.ptscore{font-family:'Sora';font-weight:700;color:var(--ice);}
  .scorebadge{font-family:'Sora';font-weight:700;font-size:13px;color:var(--ok);flex:none;}

  .detailhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;}
  .detailhead h2{font-family:'Sora';font-weight:700;font-size:20px;}
  .fieldgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px;}
  @media(max-width:1000px){.fieldgrid{grid-template-columns:1fr 1fr;}}
  .field .fk{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);margin-bottom:3px;}
  .field .fv{font-size:13px;font-weight:600;}
  .scorecard{background:rgba(255,255,255,.025);border:1px solid var(--line);padding:16px;margin-bottom:16px;}
  .scorerow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .scorerow:last-of-type{border-bottom:none;}
  .scorebar{width:120px;height:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:0 10px;}
  .scorebar i{display:block;height:100%;background:var(--idea);}
  .scoretotal{display:flex;justify-content:space-between;align-items:center;padding-top:12px;margin-top:8px;border-top:1px solid var(--line);font-family:'Sora';font-weight:700;font-size:16px;color:var(--idea);}

  .calgrid{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start;}
  @media(max-width:1000px){.calgrid{grid-template-columns:1fr;}}
  .calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .calnav h3{font-family:'Sora';font-weight:700;font-size:15px;}
  .calnav button{background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);width:26px;height:26px;cursor:pointer;}
  .calmonth{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .calmonth .cdow{font-size:10px;text-transform:uppercase;color:var(--steel-400);text-align:center;padding-bottom:4px;}
  .calday{min-height:76px;background:rgba(255,255,255,.02);border:1px solid var(--line);padding:5px;font-size:11px;cursor:pointer;transition:.14s;}
  .calday:hover{border-color:rgba(74,144,255,.4);}
  .calday.today{border-color:var(--spark);background:rgba(74,144,255,.08);}
  .calday.sel{border-color:var(--spark);background:rgba(74,144,255,.14);}
  .calday.other{opacity:.3;}
  .calday .cdnum{font-weight:600;margin-bottom:3px;}
  .caldot{display:block;font-size:9px;padding:1px 4px;margin-bottom:2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dayevents{display:flex;flex-direction:column;gap:8px;}
  .evrow{display:flex;gap:9px;padding:9px;border:1px solid var(--line);background:rgba(255,255,255,.02);}
  .evrow .edot{width:8px;height:8px;flex:none;margin-top:4px;border-radius:2px;}

// Scheduling engine: task start = max(end of dependencies) + manual shift; only the root
// task (no dependencies) keeps its own literal start date. This is what makes shifting one
// task (e.g. a material delivery) automatically cascade through everything downstream.
function scheduleProject(p){
  const computed={};
  p.tasks.forEach(t=>{
    let start;
    if(t.dependsOn.length){
      const deps=t.dependsOn.map(dep=>typeof dep==='string'?{id:dep,type:'FS'}:dep);
      const starts=[];
      deps.forEach(dep=>{
        const sc=computed[dep.id];if(!sc)return;
        if(dep.type==='SS')starts.push(sc.start.getTime());
        else if(dep.type==='FF')starts.push(addDays(sc.end,-t.dur).getTime());
        else starts.push(sc.end.getTime());
      });
      start=new Date(Math.max(...starts));
    }else{
      start=d(t.start);
    }
    start=addDays(start,t.shift||0);
    const end=addDays(start,t.dur);
    computed[t.id]={start,end};
  });
  return computed;
}
function projectSpan(p){
  const sched=scheduleProject(p);
  const starts=p.tasks.map(t=>sched[t.id].start.getTime());
  const ends=p.tasks.map(t=>sched[t.id].end.getTime());
  return{start:new Date(Math.min(...starts)),end:new Date(Math.max(...ends))};
}
function shiftTask(projNo,taskId,delta){
  const p=PROJECTS.find(x=>x.no===projNo);const t=p.tasks.find(x=>x.id===taskId);
  t.shift=(t.shift||0)+delta;
  p.updatedCompletion=fmtISO(projectSpan(p).end);
  if(window.WorkshopData&&WorkshopData.get().projects.some(x=>x.no===p.no))WorkshopData.updateProject(p.no,{tasks:p.tasks,expectedCompletion:p.updatedCompletion});
  renderAll();
}

function activeProjects(){return PROJECTS;}
function projStats(){
  const projects=activeProjects();
  const total=projects.length;
  const inProgress=projects.filter(p=>p.progress>0&&p.phase!=='completed').length;
  const planned=projects.filter(p=>p.progress===0).length;
  const completed=projects.filter(p=>p.phase==='completed').length;
  const overdue=projects.filter(p=>p.phase!=='completed'&&p.deadline<TODAY_ISO).length;
  const plannedHours=projects.reduce((a,p)=>a+(p.plannedHours||0),0);
  const util=EMPLOYEES.length?Math.round(EMPLOYEES.reduce((a,e)=>a+e.util,0)/EMPLOYEES.length):0;
  const revenue=0;
  return{total,inProgress,planned,completed,overdue,plannedHours,util,revenue};
}

function ganttHeaderHtml(rangeStart,rangeEnd,showColHead){
  const t=T[LANG];
  const totalDays=daysBetween(rangeStart,rangeEnd);
  const months=[];let cur=new Date(rangeStart.getFullYear(),rangeStart.getMonth(),1);
  while(cur<rangeEnd){const next=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    const segStart=cur<rangeStart?rangeStart:cur;const segEnd=next>rangeEnd?rangeEnd:next;
    const left=daysBetween(rangeStart,segStart)/totalDays*100;
    months.push({label:cur.toLocaleDateString('en-GB',{month:'short',year:'numeric'}),left});
    cur=next;}
  const tickStep=ganttTickDays;
  const ticks=[];let td=new Date(rangeStart);
  while(td<rangeEnd){ticks.push({label:td.getDate(),left:daysBetween(rangeStart,td)/totalDays*100});td=addDays(td,tickStep);}
  const colhead=showColHead?`<div class="gcolhead"><span class="gch-name">${t.gc_project}</span><span class="gch-date">${t.gc_start}</span><span class="gch-date">${t.gc_end}</span><span class="gch-prog">${t.gc_progress}</span></div>`:`<div class="gcolfixed"></div>`;
  return `<div class="gantthead">${colhead}<div class="gtimeline">
    <div class="gmonths">${months.map(m=>`<span class="gmonthlbl" style="left:${m.left}%">${m.label}</span>`).join("")}</div>
    <div class="gticks">${ticks.map(tk=>`<span class="gtick" style="left:${tk.left}%">${tk.label}</span>`).join("")}</div>
  </div></div>`;
}

function ganttBarHtml(rangeStart,rangeEnd,start,end,status,progress,milestones,extraRight){
  const totalDays=daysBetween(rangeStart,rangeEnd);
  const left=Math.max(0,daysBetween(rangeStart,start)/totalDays*100);
  const width=Math.max(0.6,daysBetween(start,end)/totalDays*100);
  const todayOffset=daysBetween(rangeStart,d(TODAY_ISO))/totalDays*100;
  const msHtml=(milestones||[]).map(m=>{const mo=daysBetween(rangeStart,d(m.date))/totalDays*100;if(mo<0||mo>100)return'';
    return `<div class="gmilestone ${m.done?'done':'pending'}" style="left:${mo}%" title="${escapeHtml(m.name)} — ${escapeHtml(m.date)}"></div>`;}).join("");
  let todayHtml='';
  if(todayOffset>=0&&todayOffset<=100){
    const showLabel=!todayLabelShown;todayLabelShown=true;
    todayHtml=`<div class="gtoday" style="left:${todayOffset}%">${showLabel?`<span class="gtodaylbl">${T[LANG].today}</span>`:''}</div>`;
  }
  return `<div class="gtrack">${todayHtml}
    <div class="gbar st-${status}" style="left:${left}%;width:${width}%" title="${fmtISO(start)} → ${fmtISO(end)}">
      <div class="gfill"></div>${progress?`<div class="gprog" style="right:${100-progress}%"></div>`:''}
    </div>${msHtml}</div>`;
}

    rows.push(`<div class="grow grouprow"><div class="gname" style="width:100%;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;vertical-align:-2px;"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>${t.sub_future.toUpperCase()}</div></div>`);

function monthGrid(monthDate){
  const year=monthDate.getFullYear(),month=monthDate.getMonth();
  const first=new Date(year,month,1);
  const startOffset=(first.getDay()+6)%7; // Monday=0
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<startOffset;i++){const dt=new Date(year,month,1-(startOffset-i));cells.push({date:dt,other:true});}
  for(let dnum=1;dnum<=daysInMonth;dnum++){cells.push({date:new Date(year,month,dnum),other:false});}
  while(cells.length%7!==0||cells.length<42){const last=cells[cells.length-1].date;cells.push({date:addDays(last,1),other:true});}
  return cells;
}

  const p={no,name:f.name,customerId:f.customerId||null,customerName:f.customerName,start:f.expectedStart,deadline:f.expectedFinish,progress:0,plannedHours:f.estHours,usedHours:0,phase:'design',materialStatus:'BOM check required',responsible:'Aleksandar C.',workers:['Marko K.','Elena N.'].slice(0,Math.max(1,f.employees)),machines:f.machines,dependencyNote:f.dependencyNote,problems:[],updatedCompletion:f.expectedFinish,tasks,milestones:[{name:'Drawings approved',date:f.expectedStart,done:false},{name:'Material delivered',date:fmtISO(addDays(d(f.expectedStart),Math.max(3,parseInt(f.materialLeadTime)*7||7))),done:false},{name:'FAT / inspection',date:f.expectedFinish,done:false}]};
  if(window.WorkshopData)WorkshopData.upsertProject(Object.assign({},sharedProject||{},p,{status:'planned',expectedCompletion:p.updatedCompletion}));
  PROJECTS.unshift(p);selectedProjNo=no;setSub('existing');alert(T[LANG].alert_project_created.replace('{no}',no));
}

function saveNewIdea(){
  const name=$("niName").value.trim();if(!name)return;
  const inv=parseFloat($("niInv").value)||0,rev=parseFloat($("niRev").value)||0;
  IDEAS.push({id:nextIdeaId++,name,desc:$("niDesc").value.trim(),source:"internal",category:$("niCat").value||"General",priority:"medium",
    investment:inv,expectedRevenue:rev,estProfit:Math.max(0,rev-inv),estHours:parseFloat($("niHrs").value)||0,
    machines:$("niMachines").value.split(',').map(x=>x.trim()).filter(Boolean),materials:$("niMaterials").value.split(',').map(x=>x.trim()).filter(Boolean),
    scores:{market:+$("niMarket").value||5,profit:Math.min(10,Math.max(1,Math.round((rev-inv)/Math.max(inv,1)*4))),investment:inv<50000?9:6,difficulty:+$("niDifficulty").value||5,equipment:7,devtime:6,strategic:+$("niStrategic").value||5},
    risk:$("niRisk").value,nextAction:$("niNext").value||"Initial review",responsible:$("niResp").value||"Aleksandar C.",targetDate:$("niTarget").value,stage:"new",documents:[]});
  IDEAS[IDEAS.length-1].source=$("niSource").value;IDEAS[IDEAS.length-1].priority=$("niPriority").value;
  closeModal();setSub('ideas');selectedIdeaId=nextIdeaId-1;renderAll();
}
function openUploadIdea(id){
  const t=T[LANG];
  $("fcard").innerHTML=`<h2>${t.documents}</h2>
    <div class="frow"><label for="uiName">${t.ni_filename}</label><input id="uiName" placeholder="Sketch.pdf"></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${t.nc_cancel}</button><button class="tbtn primary" onclick="saveUploadIdea(${id})">${t.nc_save}</button></div>`;

function saveUploadIdea(id){
  const name=$("uiName").value.trim();if(!name)return;
  const ext=name.split('.').pop().toLowerCase();const type=ext==='pdf'?'pdf':(ext==='xlsx'||ext==='xls')?'xls':'doc';
  IDEAS.find(i=>i.id===id).documents.push({name,type,date:TODAY_ISO});
  closeModal();renderAll();
}

$("fov").addEventListener('click',ev=>{if(ev.target===$("fov"))closeModal();});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter'&&ev.key!==' ')return;const el=ev.target.closest('a[role="link"],tr[role="link"],.listcard[role="link"],.gname[role="link"]');if(el){ev.preventDefault();el.click();}});

function renderAll(){
  const t=T[LANG];
  todayLabelShown=false;
  let body;
  if(activeSub==='ideas')body=renderIdeasSub();
  else if(activeSub==='existing')body=renderExistingSub();
  else if(activeSub==='future')body=renderFutureSub();
  else{
    if(activeTab==='gantt')body=renderGanttTab();
    else if(activeTab==='calendar')body=renderCalendarTab();
    else if(activeTab==='timeline')body=renderTimelineTab();
    else if(activeTab==='workload')body=renderWorkloadTab();
    else if(activeTab==='scenarios')body=renderScenariosTab();
    else body=renderOverviewTab();
  }
  const showSidebar=(activeSub==='overview');
  $("app").innerHTML=`${renderHeader()}<div class="maingrid">${showSidebar?`<div class="col">${renderLeft()}</div><div class="col">${body}</div>`:`<div class="col" style="grid-column:1/-1;">${body}</div>`}</div>`;
  syncModuleSidebar();
}

function syncModuleSidebar(){const current=activeSub!=='overview'?activeSub:activeTab;document.querySelectorAll('#moduleSideNav button[data-ms]').forEach(b=>b.classList.toggle('on',b.dataset.ms===current));}
function sidebarPlanning(view){if(['ideas','existing','future'].includes(view)){activeSub=view;activeTab='overview'}else{activeSub='overview';activeTab=view}renderAll();window.scrollTo({top:0,behavior:'smooth'});}

function setLang(code){LANG=code;
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=T[code][el.getAttribute('data-i')]);
  document.documentElement.lang=code==="mk"?"mk-Latn":code;
  document.querySelectorAll('.langmenu button').forEach(b=>b.classList.toggle('active',b.getAttribute('data-lang')===code));
  const _c=$("langcur");if(_c)_c.textContent=code.toUpperCase();
  renderAll();tick();
}
document.querySelectorAll('.langmenu button').forEach(b=>b.addEventListener('click',()=>{setLang(b.getAttribute('data-lang'));$("langc").classList.remove('open');}));
function tick(){const n=new Date();$("time").textContent=n.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
  try{$("date").textContent=n.toLocaleDateString(T[LANG].locale,{weekday:'short',day:'numeric',month:'short'});}catch(e){$("date").textContent=n.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}}
setLang("en");setInterval(tick,10000);

const box=$("embers");const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!reduce){for(let i=0;i<16;i++){const e=document.createElement('div');e.className='ember';e.style.left=Math.random()*100+'%';e.style.setProperty('--drift',(Math.random()*80-40)+'px');const dur=7+Math.random()*9;e.style.animationDuration=dur+'s';e.style.animationDelay=(-Math.random()*dur)+'s';const s=1+Math.random()*2;e.style.width=s+'px';e.style.height=s+'px';box.appendChild(e);}}
(function(){var lc=$("langc"),lt=$("langtoggle");if(lt){lt.addEventListener('click',function(e){e.stopPropagation();lc.classList.toggle('open');});document.addEventListener('click',function(e){if(!lc.contains(e.target))lc.classList.remove('open');});}})();
</script>
