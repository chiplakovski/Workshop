<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varmak AB — Workshop Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#04101f;
    --navy-900:#071a33;
    --navy-900-rgb:7,26,51;
    --navy-800:#0a2447;
    --navy-800-rgb:10,36,71;
    --navy-brand:#013179;
    --navy-brand-rgb:1,49,121;
    --steel-400:#8ea3c0;
    --steel-300:#b9c6da;
    --steel-300-rgb:185,198,218;
    --spark:#4a90ff;
    --spark-rgb:74,144,255;
    --accent-tint:#cfe0ff;
    --ice:#e8f0fb;
    --line-rgb:142,163,192;
    --line:rgba(var(--line-rgb),0.16);
    --font-heading:'Sora',sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --ambient-glow:radial-gradient(circle,rgba(var(--spark-rgb),0.22),transparent 62%);
    --ember-core:var(--spark);
    --ember-glow:0 0 6px 1px rgba(var(--spark-rgb),0.8);
    --dot-glow:0 0 10px 1px rgba(var(--spark-rgb),0.9);
  }
  :root[data-theme="carbon"]{
    --navy-950:#020305;
    --navy-900:#06080c;
    --navy-900-rgb:6,8,12;
    --navy-800:#0a0d13;
    --navy-800-rgb:10,13,19;
    --navy-brand:#16326a;
    --navy-brand-rgb:22,50,106;
    --steel-400:#8792a3;
    --steel-300:#aab4c4;
    --steel-300-rgb:170,180,196;
    --spark:#4f8cff;
    --spark-rgb:79,140,255;
    --accent-tint:#c7ddff;
    --ice:#e9edf3;
    --line-rgb:135,146,163;
    --font-heading:'Space Grotesk',sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --ambient-glow:radial-gradient(circle,rgba(var(--spark-rgb),0.10),transparent 66%);
    --ember-core:#dbe9ff;
    --ember-glow:0 0 7px 2px rgba(var(--spark-rgb),0.95),0 0 17px 5px rgba(var(--spark-rgb),0.42);
    --dot-glow:0 0 12px 2px rgba(var(--spark-rgb),1),0 0 24px 7px rgba(var(--spark-rgb),0.45);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font-body);
    background:var(--navy-950);
    color:var(--ice);
    overflow:hidden;
  }
  .stage{position:relative;min-height:100vh;display:flex;flex-direction:column;}

  /* ── atmospheric background ── */
  .bg{position:absolute;inset:0;z-index:0;overflow:hidden;}
  .bg::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(120% 80% at 78% 18%, rgba(var(--navy-brand-rgb),0.55), transparent 60%),
      radial-gradient(90% 70% at 15% 90%, rgba(var(--navy-800-rgb),0.7), transparent 65%),
      linear-gradient(160deg,var(--navy-950),var(--navy-900) 55%,var(--navy-950));
  }
  .grid{
    position:absolute;inset:0;opacity:0.4;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 30%,transparent 78%);
            mask-image:radial-gradient(circle at 50% 42%,#000 30%,transparent 78%);
  }
  .glow{
    position:absolute;left:50%;top:46%;width:520px;height:520px;
    transform:translate(-50%,-50%);
    background:var(--ambient-glow);
    filter:blur(8px);animation:pulse 6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:0.7;transform:translate(-50%,-50%) scale(1);}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08);}}
  .ember{position:absolute;bottom:-10px;width:2px;height:2px;border-radius:50%;
    background:var(--ember-core);box-shadow:var(--ember-glow);
    animation:rise linear infinite;opacity:0;}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0;}12%{opacity:0.9;}100%{transform:translateY(-105vh) translateX(var(--drift));opacity:0;}}

  /* ── top bar ── */
  .topbar{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:32px 40px;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .logo{font-family:var(--font-heading);font-weight:700;font-size:19px;letter-spacing:0.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px;}
  .brand .logo .dot{width:8px;height:8px;border-radius:0;background:var(--spark);box-shadow:var(--dot-glow);}
  .brand .meta{font-size:12.5px;color:var(--steel-400);line-height:1.55;letter-spacing:0.02em;}
  .clock{text-align:right;font-variant-numeric:tabular-nums;}
  .clock .time{font-family:var(--font-heading);font-size:22px;font-weight:600;letter-spacing:0.02em;}
  .clock .date{font-size:12.5px;color:var(--steel-400);margin-top:2px;letter-spacing:0.04em;}

  /* ── center ── */
  .center{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;}
  .eyebrow{font-size:11px;letter-spacing:0.42em;text-transform:uppercase;color:var(--steel-400);margin-bottom:20px;display:flex;align-items:center;gap:12px;}
  .eyebrow::before,.eyebrow::after{content:"";width:26px;height:1px;background:var(--line);}
  .headline{font-family:var(--font-heading);font-weight:700;font-size:clamp(30px,5.4vw,56px);line-height:1.03;letter-spacing:-0.02em;margin-bottom:14px;}
  .headline em{font-style:normal;color:var(--spark);}
  .sub{color:var(--steel-300);font-size:15px;max-width:400px;margin:0 auto 40px;line-height:1.6;}

  .signin{display:inline-flex;align-items:center;gap:14px;padding:15px 26px;border-radius:0;cursor:pointer;
    font-family:var(--font-heading);font-size:15px;font-weight:600;letter-spacing:0.01em;color:var(--ice);
    background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
    border:1px solid rgba(var(--steel-300-rgb),0.28);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    box-shadow:0 10px 40px rgba(var(--navy-brand-rgb),0.5),inset 0 1px 0 rgba(255,255,255,0.12);
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;}
  .signin:hover{transform:translateY(-2px);border-color:rgba(var(--spark-rgb),0.7);box-shadow:0 16px 50px rgba(var(--spark-rgb),0.4),inset 0 1px 0 rgba(255,255,255,0.18);}
  .signin .gwrap{width:26px;height:26px;border-radius:0;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
  .hint{margin-top:22px;font-size:12px;color:var(--steel-400);letter-spacing:0.03em;display:flex;align-items:center;gap:8px;}
  .hint svg{opacity:0.7;}

  /* ── language switcher (bottom-left) ── */
  /* ── footer ── */
  .footer{position:relative;z-index:2;text-align:center;padding:22px;font-size:11.5px;color:var(--steel-400);letter-spacing:0.06em;border-top:1px solid var(--line);}

  @media (max-width:600px){
    .topbar{padding:22px 22px;}
    .clock .time{font-size:18px;}
    .brand .logo{font-size:16px;}
    }
  @media (prefers-reduced-motion:reduce){.glow,.ember{animation:none;}}

  /* compact collapsible language switcher */
  .langc{position:fixed;z-index:30;left:18px;bottom:16px;font-family:var(--font-body);}
  .langtoggle{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(var(--navy-900-rgb),.8);border:1px solid rgba(var(--line-rgb),0.16);color:var(--steel-300);font-size:12px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:.15s;}
  .langtoggle:hover{color:var(--ice);border-color:rgba(var(--steel-300-rgb),0.35);}
  .langtoggle .globe{width:14px;height:14px;color:var(--steel-400);}
  .langtoggle .cur{font-weight:600;letter-spacing:.08em;}
  .langtoggle .chev{width:12px;height:12px;color:var(--steel-400);transition:transform .18s;}
  .langc.open .langtoggle .chev{transform:rotate(180deg);}
  .langmenu{position:absolute;left:0;bottom:calc(100% + 6px);min-width:158px;background:rgba(var(--navy-900-rgb),.96);border:1px solid rgba(var(--line-rgb),0.18);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 14px 34px rgba(0,0,0,.45);opacity:0;visibility:hidden;transform:translateY(6px);transition:.16s;}
  .langc.open .langmenu{opacity:1;visibility:visible;transform:translateY(0);}
  .langmenu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--steel-300);font-family:var(--font-body);font-size:13px;padding:11px 14px;cursor:pointer;transition:.13s;}
  .langmenu button:hover{background:rgba(var(--spark-rgb),.12);color:var(--ice);}
  .langmenu button.active{color:var(--accent-tint);box-shadow:inset 2px 0 0 var(--spark);}

  /* theme toggle (bottom-right) */
  .themec{position:fixed;z-index:30;right:18px;bottom:16px;font-family:var(--font-body);}
  .themetoggle{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(var(--navy-900-rgb),.8);border:1px solid rgba(var(--line-rgb),0.16);color:var(--steel-300);font-size:12px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:.15s;}
  .themetoggle:hover{color:var(--ice);border-color:rgba(var(--steel-300-rgb),0.35);}
  .themetoggle svg{width:14px;height:14px;color:var(--steel-400);}
  .themetoggle .cur{font-weight:600;letter-spacing:.04em;}

</style>
<script>(function(){try{var v=localStorage.getItem('varmak.theme');if(v==='carbon')document.documentElement.setAttribute('data-theme','carbon');}catch(e){}})();</script>
</head>
<body>
<div class="stage">
  <div class="bg">
    <div class="grid"></div>
    <div class="glow"></div>
    <div id="embers"></div>
  </div>

  <div class="topbar">
    <div class="brand">
      <div class="logo"><span class="dot"></span>Varmak AB</div>
      <div class="meta">Lagmansgatan 31 · 241 71 Marieholm<br>info@varmak.se</div>
    </div>
    <div class="clock">
      <div class="time" id="time">—</div>
      <div class="date" id="date">—</div>
    </div>
  </div>

  <div class="center">
    <div class="eyebrow" data-i="eyebrow">Workshop System</div>
    <h1 class="headline" data-i="headline">Precision starts<br>in the <em>workshop</em>.</h1>
    <p class="sub" data-i="sub">Local tools for jobs, service reports and inventory in one browser workspace.</p>

    <button class="signin" onclick="location.href='hub-desktop.html'">
      <span class="gwrap">
        <span aria-hidden="true">◇</span>
      </span>
      <span data-i="btn">Open local demo</span>
    </button>

    <div class="hint">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span data-i="hint">Local browser demo — authentication is not enabled</span>
    </div>
  </div>

  

<div class="langc" id="langc">
  <div class="langmenu" id="langmenu">
    <button data-lang="sv">Svenska</button>
    <button data-lang="en">English</button>
    <button data-lang="mk">Makedonski</button>
  </div>
  <button class="langtoggle" id="langtoggle" aria-label="Language">
    <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg>
    <span class="cur" id="langcur">EN</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</div>

<div class="themec">
  <button class="themetoggle" id="themeToggle" type="button" aria-label="Switch color theme" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>
    <span class="cur" id="themeCur">Navy</span>
  </button>
</div>
<script>
  const T = {
    sv:{
      eyebrow:"Verkstadssystem",
      headline:'Precision börjar<br>i <em>verkstaden</em>.',
      sub:"Lokala verktyg för jobb, servicerapporter och lager i en webbläsare.",
      btn:"Öppna lokal demo",
      hint:"Lokal webbläsardemo — autentisering är inte aktiverad",
      locale:"sv-SE"
    },
    en:{
      eyebrow:"Workshop System",
      headline:'Precision starts<br>in the <em>workshop</em>.',
      sub:"Local tools for jobs, service reports and inventory in one browser workspace.",
      btn:"Open local demo",
      hint:"Local browser demo — authentication is not enabled",
      locale:"en-GB"
    },
    mk:{
      eyebrow:"Sistem za rabotilnica",
      headline:'Preciznosta počnuva<br>vo <em>rabotilnicata</em>.',
      sub:"Lokalni alatki za rabotni nalozi, servisni izveštai i inventar vo eden prelistuvač.",
      btn:"Otvori lokalno demo",
      hint:"Lokalno demo vo prelistuvač — najavata ne e ovozmožena",
      locale:"mk"
    }
  };

  let current="en";
  function setLang(code){
    current=code;
    const t=T[code];
    document.querySelectorAll('[data-i]').forEach(el=>{
      const k=el.getAttribute('data-i');
      if(k==='headline')el.innerHTML=t[k];else el.textContent=t[k];
    });
    document.documentElement.lang = code==="mk" ? "mk-Latn" : code;
    document.querySelectorAll('.langmenu button').forEach(b=>{
      b.classList.toggle('active', b.getAttribute('data-lang')===code);
    });
    var _c=document.getElementById('langcur');if(_c)_c.textContent=code.toUpperCase();
    tick();
  }
  document.querySelectorAll('.langmenu button').forEach(b=>{
    b.addEventListener('click',()=>{setLang(b.getAttribute('data-lang'));var l=document.getElementById('langc');if(l)l.classList.remove('open');});
  });

  function tick(){
    const n=new Date();
    const loc = T[current].locale;
    document.getElementById('time').textContent=n.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
    try{
      document.getElementById('date').textContent=n.toLocaleDateString(loc,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    }catch(e){
      document.getElementById('date').textContent=n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    }
  }

  // embers
  const box=document.getElementById('embers');
  const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!reduce){
    for(let i=0;i<22;i++){
      const e=document.createElement('div');
      e.className='ember';
      e.style.left=Math.random()*100+'%';
      e.style.setProperty('--drift',(Math.random()*80-40)+'px');
      const dur=7+Math.random()*9;
      e.style.animationDuration=dur+'s';
      e.style.animationDelay=(-Math.random()*dur)+'s';
      const s=1+Math.random()*2;
      e.style.width=s+'px';e.style.height=s+'px';
      box.appendChild(e);
    }
  }

  setLang("en");        // default
  setInterval(tick,10000);

  (function(){var lc=document.getElementById('langc'),lt=document.getElementById('langtoggle');
    if(lt){lt.addEventListener('click',function(e){e.stopPropagation();lc.classList.toggle('open');});
    document.addEventListener('click',function(e){if(!lc.contains(e.target))lc.classList.remove('open');});}})();

  (function(){
    function getTheme(){try{return localStorage.getItem('varmak.theme')||'navy';}catch(e){return 'navy';}}
    function applyTheme(v){
      document.documentElement.setAttribute('data-theme',v==='carbon'?'carbon':'navy');
      var cur=document.getElementById('themeCur');if(cur)cur.textContent=v==='carbon'?'Carbon':'Navy';
      var btn=document.getElementById('themeToggle');if(btn)btn.setAttribute('aria-pressed',v==='carbon'?'true':'false');
    }
    function setTheme(v){try{localStorage.setItem('varmak.theme',v);}catch(e){} applyTheme(v);}
    applyTheme(getTheme());
    var toggle=document.getElementById('themeToggle');
    if(toggle)toggle.addEventListener('click',function(){setTheme(getTheme()==='carbon'?'navy':'carbon');});
  })();
</script>
</body>
</html>
