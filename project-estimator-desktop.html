<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<title>Varmak — Project / Estimator</title><style>
  :root{--navy-950:#04101f;--navy-900:#071a33;--navy-800:#0a2447;--navy-brand:#013179;
    --steel-400:#8ea3c0;--steel-300:#b9c6da;--spark:#4a90ff;--ice:#e8f0fb;
    --line:rgba(142,163,192,0.16);--field:rgba(255,255,255,0.045);--field-line:rgba(185,198,218,0.24);
    --ok:#4ad48a;--warn:#ffb057;--danger:#ff6b6b;
    --st-draft:#8ea3c0;--st-quotation:#9db4d8;--st-approved:#4a90ff;--st-planned:#6fd1ff;--st-active:#4a90ff;--st-hold:#ffb057;--st-completed:#4ad48a;--st-closed:#b9c6da;--st-cancelled:#ff6b6b;;--c-accent:#4a90ff;--c-accent-rgb:74,144,255;--c-accent2:#2c6bd6;--c-accent2-rgb:44,107,214;--c-brand:#013179;--c-brand-rgb:1,49,121;--c-card-rgb:9,23,45;--c-chip:#14202e;--c-danger-rgb:255,107,107;--c-fieldline-rgb:185,198,218;--c-line-rgb:142,163,192;--c-ok-rgb:74,212,138;--c-panel-rgb:7,26,51;--c-panel2:#0a2447;--c-panel2-rgb:10,36,71;--c-planned-rgb:111,209,255;--c-quote-rgb:157,180,216;--c-scrim-rgb:2,8,15;--c-text:#e8f0fb;--c-tint:#cfe0ff;--c-warn-rgb:255,176,87;--font-heading:'Sora',sans-serif;--font-body:'Inter',system-ui,sans-serif;color-scheme:dark;--select-bg:#0a2447;--select-fg:#e8f0fb;}
:root[data-theme="carbon"]{--navy-950:#020305;--navy-900:#06080c;--navy-800:#0a0d13;--navy-brand:#16326a;--steel-400:#a3adbd;--steel-300:#c6cedb;--spark:#4f8cff;--ice:#f2f5fa;--line:rgba(135,146,163,0.16);--field-line:rgba(170,180,196,0.24);--ok:#35c98a;--warn:#f0a544;--danger:#f4635f;--st-draft:#a3adbd;--st-approved:#4f8cff;--st-active:#4f8cff;--st-hold:#f0a544;--st-completed:#35c98a;--st-closed:#c6cedb;--st-cancelled:#f4635f;--c-accent:#4f8cff;--c-accent-rgb:79,140,255;--c-accent2:#2f6ccc;--c-accent2-rgb:47,108,204;--c-brand:#16326a;--c-brand-rgb:22,50,106;--c-card-rgb:9,11,16;--c-chip:#0f1218;--c-danger-rgb:244,99,95;--c-fieldline-rgb:170,180,196;--c-line-rgb:135,146,163;--c-ok-rgb:53,201,138;--c-panel-rgb:6,8,12;--c-panel2:#0a0d13;--c-panel2-rgb:10,13,19;--c-planned-rgb:104,196,240;--c-quote-rgb:148,166,194;--c-scrim-rgb:1,2,4;--c-text:#f2f5fa;--c-tint:#dbe8ff;--c-warn-rgb:240,165,68;--font-heading:'Space Grotesk',sans-serif;--font-body:'IBM Plex Sans',system-ui,sans-serif;--select-bg:#0f131b;--select-fg:#f2f5fa;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);color:var(--ice);min-height:100vh;}
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--navy-950);}
  .bg::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 82% 0%,rgba(var(--c-brand-rgb),0.5),transparent 55%),radial-gradient(80% 60% at 10% 100%,rgba(var(--c-panel2-rgb),0.6),transparent 60%),linear-gradient(160deg,var(--navy-950),var(--navy-900) 60%,var(--navy-950));}
  .grid{position:absolute;inset:0;opacity:0.28;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);}
  .glow{position:absolute;left:50%;top:26%;width:560px;height:560px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(var(--c-accent-rgb),0.16),transparent 62%);filter:blur(8px);animation:pulse 6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
  .ember{position:absolute;bottom:-10px;border-radius:50%;background:var(--spark);box-shadow:0 0 6px 1px rgba(var(--c-accent-rgb),.8);animation:rise linear infinite;opacity:0;}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-105vh) translateX(var(--drift));opacity:0}}
  @media (prefers-reduced-motion:reduce){.glow,.ember{animation:none}}

  .topfull{position:relative;z-index:2;width:100%;padding:22px 48px 0;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;}
  .brand .logo{font-family:var(--font-heading);font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .brand .logo .dot{width:6px;height:6px;background:var(--spark);box-shadow:0 0 9px 1px rgba(var(--c-accent-rgb),.9);}
  .brand .meta{font-size:11px;color:var(--steel-400);margin-top:2px;line-height:1.5;}
  .topright{display:flex;flex-direction:column;align-items:flex-end;gap:9px;}
  .clock{text-align:right;font-variant-numeric:tabular-nums;} .clock .time{font-family:var(--font-heading);font-weight:600;font-size:16px;} .clock .date{font-size:11px;color:var(--steel-400);}
  .who{display:flex;align-items:center;gap:8px;}
  .who .badge{display:flex;align-items:center;gap:7px;padding:5px 10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;}
  .who .badge .av{width:20px;height:20px;background:linear-gradient(135deg,var(--c-accent2),var(--c-panel2));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:var(--font-heading);}
  .who .role{color:var(--spark);font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
  .who .out{background:transparent;border:1px solid var(--field-line);color:var(--steel-300);padding:6px 10px;font-size:12px;cursor:pointer;font-family:var(--font-body);transition:.15s;}
  .who .out:hover{border-color:var(--spark);color:var(--ice);}

  .wrap{position:relative;z-index:2;max-width:1480px;margin:0 auto;padding:26px 40px 90px;}
  .modhead{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .back{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--field-line);color:var(--steel-300);font-family:var(--font-body);font-size:12.5px;padding:9px 13px;cursor:pointer;transition:.15s;}
  .back:hover{border-color:var(--spark);color:var(--ice);}
  .modhead .ttl{display:flex;align-items:center;gap:11px;}
  /* project actions sit in the page header, beside the title */
  .headactions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;}
  .headactions:empty{display:none;}
  @media(max-width:1200px){.modhead{flex-wrap:wrap;} .headactions{margin-left:0;width:100%;justify-content:flex-start;}}
  .modhead .ic{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(var(--c-accent-rgb),.14);box-shadow:inset 0 0 0 1px rgba(var(--c-accent-rgb),.35);}
  .modhead h1{font-family:var(--font-heading);font-weight:600;font-size:22px;letter-spacing:-.01em;} .modhead p{font-size:12px;color:var(--steel-400);}

  .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .search{position:relative;flex:1;min-width:220px;}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--steel-400);}
  .search input{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:var(--font-body);font-size:14px;padding:11px 12px 11px 36px;outline:none;}
  .search input:focus{border-color:var(--spark);}
  .tbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--field-line);background:transparent;color:var(--steel-300);font-family:var(--font-heading);font-weight:600;font-size:13px;padding:11px 15px;cursor:pointer;transition:.16s;white-space:nowrap;}
  .tbtn:hover{border-color:var(--spark);color:var(--ice);}
  .tbtn.primary{background:linear-gradient(180deg,var(--c-accent2),var(--c-brand));border:none;color:#fff;}
  .tbtn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(var(--c-accent2-rgb),.5);}
  .tbtn.ghost2{border-style:dashed;}
  .tbtn.danger{border-color:rgba(var(--c-danger-rgb),.4);color:#ffb3b3;}
  .tbtn.danger:hover{border-color:var(--danger);color:#fff;}
  .tbtn:disabled{opacity:.35;cursor:not-allowed;}
  .tbtn:disabled:hover{transform:none;box-shadow:none;border-color:var(--field-line);color:var(--steel-300);}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .viewtabs{display:flex;gap:6px;margin-bottom:14px;}
  .headactions .viewtabs{margin-bottom:0;}
  .viewtabs button{background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);font-family:var(--font-body);font-size:11.5px;padding:8px 16px;cursor:pointer;transition:.15s;letter-spacing:.02em;text-transform:uppercase;}
  .viewtabs button.active{background:rgba(var(--c-accent-rgb),.16);border-color:rgba(var(--c-accent-rgb),.5);color:var(--c-tint);}

  /* kanban board — each stage carries its own colour so the columns read apart */
  .board{display:grid;grid-template-columns:repeat(6,minmax(168px,1fr));gap:12px;overflow-x:auto;align-items:start;padding-bottom:10px;}
  .bcol{border:1px solid var(--line);background:rgba(255,255,255,.02);min-width:0;transition:.15s;--bs:var(--spark);--bs-rgb:var(--c-accent-rgb);}
  /* One hue per status, shared by the board column and the workflow step strip so a stage looks
     the same wherever it appears. */
  .bcol[data-status="quotation"],.pstep[data-status="quotation"]{--bs:#a78bfa;--bs-rgb:167,139,250;}
  .bcol[data-status="approved"],.pstep[data-status="approved"]{--bs:#22d3ee;--bs-rgb:34,211,238;}
  .bcol[data-status="planned"],.pstep[data-status="planned"]{--bs:#4a90ff;--bs-rgb:74,144,255;}
  .bcol[data-status="active"],.pstep[data-status="active"]{--bs:#4ad48a;--bs-rgb:74,212,138;}
  .bcol[data-status="hold"],.pstep[data-status="hold"]{--bs:#ffb057;--bs-rgb:255,176,87;}
  .bcol[data-status="completed"],.pstep[data-status="completed"]{--bs:#2dd4bf;--bs-rgb:45,212,191;}

  /* Workflow step strip (project detail header, right-hand side). */
  .pipe{display:flex;flex-direction:column;gap:9px;}
  .pipelbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel-400);}
  .psteps{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;}
  .pstep{--bs:#8fa3bf;--bs-rgb:143,163,191;display:flex;align-items:center;gap:6px;font-family:var(--font-body);
    font-size:11px;letter-spacing:.02em;text-transform:uppercase;padding:7px 11px;border:1px solid var(--field-line);
    background:var(--field);color:var(--steel-400);transition:.15s;}
  .pstep::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;flex:none;}
  .pstep.done{color:var(--steel-300);border-color:rgba(var(--bs-rgb),.28);}
  .pstep.done::before{background:rgb(var(--bs-rgb));opacity:.75;}
  .pstep.now{color:var(--bs);border-color:rgba(var(--bs-rgb),.6);
    background:linear-gradient(rgba(var(--bs-rgb),.16),rgba(var(--bs-rgb),.16)),var(--field);font-weight:600;}
  .pstep.now::before{background:rgb(var(--bs-rgb));opacity:1;box-shadow:0 0 8px rgba(var(--bs-rgb),.9);}
  button.pstep.can{cursor:pointer;color:var(--steel-200);border-color:rgba(var(--bs-rgb),.45);
    border-style:dashed;background:var(--field);}
  button.pstep.can:hover{color:var(--bs);border-style:solid;border-color:rgba(var(--bs-rgb),.85);
    background:linear-gradient(rgba(var(--bs-rgb),.12),rgba(var(--bs-rgb),.12)),var(--field);}
  button.pstep.can::before{background:rgb(var(--bs-rgb));opacity:.55;}
  button.pstep.can:hover::before{opacity:1;box-shadow:0 0 8px rgba(var(--bs-rgb),.9);}
  .pipeoff{font-size:11.5px;color:var(--steel-400);}
  .bcol{border-top:2px solid var(--bs);}
  .bcol-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);
    background:linear-gradient(rgba(var(--bs-rgb),.13),rgba(var(--bs-rgb),.13)),var(--navy-800);}
  .bcol-head h3{font-family:var(--font-heading);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--bs);}
  .bcount{font-size:11px;color:var(--bs);background:rgba(var(--bs-rgb),.18);padding:1px 8px;font-variant-numeric:tabular-nums;}
  .bhidden{margin-top:10px;font-size:11px;color:var(--steel-400);}
  .bcards{display:flex;flex-direction:column;gap:8px;padding:10px;min-height:90px;}
  .bcard{background:var(--field);border:1px solid var(--field-line);border-left:3px solid rgba(var(--bs-rgb),.8);padding:10px 11px;cursor:pointer;transition:.15s;}
  .bcard:hover{border-color:rgba(var(--bs-rgb),.6);border-left-color:var(--bs);transform:translateY(-1px);}
  .bcard.dragging{opacity:.45;}
  .bc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;}
  .bc-no{color:var(--spark);font-weight:600;} .bc-val{color:var(--steel-400);}
  .bc-name{font-weight:600;font-size:12.5px;margin:5px 0 2px;line-height:1.35;}
  .bc-cust{font-size:11px;color:var(--steel-400);margin-bottom:8px;}
  .bc-foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--steel-400);margin-top:5px;}
  .bc-foot .over{color:var(--danger);font-weight:600;}
  .bempty{color:var(--steel-400);font-size:11px;text-align:center;padding:12px 0;}
  .bcol.candrop{border-color:rgba(var(--c-accent-rgb),.55);}
  .bcol.candrop.over{background:rgba(var(--c-accent-rgb),.09);}
  .bcol.nodrop{opacity:.38;}
  .filters button{background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);font-family:var(--font-body);font-size:11.5px;padding:8px 12px;cursor:pointer;transition:.15s;letter-spacing:.02em;text-transform:uppercase;}
  .filters button:hover{color:var(--ice);} .filters button.active{background:rgba(var(--c-accent-rgb),.16);border-color:rgba(var(--c-accent-rgb),.5);color:var(--c-tint);}

  .morewrap{margin-bottom:16px;}
  .morepanel{display:none;grid-template-columns:repeat(4,1fr) auto;gap:10px;align-items:end;background:rgba(255,255,255,.03);border:1px solid var(--line);padding:14px;margin-top:8px;}
  .morewrap.open .morepanel{display:grid;}
  .morepanel label{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:5px;}
  .morepanel select,.morepanel input{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:var(--font-body);font-size:12.5px;padding:8px 9px;outline:none;}

  .ptable-wrap{overflow-x:auto;border:1px solid var(--line);background:rgba(255,255,255,.02);}
  .ptable{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1080px;}
  .ptable th{text-align:left;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);border-bottom:1px solid var(--line);padding:11px 12px;cursor:pointer;white-space:nowrap;user-select:none;}
  .ptable th:hover{color:var(--ice);}
  .ptable th .sa{opacity:.5;margin-left:3px;font-size:9px;}
  .ptable td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .ptable tr.prow2{cursor:pointer;transition:.14s;}
  .ptable tr.prow2:hover{background:rgba(var(--c-accent-rgb),.07);}
  .pnum{font-family:var(--font-heading);font-weight:600;color:var(--steel-300);font-size:12px;white-space:nowrap;}
  .pname{font-weight:600;} .pcust2{color:var(--steel-400);font-size:11.5px;}
  .miniprog{width:76px;height:5px;background:rgba(255,255,255,.08);overflow:hidden;} .miniprog i{display:block;height:100%;background:var(--spark);}
  .miniprog i.over{background:var(--warn);}
  .rnum{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .over{color:var(--warn);}
  .emptyrow td{text-align:center;color:var(--steel-400);padding:34px;}
  .kpistrip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .kpi{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:15px 18px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .kpi .kl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:7px;}
  .kpi .kv{font-family:var(--font-heading);font-size:22px;font-weight:600;} .kpi .kv.warn{color:var(--warn);}
  @media(max-width:760px){.kpistrip{grid-template-columns:1fr 1fr;}}

  .sbadge{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;font-weight:600;white-space:nowrap;border:1px solid;}
  .sbadge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
  .sbadge.draft{color:var(--st-draft);border-color:rgba(var(--c-line-rgb),.4);background:rgba(var(--c-line-rgb),.1);}
  .sbadge.quotation{color:var(--st-quotation);border-color:rgba(var(--c-quote-rgb),.4);background:rgba(var(--c-quote-rgb),.12);}
  .sbadge.approved{color:var(--c-tint);border-color:rgba(var(--c-accent-rgb),.4);background:rgba(var(--c-accent-rgb),.12);}
  .sbadge.planned{color:var(--st-planned);border-color:rgba(var(--c-planned-rgb),.4);background:rgba(var(--c-planned-rgb),.1);}
  .sbadge.active{color:var(--c-tint);border-color:rgba(var(--c-accent-rgb),.55);background:rgba(var(--c-accent-rgb),.18);}
  .sbadge.hold{color:var(--st-hold);border-color:rgba(var(--c-warn-rgb),.45);background:rgba(var(--c-warn-rgb),.12);}
  .sbadge.completed{color:var(--st-completed);border-color:rgba(var(--c-ok-rgb),.45);background:rgba(var(--c-ok-rgb),.12);}
  .sbadge.closed{color:var(--st-closed);border-color:rgba(var(--c-fieldline-rgb),.35);background:rgba(var(--c-fieldline-rgb),.08);}
  .sbadge.cancelled{color:var(--st-cancelled);border-color:rgba(var(--c-danger-rgb),.45);background:rgba(var(--c-danger-rgb),.12);}
  .sbadge.unknown{color:var(--steel-300);border-color:rgba(var(--c-line-rgb),.35);background:rgba(var(--c-line-rgb),.08);}

  /* detail header */
  .dethead{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:22px 24px;margin-bottom:18px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}
  .dethead .dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
  /* the quality hold banner sits to the right of the project facts */
  .dhgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start;}
  .dhside:empty{display:none;}
  .dhgrid:has(.dhside:empty){grid-template-columns:minmax(0,1fr);}
  @media(max-width:1200px){.dhgrid{grid-template-columns:minmax(0,1fr);}}
  .dethead .pno{font-family:var(--font-heading);font-size:12px;color:var(--steel-300);letter-spacing:.04em;} .dethead h2{font-family:var(--font-heading);font-weight:600;font-size:22px;margin-top:3px;}
  .dethead .dcust{font-size:12.5px;color:var(--steel-400);margin-top:3px;}
  .dfacts{display:flex;gap:28px;flex-wrap:wrap;}
  .dfacts .df .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:3px;} .dfacts .df .v{font-size:14px;font-weight:600;}
  .roactions{display:flex;gap:8px;flex-wrap:wrap;}
  .roactions .more{position:relative;}
  .moremenu{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:rgba(var(--c-panel-rgb),.98);border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.5);z-index:50;}
  .moremenu.open{display:block;}
  .moremenu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--steel-300);font-family:var(--font-body);font-size:12.5px;padding:11px 14px;cursor:pointer;}
  .moremenu button:hover{background:rgba(var(--c-accent-rgb),.12);color:var(--ice);}

  :root{--navy-950:#04101f;--navy-900:#071a33;--navy-800:#0a2447;--navy-brand:#013179;

:root[data-theme="carbon"]{--navy-950:#020305;--navy-900:#06080c;--navy-800:#0a0d13;--navy-brand:#16326a;--steel-400:#a3adbd;--steel-300:#c6cedb;--spark:#4f8cff;--ice:#f2f5fa;--line:rgba(135,146,163,0.16);--field-line:rgba(170,180,196,0.24);--ok:#35c98a;--warn:#f0a544;--danger:#f4635f;--c-accent:#4f8cff;--c-accent-rgb:79,140,255;--c-accent2:#2f6ccc;--c-accent2-rgb:47,108,204;--c-avatar:#14202e;--c-avatar-line:#2a3444;--c-brand:#16326a;--c-brand-rgb:22,50,106;--c-card-rgb:9,11,16;--c-danger-rgb:244,99,95;--c-fieldline-rgb:170,180,196;--c-line-rgb:135,146,163;--c-navhover-rgb:26,52,102;--c-navicon:#8ba0b8;--c-ok-rgb:53,201,138;--c-panel-rgb:6,8,12;--c-panel2:#0a0d13;--c-panel2-rgb:10,13,19;--c-scrim-rgb:1,2,4;--c-side1-rgb:6,8,12;--c-side2-rgb:3,4,7;--c-side3-rgb:6,8,12;--c-tint:#dbe8ff;--c-warn-rgb:240,165,68;--font-heading:'Space Grotesk',sans-serif;--font-body:'IBM Plex Sans',system-ui,sans-serif;--select-bg:#0f131b;--select-fg:#f2f5fa;}
  *{box-sizing:border-box;margin:0;padding:0;}#estView body{font-family:var(--font-body);color:var(--ice);min-height:100vh;}#estView .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--navy-950);}#estView .bg::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 82% 0%,rgba(var(--c-brand-rgb),0.5),transparent 55%),radial-gradient(80% 60% at 10% 100%,rgba(var(--c-panel2-rgb),0.6),transparent 60%),linear-gradient(160deg,var(--navy-950),var(--navy-900) 60%,var(--navy-950));}#estView .grid{position:absolute;inset:0;opacity:0.28;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);}#estView .glow{position:absolute;left:50%;top:20%;width:560px;height:560px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(var(--c-accent-rgb),0.16),transparent 62%);filter:blur(8px);animation:pulse 6s ease-in-out infinite;}

// Customers are authoritative in WorkshopData (shared v5 state) — every customerId used on this
// page IS a real shared customer id (Stabilisation Pass 2.1). This page no longer maintains its
// own local id numbering, which previously collided with real shared ids (e.g. local id 1 meant
// "Sanus Glutenfri AB" while shared id 1 means "MarineVent AB") and could silently reassign a
// project to the wrong customer on every edit.
let CUSTOMERS=WorkshopData.getCustomers();
function refreshCustomersFromShared(){CUSTOMERS=WorkshopData.getCustomers();}

// Projects are authoritative in WorkshopData (shared v5 state) — this module no longer reads or
// writes varmak.projects.ui.v1 directly; that legacy key is only read once, centrally, by
// workshop-data.js's migration on first load. syncSharedProject pushes every field this page
// itself owns and edits, including the real shared customerId (never re-resolved through a
// different local id table). It deliberately does NOT send bom/phase/progress/tasks/milestones/
// workers/machines/materialStatus/plannedHours/usedHours/estimationId — those belong to other
// modules (Store reservations via reserveItem/issue, Jobcards, Estimation conversion) and must
// not be overwritten with this page's stale/unused copies of them.
const PROJECT_UI_OWNED_FIELDS=['id','no','name','customerRef','poNumber','description','notes','types',
  'pm','workshop','sales','createdDate','plannedStart','actualStart','deadline','plannedCompletion',
  'actualCompletion','closedDate','quotedValue','estLabourHours','estMaterialCost','estPurchaseCost',
  'otherCostEst','otherCostAct','status','holdReason','holdComment','expectedResume','cancelReason',
  'approvedDate',
  'jobcards','hours','materials','purchases','documents','activity','archived'];
function syncSharedProject(p){
  if(!window.WorkshopData?.upsertProject)return null;
  // custName()'s "—" is a UI-only display placeholder for "no customer selected" — it must never
  // be sent as a customer name (workshop-data.js would otherwise treat it as a real, if oddly
  // named, customer to create). Only send a name when a real shared customer record exists.
  const custRecord=custObj(p.customerId);
  const payload={customerId:custRecord?p.customerId:null,customer:custRecord?custRecord.name:null};
  PROJECT_UI_OWNED_FIELDS.forEach(k=>{if(p[k]!==undefined)payload[k]=p[k];});
  const saved=WorkshopData.upsertProject(payload);
  // A rejected write (e.g. QUALITY_HOLD_ACTIVE) has no id/customerId of its own — applying those
  // here would corrupt the in-memory project record. Callers that can hit a protected transition
  // (doComplete/doClose/doReopen) must check the returned result for `.code` before trusting it.
  if(saved&&saved.code)return saved;
  p.id=saved.id;p.customerId=saved.customerId;
  return saved;
}
function refreshProjectsFromShared(){PROJECTS=WorkshopData.getProjects();}
const PEOPLE=["Aleksandar","Marko","Elena","Sofia","Erik"];

let seqProject=10, seqPO=19, seqReport=3;
// Derives the next number from the currently loaded (shared) PROJECTS rather than trusting the
// page-local seqProject counter alone — PROJECTS now reflects prior sessions' real data, and
// upsertProject() matches by `no`, so a stale/repeating counter could silently overwrite an
// existing project instead of creating a new one.
function projNo(){
  const existingNums=PROJECTS.map(p=>{const m=/^P-26-(\d{4})$/.exec(p.no||'');return m?parseInt(m[1],10):0;});
  seqProject=Math.max(seqProject,...existingNums)+1;
  return "P-26-"+String(seqProject++).padStart(4,'0');
}
function poNo(){return "PO-26-"+String(seqPO++).padStart(4,'0');}
function rptNo(){return "RPT-26-"+String(seqReport++).padStart(4,'0');}

// Projects come from the shared v5 state (WorkshopData) — see syncSharedProject()/refreshProjectsFromShared()
// above. This module no longer holds its own hardcoded seed or persists to a page-local key.
let PROJECTS=WorkshopData.getProjects();

function fmt(n){return Math.round(n||0).toLocaleString('sv-SE')+" kr";}

function today(){return new Date();}
function todayISO(){return new Date().toISOString().slice(0,10);}
function daysBetween(iso){if(!iso)return null;return Math.round((new Date(iso+"T12:00:00")-today())/86400000);}
// custName/custObj and the status adapter (uiStatus, canHold, canResume, ...) live in
// project-rules.js (loaded above) so this page and the automated tests share one implementation.
function custName(id){return ProjectRules.custName(CUSTOMERS,id);}
function custObj(id){return ProjectRules.custObj(CUSTOMERS,id);}
// The shared customer schema stores contacts as contacts:[{name,role,email,phone,primary}] rather
// than the flat "Name · email" string this page used to keep locally — this derives an equivalent
// display line (primary contact first) for the print offer.
function custContactLine(cust){
  if(!cust)return"";
  const c=(cust.contacts||[]).find(x=>x.primary)||(cust.contacts||[])[0];
  if(!c)return cust.email||"";
  return[c.name,c.email].filter(Boolean).join(" · ");
}
const {STATUS_ORDER,PIPELINE,uiStatus,isKnownUiStatus,canHold,canResume,canComplete,canClose,canCancel,canReopen,
  canApprove,canPlan,canStart,isReadonlyStatus,statusCssClass}=ProjectRules;
function getProject(id){return PROJECTS.find(p=>p.id===id);}
// Resolves via WorkshopData's central Quality Hold gate (quality-gates.js) — this covers BOTH a
// Project-scoped hold on p.no AND a Jobcard-scoped hold on any real jobcard-desktop.html Jobcard
// linked by projectNo, including the live Jobcards surfaced in this page's Items view below.

function projQualityGate(p){return (p&&window.WorkshopData?.getProjectQualityGate)?WorkshopData.getProjectQualityGate(p.no):{blocked:false,holds:[],reasons:[]};}

function handleQualityBlocked(result){
  if(!result||result.code!=='QUALITY_HOLD_ACTIVE')return false;

function qualityHoldBanner(p){

      <div><div><b>${esc(t.qh_title)}: ${esc(h.no)}</b>${h.severity?` · ${esc(t.qh_severity_label)}: ${esc(h.severity)}`:''}</div>

      ${h.requiredAction?`<div>${esc(t.qh_requiredaction_label)}: ${esc(h.requiredAction)}</div>`:''}</div>
    </div>`).join('')}
  </div>`;
}

// Pass 3.30: Projects' old "Items" were lightweight, page-local Jobcard summaries. The production
// Jobcard module has a richer schema, so this adapter deliberately maps only the compatible fields
// and keeps Projects-only commercial data (estimatedMaterialCost) as an additive overlay. Real
// Jobcards remain authoritative for identity, lifecycle, workers, progress and operation hours;
// legacy local Items remain visible until first edited, when submitJobcard() safely creates their
// real counterpart using the same number. Archived real Jobcards still reserve their numbers in
// the dedup set so a retained local fallback cannot resurrect after deletion.
function realJobcardStatusToLocal(s){
  if(s==='completed'||s==='closed')return'completed';

let VIEW="list",currentId=null,activeTab="overview",moreOpen=false;
let listMode="board",listQuery="",sortKey="no",sortDir=1;
let listFilters={customer:"",responsible:"",type:"",from:"",to:""};

// A raw status is mapped through uiStatus() before it is used for a label/class/filter/sort/KPI —
// a status the adapter doesn't recognise (not in STATUS_ORDER and not a known alias) passes through
// unchanged, so it still renders (with its own raw text as the label) instead of showing "undefined".
function statusBadge(s){
  const known=isKnownUiStatus(s);
  const cls=statusCssClass(s); // 'unknown' (a fixed, safe class) for any unrecognised raw status — never the raw text itself
  const label=known?(T[LANG]["st_"+uiStatus(s)]||s):s;
  return `<span class="sbadge ${cls}">${esc(label)}</span>`;
}

function renderList(){
  const t=T[LANG];
  let rows=PROJECTS.slice();
  if(listQuery){const q=listQuery.toLowerCase();rows=rows.filter(p=>p.no.toLowerCase().includes(q)||p.name.toLowerCase().includes(q)||custName(p.customerId).toLowerCase().includes(q)||(p.customerRef||"").toLowerCase().includes(q));}
  if(listFilters.customer)rows=rows.filter(p=>String(p.customerId)===listFilters.customer);
  if(listFilters.responsible)rows=rows.filter(p=>p.pm===listFilters.responsible||p.workshop===listFilters.responsible||p.sales===listFilters.responsible);
  if(listFilters.type)rows=rows.filter(p=>p.types.includes(listFilters.type));
  if(listFilters.from)rows=rows.filter(p=>p.deadline&&p.deadline>=listFilters.from);
  if(listFilters.to)rows=rows.filter(p=>p.deadline&&p.deadline<=listFilters.to);
  const valOf={no:p=>p.no,name:p=>p.name,customer:p=>custName(p.customerId),status:p=>uiStatus(p.status),start:p=>p.plannedStart||"",deadline:p=>p.deadline||"",progress:p=>progressOf(p),responsible:p=>p.pm,quoted:p=>p.quotedValue,actual:p=>totalActualCost(p)}[sortKey]||(p=>p.no);
  rows=rows.slice().sort((a,b)=>{const av=valOf(a),bv=valOf(b);return (av>bv?1:av<bv?-1:0)*sortDir;});

  const kQuoted=rows.reduce((a,p)=>a+p.quotedValue,0);
  const kActual=rows.reduce((a,p)=>a+totalActualCost(p),0);
  const kOverdue=rows.filter(p=>!['completed','closed','cancelled'].includes(uiStatus(p.status))&&daysBetween(p.deadline)!==null&&daysBetween(p.deadline)<0).length;
  const kHold=rows.filter(p=>uiStatus(p.status)==='hold').length;

  // The board's columns are the statuses, so it replaces the old status filter chips.
  const modes=`<div class="viewtabs" id="viewtabs">
      <button data-m="board" class="${listMode==='board'?'active':''}">${t.view_board}</button>
      <button data-m="table" class="${listMode==='table'?'active':''}">${t.view_table}</button>
      <button data-m="estimate" class="">${t.view_estimate}</button>
    </div>`;
  const custOpts=CUSTOMERS.map(c=>`<option value="${c.id}" ${listFilters.customer==String(c.id)?'selected':''}>${esc(c.name)}</option>`).join("");
  const respOpts=PEOPLE.map(n=>`<option value="${n}" ${listFilters.responsible===n?'selected':''}>${n}</option>`).join("");
  const typeOpts=TYPES.map(x=>`<option value="${x}" ${listFilters.type===x?'selected':''}>${x}</option>`).join("");

  const trs=rows.map(p=>{const prog=progressOf(p);const dl=daysBetween(p.deadline);const estH0=jcTotals(p).est;const over=estH0&&actLabourHours(p)>estH0;
    return `<tr class="prow2" onclick="openProject(${p.id})">
      <td class="pnum">${p.no}</td>
      <td class="pname">${esc(p.name)}</td>
      <td>${esc(custName(p.customerId))}<div class="pcust2">${esc(p.customerRef||"")}</div></td>
      <td>${esc(p.customerRef||"—")}</td>
      <td>${statusBadge(p.status)}</td>
      <td class="rnum">${fmtD(p.plannedStart)}</td>
      <td class="rnum ${dl!==null&&dl<0&&!['completed','closed','cancelled'].includes(uiStatus(p.status))?'over':''}">${fmtD(p.deadline)}</td>
      <td><div class="miniprog"><i class="${over?'over':''}" style="width:${prog}%"></i></div><div class="pcust2">${prog}%</div></td>
      <td>${p.pm||"—"}</td>
      <td class="rnum">${p.quotedValue?fmt(p.quotedValue):"—"}</td>
      <td class="rnum">${fmt(totalActualCost(p))}</td>
    </tr>`;}).join("");

  $("listView").innerHTML=`
    <div class="kpistrip">
      <div class="kpi"><div class="kl">${t.kpi_quoted}</div><div class="kv">${fmt(kQuoted)}</div></div>
      <div class="kpi"><div class="kl">${t.kpi_actual}</div><div class="kv">${fmt(kActual)}</div></div>
      <div class="kpi"><div class="kl">${t.kpi_overdue}</div><div class="kv ${kOverdue?'warn':''}">${kOverdue}</div></div>
      <div class="kpi"><div class="kl">${t.kpi_hold}</div><div class="kv ${kHold?'warn':''}">${kHold}</div></div>
    </div>

// ── Board view ──
// The board shows the working pipeline only. Draft, Closed and Cancelled are start/archive
// states rather than stages, so they stay in the Table view — the board reports how many
// projects that hides so none of them disappear silently.
const BOARD_ORDER=['quotation','approved','planned','active','hold','completed'];
// A card may only be dragged where project-rules.js permits a transition. The drop then runs the
// very same flow the action buttons use, so the required reasons, the completion/quality gates and
// the activity-log entry all still happen — dragging never writes a status directly.
function boardTargets(p){
  const s=new Set();
  if(canApprove(p))s.add('approved');
  if(canPlan(p))s.add('planned');
  if(canStart(p))s.add('active');
  if(canHold(p))s.add('hold');
  if(canResume(p)){s.add('active');s.add('planned');}
  if(canReopen(p)){s.add('active');s.add('completed');}
  if(canComplete(p))s.add('completed');
  if(canClose(p))s.add('closed');
  if(canCancel(p))s.add('cancelled');
  s.delete(uiStatus(p.status));
  return s;
}
function boardDrop(p,target){
  // Each quoting-chain check is true for exactly one source status, so these can never both match
  // a resume/reopen below for the same card (a 'planned' drop is either an approved project being
  // scheduled or a held one being resumed — never both).
  if(target==='approved'&&canApprove(p))return openApproveForm(p);
  if(target==='planned'&&canPlan(p))return openPlanForm(p);
  if(target==='active'&&canStart(p))return openStartForm(p);
  if(target==='hold'&&canHold(p))return openHoldForm(p);
  if((target==='active'||target==='planned')&&canResume(p))return openResumeForm(p);
  if((target==='active'||target==='completed')&&canReopen(p))return openReopenForm(p);
  if(target==='completed'&&canComplete(p))return openCompleteFlow(p);
  if(target==='closed'&&canClose(p))return openCloseFlow(p);
  if(target==='cancelled'&&canCancel(p))return openCancelForm(p);
}
function renderBoard(rows){
  const t=T[LANG];
  return `<div class="board" id="board">${BOARD_ORDER.map(st=>{
    const items=rows.filter(p=>uiStatus(p.status)===st);
    const cards=items.map(p=>{
      const prog=progressOf(p),dl=daysBetween(p.deadline);
      const late=dl!==null&&dl<0&&!['completed','closed','cancelled'].includes(st);
      return `<article class="bcard" draggable="true" data-id="${p.id}" tabindex="0" role="button" aria-label="${esc(p.no+' — '+p.name)}">
        <div class="bc-top"><span class="bc-no">${esc(p.no)}</span>${p.quotedValue?`<span class="bc-val">${fmt(p.quotedValue)}</span>`:''}</div>
        <div class="bc-name">${esc(p.name)}</div>
        <div class="bc-cust">${esc(custName(p.customerId))}</div>
        <div class="miniprog"><i style="width:${prog}%"></i></div>
        <div class="bc-foot"><span>${prog}%</span><span class="${late?'over':''}">${p.deadline?fmtD(p.deadline):'—'}</span></div>
      </article>`;}).join("");
    return `<section class="bcol" data-status="${st}">
      <header class="bcol-head"><h3>${t["f_"+st]}</h3><span class="bcount">${items.length}</span></header>
      <div class="bcards">${cards||`<div class="bempty">${t.emptylist}</div>`}</div>
    </section>`;}).join("")}</div>${boardHiddenNote(rows)}`;
}
// Anything whose status is not a board column (draft/closed/cancelled, or an unrecognised
// status) would otherwise just vanish from the view, so say so and where to find it.
function boardHiddenNote(rows){
  const t=T[LANG];
  const hidden=rows.filter(p=>!BOARD_ORDER.includes(uiStatus(p.status)));
  if(!hidden.length)return "";
  const byStatus={};
  hidden.forEach(p=>{const k=uiStatus(p.status);byStatus[k]=(byStatus[k]||0)+1;});
  const parts=Object.keys(byStatus).map(k=>`${esc(t["f_"+k]||k)} ${byStatus[k]}`).join(" · ");
  return `<div class="bhidden">${esc(t.board_hidden.replace('{n}',hidden.length))} ${parts}</div>`;
}
function wireBoard(){
  const board=$("board");if(!board)return;
  let dragId=null;
  const clearMarks=()=>board.querySelectorAll('.bcol').forEach(c=>c.classList.remove('candrop','nodrop','over'));
  board.querySelectorAll('.bcard').forEach(card=>{
    const open=()=>openProject(Number(card.dataset.id));
    card.addEventListener('click',open);
    card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
    card.addEventListener('dragstart',e=>{
      const p=getProject(Number(card.dataset.id));if(!p)return;
      dragId=p.id;card.classList.add('dragging');
      const ok=boardTargets(p);
      board.querySelectorAll('.bcol').forEach(c=>c.classList.add(ok.has(c.dataset.status)?'candrop':'nodrop'));
      try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(p.id));}catch(err){}
    });
    card.addEventListener('dragend',()=>{dragId=null;card.classList.remove('dragging');clearMarks();});
  });
  board.querySelectorAll('.bcol').forEach(col=>{
    col.addEventListener('dragover',e=>{if(col.classList.contains('candrop')){e.preventDefault();col.classList.add('over');}});
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{
      e.preventDefault();col.classList.remove('over');
      if(!col.classList.contains('candrop'))return;
      const p=getProject(dragId);if(p)boardDrop(p,col.dataset.status);
    });
  });
}

// Pass 3.29: same disconnect as Pass 3.28's Documents fix, for Purchases. p.purchases was
// page-local only, never connected to the real Purchasing module (WorkshopData.getPurchaseOrders()/
// upsertPurchaseOrder()) - a PO created here was invisible in purchasing-desktop.html/
// suppliers-desktop.html and vice versa. Unlike Documents (add-only), this tab has edit/delete-by-
// index actions, so - learning from Pass 3.27's stale-index bug class - the merged array itself
// (not the raw p.purchases) is now the ONE thing openPoForm()/submitPo()/deletePo() index into, so
// there is never a mismatch between what's rendered and what a click index refers to.
// po.po (this page's own stable PO number, e.g. "PO-26-0004") is reused directly as the real
// record's `no` - upsertPurchaseOrder() matches by no, so this naturally creates the real record
// the first time a PO is edited/created here and updates the SAME real record on every edit after
// that, with no separate sharedId tracking needed.
// ordered/received are genuinely SEK values here (see pof_ordered/pu_ordered's own translated
// labels: "Ordered value (SEK)") - ordered maps directly to the real value field. received (partial
// receipt tracking) has no real-side equivalent and stays Projects-only, defaulting to 0 for a PO
// that originated on another page.
function poLocalStatusToReal(s){
  return{draft:'Draft',requested:'Awaiting Approval',ordered:'Confirmed',partdelivered:'Partially Received',delivered:'Received',cancelled:'Cancelled'}[s]||'Draft';
}
function poRealStatusToLocal(s){
  // Overdue has no distinct local state - folded into 'ordered' (still in progress, just late),
  // same "collapse the richer real vocabulary" approach as Pass 3.28's realDocStatusToLocal().
  return{Draft:'draft','Awaiting Approval':'requested',Confirmed:'ordered',Overdue:'ordered','Partially Received':'partdelivered',Received:'delivered',Cancelled:'cancelled'}[s]||'ordered';
}
function projectPoRows(p){
  const live=(window.WorkshopData?WorkshopData.getPurchaseOrders():[]).filter(po=>po.project===p.no);
  const rows=live.filter(po=>!po.archived).map(po=>({po:po.no,supplier:po.supplier,date:po.date,items:po.items,ordered:po.value||0,received:0,status:poRealStatusToLocal(po.status),expected:po.expected}));

let openFolders={};
// Pass 3.28: p.documents was a page-local, folder-keyed object never connected to the real
// Documents module (WorkshopData.getDocuments()/upsertDocument()) - a document added here was
// invisible in documents-desktop.html and vice versa. This derives the folder view LIVE from real
// documents tagged module:'Projects', record:p.no (the exact convention already used by this
// project's own seed data - see e.g. "Project Drawing Rev B.pdf" in workshop-data.js), grouped by
// `category` (the real module's closest equivalent to a "folder"), merged with any pre-existing
// local p.documents entries not already present as a real record (matched by name+folder, same
// dedup approach as Pass 3.7's supplierOrderRows()) so nothing already there is lost.
function realDocStatusToLocal(status){
  // The real Documents module's 5-value lifecycle (Draft/Valid/Approved/Review Soon/Expired, plus
  // Archived) does not map 1:1 onto this page's simpler 3-value one (current/superseded/archived) -
  // collapsed for a consistent look here: Archived stays archived; Expired/Review Soon (needs
  // attention) becomes superseded; everything else (Valid/Approved/Draft - still active) is current.
  if(status==='Archived')return'archived';
  if(status==='Expired'||status==='Review Soon')return'superseded';
  return'current';
}
function projectDocRows(p){
  const live=(window.WorkshopData?WorkshopData.getDocuments():[]).filter(d=>d.module==='Projects'&&d.record===p.no);
  const byFolder={};
  live.forEach(d=>{
    const folder=d.category||'Other';
    (byFolder[folder]=byFolder[folder]||[]).push({name:d.name,rev:d.revision||'-',date:(d.updated||'').slice(0,10),by:d.author||'—',status:realDocStatusToLocal(d.status)});
  });
  Object.keys(p.documents||{}).forEach(folder=>{
    (p.documents[folder]||[]).forEach(d=>{
      if(!(byFolder[folder]||[]).some(x=>x.name===d.name))(byFolder[folder]=byFolder[folder]||[]).push(d);
    });
  });
  return byFolder;
}

    if(existing&&existing.projectNo!==p.no){alert('This Jobcard number already belongs to another project.');return;}
    const item={...row,...input};

      ?WorkshopData.updateJobcard(editJcNo,{title:desc,item:desc,plannedHours:item.est,estimatedMaterialCost:item.estMaterial,workers:sharedWorkersForProjectItem(item.assigned,p,existing)})
      :WorkshopData.upsertJobcard({...projectItemJobcardPayload(p,item,null),no:item.no});

    let local=p.jobcards.find(x=>x.no===editJcNo);

    else p.jobcards.push({no:item.no,status:item.status,act:item.act,progress:item.progress,...input});

function resolveInventoryCode(name){
  if(!window.WorkshopData)return null;
  const inv=WorkshopData.get().inventory||[];
  const n=name.trim().toLowerCase();
  const match=inv.find(x=>x.code.toLowerCase()===n||(x.description||'').toLowerCase()===n);
  return match?match.code:null;
}
function submitMaterial(){
  const name=$("matName").value.trim();if(!name)return;
  const p=getProject(currentId);
  // Pass 3.27 bug hunt: PROJECTS is replaced wholesale by refreshProjectsFromShared() reacting to
  // workshop:data (an existing listener, but only genuinely reachable cross-tab since Pass 3.19 -
  // before that, workshop:data never crossed tabs) while this modal can be open - if the material
  // this modal was opened for was removed/reordered by a concurrent edit elsewhere in the
  // meantime, p.materials[editMatIdx] is now stale.
  if(editMatIdx!==null&&!p.materials[editMatIdx]){alert(T[LANG].err_row_changed);closeModal();render();return;}
  const qty=parseFloat($("matQty").value)||0;
  const prevStatus=editMatIdx!==null?p.materials[editMatIdx].status:null;
  const vals={name,spec:$("matSpec").value.trim(),qty,unit:$("matUnit").value.trim(),
    source:$("matSource").value,status:$("matStatus").value,jobcard:$("matItem").value,cost:parseFloat($("matCost").value)||0};

  // Route store-sourced reservations/issues through the shared inventory engine in workshop-data.js
  // (reserveItem/issue) instead of hand-editing reserved/issued/used numbers locally, so store stock,
  // movements and BOM readiness stay authoritative. Only call it on a new record or a genuine status
  // transition, so a plain field edit doesn't double-reserve or double-issue the same quantity.
  if(vals.source==='store'&&vals.status!==prevStatus&&(vals.status==='reserved'||vals.status==='issued'||vals.status==='used')){
    const code=resolveInventoryCode(name);
    if(code){
      const call=vals.status==='reserved'?WorkshopData.reserveItem:WorkshopData.issue;
      const result=call({code,projectNo:p.no,qty,jobcard:vals.jobcard,user:'Aleksandar'});
      if(result&&result.error)alert(result.error);
      else if(result&&result.item)vals.cost=Math.round(qty*result.item.avgCost);
    }
  }

  if(editMatIdx!==null){Object.assign(p.materials[editMatIdx],vals);pushActivity(p,"Material edited: "+name);}
  else{p.materials.push(vals);pushActivity(p,"Material added: "+name);}
  syncSharedProject(p);closeModal();activeTab="materials";render();
}

  // POs, missing reports) — it can never bypass an active Quality Hold: syncSharedProject() below

// The workflow step strip shown in the project header. It never decides anything itself: a step is
// clickable only when the matching ProjectRules check says so, and clicking runs the same gated flow
// the More menu and a board drop run, so all three routes share one set of rules and one audit trail.
function pipeAction(p,step){
  if(step==='approved'&&canApprove(p))return'approve';
  if(step==='planned'&&canPlan(p))return'plan';
  if(step==='active'&&canStart(p))return'start';
  if((step==='active'||step==='planned')&&canResume(p))return'resume';
  if(step==='active'&&canReopen(p))return'reopen';
  return null;
}
function renderPipeline(p){
  const t=T[LANG],cur=uiStatus(p.status),at=PIPELINE.indexOf(cur);
  const steps=PIPELINE.map((st,i)=>{
    const isNow=st===cur,act=isNow?null:pipeAction(p,st),done=at>=0&&i<at;
    const cls=['pstep',isNow?'now':'',done?'done':'',act?'can':''].filter(Boolean).join(' ');
    const title=isNow?t.pipe_current:act?t.pipe_next:done?t.pipe_done:'';
    return act?`<button class="${cls}" data-status="${st}" title="${esc(title)}" onclick="handleAction('${act}')">${t["f_"+st]}</button>`
              :`<span class="${cls}" data-status="${st}" title="${esc(title)}">${t["f_"+st]}</span>`;
  }).join("");
  // A project parked on hold, or already finished, is off the chain — say so rather than leaving
  // the strip looking like it simply never started.
  const off=at<0?`<div class="pipeoff">${t.pipe_off.replace("{s}",t["f_"+cur]||esc(p.status))}</div>`:"";
  return `<div class="pipe"><div class="pipelbl">${t.pipe_label}</div><div class="psteps">${steps}</div>${off}</div>`;
}

function isBlank(v){return v===undefined||v===null||String(v).trim()==='';}
function isNonNegNumber(v){const n=Number(v);return Number.isFinite(n)&&n>=0;}
function isPositiveNumber(v){const n=Number(v);return Number.isFinite(n)&&n>0;}
function isPercent(v){const n=Number(v);return Number.isFinite(n)&&n>=0&&n<=100;}

// ── dynamic estimation numbering: derives the year from the given date (or today) instead of hard-coding it ──
function nextEstNumber(dateStr){
  const year=(dateStr?new Date(dateStr):new Date()).getFullYear();
  const prefix=`EST-${year}-`;
  const sharedNos=(window.WorkshopData?WorkshopData.get().estimations.map(x=>x.no):[]);
  const known=new Set([...ESTIMATIONS.map(x=>x.no),...sharedNos]);
  let n=1;while(known.has(prefix+String(n).padStart(3,'0')))n++;
  return prefix+String(n).padStart(3,'0');
}

// Estimations used to expose only its seven hardcoded customers plus a one-off MarineVent record.
// Merge every shared customer instead, while preserving the local numeric ids referenced by the
// detailed seed estimates. sharedId (or organisation number/name on first load) keeps updates and
// renames attached to the same local option; genuinely new customers receive the next free local id.
function hydrateSharedCustomers(){
  if(!window.WorkshopData)return;
  let nextLocalId=Math.max(0,...Object.keys(ESTCUST).map(Number));
  WorkshopData.getCustomers().forEach(sc=>{
    const key=Object.keys(ESTCUST).find(id=>ESTCUST[id].sharedId===sc.id)||
      Object.keys(ESTCUST).find(id=>sc.org&&sc.org!=='—'&&ESTCUST[id].org===sc.org)||
      Object.keys(ESTCUST).find(id=>ESTCUST[id].name===sc.name)||String(++nextLocalId);
    const current=ESTCUST[key]||{},primary=(sc.contacts||[]).find(c=>c.primary)||(sc.contacts||[])[0];
    ESTCUST[key]={...current,sharedId:sc.id,name:sc.name,city:sc.city||'—',address:(sc.billing||[]).join(', ')||current.address||'—',
      contact:primary?primary.name:'—',email:sc.email||'—',phone:sc.phone||'—',org:sc.org||'—',status:sc.status||'active'};
  });
}
function localCustomerIdForShared(sharedId,name){
  const key=Object.keys(ESTCUST).find(id=>ESTCUST[id].sharedId===sharedId)||Object.keys(ESTCUST).find(id=>ESTCUST[id].name===name);
  return Number(key||Object.keys(ESTCUST)[0]);
}

function projectItems(projectNo){

}

(function normalizeSeedEstimations(){

    if(e.revisionSnapshots===undefined)e.revisionSnapshots=[];

// Reads every field this module itself persists back from WorkshopData, so notes, documents, work items,
// options, terms, exclusions and status all survive a page refresh — for BOTH the hardcoded seed estimates
// (which re-run their literal JS object on every load) and estimates created purely in this session.
// Named (not an IIFE) so it can be re-run on workshop:data (see the listener near the bottom of
// this file) - an estimation created/updated elsewhere (e.g. Customers' "New Quote", Pass 3.10, or
// another tab entirely - workshop-data.js reloads on the browser's native 'storage' event and
// re-dispatches workshop:data, see that file's own comment) now reaches this page without a full
// reload. Already safe to re-run as-is: for an estimation this module has already seen it adopts
// the shared record's fields verbatim (see the comment a few lines below - syncEstimation() always
// writes the complete field set, so there is never local-only unsaved state to lose), and for a
// genuinely new one it hydrates fresh.
function hydrateSharedEstimations(){
  if(!window.WorkshopData)return;
  const shared=WorkshopData.get();
  shared.estimations.forEach(se=>{
    const existing=ESTIMATIONS.find(e=>e.no===se.no);
    if(existing){
      // A record with this number already exists locally (seed data or this session) — this shared
      // record is what WE last saved for it (syncEstimation always writes the full field set below),
      // so adopt it verbatim rather than rebuilding anything from an invented value.
      existing.sharedId=se.id;existing.customerId=localCustomerIdForShared(se.customerId,se.customer);existing.status=se.status;existing.revision=se.revision||0;
      existing.created=se.created;existing.validUntil=se.validUntil;existing.currency=se.currency||existing.currency;
      if(Array.isArray(se.workItems))existing.workItems=se.workItems;
      if(Array.isArray(se.options))existing.options=se.options;
      if(se.terms!==undefined)existing.terms=se.terms;
      if(Array.isArray(se.exclusions))existing.exclusions=se.exclusions;
      if(Array.isArray(se.notes))existing.notes=se.notes;
      if(Array.isArray(se.documents))existing.documents=se.documents;
      if(se.overheadPct!==undefined)existing.overheadPct=se.overheadPct;
      if(se.contingencyPct!==undefined)existing.contingencyPct=se.contingencyPct;
      if(se.discount!==undefined)existing.discount=se.discount;
      if(se.reference!==undefined)existing.reference=se.reference;
      if(se.customerRfq!==undefined)existing.customerRfq=se.customerRfq;
      if(se.opportunityRef!==undefined)existing.opportunityRef=se.opportunityRef;
      if(se.requestedDelivery!==undefined)existing.requestedDelivery=se.requestedDelivery;
      if(se.estimator!==undefined)existing.estimator=se.estimator;
      if(se.title!==undefined)existing.projectTitle=se.title;
      if(se.deliveryTime!==undefined)existing.deliveryTime=se.deliveryTime;
      if(se.paymentTerms!==undefined)existing.paymentTerms=se.paymentTerms;
      if(se.priceList!==undefined)existing.priceList=se.priceList;
      if(se.incoterms!==undefined)existing.incoterms=se.incoterms;
      if(se.createdBy!==undefined)existing.createdBy=se.createdBy;
      if(se.projectNo!==undefined)existing.projectNo=se.projectNo;
      if(Array.isArray(se.history)&&se.history.length)existing.history=se.history;
      if(Array.isArray(se.revisionSnapshots))existing.revisionSnapshots=se.revisionSnapshots;
      if(se.archived!==undefined)existing.archived=se.archived;
      return;
    }
    // Genuinely new shared estimation this module has never seen locally (e.g. created from another
    // module such as Planning). Hydrate directly from its own real fields — never from an invented value.
    const project=shared.projects.find(p=>p.id===se.projectId),localCustomerId=localCustomerIdForShared(se.customerId,se.customer);
    const hasDetail=Array.isArray(se.bom)&&se.bom.length>0;
    const workItems=hasDetail?[{no:'',desc:'Bill of Materials',lines:se.bom.map(b=>({desc:b.description||b.code,category:'material',qty:Number(b.qty)||1,unit:b.unit||'EA',weight:0,waste:0,cost:0,sell:0,disc:0,tax:25}))}]:[{no:'',desc:'Work items',lines:[]}];
    ESTIMATIONS.push({id:se.id,sharedId:se.id,no:se.no,customerId:localCustomerId,projectNo:project?project.no:(se.projectNo||null),projectTitle:se.title,status:se.status,created:se.created,validUntil:se.validUntil,currency:se.currency||'SEK',deliveryTime:se.deliveryTime||'4–5 weeks',paymentTerms:se.paymentTerms||'30 days',priceList:se.priceList||'Standard Price List 2026',incoterms:se.incoterms||'EXW Marieholm',reference:se.reference||'—',customerRfq:se.customerRfq||'',opportunityRef:se.opportunityRef||'',requestedDelivery:se.requestedDelivery||se.deliveryTarget||'',createdBy:se.createdBy||'Aleksandar C.',estimator:se.estimator||'Aleksandar C.',overheadPct:se.overheadPct===undefined?8:se.overheadPct,contingencyPct:se.contingencyPct===undefined?5:se.contingencyPct,discount:se.discount||0,workItems:Array.isArray(se.workItems)?se.workItems:workItems,options:Array.isArray(se.options)?se.options:[],exclusions:Array.isArray(se.exclusions)?se.exclusions:[],terms:se.terms||'Prices valid for 30 days.',documents:Array.isArray(se.documents)?se.documents:[],history:Array.isArray(se.history)&&se.history.length?se.history:(se.revisions||[]).map(r=>({date:r.date,action:`Revision ${r.rev}: ${r.reason}`,by:r.author})),notes:Array.isArray(se.notes)?se.notes:[],revision:se.revision||0,revisionSnapshots:Array.isArray(se.revisionSnapshots)?se.revisionSnapshots:[],sharedBom:se.bom||[],plannedHours:se.plannedHours||0,machines:se.machines||[],deliveryTarget:se.deliveryTarget});
    nextEstId=Math.max(nextEstId,se.id+1);
  });
  ESTIMATIONS.forEach(e=>{if(e.revision==null)e.revision=Math.max(0,(e.history||[]).filter(h=>/Rev|Revision/.test(h.action)).length-1)});
}
hydrateSharedEstimations();

// Hand every estimate's legacy work items to its project once, at load, rather than waiting for
// each one to be opened - otherwise the project list would report items the projects do not yet
// have. Each call is a no-op for a project that already owns its items.
function adoptAllLegacyWorkItems(){
  ESTIMATIONS.filter(e=>!e.archived&&e.projectNo).forEach(e=>{adoptLegacyWorkItems(e);syncWorkItemsToProject(e);});
}

let selectedId=2,filterStatus="all",query="",showCost=false,activeOptTab="base";

function getEst(id){return ESTIMATIONS.find(e=>e.id===id);}
// One estimate per project: the project is what is being quoted, so the module is browsed by
// project and an estimate is simply the pricing attached to one.
function estForProject(no){return ESTIMATIONS.find(e=>!e.archived&&e.projectNo===no)||null;}
// The estimate's visible reference is read off the project, not a separate document number, and an
// item's reference is that project number plus its position: P-26-0008-02 is P-26-0008's second item.
function estRef(e){return e&&e.projectNo?e.projectNo:(e?e.no:'—');}
function itemRef(e,seq){return e&&e.projectNo?EstimationRules.itemEstRef(e.projectNo,seq):String(seq);}
// Rebuilds the priced work items from the project's items on every read. Pricing for an item that
// has left the project is kept aside rather than dropped, and returns intact if the item comes back.
// One-time upgrade. Before this pass an estimate kept its own free-text work items, unconnected to
// the project it was quoting. Those items describe real work, so they are handed to the project
// rather than retired wholesale: the project takes them on as its own items, and the estimate's
// pricing is rebound to the item numbers the project hands back. It runs only for a project that
// has no items of its own, so it can never duplicate work the project already tracks.
function adoptLegacyWorkItems(e){
  if(!e||!e.projectNo||!window.WorkshopData||!WorkshopData.upsertJobcard)return 0;
  if(projectItems(e.projectNo).length)return 0;
  const p=WorkshopData.getProjects().find(x=>x.no===e.projectNo);
  if(!p)return 0;
  // No number check here: the early return above already guarantees the project has no items of its
  // own, so anything the estimate is holding is legacy by definition. The seeded work items carry
  // JC-style numbers that never matched a real jobcard, which is exactly what this repairs.
  const legacy=(e.workItems||[]).filter(w=>w&&w.desc);
  if(!legacy.length)return 0;
  let adopted=0;
  legacy.forEach(w=>{
    const lines=w.lines||[];
    const hours=lines.filter(l=>l.category==='labour').reduce((a,l)=>a+(Number(l.qty)||0),0);
    const material=lines.filter(l=>l.category==='material').reduce((a,l)=>a+EstimationRules.lineCostTotal(l),0);
    const saved=WorkshopData.upsertJobcard({projectId:p.id,projectNo:p.no,customerId:p.customerId,customer:p.customer,
      title:w.desc,item:w.desc,quantity:1,revision:0,workType:'other',location:'workshop',priority:'medium',
      responsible:'Aleksandar C.',workers:[],status:'draft',plannedHours:hours,estimatedMaterialCost:material,
      progress:0,actualHours:0,archived:false,created:todayISO(),createdBy:'Aleksandar C.'});
    if(saved&&saved.no){w.no=saved.no;adopted++;}
  });

// ─────────────────────────────────────────────────────────────────────────
// CALCULATION ENGINE — frontend prototype only.
// The rules below (waste handling, discount sequencing, VAT base) are the
// functional specification a future backend calculation engine must
// reproduce exactly; keep this block as the single source of truth for how
// a line, a work item and a whole estimate are priced.
// ─────────────────────────────────────────────────────────────────────────

// Tax (VAT) on a single line is computed on that line's already-discounted sell total.
// The estimate-level discount is applied later, proportionally, in computeTotals() — see note there.
function lineTax(it){const tax=Math.min(100,Math.max(0,Number(it.tax)||0));return money(lineTotal(it)*tax/100);}
function lineSellCostDelta(it){return money(lineTotal(it)-lineCostTotal(it));}

// Display-only merge used to PREVIEW an option in the items table without ever touching the saved totals.
// activeOptTab selects which option (if any) is temporarily shown; computeTotals() never reads this state.
function mergedWorkItems(e){
  const replaced=new Set();
  (e.options||[]).filter(o=>o.included&&Array.isArray(o.replacesDesc)).forEach(o=>o.replacesDesc.forEach(d=>replaced.add(o.intoWorkItem+'|'+d)));
  // Carry seq and lock onto the display copy: without them the table would renumber items by
  // position and show every item as unlocked however the stored item actually stands.
  const wis=e.workItems.map(wi=>({no:wi.no,seq:wi.seq,lock:wi.lock,desc:wi.desc,lines:wi.lines.filter(l=>!replaced.has(wi.no+'|'+l.desc))}));
  (e.options||[]).filter(o=>o.included).forEach(opt=>{
    const optLines=opt.lines.map(l=>Object.assign({},l,{fromOption:opt.name,optionId:opt.id}));
    wis.push({no:"",desc:opt.name,lines:optLines,isOption:true});
  });
  if(activeOptTab!=="base"){
    const opt=(e.options||[]).find(o=>o.id===activeOptTab);
    if(opt&&!opt.included){
      const optLines=opt.lines.map(l=>Object.assign({},l,{fromOption:opt.name,optionId:opt.id,previewOnly:true}));
      wis.push({no:"",desc:opt.name,lines:optLines,isOption:true,previewOnly:true});
    }
  }
  return wis;
}
function flatLines(e){return baseAndIncludedLines(e);}

function computeTotals(e){
  const items=baseAndIncludedLines(e);
  const bySection={};
  items.forEach(it=>{const s=it.category;bySection[s]=(bySection[s]||0)+lineTotal(it);});
  const sellSubtotal=money(items.reduce((a,b)=>a+lineTotal(b),0));

  // Estimate-level discount can never exceed the sell subtotal (no negative net price).
  const discount=Math.max(0,Math.min(Number(e.discount)||0,sellSubtotal));

  // VAT must be calculated AFTER line discounts (already applied in lineTotal) and AFTER the
  // estimate-level discount. The estimate-level discount is spread across lines proportionally
  // to each line's share of the subtotal, so VAT is charged on the true net base — not on the
  // pre-discount subtotal. This mirrors how the future backend must compute VAT.
  const discountRatio=sellSubtotal>0?discount/sellSubtotal:0;
  const taxTotal=money(items.reduce((a,b)=>{
    const lineNet=lineTotal(b)*(1-discountRatio);
    const tax=Math.min(100,Math.max(0,Number(b.tax)||0));
    return a+lineNet*tax/100;
  },0));

  const netSubtotal=money(sellSubtotal-discount);
  const grandTotal=money(netSubtotal+taxTotal);

  const costOf=cat=>money(items.filter(it=>it.category===cat).reduce((a,b)=>a+lineCostTotal(b),0));
  const sellOf=cat=>money(items.filter(it=>it.category===cat).reduce((a,b)=>a+lineTotal(b),0));
  const materialCost=costOf('material'),labourCost=costOf('labour'),machineCost=costOf('machine'),subCost=costOf('subcontractor'),
    consumableCost=costOf('consumable'),logisticsCost=costOf('logistics'),otherCost=costOf('other');
  const totalDirectCost=money(materialCost+labourCost+machineCost+subCost+consumableCost+logisticsCost+otherCost);
  const overheadPct=Math.max(0,Number(e.overheadPct)||0),contingencyPct=Math.max(0,Number(e.contingencyPct)||0);
  const overhead=money(totalDirectCost*overheadPct/100);
  const contingency=money(totalDirectCost*contingencyPct/100);
  const totalInternalCost=money(totalDirectCost+overhead+contingency);
  const sellingPrice=sellSubtotal;
  const netSellingPrice=netSubtotal;
  const grossProfit=money(netSellingPrice-totalInternalCost);
  // Margin must never be Infinity/NaN: guard the zero-price case explicitly.
  const margin=netSellingPrice>0?money(grossProfit/netSellingPrice*100):0;

  const matSell=sellOf('material'),labSell=sellOf('labour'),subSell=sellOf('subcontractor');
  const matMarkup=materialCost>0?money((matSell-materialCost)/materialCost*100):0;
  const labMargin=labourCost>0?money((labSell-labourCost)/labourCost*100):0;
  const subMarkup=subCost>0?money((subSell-subCost)/subCost*100):0;

  return{items,bySection,sellSubtotal,taxTotal,discount,netSubtotal,grandTotal,
    materialCost,labourCost,machineCost,subCost,consumableCost,logisticsCost,otherCost,
    totalDirectCost,overhead,contingency,totalInternalCost,sellingPrice,netSellingPrice,grossProfit,margin,
    matMarkup,labMargin,subMarkup};
}

function optionDelta(e,opt){return money(opt.lines.reduce((a,it)=>a+lineTotal(it),0));}
function toggleOptionIncluded(estId,optId,included){
  const e=getEst(estId);if(!guardEdit(e))return;
  const opt=(e.options||[]).find(o=>o.id===optId);if(!opt)return;
  opt.included=included;
  e.history.push({date:todayISO(),action:(included?'Option included in offer: ':'Option removed from offer: ')+opt.name,by:'Aleksandar C.'});

}

// Small wrappers over the page's existing modal and history mechanics, so the lock flows below use

function pushHistory(e,action,by,at){

}

function exportItemExcel(id,idx){

// ── Locking an item's calculation ──
// The current user and clock, in the one place the lock flows read them.
function lockStamp(){return todayISO()+' '+nowTime();}
function currentUser(){return 'Aleksandar C.';}
function getWorkItem(e,idx){return e&&e.workItems?e.workItems[idx]:null;}
// Every route that changes an item's lines goes through this, so a locked item cannot be edited by
// reaching a form directly. A blocked action does not just fail: it asks whether to unlock, and the
// action it interrupted is resumed once the unlock goes through.
let pendingUnlockAction=null;
function guardItemEdit(e,idx,resume){
  const wi=getWorkItem(e,idx);
  if(!wi)return false;
  if(!isItemLocked(wi))return true;
  if(resume)openLockedPrompt(e.id,idx,resume);
  else toast(ET[LANG].item_locked_msg.replace('{ref}',itemRef(e,wi.seq||idx+1)),'error');
  return false;
}
function openLockedPrompt(id,idx,resume){
  const e=getEst(id),wi=getWorkItem(e,idx);if(!e||!wi)return;
  const t=ET[LANG],ref=itemRef(e,wi.seq||idx+1),l=wi.lock||{};
  pendingUnlockAction=resume||null;
  showModal(`<h2>${esc(t.locked_prompt_title.replace('{ref}',ref))}</h2>
    <p class="fsub">${esc(t.locked_prompt_body.replace('{by}',l.by||'—').replace('{at}',l.at||'—'))}</p>
    <div class="fbtns"><button class="tbtn" onclick="cancelUnlockPrompt()">${esc(t.locked_prompt_no)}</button><button class="tbtn danger" onclick="openUnlockItem(${id},${idx},true)">${esc(t.locked_prompt_yes)}</button></div>`);
}
function cancelUnlockPrompt(){pendingUnlockAction=null;closeModal();}
// Locking is an approval, so it asks first and says plainly what it commits to.
function openLockItem(id,idx){
  const e=getEst(id),wi=getWorkItem(e,idx);if(!e||!wi||!guardEdit(e))return;
  const t=ET[LANG],ref=itemRef(e,wi.seq||idx+1);
  showModal(`<h2>${esc(t.lock_title)}</h2>
    <p class="fsub">${esc(t.lock_body.replace('{ref}',ref).replace('{n}',(wi.lines||[]).length))}</p>
    <div class="frow"><label>${esc(t.lock_total)}</label><div class="lockfig">${estFmt((wi.lines||[]).reduce((a,l)=>a+lineTotal(l),0))}</div></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn primary" onclick="doLockItem(${id},${idx})">${esc(t.lock_confirm)}</button></div>`);
}
function doLockItem(id,idx){
  const e=getEst(id),wi=getWorkItem(e,idx);if(!e||!wi)return;
  const at=lockStamp(),by=currentUser(),ref=itemRef(e,wi.seq||idx+1);
  wi.lock=lockItem(wi.lock,by,at);
  pushHistory(e,ET[LANG].hist_item_locked.replace('{ref}',ref),by,at);
  syncEstimation(e);closeModal();renderAll();
  toast(ET[LANG].lock_done.replace('{ref}',ref),'ok');
}
// Unlocking an agreed figure always carries a reason; who and when are recorded automatically.
function openUnlockItem(id,idx,keepPending){
  if(!keepPending)pendingUnlockAction=null;
  const e=getEst(id),wi=getWorkItem(e,idx);if(!e||!wi||!guardEdit(e))return;
  const t=ET[LANG],ref=itemRef(e,wi.seq||idx+1),l=wi.lock||{};
  showModal(`<h2>${esc(t.unlock_title)}</h2>
    <p class="fsub">${esc(t.unlock_body.replace('{ref}',ref).replace('{by}',l.by||'—').replace('{at}',l.at||'—'))}</p>
    <div class="frow"><label for="ulReason">${esc(t.unlock_reason)}</label><textarea id="ulReason" rows="3"></textarea><div id="ulErr" class="errmsg" style="display:none;"></div></div>
    <div class="frow"><label>${esc(t.unlock_recorded)}</label><div class="lockfig small">${esc(currentUser())} · ${esc(lockStamp())}</div></div>
    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn danger" onclick="doUnlockItem(${id},${idx})">${esc(t.unlock_confirm)}</button></div>`);
}
function doUnlockItem(id,idx){
  const t=ET[LANG],e=getEst(id),wi=getWorkItem(e,idx);if(!e||!wi)return;
  const reason=$("ulReason").value.trim();
  if(!reason){showFieldError('ulReason','ulErr',t.unlock_err_reason);return;}
  const at=lockStamp(),by=currentUser(),ref=itemRef(e,wi.seq||idx+1);
  wi.lock=unlockItem(wi.lock,by,at,reason);
  pushHistory(e,ET[LANG].hist_item_unlocked.replace('{ref}',ref)+' — '+reason,by,at);
  syncEstimation(e);closeModal();renderAll();
  // Resume the edit the lock interrupted, so unlocking does not cost the user their place.
  const resume=pendingUnlockAction;pendingUnlockAction=null;
  if(resume)resume();
}

}

      ${locked?'':itemLocked

        :`<button class="ibtn" onclick="openLockItem(${e.id},${idx})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="1"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>${esc(t.item_lock)}</button>`}
    </span>`;
    rows+=`<tr class="sectionrow ${itemLocked?'islocked':''}"><td colspan="${showCost?10:8}"><div class="secrow">${ref?`<span class="itemref ${itemLocked?'islocked':'isopen'}">${esc(ref)}</span>`:''}<span class="secname">${esc(wi.desc.toUpperCase())}</span>${wi.previewOnly?` <span class="subtag" style="color:var(--warn);border-color:rgba(255,176,87,.4);background:rgba(255,176,87,.1);">${esc(t.preview_only)}</span>`:''}${wi.no&&!wi.isOption?` <span class="itemsrc">${esc(wi.no)}</span>`:''}${itemTools}</div>
    </td></tr>`;

          ${it.weight?`<span class="isub">${esc(it.weight)} kg${it.waste?` · ${esc(it.waste)}% ${esc(t.waste_word)}`:''}</span>`:''}

// ── work-item and line management: move/edit/duplicate/delete. All guarded against editing a locked estimate. ──
function duplicateLine(id,wiIdx,lIdx){
  const e=getEst(id);if(!guardEdit(e)||!guardItemEdit(e,wiIdx,()=>duplicateLine(id,wiIdx,lIdx)))return;
  const wi=e.workItems[wiIdx];const line=wi.lines[lIdx];if(!line)return;
  wi.lines.splice(lIdx+1,0,JSON.parse(JSON.stringify(line)));
  e.history.push({date:todayISO(),action:'Line duplicated: '+line.desc,by:'Aleksandar C.'});
  syncEstimation(e);renderAll();
}
function deleteLine(id,wiIdx,lIdx){
  const e=getEst(id);if(!guardEdit(e)||!guardItemEdit(e,wiIdx,()=>deleteLine(id,wiIdx,lIdx)))return;
  const wi=e.workItems[wiIdx];const line=wi.lines[lIdx];if(!line)return;

function moveLine(id,wiIdx,lIdx,dir){
  const e=getEst(id);if(!guardEdit(e)||!guardItemEdit(e,wiIdx,()=>moveLine(id,wiIdx,lIdx,dir)))return;
  const wi=e.workItems[wiIdx];if(!wi)return renderAll();
  const to=lIdx+dir;

  // shrank from a concurrent edit elsewhere such that lIdx is now out of range but lIdx+dir

// History and notes are both a record of what happened to this estimate over time, so they read as

// ─────────────────────────────────────────────────────────────────────────
// STATUS WORKFLOW — frontend enforcement only. The future backend must
// enforce these exact same transition and precondition rules server-side.
//   Draft → Internal Review → Sent → Accepted
//   From Sent, also: Declined · Expired · (Revision requested, via createRevision)
// A Draft can never jump straight to Accepted, and Sent requires ≥1 valid cost line.
// ─────────────────────────────────────────────────────────────────────────
const ALLOWED_TRANSITIONS={draft:['review','sent'],review:['draft','sent'],sent:['accepted','declined','expired','review'],accepted:[],declined:[],expired:[]};
function hasValidCostLine(e){return e.workItems.some(wi=>wi.lines.some(l=>!isBlank(l.desc)&&isPositiveNumber(l.qty)&&isNonNegNumber(l.sell)));}
function requestStageChange(id,stage){
  const t=ET[LANG];const e=getEst(id);if(!e||e.status===stage)return;
  if(isLocked(e)){toast(t.locked_msg.replace('{no}',e.no),'error');return;}
  const allowed=ALLOWED_TRANSITIONS[e.status]||[];
  if(!allowed.includes(stage)){toast(t.transition_blocked.replace('{a}',t['st_'+e.status]).replace('{b}',t['st_'+stage]),'error');return;}
  if(stage==='sent'&&!hasValidCostLine(e)){toast(t.err_needs_line,'error');return;}
  if(!confirm(t.confirm_stage.replace('{s}',t["st_"+stage])))return;
  e.status=stage;
  e.history.push({date:todayISO(),action:`Status changed to ${t["st_"+stage]}`,by:"Aleksandar C."});
  syncEstimation(e);
  renderAll();
}

    <div class="fbtns"><button class="tbtn" onclick="closeModal()">${esc(t.nc_cancel)}</button><button class="tbtn primary" onclick="saveLineForm(${id},${wiIdx}${editing?','+lIdx:''})">${editing?esc(t.nc_save):esc(t.addline)}</button></div>`;

function saveLineForm(id,wiIdx,lIdx){
  const t=ET[LANG];clearAllFieldErrors();
  const e=getEst(id);if(!guardEdit(e)||!guardItemEdit(e,wiIdx))return;
  const wi=e.workItems[wiIdx];if(!wi)return;
  const editing=lIdx!==undefined&&lIdx!==null;
  const desc=$("aiDesc").value.trim();
  if(!desc){showFieldError('aiDesc','aiDescErr',t.err_required);return;}
  const qty=parseFloat($("aiQty").value),sell=parseFloat($("aiSell").value),cost=parseFloat($("aiCost").value),
    disc=parseFloat($("aiDisc").value),tax=parseFloat($("aiTax").value),waste=parseFloat($("aiWaste").value)||0;
  if(!isPositiveNumber(qty)){showFieldError('aiQty','aiNumErr',t.err_qty);return;}
  if(!isNonNegNumber(sell)){showFieldError('aiSell','aiNumErr',t.err_sell);return;}
  if(!isNonNegNumber(cost)){showFieldError('aiCost','aiNumErr',t.err_cost);return;}
  if(!isPercent(disc)){showFieldError('aiDisc','aiNumErr',t.err_disc);return;}
  if(!isPercent(tax)){showFieldError('aiTax','aiNumErr',t.err_tax);return;}
  const category=$("aiCat").value;
  const payload={desc,category,qty,unit:$("aiUnit").value.trim()||"pcs",cost,sell,disc,tax,waste:category==='material'?Math.max(0,Math.min(100,waste)):0};
  // Pass 3.27 bug hunt: workItems can now be replaced wholesale by hydrateSharedEstimations()
  // reacting to workshop:data WHILE this modal is open (Pass 3.22 made it re-callable, correctly,
  // for the cross-tab sync it exists to support) - if the line this modal was opened for was
  // removed/reordered by a concurrent edit elsewhere in the meantime, wi.lines[lIdx] is now stale
  // and Object.assign(undefined,payload) throws. Same "record no longer exists" class of guard as
  // guardEdit()/getEst() above, just for the array position specifically.
  if(editing){
    if(!wi.lines[lIdx]){toast(t.err_line_changed,'error');closeModal();renderAll();return;}
    Object.assign(wi.lines[lIdx],payload);e.history.push({date:todayISO(),action:`Line updated in ${wi.desc}: ${desc}`,by:"Aleksandar C."});
  }
  else{wi.lines.push(payload);e.history.push({date:todayISO(),action:`Item added to ${wi.desc}: ${desc}`,by:"Aleksandar C."});}
  syncEstimation(e);
  closeModal();renderAll();
}

async function saveUpload(id){
  const t=ET[LANG];clearAllFieldErrors();const name=$("udName").value.trim();
  if(!name){showFieldError('udName','udErr',t.err_required);return;}
  const e=getEst(id),file=$("udFile").files[0];
  if(file&&file.size>WorkshopData.maxDocumentFileBytes){showFieldError('udName','udErr',`File is too large (maximum ${Math.round(WorkshopData.maxDocumentFileBytes/1024)} KB)`);return;}
  let fileData='';if(file)fileData=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)}).catch(()=>null);
  if(file&&fileData===null){showFieldError('udName','udErr','The selected file could not be read.');return;}
  const saved=WorkshopData.upsertDocument({name,type:'Document',module:'Estimations',record:e.no,category:'Estimation Attachments',status:'Valid',expiry:'',revision:'1',author:'Aleksandar C.',fileName:file?file.name:'',mimeType:file?file.type:'',fileSize:file?file.size:0,fileData:fileData||''});
  if(saved.error){showFieldError('udName','udErr',saved.error);return;}
  e.history.push({date:todayISO(),action:`Document uploaded: ${name}`,by:"Aleksandar C."});
  syncEstimation(e);
  closeModal();renderAll();
  toast(t.demo_upload,'ok');
}

// Duplicating creates a genuinely independent estimate: deep-cloned commercial/cost content, a brand-new
// local id and estimation number, no shared/project linkage, reset status/revision/dates/history. The
// original estimate is never touched.
function addDaysISO(iso,days){const d2=new Date(iso+"T00:00:00");d2.setDate(d2.getDate()+days);return d2.toISOString().slice(0,10);}

// An estimate linked to a project cannot be safely deleted (the project still references it) — offer
// Archive instead and explain why. Unlinked estimates can be deleted after confirmation.
function deleteEst(id){
  const t=ET[LANG];const e=getEst(id);if(!e)return;
  if(e.projectNo){
    if(!confirm(t.confirm_archive.replace('{no}',e.no).replace('{p}',e.projectNo)))return;
    e.archived=true;
    e.history.push({date:todayISO(),action:'Archived (linked to project '+e.projectNo+')',by:'Aleksandar C.'});
    syncEstimation(e);
    if(selectedId===id){const visible=ESTIMATIONS.filter(x=>x.id!==id&&!x.archived);selectedId=visible.length?visible[0].id:null;}
    renderAll();
    return;
  }
  if(!confirm(t.confirm_delete))return;
  // Unlinked estimates are removed from BOTH this page's local list and the shared data layer, so the
  // record cannot reappear on refresh (hydrateSharedEstimations() re-adds anything still present there).
  if(window.WorkshopData&&e.sharedId){
    const res=WorkshopData.deleteEstimation(e.sharedId);
    if(res&&res.error){toast(res.error,'error');return;}
  }
  ESTIMATIONS=ESTIMATIONS.filter(x=>x.id!==id);
  if(selectedId===id)selectedId=ESTIMATIONS.length?ESTIMATIONS[0].id:null;
  renderAll();
}

// A dependency-free Excel export using Microsoft's SpreadsheetML 2003 format. This is a genuine
// workbook file (not a toast-only simulation) and opens directly in Excel/LibreOffice while
// keeping the static prototype free of a large XLSX/ZIP dependency.
function exportExcel(id){
  const e=getEst(id),c=ESTCUST[e.customerId],tot=computeTotals(e),rows=flatLines(e);
  const x=v=>esc(v==null?'':v),cell=(v,type='String')=>`<Cell><Data ss:Type="${type}">${x(v)}</Data></Cell>`;
  const body=[
    ['Estimation',e.no],['Customer',c.name],['Title',e.projectTitle||e.no],['Status',e.status],['Revision',e.revision||0],['Created',e.created],['Valid Until',e.validUntil],[],
    ['Category','Description','Quantity','Unit','Unit Cost','Unit Sell','Discount %','VAT %','Line Total'],
    ...rows.map(l=>[l.category,l.desc,l.qty,l.unit,l.cost,l.sell,l.discount||0,l.tax||0,lineTotal(l)]),
    [],['Sell Subtotal',tot.sellSubtotal],['Estimate Discount',tot.discount],['VAT',tot.taxTotal],['Grand Total',tot.grandTotal]
  ];
  const xml=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Estimation"><Table>${body.map(r=>`<Row>${r.map(v=>cell(v,typeof v==='number'&&Number.isFinite(v)?'Number':'String')).join('')}</Row>`).join('')}</Table></Worksheet></Workbook>`;
  const blob=new Blob([xml],{type:'application/vnd.ms-excel;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=e.no+'-estimation.xml';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`Excel workbook downloaded — ${a.download}`,'ok');
}

// ══════════════════════════════════════════════════════════════════════════
// Project / Estimator — one module, two views over the same projects.
// The project half (board, table, detail tabs, workflow) and the estimating
// half (item pricing, options, locks) were separate pages. They share a page,
// a language and a modal now; each still owns its own state and rules.
// ══════════════════════════════════════════════════════════════════════════
let MODULE_VIEW='projects';
function applyModuleView(){
  const est=MODULE_VIEW==='estimating';
  $("estView").style.display=est?'':'none';
  if(est){$("listView").style.display='none';$("detailView").style.display='none';}
}
function showEstimating(projectNo){
  MODULE_VIEW='estimating';
  if(projectNo){const e=estForProject(projectNo);if(e)selectedId=e.id;}
  renderAll();
}
// Opens a project's own record from the estimating view, so the work behind a price is one click
// away rather than in another module.
function openProjectFromEstimate(projectNo){
  MODULE_VIEW='projects';
  const p=PROJECTS.find(x=>x.no===projectNo);
  if(p)openProject(p.id);else render();
}
// Both halves re-render through their own entry point, so each has to leave the current view alone.
const _renderProjects=render;
render=function(){_renderProjects();applyModuleView();};
const _renderAllEst=renderAll;
renderAll=function(){_renderAllEst();applyModuleView();};
// One language toggle drives both; without this the hidden half would keep the old language and
// show it the moment you switched to it.
const _setLangBoth=setLang;
setLang=function(code){_setLangBoth(code);try{_renderAllEst();}catch(err){}applyModuleView();};
applyModuleView();
