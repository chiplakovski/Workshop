<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>Varmak — Projects</title><style>
  :root{--navy-950:#04101f;--navy-900:#071a33;--navy-800:#0a2447;--navy-brand:#013179;
    --steel-400:#8ea3c0;--steel-300:#b9c6da;--spark:#4a90ff;--ice:#e8f0fb;
    --line:rgba(142,163,192,0.16);--field:rgba(255,255,255,0.045);--field-line:rgba(185,198,218,0.24);
    --ok:#4ad48a;--warn:#ffb057;--danger:#ff6b6b;
    --st-draft:#8ea3c0;--st-quotation:#9db4d8;--st-approved:#4a90ff;--st-planned:#6fd1ff;--st-active:#4a90ff;--st-hold:#ffb057;--st-completed:#4ad48a;--st-closed:#b9c6da;--st-cancelled:#ff6b6b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ice);min-height:100vh;}
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--navy-950);}
  .bg::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 82% 0%,rgba(1,49,121,0.5),transparent 55%),radial-gradient(80% 60% at 10% 100%,rgba(10,36,71,0.6),transparent 60%),linear-gradient(160deg,var(--navy-950),var(--navy-900) 60%,var(--navy-950));}
  .grid{position:absolute;inset:0;opacity:0.28;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);mask-image:radial-gradient(circle at 55% 4%,#000 25%,transparent 82%);}
  .glow{position:absolute;left:50%;top:26%;width:560px;height:560px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(74,144,255,0.16),transparent 62%);filter:blur(8px);animation:pulse 6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
  .ember{position:absolute;bottom:-10px;border-radius:50%;background:var(--spark);box-shadow:0 0 6px 1px rgba(74,144,255,.8);animation:rise linear infinite;opacity:0;}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-105vh) translateX(var(--drift));opacity:0}}
  @media (prefers-reduced-motion:reduce){.glow,.ember{animation:none}}

  .topfull{position:relative;z-index:2;width:100%;padding:22px 48px 0;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;}
  .brand .logo{font-family:'Sora';font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .brand .logo .dot{width:6px;height:6px;background:var(--spark);box-shadow:0 0 9px 1px rgba(74,144,255,.9);}
  .brand .meta{font-size:11px;color:var(--steel-400);margin-top:2px;line-height:1.5;}
  .topright{display:flex;flex-direction:column;align-items:flex-end;gap:9px;}
  .clock{text-align:right;font-variant-numeric:tabular-nums;} .clock .time{font-family:'Sora';font-weight:600;font-size:16px;} .clock .date{font-size:11px;color:var(--steel-400);}
  .who{display:flex;align-items:center;gap:8px;}
  .who .badge{display:flex;align-items:center;gap:7px;padding:5px 10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;}
  .who .badge .av{width:20px;height:20px;background:linear-gradient(135deg,#2c6bd6,#0a2447);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:'Sora';}
  .who .role{color:var(--spark);font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
  .who .out{background:transparent;border:1px solid var(--field-line);color:var(--steel-300);padding:6px 10px;font-size:12px;cursor:pointer;font-family:'Inter';transition:.15s;}
  .who .out:hover{border-color:var(--spark);color:var(--ice);}

  .wrap{position:relative;z-index:2;max-width:1480px;margin:0 auto;padding:26px 40px 90px;}
  .modhead{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .back{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--field-line);color:var(--steel-300);font-family:'Inter';font-size:12.5px;padding:9px 13px;cursor:pointer;transition:.15s;}
  .back:hover{border-color:var(--spark);color:var(--ice);}
  .modhead .ttl{display:flex;align-items:center;gap:11px;}
  .modhead .ic{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(74,144,255,.14);box-shadow:inset 0 0 0 1px rgba(74,144,255,.35);}
  .modhead h1{font-family:'Sora';font-weight:600;font-size:22px;letter-spacing:-.01em;} .modhead p{font-size:12px;color:var(--steel-400);}

  .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .search{position:relative;flex:1;min-width:220px;}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--steel-400);}
  .search input{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:'Inter';font-size:14px;padding:11px 12px 11px 36px;outline:none;}
  .search input:focus{border-color:var(--spark);}
  .tbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--field-line);background:transparent;color:var(--steel-300);font-family:'Sora';font-weight:600;font-size:13px;padding:11px 15px;cursor:pointer;transition:.16s;white-space:nowrap;}
  .tbtn:hover{border-color:var(--spark);color:var(--ice);}
  .tbtn.primary{background:linear-gradient(180deg,#2c6bd6,#013179);border:none;color:#fff;}
  .tbtn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(44,107,214,.5);}
  .tbtn.ghost2{border-style:dashed;}
  .tbtn.danger{border-color:rgba(255,107,107,.4);color:#ffb3b3;}
  .tbtn.danger:hover{border-color:var(--danger);color:#fff;}
  .tbtn:disabled{opacity:.35;cursor:not-allowed;}
  .tbtn:disabled:hover{transform:none;box-shadow:none;border-color:var(--field-line);color:var(--steel-300);}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .filters button{background:var(--field);border:1px solid var(--field-line);color:var(--steel-300);font-family:'Inter';font-size:11.5px;padding:8px 12px;cursor:pointer;transition:.15s;letter-spacing:.02em;text-transform:uppercase;}
  .filters button:hover{color:var(--ice);} .filters button.active{background:rgba(74,144,255,.16);border-color:rgba(74,144,255,.5);color:#cfe0ff;}

  .morewrap{margin-bottom:16px;}
  .morepanel{display:none;grid-template-columns:repeat(4,1fr) auto;gap:10px;align-items:end;background:rgba(255,255,255,.03);border:1px solid var(--line);padding:14px;margin-top:8px;}
  .morewrap.open .morepanel{display:grid;}
  .morepanel label{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:5px;}
  .morepanel select,.morepanel input{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:'Inter';font-size:12.5px;padding:8px 9px;outline:none;}

  .ptable-wrap{overflow-x:auto;border:1px solid var(--line);background:rgba(255,255,255,.02);}
  .ptable{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1080px;}
  .ptable th{text-align:left;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);border-bottom:1px solid var(--line);padding:11px 12px;cursor:pointer;white-space:nowrap;user-select:none;}
  .ptable th:hover{color:var(--ice);}
  .ptable th .sa{opacity:.5;margin-left:3px;font-size:9px;}
  .ptable td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .ptable tr.prow2{cursor:pointer;transition:.14s;}
  .ptable tr.prow2:hover{background:rgba(74,144,255,.07);}
  .pnum{font-family:'Sora';font-weight:600;color:var(--steel-300);font-size:12px;white-space:nowrap;}
  .pname{font-weight:600;} .pcust2{color:var(--steel-400);font-size:11.5px;}
  .miniprog{width:76px;height:5px;background:rgba(255,255,255,.08);overflow:hidden;} .miniprog i{display:block;height:100%;background:var(--spark);}
  .miniprog i.over{background:var(--warn);}
  .rnum{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .over{color:var(--warn);}
  .emptyrow td{text-align:center;color:var(--steel-400);padding:34px;}
  .kpistrip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .kpi{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:15px 18px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .kpi .kl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:7px;}
  .kpi .kv{font-family:'Sora';font-size:22px;font-weight:600;} .kpi .kv.warn{color:var(--warn);}
  @media(max-width:760px){.kpistrip{grid-template-columns:1fr 1fr;}}

  .sbadge{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;font-weight:600;white-space:nowrap;border:1px solid;}
  .sbadge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
  .sbadge.draft{color:var(--st-draft);border-color:rgba(142,163,192,.4);background:rgba(142,163,192,.1);}
  .sbadge.quotation{color:var(--st-quotation);border-color:rgba(157,180,216,.4);background:rgba(157,180,216,.12);}
  .sbadge.approved{color:#cfe0ff;border-color:rgba(74,144,255,.4);background:rgba(74,144,255,.12);}
  .sbadge.planned{color:var(--st-planned);border-color:rgba(111,209,255,.4);background:rgba(111,209,255,.1);}
  .sbadge.active{color:#cfe0ff;border-color:rgba(74,144,255,.55);background:rgba(74,144,255,.18);}
  .sbadge.hold{color:var(--st-hold);border-color:rgba(255,176,87,.45);background:rgba(255,176,87,.12);}
  .sbadge.completed{color:var(--st-completed);border-color:rgba(74,212,138,.45);background:rgba(74,212,138,.12);}
  .sbadge.closed{color:var(--st-closed);border-color:rgba(185,198,218,.35);background:rgba(185,198,218,.08);}
  .sbadge.cancelled{color:var(--st-cancelled);border-color:rgba(255,107,107,.45);background:rgba(255,107,107,.12);}

  /* detail header */
  .dethead{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:22px 24px;margin-bottom:18px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}
  .dethead .dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
  .dethead .pno{font-family:'Sora';font-size:12px;color:var(--steel-300);letter-spacing:.04em;} .dethead h2{font-family:'Sora';font-weight:600;font-size:22px;margin-top:3px;}
  .dethead .dcust{font-size:12.5px;color:var(--steel-400);margin-top:3px;}
  .dfacts{display:flex;gap:28px;flex-wrap:wrap;}
  .dfacts .df .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:3px;} .dfacts .df .v{font-size:14px;font-weight:600;}
  .roactions{display:flex;gap:8px;flex-wrap:wrap;}
  .roactions .more{position:relative;}
  .moremenu{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:rgba(7,26,51,.98);border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.5);z-index:50;}
  .moremenu.open{display:block;}
  .moremenu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--steel-300);font-family:'Inter';font-size:12.5px;padding:11px 14px;cursor:pointer;}
  .moremenu button:hover{background:rgba(74,144,255,.12);color:var(--ice);}
  .moremenu button.danger2:hover{background:rgba(255,107,107,.12);color:#ffb3b3;}
  .roreadonly{margin-top:12px;font-size:11.5px;color:var(--warn);display:flex;align-items:center;gap:7px;}

  .ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;}
  .ptabs button{background:transparent;border:none;color:var(--steel-400);font-family:'Sora';font-weight:600;font-size:12px;letter-spacing:.03em;text-transform:uppercase;padding:12px 15px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:.15s;}
  .ptabs button:hover{color:var(--ice);}
  .ptabs button.on{color:#cfe0ff;border-bottom-color:var(--spark);}

  .tabpanel{min-height:280px;}
  .card2{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:20px;}
  .warnbox{border:1px solid rgba(255,176,87,.4);background:rgba(255,176,87,.08);padding:13px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:7px;}
  .warnbox .wline{font-size:12px;color:#ffd0b0;display:flex;gap:8px;align-items:flex-start;}
  .warnbox .wline svg{flex:none;margin-top:1px;}
  .pinnote{border:1px solid rgba(255,176,87,.35);background:rgba(255,176,87,.06);padding:12px 15px;margin-bottom:16px;font-size:12.5px;color:var(--steel-300);}
  .pinnote b{color:#ffd0b0;font-family:'Sora';font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:5px;}

  .ovgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px;}
  .ovcard{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:16px;}
  .ovcard h4{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:12px;display:flex;align-items:center;gap:7px;}
  .ovcard h4 svg{width:14px;height:14px;color:var(--spark);}
  .ovline{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px;} .ovline .lk{color:var(--steel-400);}
  .ovbar{height:7px;background:rgba(255,255,255,.08);overflow:hidden;margin:4px 0 8px;} .ovbar i{display:block;height:100%;background:var(--spark);}
  .ovbig{font-family:'Sora';font-size:22px;font-weight:600;}
  @media(max-width:1200px){.ovgrid{grid-template-columns:repeat(2,1fr);}}

  .subtable{width:100%;border-collapse:collapse;font-size:12.5px;}
  .subtable th{text-align:left;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);border-bottom:1px solid var(--line);padding:9px 10px;white-space:nowrap;}
  .subtable td{padding:10px;border-bottom:1px solid var(--line);}
  .subtable tfoot td{border-bottom:none;padding-top:12px;font-weight:600;font-family:'Sora';}
  .rowactions{display:flex;gap:8px;margin-top:12px;}
  .rowbtn{background:transparent;border:1px solid var(--field-line);color:var(--steel-400);cursor:pointer;padding:4px 8px;font-size:11px;transition:.15s;}
  .rowbtn:hover{border-color:var(--spark);color:var(--ice);}
  .rowbtn.danger2:hover{border-color:var(--danger);color:#ff9d9d;}
  .tabhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .tabhead h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel-400);}
  .smtag{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;color:var(--steel-400);border:1px solid var(--line);white-space:nowrap;}
  .smtag.src-store{color:#cfe0ff;border-color:rgba(74,144,255,.4);background:rgba(74,144,255,.1);}
  .smtag.src-purchase{color:var(--warn);border-color:rgba(255,176,87,.4);background:rgba(255,176,87,.1);}

  .folder{margin-bottom:14px;border:1px solid var(--line);}
  .folder .fh{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;cursor:pointer;background:rgba(255,255,255,.02);}
  .folder .fh:hover{background:rgba(74,144,255,.06);}
  .folder .fh .fn{font-family:'Sora';font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:8px;}
  .folder .fh .fn svg{width:14px;height:14px;color:var(--spark);}
  .folder .fh .fc{font-size:11px;color:var(--steel-400);}
  .folder .fb{display:none;padding:4px 14px 10px;}
  .folder.open .fb{display:block;}
  .folder .fh .chev{transition:transform .16s;color:var(--steel-400);}
  .folder.open .fh .chev{transform:rotate(90deg);}
  .docrow{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-top:1px solid var(--line);font-size:12.5px;}
  .docrow:first-child{border-top:none;}
  .docrow .dn{display:flex;align-items:center;gap:8px;} .docrow .dmeta{font-size:11px;color:var(--steel-400);}
  .revtag{font-size:9.5px;padding:2px 6px;border:1px solid var(--field-line);color:var(--steel-300);}
  .dstat{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;}
  .dstat.current{color:var(--ok);border:1px solid rgba(74,212,138,.4);background:rgba(74,212,138,.1);}
  .dstat.superseded{color:var(--steel-400);border:1px solid var(--line);}
  .dstat.archived{color:var(--steel-400);border:1px solid var(--line);opacity:.7;}

  .costgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .costcol{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:20px;}
  .costcol h4{font-family:'Sora';font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-300);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .costline{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:9px;color:var(--steel-300);} .costline .lk{color:var(--steel-400);}
  .costline.tot{border-top:1px solid var(--line);padding-top:10px;margin-top:6px;font-weight:600;color:var(--ice);}
  .costline.profit{font-weight:600;color:var(--ok);} .costline.profit.neg{color:var(--danger);}
  @media(max-width:900px){.costgrid{grid-template-columns:1fr;}}

  .actrow{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:12.5px;}
  .actrow:first-child{border-top:none;}
  .actrow .adot{width:7px;height:7px;border-radius:50%;background:var(--spark);margin-top:5px;flex:none;}
  .actrow .atime{color:var(--steel-400);font-size:11px;white-space:nowrap;width:118px;flex:none;}
  .actrow .auser{font-weight:600;margin-right:4px;}

  .notecard{border:1px solid var(--line);padding:12px 14px;margin-bottom:10px;background:rgba(255,255,255,.02);}
  .notecard.pinned{border-color:rgba(255,176,87,.4);background:rgba(255,176,87,.05);}
  .notecard .nh{display:flex;justify-content:space-between;font-size:11px;color:var(--steel-400);margin-bottom:6px;}
  .notecard .ntag{font-size:9px;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);margin-left:7px;}
  .notecard p{font-size:12.5px;color:var(--steel-300);line-height:1.5;}

  /* generic form modal */
  .fov{position:fixed;inset:0;z-index:90;background:rgba(2,8,15,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;}
  .fov.show{display:flex;}
  .fcard{background:rgba(9,23,45,.98);border:1px solid var(--line);width:660px;max-width:100%;padding:30px 34px;box-shadow:0 30px 80px rgba(0,0,0,.55);}
  .fcard h2{font-family:'Sora';font-weight:600;font-size:18px;margin-bottom:6px;}
  .fcard .fsub{font-size:12px;color:var(--steel-400);margin-bottom:20px;}
  .fcard .frow{margin-bottom:14px;} .fcard .frow2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .fcard .frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px;}
  .fcard label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-400);margin-bottom:6px;}
  .fcard input,.fcard select,.fcard textarea{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:'Inter';font-size:13.5px;padding:9px 11px;outline:none;}
  .fcard input:focus,.fcard select:focus,.fcard textarea:focus{border-color:var(--spark);}
  .fcard input[readonly]{color:var(--steel-400);}
  .fcard textarea{min-height:64px;resize:vertical;}
  .fcard .fbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
  .fcard .fnewlink{font-size:11.5px;color:var(--spark);cursor:pointer;margin-top:6px;display:inline-block;}
  .mchips{display:flex;flex-wrap:wrap;gap:7px;}

function fmt(n){return Math.round(n||0).toLocaleString('sv-SE')+" kr";}
function fmtD(iso){if(!iso)return "—";const[y,m,d]=iso.split('-');return d+"-"+m+"-"+y;}
function today(){return new Date("2026-08-24T12:00:00");}
function daysBetween(iso){if(!iso)return null;return Math.round((new Date(iso+"T12:00:00")-today())/86400000);}
function custName(id){const c=CUSTOMERS.find(x=>x.id===id);return c?c.name:"—";}
function custObj(id){return CUSTOMERS.find(x=>x.id===id);}
function getProject(id){return PROJECTS.find(p=>p.id===id);}

function jcTotals(p){const est=p.jobcards.reduce((a,b)=>a+b.est,0),act=p.jobcards.reduce((a,b)=>a+b.act,0),completed=p.jobcards.filter(j=>j.status==='completed').length;return{est,act,completed,total:p.jobcards.length};}
function itemEstMaterialTotal(p){return p.jobcards.reduce((a,b)=>a+(b.estMaterial||0),0);}
function itemMaterialActual(p,itemNo){return p.materials.filter(m=>m.jobcard===itemNo).reduce((a,b)=>a+b.cost,0);}
function itemEstPrice(item){return item.est*RATE+(item.estMaterial||0);}
function itemActualCost(p,item){return item.act*RATE+itemMaterialActual(p,item.no);}
function progressOf(p){if(!p.jobcards.length)return 0;const est=p.jobcards.reduce((a,b)=>a+b.est,0);if(!est)return 0;const done=p.jobcards.reduce((a,b)=>a+b.est*(b.status==='completed'?1:(b.progress||0)/100),0);return Math.round(done/est*100);}
function actLabourHours(p){return p.hours.reduce((a,b)=>a+b.hours,0);}
function actMaterialStore(p){return p.materials.filter(m=>m.source==='store').reduce((a,b)=>a+b.cost,0);}
function actPurchaseReceived(p){return p.purchases.reduce((a,b)=>a+b.received,0);}
function purchaseOrderedTotal(p){return p.purchases.filter(x=>x.status!=='cancelled').reduce((a,b)=>a+b.ordered,0);}
function purchasePendingTotal(p){return p.purchases.filter(x=>x.status!=='cancelled').reduce((a,b)=>a+Math.max(0,b.ordered-b.received),0);}
function costs(p){
  const jt=jcTotals(p);
  const estLabour=jt.est*RATE,estMaterial=itemEstMaterialTotal(p),estPurchased=p.estPurchaseCost,estOther=p.otherCostEst||0;
  const totalEst=estLabour+estMaterial+estPurchased+estOther;
  const quoted=p.quotedValue,estProfit=quoted-totalEst,estMargin=quoted?estProfit/quoted*100:0;
  const aLabH=actLabourHours(p),actLabour=aLabH*RATE,actMaterial=actMaterialStore(p),actPurchase=actPurchaseReceived(p),actOther=p.otherCostAct||0;
  const totalAct=actLabour+actMaterial+actPurchase+actOther;
  const revenue=quoted,actProfit=revenue-totalAct,actMargin=revenue?actProfit/revenue*100:0;
  return{estLabour,estMaterial,estPurchased,estOther,totalEst,quoted,estProfit,estMargin,aLabH,actLabour,actMaterial,actPurchase,actOther,totalAct,revenue,actProfit,actMargin};
}
function totalActualCost(p){return costs(p).totalAct;}
function getWarnings(p){const t=T[LANG],w=[],c=costs(p),dl=daysBetween(p.deadline);
  if(['completed','closed','cancelled'].includes(p.status))return w;
  if(dl!==null){if(dl<0)w.push(t.warn_deadline_overdue.replace('{d}',Math.abs(dl)));else if(dl<=14)w.push(t.warn_deadline_approaching.replace('{d}',dl));}
  const estH=jcTotals(p).est,estM=itemEstMaterialTotal(p);
  if(estH&&c.aLabH>estH)w.push(t.warn_hours_exceeded.replace('{a}',c.aLabH).replace('{e}',estH));
  if(estM&&c.actMaterial>estM)w.push(t.warn_material_exceeded.replace('{a}',fmt(c.actMaterial)).replace('{e}',fmt(estM)));
  if(c.totalEst&&c.totalAct>c.totalEst)w.push(t.warn_budget_exceeded.replace('{a}',fmt(c.totalAct)).replace('{e}',fmt(c.totalEst)));
  p.purchases.forEach(po=>{if(po.status!=='delivered'&&po.status!=='cancelled'&&daysBetween(po.expected)!==null&&daysBetween(po.expected)<0)w.push(t.warn_purchase_late.replace('{po}',po.po));});
  return w;}

function inspectionReports(p){return (p.documents&&p.documents["Inspection Reports"])||[];}
function completeIssues(p){const t=T[LANG],iss=[];
  const openJc=p.jobcards.filter(j=>j.status!=='completed');
  if(openJc.length)iss.push(t.iss_open_jc.replace('{n}',openJc.length));
  const undel=p.purchases.filter(x=>x.status!=='delivered'&&x.status!=='cancelled');
  if(undel.length)iss.push(t.iss_po_undelivered.replace('{n}',undel.length));
  if(!inspectionReports(p).length && p.jobcards.length)iss.push(t.iss_report_missing);
  return iss;}
function closeIssues(p){const t=T[LANG],iss=[];
  const openJc=p.jobcards.filter(j=>j.status!=='completed');
  if(openJc.length)iss.push(t.iss_jc_not_complete.replace('{n}',openJc.length));
  const undel=p.purchases.filter(x=>x.status!=='delivered'&&x.status!=='cancelled');
  if(undel.length)iss.push(t.iss_po_unresolved.replace('{n}',undel.length));
  const unapproved=inspectionReports(p).filter(r=>r.status!=='current');
  if(unapproved.length)iss.push(t.iss_report_unapproved.replace('{n}',unapproved.length));
  return iss;}

let VIEW="list",currentId=null,activeTab="overview",moreOpen=false;
let listFilter="all",listQuery="",sortKey="no",sortDir=1;
let listFilters={customer:"",responsible:"",type:"",from:"",to:""};
const STATUS_ORDER=["draft","quotation","approved","planned","active","hold","completed","closed","cancelled"];

function statusBadge(s){return `<span class="sbadge ${s}">${T[LANG]["st_"+s]}</span>`;}

function renderList(){
  const t=T[LANG];
  let rows=PROJECTS.filter(p=>listFilter==="all"||p.status===listFilter);
  if(listQuery){const q=listQuery.toLowerCase();rows=rows.filter(p=>p.no.toLowerCase().includes(q)||p.name.toLowerCase().includes(q)||custName(p.customerId).toLowerCase().includes(q)||(p.customerRef||"").toLowerCase().includes(q));}
  if(listFilters.customer)rows=rows.filter(p=>String(p.customerId)===listFilters.customer);
  if(listFilters.responsible)rows=rows.filter(p=>p.pm===listFilters.responsible||p.workshop===listFilters.responsible||p.sales===listFilters.responsible);
  if(listFilters.type)rows=rows.filter(p=>p.types.includes(listFilters.type));
  if(listFilters.from)rows=rows.filter(p=>p.deadline&&p.deadline>=listFilters.from);
  if(listFilters.to)rows=rows.filter(p=>p.deadline&&p.deadline<=listFilters.to);
  const valOf={no:p=>p.no,name:p=>p.name,customer:p=>custName(p.customerId),status:p=>p.status,start:p=>p.plannedStart||"",deadline:p=>p.deadline||"",progress:p=>progressOf(p),responsible:p=>p.pm,quoted:p=>p.quotedValue,actual:p=>totalActualCost(p)}[sortKey]||(p=>p.no);
  rows=rows.slice().sort((a,b)=>{const av=valOf(a),bv=valOf(b);return (av>bv?1:av<bv?-1:0)*sortDir;});

  const kQuoted=rows.reduce((a,p)=>a+p.quotedValue,0);
  const kActual=rows.reduce((a,p)=>a+totalActualCost(p),0);
  const kOverdue=rows.filter(p=>!['completed','closed','cancelled'].includes(p.status)&&daysBetween(p.deadline)!==null&&daysBetween(p.deadline)<0).length;
  const kHold=rows.filter(p=>p.status==='hold').length;

  const chips=["all",...STATUS_ORDER].map(s=>`<button data-f="${s}" class="${listFilter===s?'active':''}">${t["f_"+s]}</button>`).join("");
  const custOpts=CUSTOMERS.map(c=>`<option value="${c.id}" ${listFilters.customer==String(c.id)?'selected':''}>${c.name}</option>`).join("");
  const respOpts=PEOPLE.map(n=>`<option value="${n}" ${listFilters.responsible===n?'selected':''}>${n}</option>`).join("");
  const typeOpts=TYPES.map(x=>`<option value="${x}" ${listFilters.type===x?'selected':''}>${x}</option>`).join("");

  const trs=rows.map(p=>{const prog=progressOf(p);const dl=daysBetween(p.deadline);const estH0=jcTotals(p).est;const over=estH0&&actLabourHours(p)>estH0;
    return `<tr class="prow2" onclick="openProject(${p.id})">
      <td class="pnum">${p.no}</td>
      <td class="pname">${p.name}</td>
      <td>${custName(p.customerId)}<div class="pcust2">${p.customerRef||""}</div></td>
      <td>${p.customerRef||"—"}</td>
      <td>${statusBadge(p.status)}</td>
      <td class="rnum">${fmtD(p.plannedStart)}</td>
      <td class="rnum ${dl!==null&&dl<0&&!['completed','closed','cancelled'].includes(p.status)?'over':''}">${fmtD(p.deadline)}</td>
      <td><div class="miniprog"><i class="${over?'over':''}" style="width:${prog}%"></i></div><div class="pcust2">${prog}%</div></td>
      <td>${p.pm||"—"}</td>
      <td class="rnum">${p.quotedValue?fmt(p.quotedValue):"—"}</td>
      <td class="rnum">${fmt(totalActualCost(p))}</td>
    </tr>`;}).join("");

  $("listView").innerHTML=`
    <div class="kpistrip">
      <div class="kpi"><div class="kl">${t.kpi_quoted}</div><div class="kv">${fmt(kQuoted)}</div></div>
      <div class="kpi"><div class="kl">${t.kpi_actual}</div><div class="kv">${fmt(kActual)}</div></div>
      <div class="kpi"><div class="kl">${t.kpi_overdue}</div><div class="kv ${kOverdue?'warn':''}">${kOverdue}</div></div>
      <div class="kpi"><div class="kl">${t.kpi_hold}</div><div class="kv ${kHold?'warn':''}">${kHold}</div></div>
    </div>
    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="search" type="text" data-i-ph="searchph" placeholder="${t.searchph}" value="${listQuery.replace(/"/g,'&quot;')}"></div>
      <button class="tbtn primary" onclick="openNewProject()">${t.newproj}</button>
    </div>
    <div class="filters" id="filters">${chips}</div>
    <div class="morewrap ${moreOpen?'open':''}" id="morewrap">
      <button class="tbtn ghost2" id="moreToggle">${t.morefilters}</button>
      <div class="morepanel">
        <div><label>${t.ff_customer}</label><select id="ffCustomer"><option value="">${t.ff_any}</option>${custOpts}</select></div>
        <div><label>${t.ff_responsible}</label><select id="ffResp"><option value="">${t.ff_any}</option>${respOpts}</select></div>
        <div><label>${t.ff_type}</label><select id="ffType"><option value="">${t.ff_any}</option>${typeOpts}</select></div>
        <div><label>${t.ff_from}</label><input type="date" id="ffFrom" value="${listFilters.from}"></div>
        <div><label>${t.ff_to}</label><input type="date" id="ffTo" value="${listFilters.to}"></div>
      </div>
    </div>
    <div class="ptable-wrap"><table class="ptable"><thead><tr>
      <th data-k="no">${t.th_no}${sortArrow('no')}</th><th data-k="name">${t.th_name}${sortArrow('name')}</th><th data-k="customer">${t.th_customer}${sortArrow('customer')}</th>
      <th>${t.th_ref}</th><th data-k="status">${t.th_status}${sortArrow('status')}</th><th data-k="start">${t.th_start}${sortArrow('start')}</th>
      <th data-k="deadline">${t.th_deadline}${sortArrow('deadline')}</th><th data-k="progress">${t.th_progress}${sortArrow('progress')}</th>
      <th data-k="responsible">${t.th_responsible}${sortArrow('responsible')}</th><th data-k="quoted">${t.th_quoted}${sortArrow('quoted')}</th><th data-k="actual">${t.th_actual}${sortArrow('actual')}</th>
    </tr></thead><tbody>${trs||`<tr class="emptyrow"><td colspan="11">${t.emptylist}</td></tr>`}</tbody></table></div>`;

  $("filters").addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;listFilter=b.getAttribute('data-f');renderList();});
  $("search").addEventListener('input',e=>{listQuery=e.target.value;renderList();$("search").focus();$("search").setSelectionRange(listQuery.length,listQuery.length);});
  $("moreToggle").addEventListener('click',()=>{moreOpen=!moreOpen;renderList();});
  if(moreOpen){
    $("ffCustomer").addEventListener('change',e=>{listFilters.customer=e.target.value;renderList();});
    $("ffResp").addEventListener('change',e=>{listFilters.responsible=e.target.value;renderList();});
    $("ffType").addEventListener('change',e=>{listFilters.type=e.target.value;renderList();});
    $("ffFrom").addEventListener('change',e=>{listFilters.from=e.target.value;renderList();});
    $("ffTo").addEventListener('change',e=>{listFilters.to=e.target.value;renderList();});
  }
  document.querySelectorAll('.ptable th[data-k]').forEach(th=>th.addEventListener('click',()=>{const k=th.getAttribute('data-k');if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}renderList();}));
}
function sortArrow(k){return sortKey===k?`<span class="sa">${sortDir===1?'▲':'▼'}</span>`:"";}
function openProject(id){currentId=id;VIEW="detail";activeTab="overview";render();}
function safeTab(){if(['hours','reports'].includes(activeTab))activeTab="overview";}

function canHold(p){return['active','planned'].includes(p.status);}
function canResume(p){return p.status==='hold';}
function canComplete(p){return p.status==='active';}
function canClose(p){return p.status==='completed';}
function canCancel(p){return !['closed','cancelled','completed'].includes(p.status);}
function canReopen(p){return p.status==='closed';}
function isReadonly(p){return p.status==='closed';}

function renderDetail(){
  safeTab();
  const t=T[LANG],p=getProject(currentId);if(!p){VIEW="list";render();return;}
  const dl=daysBetween(p.deadline);const ro=isReadonly(p);
  let dlLine=t.ov_nodeadline;
  if(dl!==null)dlLine=dl<0?t.ov_daysoverdue.replace('{d}',Math.abs(dl)):t.ov_daysremaining.replace('{d}',dl);

  const moreItems=[
    ['duplicate',t.a_duplicate,false,true],
    ['hold',t.a_hold,false,canHold(p)],
    ['resume',t.a_resume,false,canResume(p)],
    ['complete',t.a_complete,false,canComplete(p)],
    ['close',t.a_close,false,canClose(p)],
    ['cancel',t.a_cancel,true,canCancel(p)],
    ['reopen',t.a_reopen,false,canReopen(p)]
  ].filter(x=>x[3]).map(x=>`<button class="${x[2]?'danger2':''}" onclick="handleAction('${x[0]}')">${x[1]}</button>`).join("");

  $("detailView").innerHTML=`
    <div class="dethead">
      <div class="dtop">
        <div><div class="pno">${p.no}</div><h2>${p.name}</h2><div class="dcust">${custName(p.customerId)}${p.customerRef?' · '+p.customerRef:''}</div></div>
        <div class="roactions">
          <button class="tbtn" onclick="openEditProject()" ${ro?'disabled':''}>${t.a_edit}</button>
          <button class="tbtn" onclick="printOffer(${p.id})">${t.np_printoffer}</button>
          <button class="tbtn" onclick="openJobcardForm()" ${ro?'disabled':''}>${t.a_createjc}</button>
          <button class="tbtn" onclick="openDocForm()" ${ro?'disabled':''}>${t.a_adddoc}</button>
          <button class="tbtn" onclick="openPoForm()" ${ro?'disabled':''}>${t.a_createpo}</button>
          <button class="tbtn" onclick="openNoteForm()" ${ro?'disabled':''}>${t.a_addnote}</button>
          <div class="more">
            <button class="tbtn" id="moreBtn">${t.a_more} ▾</button>
            <div class="moremenu" id="moreMenu">${moreItems}</div>
          </div>
        </div>
      </div>
      <div class="dfacts">
        <div class="df"><div class="k">${t.ov_status}</div><div class="v">${statusBadge(p.status)}</div></div>
        <div class="df"><div class="k">${t.ov_progress}</div><div class="v">${progressOf(p)}%</div></div>
