<title>Varmak — Projects</title><style>

  @media (prefers-reduced-motion:reduce){.glow,.ember{animation:none}}

  .topfull{position:relative;z-index:2;width:100%;padding:22px 48px 0;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;}

  .who .role{color:var(--spark);font-size:10px;letter-spacing:.08em;text-transform:uppercase;}

  .wrap{position:relative;z-index:2;max-width:1360px;margin:0 auto;padding:26px 40px 90px;}

  .modhead .ttl{display:flex;align-items:center;gap:11px;}
  .modhead .ic{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(74,144,255,.14);box-shadow:inset 0 0 0 1px rgba(74,144,255,.35);}
  .modhead h1{font-family:'Sora';font-weight:600;font-size:22px;letter-spacing:-.01em;} .modhead p{font-size:12px;color:var(--steel-400);}

  .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .search{position:relative;flex:1;min-width:200px;}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--steel-400);}
  .search input{width:100%;background:var(--field);border:1px solid var(--field-line);color:var(--ice);font-family:'Inter';font-size:14px;padding:11px 12px 11px 36px;outline:none;}
  .search input:focus{border-color:var(--spark);}
  .filters{display:flex;gap:6px;}

  .pcols{display:grid;grid-template-columns:1fr 1.5fr;gap:18px;align-items:start;}
  .plist{display:flex;flex-direction:column;gap:10px;max-height:74vh;overflow:auto;padding-right:4px;}
  .prow{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:15px;cursor:pointer;transition:.15s;}
  .prow:hover{border-color:rgba(74,144,255,.5);background:rgba(74,144,255,.06);}
  .prow.sel{border-color:var(--spark);background:rgba(74,144,255,.1);box-shadow:inset 3px 0 0 var(--spark);}
  .prow .r1{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;}
  .prow .pno{font-family:'Sora';font-weight:600;font-size:13px;color:var(--steel-300);letter-spacing:.03em;}
  .prow .ptitle{font-size:15px;font-weight:600;margin-bottom:2px;} .prow .pcust{font-size:12px;color:var(--steel-400);}
  .badge-st{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;font-weight:600;white-space:nowrap;}
  .st-active{background:rgba(74,144,255,.16);color:#cfe0ff;box-shadow:inset 0 0 0 1px rgba(74,144,255,.4);}
  .st-quoted{background:rgba(157,180,216,.14);color:var(--quoted);box-shadow:inset 0 0 0 1px rgba(157,180,216,.35);}
  .st-hold{background:rgba(255,176,87,.14);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(255,176,87,.4);}
  .st-done{background:rgba(74,212,138,.14);color:var(--ok);box-shadow:inset 0 0 0 1px rgba(74,212,138,.4);}
  .prog{margin-top:10px;} .prog .bar{height:5px;background:rgba(255,255,255,.08);overflow:hidden;} .prog .fill{height:100%;background:var(--spark);} .prog .fill.over{background:var(--warn);}
  .prog .lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--steel-400);margin-top:5px;font-variant-numeric:tabular-nums;}

  .pdetail{background:rgba(255,255,255,.035);border:1px solid var(--line);padding:24px;min-height:420px;position:sticky;top:20px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:360px;color:var(--steel-400);gap:12px;text-align:center;} .empty svg{opacity:.4;}
  .dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .dhead .pno{font-family:'Sora';font-size:12px;color:var(--steel-300);letter-spacing:.04em;} .dhead h2{font-family:'Sora';font-weight:600;font-size:20px;margin-top:3px;}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-bottom:18px;}

  .dactions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}

  .items h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel-400);margin-bottom:10px;display:flex;justify-content:space-between;}
  .item{border:1px solid var(--line);margin-bottom:9px;background:rgba(255,255,255,.02);}
  .item .ihead{display:grid;grid-template-columns:22px 1fr auto auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;}
  .item .chev{color:var(--steel-400);transition:transform .18s;} .item.open .chev{transform:rotate(90deg);}
  .item .iname{font-size:14px;font-weight:600;} .item .itags{display:flex;gap:6px;margin-top:4px;}
  .tag{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;color:var(--steel-400);border:1px solid var(--line);}
  .tag.on{color:#cfe0ff;border-color:rgba(74,144,255,.5);background:rgba(74,144,255,.1);}
  .tag.jc-inprogress{color:var(--warn);border-color:rgba(255,176,87,.4);background:rgba(255,176,87,.1);}
  .tag.jc-done{color:var(--ok);border-color:rgba(74,212,138,.4);background:rgba(74,212,138,.1);}
  .item .ih{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--steel-300);text-align:right;} .item .ih small{color:var(--steel-400);}

  .isub{display:none;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:0 14px 14px;} .item.open .isub{display:grid;}
  .scard{border:1px solid var(--line);padding:13px;background:rgba(255,255,255,.02);}
  .scard .sh{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-400);margin-bottom:10px;} .scard .sh svg{width:14px;height:14px;color:var(--spark);}
  .scard .line{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;} .scard .line .lk{color:var(--steel-400);} .scard .line.tot{border-top:1px solid var(--line);padding-top:7px;margin-top:7px;font-weight:600;}
  .scard .ob{width:100%;margin-top:10px;background:transparent;border:1px solid var(--field-line);color:var(--steel-300);font-family:'Inter';font-size:12px;padding:8px;cursor:pointer;transition:.15s;}
  .scard .ob:hover{border-color:var(--spark);color:var(--ice);}
  .itotal{display:flex;justify-content:space-between;padding:14px;margin-top:4px;border:1px solid rgba(74,144,255,.3);background:rgba(74,144,255,.06);font-family:'Sora';}
  .itotal .lk{color:var(--steel-300);} .itotal .lv{font-weight:600;}

  /* offer modal */
  .overlay{position:fixed;inset:0;z-index:80;background:rgba(2,8,15,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;}
  .overlay.show{display:flex;}
  .sheet{background:#fff;color:#14202e;width:760px;max-width:100%;padding:48px 54px;font-size:13px;line-height:1.5;box-shadow:0 30px 80px rgba(0,0,0,.5);}
  .sheet .oh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #013179;padding-bottom:18px;margin-bottom:22px;}
  .sheet .oh .co{font-family:'Sora';font-weight:700;font-size:20px;color:#013179;letter-spacing:.04em;} .sheet .oh .cm{font-size:11.5px;color:#5b6b7d;margin-top:4px;line-height:1.5;}
  .sheet .oh .ot{text-align:right;} .sheet .oh .ot h2{font-family:'Sora';font-size:22px;color:#14202e;} .sheet .oh .ot .om{font-size:11.5px;color:#5b6b7d;margin-top:4px;}
  .sheet .oto{display:flex;justify-content:space-between;margin-bottom:20px;font-size:12.5px;}
  .sheet .oto .lbl{color:#5b6b7d;text-transform:uppercase;font-size:10px;letter-spacing:.06em;margin-bottom:3px;}
  .sheet table{width:100%;border-collapse:collapse;margin-bottom:16px;} .sheet th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#5b6b7d;border-bottom:1.5px solid #cdd6e0;padding:8px 6px;}
  .sheet th.n,.sheet td.n{text-align:right;} .sheet td{padding:9px 6px;border-bottom:1px solid #e6ebf1;}
  .sheet tfoot td{border-bottom:none;padding:5px 6px;} .sheet tfoot tr.grand td{font-weight:700;font-size:15px;border-top:2px solid #013179;padding-top:10px;color:#013179;}
  .sheet .foot{margin-top:24px;font-size:11px;color:#5b6b7d;border-top:1px solid #e6ebf1;padding-top:14px;}
  .obar{display:flex;gap:10px;justify-content:flex-end;width:760px;max-width:100%;margin-bottom:12px;}
  .obar button{font-family:'Sora';font-weight:600;font-size:13px;padding:11px 18px;cursor:pointer;border:none;}
  .obar .pr{background:#2c6bd6;color:#fff;} .obar .cl{background:rgba(255,255,255,.1);color:#e8f0fb;border:1px solid var(--field-line);}

  .langc{position:fixed;z-index:30;left:18px;bottom:16px;font-family:'Inter';}
  .langtoggle{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(7,26,51,.8);border:1px solid rgba(142,163,192,0.16);color:var(--steel-300);font-size:12px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:.15s;}
  .langtoggle:hover{color:var(--ice);border-color:rgba(185,198,218,0.35);} .langtoggle .globe{width:14px;height:14px;color:var(--steel-400);} .langtoggle .cur{font-weight:600;letter-spacing:.08em;} .langtoggle .chev{width:12px;height:12px;color:var(--steel-400);transition:transform .18s;}
  .langc.open .langtoggle .chev{transform:rotate(180deg);}
  .langmenu{position:absolute;left:0;bottom:calc(100% + 6px);min-width:158px;background:rgba(7,26,51,.96);border:1px solid rgba(142,163,192,0.18);box-shadow:0 14px 34px rgba(0,0,0,.45);opacity:0;visibility:hidden;transform:translateY(6px);transition:.16s;}
  .langc.open .langmenu{opacity:1;visibility:visible;transform:translateY(0);}

  @media(max-width:1050px){.pcols{grid-template-columns:1fr;} .pdetail{position:static;} .plist{max-height:none;} .isub{grid-template-columns:1fr;}}
  @media(min-width:1800px){.wrap{max-width:1760px;padding:34px 60px 100px;} .topfull{padding:32px 60px 0;} .modhead h1{font-size:26px;} .prow .ptitle{font-size:17px;} .dhead h2{font-size:24px;} .fact .v{font-size:16px;} .item .iname{font-size:16px;}}
  @media(min-width:2600px){.wrap{max-width:2300px;padding:48px 90px 130px;} .topfull{padding:46px 90px 0;} .modhead h1{font-size:34px;} .modhead .ic{width:54px;height:54px;} .prow .ptitle{font-size:21px;} .dhead h2{font-size:30px;} .fact .v{font-size:19px;} .item .iname{font-size:19px;} .search input,.filters button,.tbtn{font-size:16px;} .langtoggle{font-size:15px;padding:11px 16px;} .langmenu button{font-size:16px;}}
  @media print{body *{visibility:hidden;} .overlay,.overlay *{visibility:visible;} .overlay{position:absolute;inset:0;background:#fff;padding:0;display:block;} .sheet{box-shadow:none;width:100%;} .obar{display:none;}}
</style></head><body>

<div class="topfull"><div class="topbar">

<script>

  let current="en",filter="all",selected=null,query="",openItems={};
  const $=id=>document.getElementById(id);
  const fmt=n=>Math.round(n).toLocaleString('sv-SE')+" kr";
  const itemPrice=it=>it.est*RATE+it.mat;
  const sums=p=>({est:p.items.reduce((a,b)=>a+b.est,0),act:p.items.reduce((a,b)=>a+b.act,0),offer:p.items.reduce((a,b)=>a+itemPrice(b),0)});

  function renderList(){
    const t=T[current];const list=$("plist");list.innerHTML="";
    const rows=PROJECTS.filter(p=>filter==="all"||p.status===filter)
      .filter(p=>{const q=query.toLowerCase();return !q||p.title.toLowerCase().includes(q)||p.customer.toLowerCase().includes(q)||p.no.toLowerCase().includes(q);});
    rows.forEach(p=>{const {est,act}=sums(p);const pct=est?Math.min(100,Math.round(act/est*100)):0;const over=act>est;
      const d=document.createElement('div');d.className="prow"+(selected===p.no?" sel":"");
      d.onclick=()=>{selected=p.no;openItems={};renderList();renderDetail();};
      d.innerHTML=`<div class="r1"><span class="pno">${p.no}</span><span class="badge-st st-${p.status}">${t["st_"+p.status]}</span></div>
        <div class="ptitle">${p.title}</div><div class="pcust">${p.customer}</div>
        <div class="prog"><div class="bar"><div class="fill ${over?'over':''}" style="width:${over?100:pct}%"></div></div>
        <div class="lbl"><span>${act} / ${est} ${t.hrs}</span><span>${over?'+'+(act-est).toFixed(1)+' '+t.hrs:pct+'%'}</span></div></div>`;
      list.appendChild(d);});
    if(!rows.length)list.innerHTML=`<div style="color:var(--steel-400);font-size:13px;padding:20px;text-align:center;">—</div>`;
  }

  function renderDetail(){
    const t=T[current];const d=$("pdetail");const p=PROJECTS.find(x=>x.no===selected);
    if(!p){d.innerHTML=`<div class="empty"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H3z"/><path d="M3 7V5a2 2 0 0 1 2-2h4l2 2"/></svg><span>${t.pick}</span></div>`;return;}
    const {est,act,offer}=sums(p);
    const items=p.items.map((it,idx)=>{const op=openItems[idx];const price=itemPrice(it);
      return `<div class="item ${op?'open':''}">
        <div class="ihead" onclick="toggleItem(${idx})">
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
          <div><div class="iname">${it.n}</div><div class="itags"><span class="tag on">${t.tag_est}</span><span class="tag jc-${it.jc}">${t.j_head}: ${t["jc_"+it.jc]}</span></div></div>
          <div class="ih">${it.est} ${t.hrs}<br><small>${t.d_est}</small></div>
          <div class="ih"><span class="${it.act>it.est?'over':''}">${it.act} ${t.hrs}</span><br><small>${t.d_act}</small></div>
        </div>
        <div class="isub">
          <div class="scard"><div class="sh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18"/><path d="M8 7h8M8 11h8M8 15h4"/></svg>${t.e_head}</div>
            <div class="line"><span class="lk">${t.e_material}</span><span>${fmt(it.mat)}</span></div>
            <div class="line"><span class="lk">${t.e_labour}</span><span>${it.est} ${t.hrs} · ${fmt(it.est*RATE)}</span></div>
            <div class="line tot"><span>${t.e_total}</span><span>${fmt(price)}</span></div>
            <button class="ob" onclick="alert('Open estimation (demo)')">${t.open}</button></div>
          <div class="scard"><div class="sh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18"/><path d="M9 3v3h6V3M8 12h8M8 16h5"/></svg>${t.j_head}</div>
            <div class="line"><span class="lk">${t.j_status}</span><span class="tag jc-${it.jc}" style="border:none;padding:0;background:none;">${t["jc_"+it.jc]}</span></div>
            <div class="line"><span class="lk">${t.j_steps}</span><span>${it.steps}</span></div>
            <button class="ob" onclick="alert('Open jobcard (demo)')">${t.open}</button></div>
          <div class="scard"><div class="sh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${t.h_head}</div>
            <div class="line"><span class="lk">${t.h_logged}</span><span class="${it.act>it.est?'over':''}">${it.act} ${t.hrs}</span></div>
            <div class="line"><span class="lk">${t.d_est}</span><span>${it.est} ${t.hrs}</span></div>
            <button class="ob" onclick="alert('Open in Hours (demo)')">${t.loghours}</button></div>
        </div></div>`;}).join("");

    d.innerHTML=`
      <div class="dhead"><div><div class="pno">${p.no}</div><h2>${p.title}</h2></div><span class="badge-st st-${p.status}">${t["st_"+p.status]}</span></div>
      <div class="facts">
        <div class="fact"><div class="k">${t.d_customer}</div><div class="v">${p.customer}</div></div>
        <div class="fact"><div class="k">${t.d_contact}</div><div class="v">${p.contact}</div></div>
        <div class="fact"><div class="k">${t.d_machine}</div><div class="v">${p.machine}</div></div>
        <div class="fact"><div class="k">${t.d_deadline}</div><div class="v">${p.deadline}</div></div>
        <div class="fact"><div class="k">${t.d_est}</div><div class="v">${est} ${t.hrs}</div></div>
        <div class="fact"><div class="k">${t.d_act}</div><div class="v" style="${act>est?'color:var(--warn)':''}">${act} ${t.hrs}</div></div>
      </div>
      <div class="dactions">
        <button class="tbtn primary" onclick="printOffer('${p.no}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4v-6h16v6h-2M8 14h8v8H8z"/></svg>${t.printoffer}</button>
        <button class="tbtn" onclick="alert('Edit project (demo)')">${t.edit}</button>
      </div>
      <div class="items"><h3><span>${t.d_items}</span><span>${t.itotal}: ${fmt(offer)}</span></h3>${items}
        <div class="itotal"><span class="lk">${t.itotal}</span><span class="lv">${fmt(offer)}</span></div></div>`;
  }

  function toggleItem(i){openItems[i]=!openItems[i];renderDetail();}

  function printOffer(no){
    const t=T[current];const p=PROJECTS.find(x=>x.no===no);if(!p)return;
    let sub=0;const rows=p.items.map(it=>{const amt=itemPrice(it);sub+=amt;
      return `<tr><td>${it.n}</td><td class="n">${it.est}</td><td class="n">${fmt(it.mat)}</td><td class="n">${fmt(amt)}</td></tr>`;}).join("");
    const vat=sub*VAT, tot=sub+vat; const today=new Date().toLocaleDateString(t.locale);
    $("sheet").innerHTML=`
      <div class="oh"><div><div class="co">VARMAK AB</div><div class="cm">Lagmansgatan 31 · 241 71 Marieholm<br>info@varmak.se · Org.nr 559568-2468</div></div>
        <div class="ot"><h2>${t.o_title}</h2><div class="om">${t.o_no}: ${p.no}-Q<br>${t.o_date}: ${today}</div></div></div>
      <div class="oto"><div><div class="lbl">${t.o_to}</div><div><b>${p.customer}</b><br>${p.contact}</div></div>
        <div style="text-align:right;"><div class="lbl">${t.ptitle}</div><div>${p.title}<br>${p.machine}</div></div></div>
      <table><thead><tr><th>${t.o_desc}</th><th class="n">${t.o_hrs}</th><th class="n">${t.o_mat}</th><th class="n">${t.o_amount}</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td colspan="3" class="n">${t.o_subtotal}</td><td class="n">${fmt(sub)}</td></tr>
          <tr><td colspan="3" class="n">${t.o_vat}</td><td class="n">${fmt(vat)}</td></tr>
          <tr class="grand"><td colspan="3" class="n">${t.o_total}</td><td class="n">${fmt(tot)}</td></tr></tfoot></table>
      <div class="foot">${t.o_valid}</div>`;
    $("overlay").classList.add("show");
  }
  $("offClose").addEventListener('click',()=>$("overlay").classList.remove("show"));
  $("overlay").addEventListener('click',e=>{if(e.target===$("overlay"))$("overlay").classList.remove("show");});

  function setLang(code){current=code;const t=T[code];
    document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t[el.getAttribute('data-i')]);
    document.querySelectorAll('[data-i-ph]').forEach(el=>el.placeholder=t[el.getAttribute('data-i-ph')]);
    document.documentElement.lang=code==="mk"?"mk-Latn":code;
    document.querySelectorAll('.langmenu button').forEach(b=>b.classList.toggle('active',b.getAttribute('data-lang')===code));
    var _c=$("langcur");if(_c)_c.textContent=code.toUpperCase();
    renderList();renderDetail();tick();}
  document.querySelectorAll('.langmenu button').forEach(b=>b.addEventListener('click',()=>{setLang(b.getAttribute('data-lang'));$("langc").classList.remove('open');}));
  $("filters").addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.getAttribute('data-f');document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));renderList();});
  $("search").addEventListener('input',e=>{query=e.target.value;renderList();});
  function tick(){const n=new Date();$("time").textContent=n.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});try{$("date").textContent=n.toLocaleDateString(T[current].locale,{weekday:'short',day:'numeric',month:'short'});}catch(e){$("date").textContent=n.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}}
  setLang("en");setInterval(tick,10000);
  const box=$("embers");const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!reduce){for(let i=0;i<16;i++){const e=document.createElement('div');e.className='ember';e.style.left=Math.random()*100+'%';e.style.setProperty('--drift',(Math.random()*80-40)+'px');const dur=7+Math.random()*9;e.style.animationDuration=dur+'s';e.style.animationDelay=(-Math.random()*dur)+'s';const s=1+Math.random()*2;e.style.width=s+'px';e.style.height=s+'px';box.appendChild(e);}}
  (function(){var lc=$("langc"),lt=$("langtoggle");if(lt){lt.addEventListener('click',function(e){e.stopPropagation();lc.classList.toggle('open');});document.addEventListener('click',function(e){if(!lc.contains(e.target))lc.classList.remove('open');});}})();
</script>
